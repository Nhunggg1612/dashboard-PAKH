hẩm/hệ thống thấp","Sản phẩm/Hệ thống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động","Tiến độ triển khai chậm","Sản phẩm/Hệ thống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động","Hỗ trợ lắp đặt","Sản phẩm/Hệ thống lỗi/không hoạt động","Chất lượng, hiệu suất của sản phẩm/hệ thống thấp","Sản phẩm/Hệ thống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động","Thiết bị vỡ, hỏng, chập cháy","Thiết bị vỡ, hỏng, chập cháy","Sản phẩm/Hệ thống lỗi/không hoạt động"],"Chi tiết":["1. KH đã báo CN: Anh Khải\n2. KH phản ánh: PV dư tải nhưng vẫn thấy lấy điện lưới bù vào\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH chưa báo CN\n2. KH phản ánh: KH theo dõi trên app ko thấy có thông số từ đầu giờ chiều tới giờ, KH có 3 pin lưu trữ thì 1 cục chạy 2 cục còn lại không chạy\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH đã liên hệ CN\n2. KH không theo dõi được hiệu suất HT NLMT\n3. KH cần CN hỗ trợ kiểm tra và khắc phục sớm","KH đã báo bạn KHẢI CN \nKH báo sự cố NLMT sạc không đầy pin, pin lưu trữ 16kw sạc chỉ được dưới 90%\nYêu cầu CN cho KT qua ktra cho KH","1. KH đã báo CN: a Tuy\n2. KH phản ánh: hệ nlmt ko sản sinh ra điện, ko hoạt động\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN: anh An \n2. KH phản ánh: cúp điện lưới ko thấy có điện nlmt để sử dụng, điện lưới nhá lên tí rồi lại ngắt\n3. KH yêu cầu: qua kiểm tra, hỗ trợ khắc phục tình trạng này","1. KH chưa liên hệ CN\n2. App theo dõi HT NLMT của KH báo ngoại tuyến\n3. KH cần CN liên hệ và đến hỗ trợ sớm","1. KH chưa liên hệ CN\n2. Hiện hiệu suất của HT NLMT giảm mạnh chỉ sản xuất được khoảng 3 số điện, tiền điện tháng trước tăng lên 11tr, App theo dõi HT không báo sự cố\n3. Kh cần CN đến kiểm tra và khắc phục cho KH","KH báo sự cố bị rỉ nước máy nước nóng gần 1 tháng nay, KT trước đấy có qua kiểm tra xử lý nhưng chưa triệt để\nYêu cầu CN cho KT qua ktra xử lý lại cho KH","1. CN báo sự cố cho KH(0965781379)\n2. HT NLMT của KH đang không hoạt động khoảng 3 ngày nay\n3.KH cần CN hỗ trợ kiểm tra và khắc phục gấp\nĐ/C : Đường Huỳnh Mẫn Đạt, Phường Bình Thủy, TP Cần Thơ","Hiện sản phẩm đã hết hạn bảo hành\n1. KH đã liên hệ CN\n2. Hiện sản phẩm đèn NLMT sáng cả vào ban ngày, KH chưa điều chỉnh được\n3. KH cần CN hỗ trợ kiểm tra và khắc phục, sẽ thanh toán chi phí phát sinh","1. KH chưa liên hệ CN\n2. Tiền điện KH cần thanh toán đang tăng gấp đôi so với tháng 6, trên App theo dõi hiệu suất không báo lỗi tuy nhiên không hiển thị sản lượng điện NLMT sản xuất được\n3. KH cần CN liên hệ và đến kiểm tra sớm","KH có nhu cầu thay đổi lịch hẹn thực hiện đơn hàng vào ngày 13/09/2026,","1. CN báo sự cố cho KH\n2. Nhà KH mất điện, Ăc quy báo đỏ nhấp nháy, có dấu hiệu bị xả kiệt\n3. Kh cần CN liên hệ và đến khắc phục gấp","1. CN báo sự cố cho KH (981118000)\n2. Ăc uy lưu trữ báo đỏ, không nạp\n3. KH cần CN đến kiểm tra và khắc phục sớm","KH đặt đơn DVKT từ ngày 08/08 chưa được CN liên hệ và đến hỗ trợ thực hiện đơn hàng","1. KH đã liên hệ nhân sự Quang\n2. KH đang bị mất hiệu suất HT NLMT, 2 đường điện hiện chỉ sử dụng được 1 đường \n3. KH cần CN đến kiểm tra và khắc phục sớm","Hiện điều hòa của KH đang có dấu hiệu rò rỉ Gas, cần CNCT hỗ trợ kiểm tra, KH sẽ thanh toán chi phí","1. KH đã báo CN: a Phụng\n2. KH phản ánh: đăng nhập vào tài khoản app theo dõi ko được, báo sai mật khẩu\n3. KH yêu cầu: qua kiểm tra, hỗ trợ KH đăng nhập lại app theo dõi","KH yêu cầu KT liên hệ lại hẹn lịch","KH báo KT hẹn là 1h30 tới nhưng giờ chưa thấy có đến, KH liên hệ KT thì ko được. KH cũng là người Viettel phải nghỉ làm ở nhà, KH yêu cầu KT đến đúng lịch hẹn","KH báo chưa có CN liên hệ gửi báo giá NLMT cho KH","1. KH chưa báo CN\n2. KH phản ánh: khi mất điện lưới ko thấy có điện nlmt để sử dụng\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này sớm","KT hẹn lịch là 9h-9r hôm nay nhưng đến 10h chưa thấy đến KH liên hệ lại KT thì KT báo đang đến nhưng đến giờ này vẫn chưa thấy đến","KH cần KT liên hệ lại hẹn lịch","1. KH đã liên hệ CN\n2. Inverter của KH gặp sụ cố báo đỏ, hiện cảnh báo, nhà KH đang không có điện để sử dụng\n3. KH cần CN liên hệ và hỗ trợ gấp","KH chưa báo CN\nKH phản ánh hệ thống NLMT lâu lâu hay lỗi, báo lỗi tiếp đất khoảng 1 2 tuần nay\nYêu cầu CN cho KT qua ktra cho KH","1. KH chưa liên hệ CN\n2. KH đã nhận được Logger từ ngày 26/07 tuy nhiên chưa được hỗ trợ lắp đặt\n3. KH cần CN hỗ trợ lắp đặt sớm","1. KH đã liên hệ CN \n2. KH đang không theo dõi được hiệu suất HT NLMT trên App, hiện đang báo ngoại tuyến\n3. KH cần CN liên hệ và hỗ trợ sớm","KH có đơn hàng tháo, lắp điều hòa từ ngày 08/08 chưa được CN liên hệ và đến hỗ trợ","1. KH đã báo CN \n2. KH phản ánh: từ phản ánh trước TT_1783925046228 KT đã có qua kiểm tra và xác định ats bị hư, KT chỉ nói qua kiểm tra bảo hành nhưng chưa đưa ra phương án hay hỗ trợ KH. KH có liên hệ CN là A Tài nhưng CN bảo chuyển công tác\n3. KH yêu cầu: Đưa ra phương án xử lý và hỗ trợ KH khắc phục tình trạng này","CN 0985951652 báo sự cố hộ KH\n1. KH phản ánh: hệ thống nlmt ko sản sinh ra điện\n2. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","CN 0985951652 báo sự cố hộ KH\n1. KH phản ánh: hệ thống nlmt ko ra sản lượng, khả năng pin lưu trữ bị lỗi\n2. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN\n2. KH phản ánh: hôm nay bên điện lực có đến kiểm tra thông báo về việc sử dụng điện nlmt thì đến kiểm tra phần tủ điện thì thấy bị rò điện\n3. KH yêu cầu: Đề nghị kiểm tra lại tủ điện và có biện pháp đấu nối phù hợp do công ty điện lực phát hiện có rò điện ở tủ điện vào sáng nay (10/8).","Đơn hàng KT làm 9/8 thì thiết bị KH bị hỏng và KT có hẹn KH là 7h tối ngày 10/8 qua kiểm tra lại và khắc phục. KH yêu cầu đến đúng hẹn để qua kiểm tra và xử lý","1. KH đã báo CN: A Hào\n2. KH phản ánh: hiệu suất ko đạt yêu cầu tiền điện có . \nKH bắt đầu báo cáo từ tháng 4 nhưng đến nay vẫn chưa được hỗ trợ chính thức\nKH yêu cầu: Hỗ trợ KH hồ sơ để đăng ký nlmt để báo cáo cho bên điện lực.","1. KH đã liên hệ bộ phận kinh doanh tại CN\n2. Hiệu suất của HT NLMT chưa đạt yêu cầu, giữa trưa nắng và trời trong nhưng hiệu suất chỉ đạt 4.250W, thời điểm hiệu suất cao nhất là 4.800W\nTrong quá trình lắp đặt hệ thống nhân sự chưa cẩn thận, suýt làm rơi tấm pin, đi lên tấm pin, thời gian thi công còn chậm\nKhông thấy sử dụng Camera nhiệt để kiểm tra các đầu Cosse AC, DC, MC4, không đo điện trở tiếp địa\nDây DC kéo dài đã đi trong ống luồn tuy nhiên các đầu nối MC4 nối 2 tấm pin liền kề đều nằm trên mái, KH đã đề nghị KT rút dây thít cho MC4 không chạm mái nhưng chưa được hỗ trợ\nTrong tủ điện không có nhãn tên các thiết bị\nChưa có nhân sự đến thu hồi vật tư còn dư để chốt chi phí cho KH như:\nVật tư phụ, dây DC tính theo m\nThanh Rail nhôm (Tính tiền 8 thanh 2,3 m nhưng lắp đặt các mẩu rail nhôm 20cm)\nChân đỡ chữ L(có tính tiền nhưng không thấy lắp)\nCùm kẹp hộp Inox(có tính tiền nhưng không thấy lắp)\n3, KH cần CN liên hệ và đến hỗ trợ giải đáp cho KH sớm","KH đã báo CN nhưng chưa được hỗ trợ \nINVT báo lỗi không hoạt động, tình trạng bị lần thứ 3\nYêu  cầu CN cho KT qua ktra cho KH","1. KH đã liên hệ CN\n2. HT NLMT của KH (Hệ 2) đang tiêu thụ điện nhiều, Hiện tại tiêu thu khoàng 1,300->1400Kw , trong khi trước đó chỉ khoảng hơn 1000kw, KH đã tắt ATS tổng vào tầng 2 tuy nhiên vẫn thấy tiêu thụ điện\n3. KH cần CN đến kiểm tra sớm cho KH","KH chưa báo CN \nKH phản ánh ivt bị hỏng, điện chạy lên điện lưới nên đồng hồ điện chạy gấp đôi bình thường, bị hơn 1 tháng nay\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","1. KH chưa liên hệ CN\n2. KH đã ký HĐ lắp đặt thiết bị Ăc quy lưu trữ NLMT và chuyển tiền đặt cọc từ ngày 19/06 cho nhân sự Đạt tuy nhiên chưa được hỗ trợ lắp đặt và hoàn thiện hệ thống. CSKH kiểm tra Hợp đồng chưa được ký\n3. KH cần CN phản hồi và đề xuất hướng xử lý cho KH","Kh chưa báo CN \nKH báo sự cố nlmt không sạc được pin dù nắng to vẫn không sạc được \nYêu cầu CN cho KT qua ktra cho KH","KH  chưa báo CN\nKH báo sự cố pin lưu trữ đang bị lỗi, hiện tại không sản xuất ra điện \nYêu cầu CN cho KT qua ktra cho KH","1. KH chưa liên hệ CN\n2. Trước đó tiền điện tháng 5 của KH cần đóng là 2tr6, hiện tại tiền điện tháng 6 cần đóng là 5tr1 trong khi trên App hiển thị HT NLMT vẫn hoạt động\n3.KH cần CN đến kiểm tra sớm","1. KH đã liên hệ CN\n2. Hiện nhà KH đang không sử dụng được điện lưới và điện NLMT, ngày hôm nay đã mất điện 2 lần\n3. KH cần CN đến kiểm tra và khắc phục gấp","1. KH đã được nhân sự Ngọc tại CN liên hệ\n2. KH ký HĐ lắp đặt HT NLMT từ ngày 14/06 và thời gian lắp đặt là 30 ngày kể từ ngày khởi công, hiện đã sắp hết thời gian thực hiện lắp đặt theo HĐ nhưng KH chưa được hỗ trợ\n3. KH cần CN liên hệ và phản hồi gấp","KH đã báo CN\nKH báo sự cố NLMT biến tần đầy pin  nhưng không dùng được chỉ dùng được điện lưới\nYêu cầu CN cho KT qua ktra cho KH","1. KH chưa báo CN\n2. KH phản ánh: hiệu suất sản phẩm kém, cảm thấy tiền điện tăng (KH lớn tuổi ko trao đổi chi tiết rõ thêm và gay gắt)\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN\n2. KH phản ánh: nắng nhưng ko thấy sản xuất ra điện toàn thấy sử dụng điện lưới tiền điện tăng cao bất thường, 1 tháng 3tr5 tiền điện. \n3. KH yêu cầu: KT qua kiểm tra, xử lý tình trạng này\n***Địa chỉ KH cung cấp: 44 nguyễn công hoàn, phường giảng võ, hà nội","1. KH đã báo CN\n2. KH phản ánh: Từ các sự cố trước về ivt hoạt động ko ổn định. CN chỉ thấy điều khiển từ xa ko thấy đến kiểm tra trực tiếp, và ko thấy xử lý. KH thấy là khi tăng tải lên vẫn lưới điện lưới buộc KH phải tắt tải. KH có liên hệ người phụ trách lắp đặt trước thì ko thấy nghe máy, KH rất ko hài lòng và bức xúc. \n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","1. KH đã báo CN: A Quốc Đại\n2. KH phản ánh: tủ điện có mùi khét, cả nhà mất điện\n3. KH yêu cầu: Qua hỗ trợ, xử lý tình trạng này","1. KH chưa báo CN\n2     var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>
