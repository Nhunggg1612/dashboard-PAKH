hống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động"],"Chi tiết":["KH có đơn bảo dưỡng điều hòa phản ánh chưa được kĩ thuật liên hệ và hỗ trợ KH\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","KH có YCTX NLMT từ 31/07 chưa có ai liên hệ và tư vấn","1. KH đã liên hệ CN\n2. Ắc quy lưu trữ sạc đầy nhưng không xả, trên App theo dõi khi dùng tải nhà cao hơn hiệu suất của HT NLMT không thấy bù điện lưới \n3. KH cần CN đến kiêm tra sớm","KH đã báo CN \nKH phản ánh hiện chưa được bên Cn liên hệ và hỗ trợ lắp đặt NLMT cho KH \nYêu cầu CN liên hệ và hỗ trợ KH","1. KH chưa liên hệ CN\n2. Nhà KH đang mất điện, HT NLMT Ăc quy lưu trữ còn điện nhưng không xả, hiện không có điện NLMT và điện lưới để sử dụng\n3. KH cần CN liên hệ và đến khắc phục gấp cho KH","1. KH chưa liên hệ CN\n2. HT NLMT dùng hết điện trong Ăc quy lưu trữ là tắt, không sản xuất điện NLMT để sử dụng, KH không theo dõi được hiệu suất NLMT trên App\n3. KH cần CN đến kiểm tra và khắc phục sớm","KH đặt trên app hiện tại vẫn chưa thấy KT liên hệ xác nhận đơn. KH yêu cầu liên hệ KH có làm không để KH còn biết","1. KH đã báo CN: A Dũng\n2. KH phản ánh: điện lưới mất mà pin nlmt còn 10% tự ngắt cũng ko thấy nạp vào nữa. \n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN\n2. KH phản ánh: KH ký HĐ vào 2/7 nhưng đến cuối tháng dời ngày lắp đặt 2 lần rồi đưa ra lý do rất mơ hồ là kẹt công trình hết ngày này qua ngày khác. KH ko chấp nhận lí do đó hẹn 29,30 rồi dời sang 31/7 rồi lại dời sang 1/8\n3. KH yêu cầu: KH sẽ ko chấp nhận dời lịch nữa yêu cầu CN hẹn lịch chính xác cho KH về thời gian lắp đặt","CN 0974048788 báo sự cố hộ KH \n1. KH phản ánh: hôm qua từ 12h đêm - 8h sáng mất điện lưới mà ko thấy có điện nlmt\n2. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","Đơn hàng DVKT hiện đang điều phối từ 28/07, KH chưa được liên hệ và đến hỗ trợ\n\nKH cần CN liên hệ và đến thực hiện đơn hàng sớm","1. KH đã báo CN: A Thiện\n2. KH phản ánh: gần 10 ngày nay cb ở ivt nhảy liên tục, 1 ngày nhảy 2,3 lần. KH có 6 cb nhưng chỉ bị 1 cái \n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","CN mnv 118290 báo hộ sự cố KH qua hệ thống\n1. KH phản ánh: Lỗi hệ thống điện năng lượng mặt bị chập chờn, chập nhảy 2,3s mất điện có lại\n2. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","KH chưa báo CN\nKH báo hôm qua mưa bão bị sét đánh hỏng cục wifi cần nhờ KT đến kiểm tra kết nối lại cho KH","1. KH đã liên hệ CN\n2.HT NLMT điện lúc mạnh lúc yếu lúc không có điện, tủ nguồn biến tần có tiếng kêu khoảng 3 ngày nay, hiện KH đang dùng điện lưới, nếu KH tắt AB tủ nguồn và bật lại sẽ sử dụng được một lúc sau đó lại gặp sự cố\n3. KH cần CN liên hệ và đến hỗ trợ sớm","KH chưa báo CN \nKH phản ánh app không xem được hệ thống NLMT báo ngoại tuyến\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","KH đã báo CN nhưng chưa được hỗ trợ \nINVT báo lỗi không hoạt động, tình trạng bị lần thứ 3\nYêu  cầu CN cho KT qua ktra cho KH","1. KH chưa liên hệ CN\n2. KH đã ký HĐ lắp đặt thiết bị Ăc quy lưu trữ NLMT và chuyển tiền đặt cọc từ ngày 19/06 cho nhân sự Đạt tuy nhiên chưa được hỗ trợ lắp đặt và hoàn thiện hệ thống. CSKH kiểm tra Hợp đồng chưa được ký\n3. KH cần CN phản hồi và đề xuất hướng xử lý cho KH","1. KH đã được nhân sự Ngọc tại CN liên hệ\n2. KH ký HĐ lắp đặt HT NLMT từ ngày 14/06 và thời gian lắp đặt là 30 ngày kể từ ngày khởi công, hiện đã sắp hết thời gian thực hiện lắp đặt theo HĐ nhưng KH chưa được hỗ trợ\n3. KH cần CN liên hệ và phản hồi gấp","1. KH đã báo CN: A Quốc Đại\n2. KH phản ánh: tủ điện có mùi khét, cả nhà mất điện\n3. KH yêu cầu: Qua hỗ trợ, xử lý tình trạng này","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng"],"Ngày bắt đầu":["2026-08-03 08:00:00","2026-08-03 08:00:00","2026-08-03 08:00:00","2026-08-03 08:00:00","2026-07-31 17:16:00","2026-07-31 16:23:00","2026-07-31 13:30:00","2026-07-31 09:58:00","2026-07-31 08:22:00","2026-07-31 08:00:00","2026-07-31 15:42:00","2026-07-31 13:53:00","2026-07-31 08:00 <script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA

    if (tinhFilterHandle) tinhFilterHandle.clear();

  function getFilteredData() {

    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }

    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

    function doExcel() {
      setBtnState(btn, true);

        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });

  };

  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();

      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>
