ệu suất","YCTX NLMT lịch hẹn 30/06 KH chưa thấy có KT liên hệ tư vấn khảo sát","YCTX NLMT lịch hẹn 30/6 KH chưa được liên hệ tư vấn NLMT","CN 0384989610 báo sự cố hộ KH\n1.\tKH phản ánh: cúp điện nlmt\n2.\tKH yêu cầu: KT qua kiểm tra, xử lý tình trạng này","1. KH chưa liên hệ CN\n\n2. Hiện một tấm pin của KH đang gặp sự cố\n\n3. KH cần CN hỗ trợ đến kiểm tra sớm","1. KH đã liên hệ tới CN\n\n2. HT NLMT của KH đã hoàn thiện lắp đặt và đưa vào sử dụng tuy nhiên chi nhánh chưa cung cấp cho KH các chứng từ:\n\n      - Bản hoàn công\n\n      - Bản hướng dẫn sử dụng hệ thống NLMT sau lắp đặt\n\n       - Chứng từ, hồ sơ, CO CQ của HT NLMT để KH có thể cung cấp cho EVN\n\n3. KH cần chi nhánh liên hệ, hướng dẫn KH sử dụng , cung cấp các chứng từ liên quan và có đề xuất hướng xử lý về việc chậm hợp đồng cho KH","1. KH chưa liên hệ CN\n\n2. HT NLMT của KH bị giảm hiệu suất nhiều thời gian gần đây,  hiện tại sản xuất được 2,9Kw, so sánh với hộ gia đình khác cùng lắp HT NLMT sản xuất được 4,3Kw\n\n3. KH cần CN đến hỗ trợ kiểm tra giúp","KH đã báo KT nhưng chưa được hỗ trợ \n KH phản ánh Viettel  Vinh Long vẫn không cung cấp tài liệu hay bất hoá đơn chứng từ cho khách hàng sau khi lắp bình lưu trữ và biến tần.\nKH cần CN cung cấp bộ hồ sơ để thông báo cho bên điện lực\nYêu cầu CN cho KT hỗ trợ KH","1. KH phản ánh: Đơn hàng của KH làm xong từ 9/5 sau đó 1 máy lạnh ko đóng được và có liên hệ với a Ngọc trong thời gian bảo hành, KH có kb zalo để trao đổi. CN cũng đã đến kiểm tra nhưng chưa khắc phục được tình trạng giờ 2 cái bị hư còn 1 cái bị chảy nước.\n2. KH yêu cầu: Chiều mai 3h 2/3 đến kiểm tra xử lý tình trạng này. KH có sẵn thông tin hình ảnh nhắn tin với a Ngọ trong zalo đến làm việc KH sẽ cung cấp","hệ thống lỗi không hoạt động","1. KH  đã báo KT CN\n2. Cục biến tần lắp chưa chuẩn, KT đã đến hỗ trợ cài đặt lại nhưng chưa xử lí triệt để.\n3. Yêu cầu CN hỗ trợ KH","Kh đã báo KT\nKH báo sự cố NLMT biến tần không nhận điện, chỉ có dùng điện NLMT \nYêu cầu CN cho KT qua ktra cho KH..","Đơn hàng 28/6 vẫn đang trong hạn bảo hành\n1. KH phản ánh: vẫn còn mùi ở thiết bị\n2. KH yêu cầu: KT qua kiểm tra lại","1. KH đã báo CN\n2. KH khi sửa dụng vào mùa nắng nong thì tiền điện giảm không nhiều chỉ giảm chưa đên 700.000, hệ thống pin chỉ thu dược tầm 60-70% vào mùa nắng trong khi KH lắp hệ 12.4KWP\n3. KH muốn CN hỗ trợ và khảo sát lại xem có phải tăng tấm pin để cải thiện không","1. KH đã báo CN\n2. KH muốn hoàn thiện hồ sơ để nộp điện lực vì bên điện lực đã đến kiểm tra, KH đã đưa giấy tờ nhưng bị sai mẫu \n3. Yêu cầu CN hỗ trợ KH","Kh chưa báo CN\nKH báo sự cố hệ thống NLMT đang không theo dõi được qua App, không báo thông số , hiện HT đang không sản sinh điện NLMT\nYêu cầu CN cho KT qua ktra cho KH","1. KH chưa báo CN\n2. KH phản ánh: KH theo dõi trên app ko thấy có thông số hiệu suất\n3. KH yêu cầu: KT qua kiểm tra, hỗ trợ KH tình trạng này","Đơn hàng làm xong từ 26/6 vẫn trong hạn bảo hành 72h\n1. KH phản ánh: giờ giặt quần áo ra nhiều mùn rất bẩn\n2. KH yêu cầu: qua kiểm tra, xử lý tình trạng này nếu cần thiết thì thay phần ba chảng máy giặt","1. KH đã báo CN\n2. KH phản ánh: Từ phản ánh trước TT_1782300958053 về việc tập kết vật tư đủ hơn 1 tuần trời nhưng ko triển khai lắp đặt và hẹn KH khất hất lần này đến lần khác là lắp đặt. KH ko còn sự tin tưởng, bức xúc và thất vọng.\n3. KH yêu cầu: đến dọn dẹp đồ đạc và làm thủ tục hủy HĐ, yêu cầu người có thẩm quyền phản hồi xử lý trước 12h. Nếu ko KH sẽ tự xử lý theo cách của KH","CN báo sự cố hộ KH 0393188966\nKH gặp sự cố NLMT tiền điện hàng tháng chỉ khoảng 2-2,5tr. Tuy nhiên sau khi lắp đặt và sử dụng hệ thống NLMT của VCC cung cấp từ ngày 11/6 thì tiền điện tăng vọt lên 6,4tr, mặc dù trên App theo dõi vẫn hoạt động bình thường\nYêu cầu Cn cho KT qua Ktra cho KH","Kh phản ánh hệ thống NLMT bị sập điện, sập luôn cả điện lưới không hoạt động được, bị từ sáng\nYêu cầu quản lí điều kĩ thuật liên hệ và xuống kiểm tra gấp","1. KH đã báo CN\n2. KH phản ánh: nắng nhưng ko thấy sản xuất ra điện toàn thấy sử dụng điện lưới tiền điện tăng cao bất thường, 1 tháng 3tr5 tiền điện. \n3. KH yêu cầu: KT qua kiểm tra, xử lý tình trạng này\n***Địa chỉ KH cung cấp: 44 nguyễn công hoàn, phường giảng võ, hà nội","KH đã báo KT\nKh báo sự cố NLMT đã lắp pin lưu trữ nhưng hiện tại điện vẫn bị sập\nYêu cầu CN cho KT qua ktra cho KH","1. KH đã liên hệ CN\n\n2. Biến tần của KH đang không hiển thị thông tin tải điện của nhà KH khoảng 2 ngày nay\n\n3. KH cần CN liên hệ và đến hỗ trợ kiểm tra sớm","1. KH đã liên hệ CN \n\n2. Trên App theo dõi hiệu suất HT NLMT của KH thông báo lấy 5Kw điện lưới, thực tế Đồng hồ điện lưới thông báo lấy 50Kw điện lưới\n\n3.KH cần CN liên hệ và đến kiểm tra sớm","KH chưa báo CN \nkhách hàng báo pin lưu trữ bị chớp đỏ, ko sử dụng được.\nYêu cầu quản lí điều kỹ thuật hỗ trợ kiểm tra gấp","Đã báo CN: Đã báo\nKH báo sự cố: Hiện tại 1 tấm pin nhà KH có hiện tượng bị không sử dụng được \nKH yêu cầu: KT qua kiểm tra cho Kh","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra"],"Ngày bắt đầu":["2026-07-01 17:19:00","2026-07-01 11:18:00","2026-07-01 09:41:00","2026-07-01 09:16:00","2026-07-01 09:08:00","2026-07-01 08:00:00","2026-07-01 08:00:00","2026-06-30 14:32:00","2026-06-30 14:31:00","2026-07-01 15:01:00","2026-07-01 11:21:00","2026-07-01 08:45:00","2026-07-01 08:10:00","2026-06-29 10:49:00","2026-06-29 10:12:00","2026-06-30 09:28:00","2026-06-29 08:38:00","2026-06-29 10:11:00","2026-06-29 08:00:00","2026-06-29 08:00:00","2026-06-29 08:00:00","2026-06-25 13:34:00","2026-06-23 08:00:00","2026-06-22 08:00:00","2026-06-18 08:00:00","2026-06-17 16:19:00","2026-06-15 11:47:00","2026-06-03 14:26:00","2026-04-28 08:00:00"],"Ngày kết thúc":["2026-07-02 17:19:00","2026-07-02 17:05:00","2026-07-02 09:41:00","2026-07-02 09:16:00","2026-07-02 09:08:00","2026-07-02 09:00:00","2026-07-02 09:00:00","2026-07-01 14:32:00","2026-07-01 14:31:00","2026-07-02 15:01:00","2026-07-02 11:21:00","2026-07-02 08:45:00","2026-07-02 08:10:00","2026-07-01 20:00: var COL_WIDTHS = {"Mã tỉnh":100,"Lĩnh vực":100,"Ngành hàng":100,"Sản phẩm":150,"Mã HĐ":100,"Tên khách hàng":120,"SĐT":100,"Địa chỉ":250,"Giai đoạn":100,"Nhóm sự cố":100,"Loại sự cố":100,"Chi tiết":300,"Ngày bắt đầu":100,"Ngày kết thúc":100,"Ngày hoàn thành":100,"Trạng thái":100,"Tên nhân viên":100,"Mã nhân viên":100,"Hệ thống":100,"Đơn vị điều hành":100,"AM chuyên quản":100};
var CT_GROUP   = 'bang_chitiet_group';
var AM_MAP     = {"P.KDNLMT":["N1 - Truongdv17, Congnd15","N2 - Tienvt16, Anhnt631","N3 - Thikd, Ducnt84"],"P.Triển khai":["N1 - Truongdv17, Congnd15","N3 - Thikd, Ducnt84"],"VHKT":["N1 - Truongdv17, Congnd15","N2 - Tienvt16, Anhnt631","N3 - Thikd, Ducnt84"]};
var TINH_MAP   = {"N1 - Truongdv17, Congnd15":["BNH","HNI","HPG","HYN","TNN"],"N2 - Tienvt16, Anhnt631":["NAN"],"N3 - Thikd, Ducnt84":["AGG","CTO","DLK","DNI","DTP","HCM","TNH","VLG"]};
</script>
<script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>

      return (...args) => {

        } else { // all the others get throttled
