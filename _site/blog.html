ệ lại tư vấn cho KH","1. KH đã liên hệ CN \n\n2. Hiện tại KH đang mất điện, nghi ngờ do NLMT\n\n3. KH cần CN đến hỗ trợ và kiểm tra gấp","KH chưa báo CN, KT\nKH báo sự cố NLMT điện không chạy vào điện lưới\nYêu cầu CN cho KT qua kiểm tra cho KH","1. KH đã báo CN\n2. KH phản ánh: KH theo dõi trên app toàn bị mất kết nối thiết bị, từ đầu năm tới giờ đã hơn chục lần bị thế này nhưng KT chỉ điều khiển từ xa chứ ko có đến kiểm tra trực tiếp.\n3. KH yêu cầu: Qua kiểm tra trực tiếp và xử lý dứt điểm tình trạng này","KH phản ánh chưa có kĩ thuật liên hệ tư vấn NLMT  \nYêu cầu quản lí điều kĩ thuật liên hệ lại cho KH","HĐ của KH mua sắm Bàn ghế hội trường tại kho bạc nhà nước Bến Tre.\nKH cần hỗ trợ gửi lại biên bản nghiệm thu và hết hạn bảo hành, trước CN là Anh Trần Hữu Tuấn có làm rồi nhưng ghi tên nhân viên cũ của KH giờ nhân viên đó chuyển công tác nên cần làm lại và gửi lại, giờ KH cũng ko có SĐT của A Tuấn nên ko trao đổi được.","KH chưa báo CN \nKH phản ánh pin lưu trữ hiện đang bị lỗi không hoạt động \nYêu cầu quản lí điều kĩ thuật liên hệ trước và kiềm tra cho KH gấp","KH chưa báo CN \nKH phản ánh Hệ thống NLMT đang bị lỗi không hoạt động \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH gấp","KH có YCTXtuw vấn NLMT từ ngày 12/6 nhưng chưa có KT liên hệ tư vấn \nYêu cầu KT liên hệ lại cho KH","KH chưa báo CN \nKH phản ánh sau khi bảo dưỡng xong điều hòa hoạt động yếu hơn trước\nYêu cầu quản lí điều kĩ thuật xuống kiểm tra gấp","KH chưa báo CN \nKH phản ánh sau bảo dưỡng sản phẩm bị chảy nước liên tục \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","1. KH đã liên hệ CN\n\n2. Bếp từ đôi của KH gặp sự cố một bên không sử dụng được\n\n3. KH cần CN hỗ trợ kiểm tra và khắc phục sớm","KH có đơn hàng DVKT tạo ngày 13/06 nhưng chưa có KT liên hệ và đến hỗ trợ KH","KH đã có YCTX tư vấn NLMT từ ngày 13.6 nhưng chưa có ai liên hệ tư vấn cho KH\nYêu cầu CN liên hệ tư vấn cho KH gấp!!","Đơn hàng làm xong vào 11/6 vẫn đang trong hạn bảo hành\n1. KH phản ánh: KH có bơm au khi đến khảo sát để hỗ trợ di chuyển do KH xây nhà KH phát hiện ra trước đây việc lắp đặt ko đảm bảo tất cả các dây đều ko bọc ven và để trần. Ngoài ra lúc đầu tư vấn KH trao đổi rõ là làm điện 3 pha nhưng giờ KH mới thấy là biến tần 1 pha. KH đã có trao đổi với a Thuận thì a Thuận bảo tưởng và bảo nhà KH dùng tivi 1 pha, tủ lạnh 1 pha thì dùng 3 pha làm gì. KH bức xúc khi đã nói rõ là nhà KH kinh doanh phòng trọ rồi.\n3. KH yêu cầu: CN đến khảo sát trực tiếp đối chứng và đưa ra phương án xử lý vấn đề này. Nếu không KH sẽ khiếu nại cấp cao hơn mà đưa ra MXH.","1. KH chưa liên hệ CN\n\n2. Đơn hàng DVKT của KH đã hoàn thành ngày 08/06 và khách hàng có một số phản ánh :\n\n- KH cần KT hỗ trợ kiểm tra và bơm gas nếu cần, sau đó KT hỗ trợ tuy nhiên chưa báo đơn giá, loại gas, chỉ số áp suất trước và sau khi bơm\n\n- Sau khi hoàn thành và thanh toán thì KH mới có thông tin dịch vụ bơm gas không trong gói dịch vụ của VCC, sau đó KH được KT y/c ký nhận \"hóa đơn bán lẻ\", KH không được nhận các chứng từ liên quan đến việc nghiệm thu sau khi hoàn thành dịch vụ\n\n- Nội dung đơn hàng của KH ban đầu là bảo dưỡng combo 3 điều hòa, sau đó chuyển thành bảo dưỡng điều hòa tủ đứng,\n\n- KH chưa được ký chứng từ, biên bản nghiệm thu nào liên quan đến Dịch vụ bảo dưỡng và vệ sinh điều hòa, chỉ có lịch sử chuyển tiền thanh toán đơn hàng 1.850.000 ( 600.000 gói dịch vụ bảo dưỡng vệ sinh điều hòa và 1.250.000 phí bơm gas cho 3 thiết bị điều hòa)\n\n3. KH cần chi nhánh liên hệ và giải đáp cho KH sớm","KH phản ánh có KT qua làm báo ko phải thợ của Viettel và do người mặt đồng phục viettel dẫn đến. KH thấy giá vật tư phát sinh thêm là ống đồng mà KT trao đổi báo giá thu vượt so với cả trên app. KH yêu cầu KT phản hồi lại thông tin cho KH.","KH làm xong gói BD 3 điều hòa vào 22/5, KH cũng đi công tác nên giờ mới thấy 1 cái bị kẹt cửa gió và 1 cái bị chảy nước đã hết hạn bảo hành CSKH đã từ chối nhưng KH gay gắt cần KT qua kiểm tra hỗ trợ, KH đồng ý trả phí.","KH có YCTX nhưng chưa có KT toán, thanh toán giá trị hợp đồng còn lại theo quy định\n- Xác nhận thông tin bảo hành của Hệ thống, thiết bị đã lắp đặt\n\n3. KH cần CN liên hệ và hỗ trợ giải đáp sớm","Đã báo chi nhánh \nKH THẤY ĐIỆN NĂNG LƯỢNG TRỜI HIỆU NĂNG THẤP \nYÊU CẦU KT QUA KTRA CHO KH liên hệ  0983449917","KH có YCTX NLMT từ 19/05 cần Chi nhánh liên hệ lại và tư vấn cho KH","1. Chi nhánh báo lỗi cho KH\n\n2. Thiết bị pin lưu trữ của KH gặp sự cố không xả, hiện KH chỉ sử dụng được điện lưới\n\n3. KH cần chi nhánh liên hệ và đến hỗ trợ sớm","KH chưa báo CN,KT\nKH cần hỗ trợ về việc cài lại app theo dõi NLMT\nYêu cầu CN cho KT xuống hỗ trợ KH","KH cần hỗ trợ giấy tờ hồ sơ để nộp lên EVN\nYêu cầu CN cho KT đến hỗ trợ KH","KH đã báo KT\nKH phản ánh về tiến độ lấp đặt chậm chễ hơn 1 tháng nay cứ hẹn lên hẹn xuống KH bức xúc\nYêu cầu CN cho KT xuống hỗ trợ KH","KH chưa báo CN,KT\nKH báo KH thấy hiệu suất sản phẩm NLMT bị kém đi, dù KH lắp hệ 10kw nhưng sản lượng rất kém\nYeu cầu CN cho KT xuống ktra hỗ trợ KH","KH có YCTX NLMT từ 01/06 chưa có ai liên hệ và tư vấn","1. KH đã liên hệ CN\n\n2. Điện trong Pin lưu trữ vẫn còn nhưng HT NLMT vẫn lấy điện lưới, sản lượng không nhiều (0,1 Kw/h), tuy nhiên KH lo ngại về lâu dài\n\n3. KH cần CN liên hệ và hỗ trợ sớm","KH có đơn hàng bảo dưỡng KT hẹn 4H chiều 7/6 nhưng chưa thấy có ai liên hệ\nYêu cầu KT liên hệ lại cho KH","KH có YCTX NLMT từ ngày 6/6 chưa có ai liên hệ tư vấn","KH có YCTX NLMT từ ngày 03/06 chưa có ai liên hệ tư vấn","KH chưa báo CN \nKH phản ánh: Hệ thống NLMT bị lỗi không hoạt động \nYểu cầu quản lí điểu kĩ thuật xuống kiểm tra","1. KH đã liên hệ CN\n\n2. Hiện HT NLMT của KH đang ko sản xuất điện\n\n3. KH cần CN đến kiểm tra và khắc phục sớm","KH có đặt đơn hàng DVKT chưa được KT tại chi nhánh liên hệ và đến hỗ trợ\n\nKH cần CN liên hệ và hỗ trợ gấp","Kh chưa báo CN,KT\nKH đang cần hỗ trợ lắp đặt thêm Metor, hd cài lại app vì không xem được công suất điện sản xuất ra \nYêu cầu CN cho KT đến hỗ trợ KH","KH đã có YCTX nhưng chưa được nhân viên hẹn lịch khảo sát\nYêu cầu CN liên hệ lại KH","KH có YCTX NLMT cần chi nhánh liên hệ lại và đến khảo sát, gửi báo giá gấp","CN báo sự cố KH (0981191000)\nKH gặp sự cố nhà KH mất điện hệ thống nlmt không hoạt động được\nYêu cầu CN cho KT xuống hỗ trợ KH","KH chưa báo CN,KT\nKh báo sự cố nlmt điện lưới lên không có điện pin chỉ có điện lưới\nYêu cầu CN liên hệ cho KH đến ktra cho KH","KH chưa báo CN,KT\nKH báo sự cố biến tần kêu to, có mùi khét\nYêu cầu CN cho KT xuống Kiểm tra cho KH","KH sử dụng dịch vụ sửa chữa điều hòa trước đây giờ cục nóng bên ngoài đang có tiếng kêu bất thường. KH yêu cầu qua kiểm tra lại.","1. KH đã báo CN\n2. KH phản ánh: pin lưu trữ không hoạt động\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này nếu có gì thay thế thì thay thế luôn","KH chưa báo CN, KT, đã báo GĐKD nhưng chưa được sử lý triệt để\nKH báo sự cố NLMT thi thoảng bị ngắt điện 1,2 phút xong lại có lại \nYêu cầu CN cho KT đến kiểm tra xử lý cho KH","KH làm xong vào t5 mới sáng nay thì thấy đèn xanh nháy và cửa gió không mở nữa. KH cần KT hỗ trợ khắc phục lỗi hoặc đến kiểm tra lại điều hòa.","CN 0977162333 báo sự cố hộ KH\n1. KH phản ánh: Bình ắc quy bị lỗi không xả, đang phải sử dụng toàn điện lưới\n2. KH yêu cầu: Qua kiểm tra lại và khắc phục tình trạng này.","1. KH đã liên hệ CN\n\n2. Biến tần của KH hiện đang gặp sự cố không phát điện\n\n3. KH cần CN đến hỗ trợ khắc phục sớm","1. KH đã liên hệ CN\n\n2. Thiết bị NLM inverter 3 pha nhưng 1 pha không hoạt động\n\n3. KH cần chi nhánh liên hệ và đến hỗ trợ sớm","KH chưa báo CN, KT \nKH báo sự cố NLMT inverter không sản xuất ra điện \nYêu cầu CN cho KT xuống ktra xử lý cho KH","YCTX NLMT 29/5 KH cần KT liên hệ sớm tư vấn chính sách trả góp NLMT","1. KH đã báo CN\n2. KH phản ánh: Trời nắng điện nlmt lúc có lúc không. CN có phản hồi là do điện yếu với nhà KH dùng nhiều, KH thấy không thuyết phục. \n3. KH yêu cầu: Qua kiểm tra, đưa ra phương án khắc phục xử lý tình trạng này.","KH chưa báo CN, đã báo KT nhưng chưa được hỗ trợ \nKH báo sự cố NLMT buổi tối là dùng điện lưới không dùng điện pin nlmt\nYêu cầu CN cho KT xuống kiểm tra hỗ trợ KH","1. KH đã báo CN\n2. KH phản ánh: ivt bị lỗi đã hết hạn bảo hành đã báo CN qua kiểm tra bảo là thay mới nhưng KH thấy chỉ đến kiểm tra qua loa rồi bắt thay mới. KH ko đồng ý, ko hài lòng với cách kiểm tra phương án thay mới của CN.\n3. KH yêu cầu: Qua kiểm tra lại và mang ivt đi sửa chữa, KH đồng ý tính phí sửa chữa nếu ko sửa được thật thì mang trả lại và phản hồi lại cho KH về lý do.","KH gặp sự cố sau bảo dưỡng điều hòa bị chảy nước\nYêu cầu CN cho KT đến hỗ trợ KH","1. KH chưa báo CN\n2. KH phản ánh: Sập hết cả điện lưới lẫn điện nlmt\n3. KH yêu cầu: Qua kiểm tra, khắc phục gấp","KH chưa báo CN Chưa báo KT \nKH báo sự cố hệ thống NLMT hoạt động chập chờn\nYêu cầu CN cho KT xuống hỗ trợ KH","KH báo chưa thấy có KT liên hệ","1. KH chưa báo CN\n2. KH phản ánh: Chốt số 5 của KH gặp sự cố ko thấy nạp vào, cứ thấy bật lên rồi lại cúp nguồn. KH đồng ý hỗ trợ tính phí\n3. KH yêu cầu: KT qua kiểm tra, hỗ trợ cho KH.","1.KH chưa liên hệ CN\n\n2. KH không đăng nhập được vào App theo dõi hiệu suất HT NLMT\n\n3. KH cần CN liên hệ và hỗ trợ sớm","1. KH chưa báo CN\n2. KH phản ánh: pin lưu trữ ko thấy nạp vào, thiết bị điện trong nhà thì cháy hết.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN\n2. KH phản ánh: nội dung combo dùng biến tần Solax và pin Solax thì thời gian bảo hành biến tần sẽ là 10 năm nhưng trong hợp đồng đang để là 7 năm. KH đã trao đổi với CN và được thông tin là đang xem xét với hãng.\n3. KH yêu cầu: Sửa lại phần hợp đồng bảo hành là 10 năm","1. KH chưa báo CN\n2. KH cần hỗ trọ: KH có 3 hợp đồng đang cần xin tất cả bản hợp đồng bản mềm từ nghiệm thu, tới bản hợp đồng chính thức gửi qua zalo cho KH\nKH có di chuyển hệ thống NLMT từ trong DLK ra ngoài HNI đã báo CN HNI về việc lắp đặt nhưng 3 tuần rồi chưa có ai liên hê đến lắp đặt cho KH\nYêu cầu CN liên hệ và cho KT đến hỗ trợ lắp đặt, thủ tục giấy tờ cho KH","KH báo chưa thấy có KT liên hệ","KH đặt đơn từ 26/5 mà chưa thấy có KT liên hệ","Đơn hàng mới làm xong vào 12h trưa 5/6 còn hạn bảo hành 72h\n1. KH phản ánh: KT đến làm vệ sinh máy và kiểm tra nói là tầng 1 có 1 máy điều hoà không được mát lắm và kiểm tra xác định ga bị thiếu khoảng 35 psi. KT khuyên bổ sung ga, KH đồng ý. KT nạp ga xong ghi phiếu là bồ sung ga R32 nhưng KH phát hiện ra vỏ bình ga ghi R22. KT giải thích không vấn đề gì. Như KH được biết là điều hoà nhà KH phải dùng ga R32. KH lo ngại việc bổ sung ga R22 gây nguy hiểm và có thể hư hại cho điều hoà.Ngoài ra, sau khi làm vệ sinh có 1 điều hoà dùng điều khiển bật thì nút nguồn chập chờn, lúc được lúc không, KH bấm nút bằng tay thì chạy.\n2. KH yêu cầu: Phản hồi hay giải thích để cho KH yên tâm hơn và qua kiểm tra lại phần nguồn bật","1. KH chưa báo CN\n2. KH phản ánh: Từ sáng tới giờ trời nắng mà ko sử dụng được điện nlmt, cũng ko thấy điện nạp vào pin lưu trữ\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Kh đã báo CN, KT \nKH cần hỗ trợ cài lại giờ sạc từ điện lưới vào bình acquy từ 0h đến 4h sáng\nYêu cầu CN cho KT xuống hỗ trợ KH","KH đã báo CN, KT\nKH báo sự cố NLMT bộ chuyển đổi 1 đèn có sáng 1 đèn không sáng, sản lượng kém\nYêu cầu CN cho KT xuống hỗ trợ cho KH gấp","KH chưa báo CN,KT\nKH báo sự cố đường truyền mạng lắp của VCC kiểm tra đo đạc từ ngoài thì không sao nhưng khi đưa vào sử dụng thì không sử dụng được\nYêu cầu CN cho KT qua kiểm tra cho KH","KH có YCTX chuyển thiết bị biến tần NLMT phục vụ việc xây nhà\n\nKH cần CN liên hệ và hõ trợ gấp để có thể sử dụng dịch vụ","KH đã báo CN và KT\n\nKH phản ánh về việc lắp đặt NLMT chậm chễ hôm làm hôm không, Kỹ thuật lắp đặt đo đạc không chuẩn chỉnh khiến KH bức xúc\n\nBiến tần của KH đang gặp sự cố báo lỗi, nếu nhà KH sử dụng quá số tải sẽ nhảy CB mất điện, hiện đang không có điện lưới, chỉ sử dụng được điện NLMT\n\n\nYêu cầu CN liên hệ lại và cho KT xuống hỗ trợ cho KH","KH đã báo KT chưa báo CN \nKH báo sự cố NLMT pin không sạc vào điện dù trời nắng to, KH đã liên hệ KT nhiều làn nhưng chưa được hỗ trợ\nYêu cầu CN cho KT xuống hỗ trợ KH","KH có YCTX NLMT ngày 05/06 cần Chi nhánh liên hệ và tư vấn lại","KH có YCTX NLMT từ ngày 28/05 chưa có ai liên hệ và tư vấn","KH có YCTX NLMT từ ngày 02/06 cần CN liên hệ và tư vấn lại","1. KH đã liên hệ CN\n\n2. KH cần CN hỗ trợ hoàn thiện hồ sơ của HT NLMT để thông báo cho bên điện lực, KH hiện đang ký kết 2 HĐ NLMT với Chi nhánh\n\n3. KH cần CN liên hệ và hỗ trợ sớm","KH đã báo CN , KT \nKH phản ánh về việc triển khai lắp đặt hệ thống NLMT chậm chễ \nYêu cầu CN liên hệ và cho KT xuống hỗ trợ KH","KH đã báo KT, CN \nKH phản ánh tiến độ triển khai chậm, mưa ngấm trần vì KH tháo mái tôn cho KT dễ thi công nhưng đến giờ là gần 1 tháng vẫn chưa lắp đặt xong cho KH\nYêu cầu CN cho KT đến lắp đặt hỗ trợ cho KH","1. KH đã liên hệ CN\n\n2. KH đang bị mất điện luới, HT không tự chuyển sang điện NLMT để sử dụng mà AB bị nhảy và ko có điện NLMT\n\n3. KH cần CN liên hệ và đến hỗ trợ sớm","KH đặt đơn DVKT từ ngày 04/06 nhưng  chưa có KT liên hệ đến hỗ trợ\n\nKH cần KT liên hệ và đến hỗ trợ sớm","KH có YCTX NLMT từ ngày 04/06 chưa có ai liên hệ tư vấn","1 KH đang bị mất giám sát HTNLMT  và đã được CN hỗ trợ chuyển đi bảo hành\n\n2 KH cần CN hỗ trợ sửa chữa và chuyển trả thiết bị sớm","KH đặt đơn bảo dưỡng diều hòa , bảo dưỡng xong khi KT đến thì điều hòa không kêu nhưng sau khi KT sửa thì điều hòa kêu, KH gọi KT nhưng KT chưa liên hệ lại. \nYêu cầu chi nhánh cho Kt xuống hỗ trợ KH, KH gay gắt","1. KH đã liên hệ CN\n\n2. KH đã ký hợp đồng lắp đặt NLMT và đóng trước 40% phí lắp đặt, tuy nhiên chưa được lắp đặt với lý do thiếu vật tư thiết bị, KH không hài lòng và đề xuất hủy hợp đồng\n\n3. KH cần CN liên hệ và đề xuát hướng xử lý gấp","1. Inverter của KH lỗi từ sáng,  cần hỗ trợ gấp , nhà có 4 tủ đông mất điện, đang rả đông hàng gia trị gần 100tr.\n\n2. CN báo lỗi cho KH, hiện đã hỗ trợ khắc phục sơ bộ\n\n3. KH cần CN đến hỗ trợ khắc phục sớm","YCTX NLMT lịch hẹn 27/5 mà giờ KH vẫn chưa thấy có KT liên hệ tư vấn hay đến khảo sát","KH đã báo CN \nKH đang sd NLMT , hiện tại thiết bị ko hoạt động, \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra gấp","CN 0985792828 báo sự cố hộ KH\n1. KH phản ánh: biến tần báo lỗi, thiết bị trong nhà bật tắt liên tục. Trong vòng 30p app bật tắt nhảy 10 lần, mất điện xong có điện.\n2. KH yêu cầu: Qua kiểm tra, xử lý gấp","KH đặt 8h sáng nay xong ko thấy KT đến làm cũng ko thấy liên hệ. Sáng KH phải xin đi làm muộn và chờ từ 8h-9h10 ko giải quyết được gì. KH thấy cách làm việc rất thiếu chuyên nghiệp và ko tôn trọng KH 1 chút nào.","CN 0973616011 báo sự cố hộ KH\n1. KH phản ánh: mất kết nối pin lưu trữ với hệ thống giám sát\n2. KH yêu cầu: Qua kiểm tra, xử lý gấp cho KH","KH có YCTX tư vấn NLMT nhưng chưa được liên hệ tư vấn và khảo sát\nYêu cầu CN liên hệ ngay cho KH","1. KH đã liên hệ CN\n\n2. Chỉ số điện lưới KH sử dụng trên App đang có sự chênh lệch với công tơ (Trên App báo 94Kw - CÔng tơ báo 156Kw trong tháng 5), KH vào App kiểm tra thấy có lúc cập nhật thông tin hệ thống chưa chính xác\n\n3. KH cần CN hỗ trợ kiểm tra và xử lý giúp","KH chưa báo CN chưa báo KT\nKH báo sự cố NLMT mới lắp xong nhưng hiện tại bị rò rỉ điện\nYêu  cầu CN cho KT xuống khắc phục gấp cho KH","KH chưa báo CN \nKh phản ánh: chưa có kĩ thuật đến lắp đặt mặc dù đã có linh kiện \nYêu cầu quản lí điều kĩ thuật xuống lắp đặt gấp cho khách","KH có đơn DVKT chưa được KT liên hệ và đến hỗ trợ thực hiện\n\nKH cần KT đến hỗ trợ gấp","1. KH đã báo CN\n2. KH phản ánh: hệ nlmt bị hư át khi dùng phải canh át nhảy rồi bật đi bật lại. CN đã có qua kiểm tra nhưng báo chưa có linh kiện để thay. \n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","1. KH đã báo CN\n2. KH phản ánh: khi cúp điện không thấy bình ắc quy xả điện. CN đã đến kiểm tra 1 lần trước đó, báo bị lỗi và khả năng phải mang đi bảo hành.\n3. KH yêu cầu: Qua kiểm tra lại 1 lần nữa xem khắc phục được không nếu không thì mang đi bảo hành","YCTX NLMT lịch hẹn 5/6 nhưng giờ KH báo ch ớm","Kh phản ánh trên app của hệ thống với đồng hồ nhà nước chênh lệch số điện hơn gấp đôi\nYêu cầu KT xuống kiểm tra cho KH gấp","KH đặt đơn DVKT từ ngày 30/5 chưa có KT đến hỗ trợ\n\nKH cần KT liên hệ và đến hỗ trợ KH sớm","1. CN báo lỗi cho KH\n\n2. Ắc quy lưu trữ của KH xả cạn 0%, cần gửi hãng kiểm tra\n\n3. KH cần CN hỗ trợ khắc phục sớm","KH đã báo chi nh ánh \nKH phản ánh bộ lưu trữ không xả\nYêu cầu quản lí điều kĩ thuật kiểm tra","1. KH đã liên hệ CN\n\n2.KH bị lỗi AC, App theo dõi hiệu suất NLMT của KH báo lỗi\n\n3. KH cần CN liên hệ và đến hỗ trợ sớm","KH chưa báo chi nhánh\nKH không thấy trên hệ thống hiện số liệu \nYêu cầu kĩ thuật đến kiểm tra","1. KH đã liên hệ CN\n\n2.KH P/á chất lượng HT NLMT ko đạt yêu cầu, Biến tần của KH báo lỗi liên tục, KH lắp HT NLMT 40KW nhưng có lúc chỉ phát sinh được 2KW, thông tin tấm pin trong HĐ và lắp đặt thực tế khác nhau\n\n3. KH cần CN đến hỗ trợ khắc phục gấp cho KH","CN báo sự cố hộ KH \nKH phản ánh Bình lưu trữ vẫn nạp bth nhưng lúc mất điện là không cấp điện cho KH dùng\nYêu cầu kĩ thuật liên hệ và xuống kiểm tra cho KH","Đơn hàng trong hạn bảo hành\n\nKH có đơn hàng DVKT đã được hỗ trợ, sau bảo dưỡng máy giặt của KH có dấu hiệu rò rỉ nước ra sàn\n\nKH cần KT đến hỗ trợ khắc phục sớm","KH có YCTX NLMT ngày 13/05 và cần Chi nhánh liên hệ lại để tư vấn","KH đặt đơn hàng DVKT nhưng chưa có KT liên hệ và đến hỗ trợ\n\nKH cần KT liên hệ và đến hỗ trợ sớm","1. Chi nhánh báo lỗi cho KH\n\n2. Hiện nhà KH đang mất điện NLMT, bị nhảy AB liên tục\n\n3. KH cần CN đến hỗ trợ khắc phục sớm cho KH","KH chưa báo CN chưa báo KT\nKH báo sự cố NLMT đang không vào đc hệ thống giám sát \nYêu cầu CN cho KT xuống hõ trợ KH","KH đã có YCTX tư vấn NLMT và KT đã qua khảo sát xong không nói gì với KH, cũng không thấy quay lại để tư vấn hỗ trợ lắp đăt \nYêu cầu CN liên hệ lại KH gấp","KH có YCTX tư vấn NLMT nhưng chưa có KT liên hệ tư vấn\nYêu cầu CN liên hệ lại cho KH","KH kí hợp đồng đã chuyển cọc quá hạn hợp đồng mà chưa có ai xuống hỗ trợ \nYêu cầu KT xuống hỗ trợ KH lắp đặt","KH chưa báo CN chưa báo KT\nKH báo sự cố NLMT bình ac quy kêu cả đêm liền mây ngày \nYêu cầu CN cho KT xuống hỗ trợ KH","CN 0985524405 báo sự cố hộ KH qua zalo\n1. KH phản ánh: mất điện lưới hệ thống năng lượng mặt trời không hoạt động\n2. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","KH đã có YCTX nhưng chưa có NV qua khảo sát \nYêu cầu CN liên hệ lại cho KH","KH chưa báo chi nhánh \nKH đặt dịch vụ vệ sinh nhưng quên không báo kĩ thuật kiểm tra gas\nYêu cầu kĩ thuật đến kiểm tra","KH chưa báo CN chưa báo KT \nKH báo sự cố NLMT không hoạt động từ ngày 30/5 đến nay \nYêu cầu CN cho KT xuống hỗ trợ cho KH gấp","KH đặt đơn DVKT từ ngày 27/05 chưa được liên hệ và đến hỗ trợ\n\nKH cần đến hỗ trợ sớm","YCTX thang máy lịch hẹn vào 23/05 mà giờ KH chưa thấy có KT liên hệ để tư vấn, khảo sát","Khách hàng đã báo chi nhánh\nHệ thống năng lượng bị sập, không hoạt động\nYêu cầu chi nhánh điều kĩ thuật kiểm tra","CN 0969776567 báo sự cố hộ KH\n1. KH phản ánh: điện nlmt ko phát ra tải cho KH sử dụng. Hiện tại khi mất điện lưới ko có điện nlmt để sử dụng\n2. KH yêu cầu: Qua kiểm tra, xử lý tình trạng này","KH chưa báo KT chưa báo CN\nKH báo sự cố NLMT hiện tại điện áp bị cao quá\nYêu cầu CN cho KT xuống hỗ trợ gấp","KH chưa báo chi nhánh \nKH phản ánh lắp thiếu 1 cục pin lưu trữ chưa lắp cho khách, khách báo kĩ thuật nhưng kĩ thuật chậm hẹn vì không có linh kiện \nYêu cầu chi nhánh liên hệ lại cho KH","1. KH đã báo CN\n2. KH phản ánh: chập cháy nguồn vào tủ điện\n3. KH yêu cầu: Qua kiểm tra, xử lý tình trạng này.","1. KH chưa báo CN\n2. KH phản ánh: pin báo đỏ, ko xả điện ra\n3. KH yêu cầu: Qua kiểm tra, xử lý","KH chưa thấy có kĩ thuật liên hệ, KH cần vệ sinh lúc 9h30 sáng nay","KH đã báo bên chi nhánh. \nKhách hàng báo tiến độ triển khai chậm \nYêu cầu chi nhánh cho kĩ thuật xuống hỗ trợ KH","1. KH đã báo CN\n2. KH phản ánh: Công suất tụt giảm so với lúc trước khoảng 30-40% cụ thể từ trước công suất khoảng 15kw/1h mà giờ đỉnh điểm  xong thì bây giờ KH thấy hệ thống NLMT kêu tiếng to ù ù\nYêu cầu CN cho KT xuống hỗ trợ KH","Yêu cầu kĩ thuật liên hệ lại KH để thông tin thời gian cụ thể","Chưa điều phối kĩ thuật gọi cho KH \nYêu cầu điều phối kĩ thuật gấp","KH đã báo KT chưa báo CN\nKH báo sự cố nlmt hiệu suất bị chênh với app của điện lực\nYêu cầu CN cho KT xuống hỗ trợ KH","Đã báo chi nhánh\nTrước chi nhánh đã mang pin lưu trữ đi bảo hành nhưng mang về vẫn không dùng được \nBiến tần của KH đang hiển thị được sản xuất từ năm 2016\nkh đang rất gay gắt\n\nKH Cần Chi nhánh liên hệ và đến kiểm tra khắc phục sự cố thiết bị cho KH","CN báo sự cố hộ KH (0986688282)\nKH gặp sự cố nlmt điện lưới chập chợt không hoạt động được\nYêu cầu KT xuống hỗ trợ KH","Đơn hàng trong hạn bảo hành\n\nKH cần KT qua kiểm tra cho KH thiết bị sau bảo dưỡng có tiếng kêu ù ù\n\nKH cần KT liên hệ và đến kiểm tra sớm","KH đã báo chi nhánh:\nTấm lưới pin NLMT bị mất điện sau 2h chiều mặc dù vẫn có điện, sau 3h lại hoạt động bth, KH sợ biến tần có vấn đè \nYêu cầu KT xuống kiểm tra giúp KH","KH chưa thấy có KT liên hệ tư vấn NLMT. KH yêu cầu kt gọi lại cho khách hàng để tư vấn, khảo sát NLMT","1. Kh chưa báo CN\n2. KH báo trước lắp 1 cục pin lưu trữ nhưng do quá tải nên KH lắp thêm 1 cục nữa để 2 cục chạy bằng nhau. Sau khi lắp xong KH thấy 1 cục thì đầy, còn cục mới lắp thì ít. KH muốn là nếu chạy công suất 100% thì phải chia đều 50-50 cho 2 cục pin. KT xử lí onl cho KH chứ không có xuống trực tiếp để hỗ trợ. KH muốn KT xuống hỗ trợ cho KH\n3. Yêu cầu CN điều KT xuống hỗ trợ cho KH gấp","1. KH chưa báo CN\n2. Kh báo 3 ngày vừa rồi hệ thống không chạy điện\n3. Yêu cầu CN điều KT xuống hỗ trợ KH gấp","KH đã báo CN, đã báo KT\nKH báo: \"KH cần cung cấp hồ sơ thiết bị biến tần hóa đơn, thủ tục đăng kí\nKH cần bản cứng hóa đơn về việc lắp đặt thiết bị , seri thiết bị, phiếu xuất,\nKH có hỏi nhân viên về việc kiểm tra hồ sơ thông báo với điện lực về việc lắp đặt hay chưa để KH còn thông báo\nYêu cầu CN liên hệ lại gấp  cho KH \n\"","KH đã báo Kĩ  Thuật, đã báo Chi Nhánh\nKH phản ánh: Tư vân lắp đặt không đúng yêu cầu\nLắp đặt xong ko đáp ứng được công năng sử dụng\nKH có báo lên tổng đài để xử lý, có người gọi nhưng không có ai hỗ trợ\nYêu cầu Chi Nhánh cho kĩ thuật xuống hỗ trợ KH gấp","1. KH chưa báo CN\n2. KH phản ánh: Mất kết nối ở trên app báo ngoại tuyến ko xem được điện vào điện ra, đèn ở nlmt báo đỏ.\n3. KH yêu cầu: Qua kiểm tra, hỗ trợ KH","KH có YCTX NLMT được tạo ngày 28/05 nhưng chưa có ai liên hệ tư vấn","Đã  báo chi nhánh \nMàn hình inveter lúc bật lúc tắt, kêu tạch tạch \nYêu cầu kĩ thuật qua kiểm tra cho khách hàng gấp","1. KH đã liên hệ CN\n\n2. Hiện KH đang được hỗ trợ lắp đặt hệ thống NLMT chỉ còn thiếu Inverter\n\n3. KH cần CN hỗ trợ chuyển thiết bị và lắp đặt hoàn thiện HT NLMT cho KH","1. KH đã liên hệ CN\n\n2. HIện tại có một số phòng tại nhà KH đang không có điện NLMT mà dùng điện lưới, chỉ có 2 phòng sử dụng điện NLMT\n\n3. KH cần CN đến hõ trợ khắc phục sớm","KH chưa báo CN chưa báo Kt \nKH gặp sự cố Thang máy đang hoạt động bị dừng đột ngột \nYêu cầu CN liên hệ ngay cho KH gấp","1. KH chưa liên hệ CN\n\n2. Pin lưu trữ của KH đang không xả điện, HT NLMT không phát sinh điện NLMT khoảng 2 ngày nay\n\n3. KH cần CN đến hỗ trợ và xử lý gấp","1. KH đã báo CN: Anh Nồng\n2. KH phản ánh: Đường dây nlmt giằng xuống thấp khiến cho sạc vào pin yếu và tín hiệu yếu. CN có hẹn nhiều lần nhưng chưa thấy xuống kiểm tra, xử lý.\n3. KH yêu cầu: Qua kiểm tra, xử lý gấp cho KH\n***Địa chỉ lắp đặt: khu 4, Xã Đình Lập, Tỉnh Lạng Sơn","yêu cầu kt gọi lại cho khách hàng","1. KH chưa báo CN\n2. KH cần hoàn thiện hồ sơ để gửi cho bên điện lực\n3. Yêu cầu CN hỗ trợ và xử lí cho KH","1. KH chưa báo CN\n2. KH cần CN hoàn thiện hồ sơ để gửi cho bên điện lực\n3. Yêu cầu CN hỗ trợ và xử lí cho KH","984299113 chi nhánh báo hộ \nTủ điện NLMT nhảy atomat liên tục \nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Tống - ký hợp đồng, A Cảnh - đội thi công lắp láp\n2. KH phản ánh: Tiếp địa k thấy làm theo quy trình mà đấu trực tiếp vào cột nhà, có báo lại nhưng chưa thấy kỹ thuật đến xử lí. Vì trời đang vào mùa mưa xét nhiều nên nguy hiểm.\n3. KH yêu cầu: Qua kiểm tra, xử lý đấu nối tiếp địa","Chưa báo chi nhánh\nKh bị cháy attommat \nYêu cầu kt qua ktra cho kh","1. KH đã liên hệ với chi nhánh\n\n2. HT NLMT của KH chưa được hoàn thiện hạng mục dây tiếp địa\n\n3. KH cần CN liên hệ và hỗ trợ sớm cho KH\n\n3. KH cần CN liên hệ và đến hỗ trợ","0986688282 chi nhánh báo hộ \nNLMT bị nhảy aptomat liên tục KH đang mất cả điện NLMT cả điện lưới\nYêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: KH theo dõi trên app ko thấy có sản lượng điện trong khi trời nắng rất to, các tháng trước cũng đều ko có điện dư\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","1. KH đã báo CN\n2. KH phản ánh: Trước đó CN hỗ trợ cung cấp hình ảnh thiết bị nhưng khi KH đưa cho bên điện lực thì bị từ chối và trả lại. KH đang thấy bên điện lực bắt cung cấp CO,CQ và phải có dấu mộc nguồn gốc sản phẩm.\n3. KH yêu cầu: Hỗ trợ KH hoàn thiện nốt hồ sơ","1. KH đã báo CN\n2. KH phản ánh: Cháy cục chống sét trong tủ điện, trước đó có bị 1 lần rồi và KT đã thay cho KH rồi đến hôm nay lại bị tiếp và cháy đen luôn.\n3. KH yêu cầu: Qua kiểm tra xác định rõ nguyên nhân và khắc phục","Kh chưa báo chi nhánh\nPin lưu trữ không sạc không xả\nYêu cầu kĩ thuật qua xử lý cho khách hàng","Đã báo chi  nhánh \nÁc quy lưu trữ ko vào pin, không có lưu trữ\nYêu cầu kt qua ktra cho kh","KH đã báo KT chưa báo CN\nKH báo việc lắp đặt hệ thống NLMt lâu\nYêu cầu CN cho KT xuống hỗ trợ KH","kh đã báo chi nhánh \nkh đang cháy cục City, khách hàng muốn KT trả lời rõ ràng cho khách hàng\nKhách hàng muốn biết hướng giải quyết yêu cầu kt gọi cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Nắng to nhưng khi mất điện lưới ko thấy có điện nlmt để sử dụng\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Chưa báo chi nhánh \nBiến tần nhà khách hàng đang lỗi \nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN\n2. KH cần hỗ trợ gửi lại biên bản nghiệm thu, bảng báo giá, CO, CQ và hướng dẫn làm thủ tục hồ sơ để gửi phía bên điện lực. Gửi qua đường mail: tuananhsocsonhanoi@gmail.com","KH có YCTX NLMT từ ngày 21/05 chưa có ai liên hệ và tư vấn","1. KH chưa liên hệ CN\n\n2. Từ ngày 26/05 HT NLMT của KH không hoạt động, Trên App chỉ hiện thông tin hoạt động của Hệ thống từ ngày 26, KH đang sử dụng điện lưới\n\n3. KH cần CN liên hệ và đến hỗ trợ gấp","1. KH đã liên hệ cho CN\n\n2. Biến tần của KH báo đỏ và ko sử dụng được điện NLMT trong khi Pin lưu trữ còn 91%\n\n3. KH cần CN đến hỗ trợ khắc phục sớm","1. KH đã liên hệ cho CN\n2. HT NLMT của KH đang ko sản xuất và tích đủ điện để sử dụng, Sáng nắng to, đến chiều khi mất điện KH bật bóng đèn không sáng\n3. KH cần CN đến hỗ trợ và khắc phục sớm\"","kh gọi hotline báo kt qua bảo dưỡng ko làm đúng quy trình (ko đo gas) , ko mặc đồng phục, kh hỏi thì bảo mình là bên thứ 3 nhận việc ăn chia tiền với Viettel thôi, kh báo hiện tại điều hòa vệ sinh xong vẫn ko mát (nghi do hết gas nhưng kt báo máy bình thường nên ko đo gas và ko bơm gas cho kh) kh cần kt của Viettel qua kiểm tra lại cho kh","Kh đã báo KT\nKH báo hệ thống NLMT KH lắp là 150tr gồm có 1 cục pin lưu trữ và 1 biến tần, nhưng hiệu suất kém ,điện chỉ đủ đến 8 9h tối là ngắt, nắng to cũng không đủ điện dùng\nKH yeu cầu CN cho KT xuỗng hỗ trợ KH gấp","1. Kh chưa báo cn\n2. Kh phản ánh: Hiện tại ko có mắt cam nào xem đc, mạng thì vẫn bình thường\nkh gặp lại trường hợp cũ\n3. Kh yc: Yc cn hỗ trợ","1. CN báo lỗi giúp KH\n\n2. KH đã được hỗ trợ lắp đặt HT NLMT khoảng 3 ngày nhưng hệ thống gần như ko hoạt động, báo sai thông tin trên App theo dõi hiệu suất, Ắc quy lúc nhày 100% lúc lai\n\n3. KH cần CN liên hệ và đến hỗ trợ sớm","CN 0965313434 báo sự cố hộ KH\n1. KH phản ánh: hệ thống điện bị ngắt, có thể bị hỏng ats\n2. KH yêu cầu: Qua kiểm tra, hỗ trợ, xử lý tình trạng","CN 0984299113 báo sự cố hộ KH\n1. KH phản ánh: hiệu suất ko đạt, KH lắp 16kw nhưng 1 ngày ắc quy ko đầy chỉ đạt được 81%.\n2. KH yêu cầu: Qua kiểm tra lại hiệu suất cho KH","CN 0984299113 báo sự cố hộ KH\n1. KH phản ánh: mất kết nối app, báo offline, ko thấy có điện nlmt để sử dụng\n2. KH yêu cầu: Đến xử lý, hỗ trợ cho KH","1. CN báo lỗi cho KH\n\n2.KH đã lắp đặt HT NLMT 1 tháng rồi nhưng chưa được hỗ trợ cài đặt App theo dõi hiệu suất\n\n3. KH cần CN liên hệ và đến hỗ trợ sớm","1. CN báo lỗi giúp KH\n\n2. KH bị mất giám sát trên APP theo dõi hiệu suất\n\n3. KH cần CN hỗ trợ sớm","***SĐT phản ánh: 0966968513\n1. KH chưa báo CN\n2. KH phản ánh: bị nhảy áp liên tục, ko dùng được điện nlmt, điện lưới vẫn vào.\n3. KH yêu cầu: Qua kiểm tra, tách điện lưới và điện nlmt","Đã báo chi nhánh\nNLMT không vào điện inverter ko hiển thị\nYêu cầu kt qua ktra cho khách hàng","CN 0968088033 báo sự cố hộ KH \n1. KH phản ánh: Bị bể 3 tấm pin. CN có qua kiểm tra tấm pin thì cũng thấy có vết từ trên trời rơi xuống, nhưng cũng chưa thể xác nhận chính xác được, KH cũng đang ko chấp nhận là do tác động vật lý. \n2. KH yêu cầu: Phản hồi lại thông tin cho KH và thay mới 3 tấm pin.","1. KH đã báo CN: A Nghĩa\n2. KH phản ánh: hiệu suất kém chưa ko đạt hiệu suất theo cam kết. Hệ 10kw nhưng chưa bao giờ lên được 7kw lúc đầu KH lắp 10 tấm và có lắp thêm 6 tấm nữa KT cũng bảo tối đa ít nhất là 13kw mà hiện tại chỉ vẫn có được 6-7kw. Ngoài ra còn thấy ưu tiên sử dụng điện lưới khi vẫn có điện tại pin lưu trữ và vào ban đêm cục dự trữ pin nút đỏ kêu, CN có bảo tắt 5-10p rồi bật lại là ko sao nhưng hiện tượng này KH thấy lặp đi lặp lại 4-5 lần rồi.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","1. KH chưa báo CN\n2 NLMT nhà Kh tủ điện nhà khách hàng nhảy át liên tục\n3 yêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Thạnh, A Nhị\n2. KH phản ánh: Cục biến tần cứ kêu tít tít ko sử dụng được.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","Chi nhánh báo hộ 971759579  \nInvertet bị lỗi đã bảo hành về nhưng vẫn bị lỗi \nYêu cầu kt xuống ktra cho kh","Đã báo chi nhánh\nTrong tủ điện báo đèn đỏ và có tiếng kêu, ktra trên app ko hiển thị chức năng\nkhách hàng ở ( tỉnh phú thọ xã thượng cốc)\nYêu cầu kt qua ktra cho khách hàng","Đã báo chi nhánh\nNLMT chỉ kéo điện lưới vào chứ không sản xuất \nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ CN\n\n2. HT NLMT của KH có công suất 12KW, hiện tại ngày nắng tốt nhưng chỉ phát sinh được 2KW\n\n3. KH cần CN liên hệ và hỗ trợ sớm","Đã báo chi nhánh\nNLMT chỉ kéo điện lưới vào không dùng điện pin lưu trữ\nYcau kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Hiện tại 1 áp ở trong hệ thống tổng tủ điện ko thấy nhảy lên và giờ đang ko sử dụng được \n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","1. KH chưa báo CN\n2. KH báo sau khi lắp đặt được 1 tháng, aptomat 2 chiều bị đảo chiều. KH đã liên hệ cho KT nhưng không nghe máy\n3. Yêu cầu KT liên hệ và hỗ trợ xử lí cho KH","Đã báo chi nhánh \nKh lắp hệ 30Wh nhưng hiện tại công suất chưa được 50%\nYêu cầu kt qua ktra cho kh","1. KH đã báo CN: Anh Long trước lắp đặt nhưng đang đi công tác \n2. KH phản ánh:  Lỗi ko sạc pin lưu trữ. Pin đã xả từ lúc sáng từ 50% xuống 0% sau đó dù có nắng và hệ thống điện mặt trời hoạt động nhưng công suất sạc pin hiển thị 0kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH chưa liên hệ\n\n2, Mức điện của KH phát sinh khi không sử dụng điện NLMT là 200 số/ngày, nếu đóng điện NLMT sẽ lã 295 số /ngày, mức tiền điện KH cần đóng thêm đang tăng cao\n\n3. KH cần CN đến hỗ trợ kiểm tra HT NLMT giúp KH","Kh đã báo chi nhánh \nBiến tần đang không chạy được\nYêu cầu kt qua ktra cho kh","1. CN báo lỗi cho KH\n\n2. HT NLMT của KH có dấu hiệu đẩy điện lưới, ắc quy báo 100% nhưng chỉ dùng điện lưới , sự cố từ hôm qua\n\n3. KH cần CN đến hỗ trợ kiểm tra sớm","Đã báo chi nhánh\nPin lưu trữ về 0% kh muốn pin lưu trữ không xuống 0% nếu không sẽ bị kêu báo động \nYêu cầu kt xuống ktra cho khách hàng","1. Kh chưa báo CN\n2. KH báo cục pin lưu trữ không có điện\n3. Yêu cầu KT hỗ trợ và xử lí cho KH","1. KH chưa báo CN\n2. KH lắp 2 máy nhưng 1 máy chạy công suất hoạt động kém\n3. Yêu cầu KT hỗ trợ và xử lí cho KH","1. KH đã báo CN \n2. KH đã kí hợp đồng từ 20/4 và thanh toán đầy đủ nhưng vẫn chưa được lắp đăt. KH rất gay gắt. Nếu từ giờ đến 2 ngày tới mà không được hỗ trợ KH sẽ đăng bài phốt\n3. Yêu cầu KT hỗ trợ lắp đặt cho KH","1. KH đã báo CN (anh phụ trách ký HĐ KH ko muốn nhắc tên)\n2. KH phản ánh: Đã ký hợp đồng nlmt được 20 ngày rồi mà giờ vẫn chưa lắp xong, chỉ lắp được mỗi pin còn những bộ phận khác không thấy gì. KH có liên hệ CN thì hứa hẹn hết ngày này qua ngày khác giờ thì gọi điện ko được, cũng ko thấy ai liên hệ với KH. KH rất bức xúc.\n3. KH yêu cầu: Từ giờ tới t2 mà ko lắp đặt yêu cầu CN tháo hết xuống mang về và hủy HĐ.","Chưa báo chi nhánh\nPin lưu trữ xả nhưng không nạp \nYêu cầu kt qua kiểm tra cho khách hàng","2. Tủ điện ATS tự chuyển đổi không tự động chuyển điện NLMT khi KH bị mất điện lưới ngày 22/05, đường dây điện vào bị cháy\n\n3. KH cần CN liên hệ và hỗ trợ khắc phục sớm","1. KH chưa liên hệ CN\n\n2.KH chưa theo dõi đc hiệu suất qua app, Hiệu suất HT NLMT không như quảng cáo, đội ngũ hỗ trợ tại CN chậm \n\n3. KH cần CN hỗ trợ liên hệ sớm","Đã chi nhánh \nKh thấy điện NLMt kéo điện lưới vào quá nhiều\nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Chẩu Văn Nghĩa\n2. KH phản ánh: pin lưu trữ đang bị gặp lỗi trước đó có ivt có mang đi bảo hành rồi mà có báo CN nhưng chưa thấy tháo dỡ nốt pin lưu trữ đi bảo hành.\n3. KH yêu cầu: Kiểm tra pin lưu trữ và mang thiết bị đi bảo hành","Đã báo chi nhánh \nAbs bị hỏng khách hàng sẵn abs \nYêu cầu kt xuống lắp cho khách hàng","1. KH đã liên hệ CN (Lê Ánh)\n\n2.Tối 8h Pin đóng không xả điện, sáng KH chỉ dùng được điện lưới dù pin lưu trữ vần còn 75% , Qua App thông báo Pin còn 10-15% tuy nhiên KH kiểm tra thì Pin lưu trữ thông tin vẫn còn 4 cọc\n\n3. KH cần CN hỗ trợ kiểm tra sớm cho KH","Đã báo chi nhánh\nĐiện năng lượng mt chập chờn, kh lắp hệ 12Wh nhưng chỉ được 6Wh\nYêu cầu kt xuống kiểm tra cho khách hàng","1. KH chưa liên hệ CN\n\n2. Những hôm nắng to Điện NLMT chỉ đạt hiệu suất 25-30% cố định do lệch pha từ khi lắp HT NLMT \n\n3. KH cần CN đến nhà KH trao đổi với nhân sự đấu điện cho KH dể thống nhất và có phương án xử lý lệch pha điện NLMT","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. KH bị mất điện ngày  17/5, khi có điện lại HT NLMT của KH không hoạt động, trên APP chỉ có thông số điện lưới, không có phát sinh điện từ NLMT\n3. KH cần CN hỗ trợ khắc phục sớm\nĐịa chỉ lắp đặt: Số nhà 18, Ngõ 111, Phạm Đình Toái, Nghệ An","Đã báo chi nhánh \n1 tấm pin nlmt bị nứt  \nYêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: pin ko đạt hiệu suất, trời nắng gắt chỉ đạt được 60-70% hiệu suất.\n3. KH yêu cầu: Qua kiểm tra thiết bị và khắc phục tình trạng này","1. KH đã báo CN\n2. KH phán ánh: Sự cố từ trước về 1 đèn NLMT xử lý xong rồi nhưng giờ đèn NLMT còn lại lại thấy sáng yếu hơn. KH có trao đổi với KT thì KT bảo KH tự mang xuống mang đi bảo hành trong khi lần trước là KT vẫn xuống mang đi bảo hành mà lần này lại bảo ko.\n3. KH yêu cầu: Xuống kiểm tra đèn nlmt còn lại nếu cần thì mang đi bảo hành.","1. KH đã liên hê CN và được hỗ trợ tháo thiết bị để chuyển cho hãng\n2. Pin lưu trữ của KH bị lỗi\n3. KH cần CN hỗ trợ khắc phục sớm","1.  KH chưa báo chi nhánh\n2. KH báo lỗi inverter không hoạt động, báo lỗi không hiển thị màn hình\n3. Yêu cầu Chi nhanh cho Kỹ thuật xuống hỗ trợ KH gấp","kh chưa báo chi nhánh ko thấy HĐ điện tử nhg khách hàng đã chụp hợp đồng giấy qua zalo\nNlmt không sản xuất ra điện\nyêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ với CN nhưng chưa tiếp nhận: Có liên hệ với CN là a Bùi Anh Nguyễn nhưng ko nghe máy, và cũng ko thấy gọi lại.\n2. KH phản ánh: Pin tích điện đủ nhưng ko thấy xả ra để dùng. KH đã báo bên điện lực đến kiểm tra và đã đo đồng hồ các thứ và ko bị làm sao. Tiền điện bây giờ vẫn tăng cao lúc chưa lắp là 8tr tư vấn lắp đặt thông tin là 2tr mà những tháng đầu tiền điện 4tr. Và khi <script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>

            div.style.top = top - 2 + "px";

    function throttle(fn, ms) {
    let throttle = false;
    let timer;
      return (...args) => {
        if(!throttle) { // first call gets through
            fn.apply(this, args);
            throttle = true;
        } else { // all the others get throttled
            if(timer) clearTimeout(timer); // cancel #2
            timer = setTimeout(() => {
              fn.apply(this, args);
              timer = throttle = false;
            }, ms);
        }
      };
