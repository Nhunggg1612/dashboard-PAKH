g","Thủ tục/giấy tờ/ Hóa đơn/ Hồ sơ lắp đặt","Sản phẩm/Hệ thống lỗi/không hoạt động","Tiến độ triển khai chậm","Sản phẩm/Hệ thống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động","Hỗ trợ lắp đặt","Sản phẩm/Hệ thống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động","Sản phẩm/Hệ thống lỗi/không hoạt động","Thiết bị vỡ, hỏng, chập cháy","Sản phẩm/Hệ thống lỗi/không hoạt động"],"Chi tiết":["1.  Tủ nguồn ATS của KH có dấu hiệu chập cháy\n2. KH đã liên hệ CN và được hỗ trợ xử lý sơ bộ\n3. KH cần CN hỗ trợ khắc phục sớm","1. KH đã báo KT anh Hải\n2.Hệ thống NLMT không phát ra điện, KH bị sự cố báo sáng 6/8 nhưng chưa được hỗ trợ \n3. Yêu cầu CN hỗ trợ KH","Đơn hàng KH đặt lịch hẹn với KT là 7/8 nhưng tin nhắn nhận được là làm 8/8. CSKH kiểm tra đơn với đề xuất KH muốn thay đổi lịch hẹn. KH yêu cầu CN liên hệ lại xác nhận đơn chính xác hẹn với KH","KH có YCTX từ 04/08 chưa có ai liên hệ và tư vấn","1. KH đã liên hệ CN\n2. KH cần hỗ trợ hoàn thiện chứng từ, hồ sơ của hệ thống NLMT để có thể cung cấp cho bên điện lực trong trường hợp có yêu cầu\n3. KH cần CN liên hệ và đến hỗ trợ sớm","KH có YCTX tư vấn về NLMT cần NVCN liên hệ lại tư vấn cho KH","KH có đặt đơn DVKT nhưng chưa có KT liên hệ hẹn lịch","1. KH đã báo CN: KT Quốc Việt,( CN phản hồi là ko thấy có thông tin HĐ, KH thấy có thể là KH gọi bằng SĐT khác nên CN ko thấy có HĐ )\n2. KH phản ánh: ivt mất kết nối, KH kiểm tra đường truyền mạng thì vẫn thấy bình thường\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","KH đã có YCTX phản ánh chưa được bên CN liên hệ tư vấn sản phẩm NLMT cho KH \nYêu cầu CN liên hệ và hỗ trợ KH","YCTX NLMT lịch hẹn 11/7 KH báo chưa thấy liên hệ tư vấn nlmt","YCTX NLMT lịch hẹn 6/8 nhưng KH cần liên hệ tư vấn gấp","1. KH chưa báo CN: KH ko còn giữ SĐT liên hệ\n2. KH cần hỗ trợ cung cấp bản hợp đồng cứng để KH lưu lại \n*** liên hệ trước SĐT đky HĐ là chị phó hiệu trưởng trường, nếu ko liên hệ được thì liên hệ với SĐT phản ánh 0868731084","Đơn hàng còn trong hạn bảo hành, sau bảo dưỡng điều hòa của KH gặp sự cố rò nước, cần CN hỗ trợ kiểm tra và khăc phục sớm","1. KH đã báo CN \n2. KH khi sử dụng điện thì nguồn điện bị chuyển nhảy lung tung giữa điện mặt trời và điện lưới (đang sử dụng năng lượng mặt trời thì hệ thống tự ngắt và chuyển sang điện lưới), ban đêm dung lượng pin lưu trữ vẫn còn nhiều (80% - 90%) nhưng hệ thống vẫn bị nhảy nguồn.\n3. Yêu cầu CN hỗ trợ KH","1. KH đã liên hệ CN\n2. Hiện trường đang bị mất điện một dãy lớp học, KH đã nhờ thợ điện đến kiểm tra và được thông tin do HT NLMT quá tải dẫn đến cháy cầu dao tổng\n3. KH cần CN đến kiểm tra và khắc phục sớm cho KH","cntt test","1. KH đã liên hệ CN\n2. KH đã ký hợp đồng NLMT với CNCT và đặt cọc từ tháng 3 tuy nhiên hiện tại chưa được CN hỗ trợ đến lắp đặt và hoàn thiện hệ thống, nhà KH đang trong quá trình xây dựng và đã hoàn thiện đường điện do không đợi được CN\n3. Hiện KH đang cân nhắc việc hủy hợp đồng và yêu cầu hoàn cọc do tiến độ lắp đặt chậm, khi cần liên hệ chi nhánh rất khó khăn, cần CN liên hệ và đến hỗ trợ đề xuất hướng xử lý gấp cho KH\n\n(Liên hệ KH trước 7h sáng hoặc sau 16h chiều, có thể nhắn tin trao đổi qua Zalo)","1. KH đã liên hệ CN\n2. Tủ nguồn NLMT đóng ngắt liên tục vào buổi tối khoảng 2 ngày nay\n3. KH cần CN liên hệ và đến hỗ trợ sớm","1. KH chưa liên hệ CN\n2. KH theo dõi HT NLMT thấy lượng điện sản xuất được và sản lượng tiêu thụ đang không đồng đều, nếu HT NLMT sản xuất được 10Kw điện thì tải nhà sẽ tiêu thụ khoảng 8Kw\n3. KH cần CN liên hệ và giải đáp cho KH","KH đã báo CN\nKH phản ánh biến tần không phát được điện  nữa,\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","1. KH chưa báo CN\n2. KH phản ánh: pin lưu trữ ko nạp điện vào, nguồn điện nlmt chạy lên mái đứng im\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","Đơn hàng đã có log cuộc gọi của KT, KH thấy có cuộc gọi nhỡ nhưng ko dám gọi lại do sợ lừa đảo. KH yêu cầu KT liên hệ lại","1. KH chưa báo CN\n2. KH phản ánh: điều hòa ko lạnh, bật nhiệt độ rất nhỏ nhưng cũng ko thấy lạnh\n3. KH yêu cầu: qua kiểm tra, bảo hành điều hòa cho KH","Đơn hàng không giới hạn số lần thăm khám từ t5 KH có vệ sinh 7 chiếc điều hòa hện tại có 3 điều hòa âm trần gặp tình trạng chảy nước. KH yêu cầu qua kiểm tra lại và hỗ trợ khắc phục tình trạng này","1. KH đã báo CN: từ phản ánh trước TT_1784109701554, và a Hào ở Thành Quá\n2. KH phản ánh: phản ánh từ trước xác định tấm pin bị vỡ KH có đặt mua nhưng do thời gian lâu nên CN là a Hào báo KH mua tấm pin ở ngoài, KH đã mua nhưng ko thấy CN tới hỗ trợ lắp. Ngoài ra, hiệu suất cũng ko đạt so với trước, bình thường rơi vào 25-30kw nhưng hiện tại chỉ được tầm 10kw\n3. KH yêu cầu: hỗ trợ lắp đặt và kiểm tra lại phần hiệu suất","1. KH chưa báo CN\n2. KH phản ánh: mất kết nối app theo dõi, mất giám sát\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","KH báo CN, CN báo gọi TĐ\nKH báo sự cố NLMT khi mất điện không tự đảo át\nYêu cầu CN cho KT qua ktra cho KH","KH đã báo CN, anh Hoàng \nKH phản ánh hiện nay hệ thống điện NLMT của KH không phát điện được nữa, mất toàn bộ hệ thống, kiểm tra trên app cũng báo lỗi\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","1. CN báo sự cố cho KH (981575791)\n2. Tủ nguồn của HT NLMT gặp sự cố không nhảy ATS và mất điện NLMT\n3. KH cần CN đến hỗ trợ sớm","Đơn hàng được áp dụng gói không giới hạn số lần thăm khám từ Tháng 03, Một điều hòa của KH gặp sự cố rò nước cần CN hỗ trợ kiểm tra","KH đặt đơn DVKT từ ngày 03/08 chưa được CN liên hệ và đến hỗ trợ","KH có YCTX tư vấn NLMT cần CN liên hệ tư vấn lại cho KH","cntt test","KH có YCTX NLMT cần CN liên hệ và tư vấn lại","KH có YCTX NLMT cần Chi nhánh liên hệ và tư vấn lại","1. KH đã liên hệ CN\n2. Tiền điện KH cần thanh toán tháng 7 là 1tr8 trong khi trước đó khi chưa lắp đặt HT NLMT chi phí khoảng 2tr1, Ăc quy lưu trữ dù nạp đầy nhưng không đủ dùng\n3. KH cần CN đến kiểm tra và giải đáp cho KH","1. Kh chưa liên hệ CN\n2. KH có ký hợp đồng bán điện cho phía điện lực, tháng vừa rồi KH không thấy điện lực thanh toán cước cho KH\n3. KH cần CN liên hệ và đến kiểm tra sớm","1. KH chưa báo CN\n2. KH phản ánh: mất kết nối app theo dõi nlmt, KH đã kiểm tra đường mạng, tự tìm hiểu kết nối nhưng vẫn ko được\n3. KH yêu cầu: hỗ trợ KH kết nối lại app theo dõi nlmt","1. KH đã báo CN: A Khương\n2. KH phản ánh: pin lưu trữ đầy nhưng ko xả điện ra để sử dụng\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","KH đã báo CN \nKH cần bên mình hỗ trợ nhờ đấu thêm dây điện vào tủ điện \nYêu cầu CN liên hệ và hỗ trợ KH","1. KH chưa báo CN\n2. KH phản ánh: mất kết nối app theo dõi, ko xem được hiệu suất\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","Đơn hàng từ 18/7 hiện tại KH vẫn chưa thấy có KT liên hệ","1. KH chưa báo CN\n2. KH phản ánh: hệ thống bị mất PV, bị từ hôm qua sáng có nhưng chiều mất còn tối thì ko thấy xả pin, đến hôm nay thì chập chờn lúc có lúc ko\n3. KH yêu cầu: qua kiểm tra,khắc phục tình trạng này","KH có YCTX NLMT chưa có ai liên hệ và tư vấn","Khách hàng có YCTX NLMT cần CN liên hệ và tư vấn lại","YCTX thang máy KH cần liên hệ lại để tư vấn","1.KH đã liên hệ CN\n2. Số điện phát sinh 20 ngày Tháng 7 là 1022 số, Tháng 6 chưa sử dụng HT NLMT là 1066 số điện trong khi đó KH đã được hỗ trợ lắp lại Inverter vào ngày 10-11/7, App theo dõi tháng 7 thông tin tạo 275kW điện NLMT trong 20 ngày, sản lượng điện NLMT có nhưng mức chênh lệch không nhiều\n3.KH cần CN đến kiểm tra và giải đáp cho KH","KH đã báo CN \nKH phản ánh điện NLMT bị nhảy liên tục giữa điện NLMT và điện lưới, không sử dụng được\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","KH chưa báo CN \nKH phản ánh trên app đang báo lỗi mất điện NLMT và mất ắc quy, bị sáng nay \nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","KH chưa báo CN \nKH phản ánh hiệu suất sản phẩm kém, tiền điện vẫn tăng 40% so với tháng trước\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","1. KH chưa liên hệ CN\n2. Hệ thống thang máy của KH đang gặp sự cố không hoạt động\n3. KH cần CN đến kiểm tra và khắc phục gấp để có thể ph ra, khắc phục tình trạng này","CN mnv 118290 báo hộ sự cố KH qua hệ thống\n1. KH phản ánh: Lỗi hệ thống điện năng lượng mặt bị chập chờn, chập nhảy 2,3s mất điện có lại\n2. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","KH chưa báo CN\nKH báo hôm qua mưa bão bị sét đánh hỏng cục wifi cần nhờ KT đến kiểm tra kết nối lại cho KH","1. KH đã liên hệ CN\n2.HT NLMT điện lúc mạnh lúc yếu lúc không có điện, tủ nguồn biến tần có tiếng kêu khoảng 3 ngày nay, hiện KH đang dùng điện lưới, nếu KH tắt AB tủ nguồn và bật lại sẽ sử dụng được một lúc sau đó lại gặp sự cố\n3. KH cần CN liên hệ và đến hỗ trợ sớm","1. KH đã liên hệ CN\n2. KH cần lắp thêm 2 tấm pin NLMT do thiếu công suát và CN đã chuyển vật tư đến cho KH tuy nhiên chưa hỗ trợ lắp đặt\n3. KH cần CN thông tin cụ thể thời gian lắp đặt cũng như hoàn thiện để KH có thể thanh toán cho CN","1. KH chưa báo CN\n2. KH phản ánh: camera báo lỗi ko có thẻ nhớ, có hình ảnh nhưng load chậm.\n3. KH yêu cầu: qua kiểm tra, hỗ trợ khắc phục tình trạng này. Nếu hết hạn bảo hành KH đồng ý tính phí sửa chữa","KH đã báo CN \nKH phản ánh hiệu suất sản phẩm kém, tiền điện tăng 1tr5 đến 2tr,3tr\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","KH chưa báo CN \nKH phản ánh app không xem được hệ thống NLMT báo ngoại tuyến\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","KH đã báo CN \nKH báo sự cố mất kết nối inverter, không xem online được\nYêu cầu KT qua ktra hỗ trợ KH","KH chưa báo Cn\nKH phản ánh việc lắp đặt hệ thống chống sét không lắp đường dây chống sét xuống dưới nhà mà lại nối vào đường chống sét trên tầng\nKH yêu cầu KT qua kiểm tra và lắp đặt lại đúng quy trình đảm bảo cho KH","CN 0973575722 báo sự cố hộ KH\n1. KH phản ánh: lỗi ivt ko phát ra điện\n2. Kh yêu cầu: Qua kiểm tra, khắc phục tình trạng này","KH đã báo anh Việt CN \nKH cần hỗ trợ lắp đặt lại tấm pin, vì hiện tại tấm pin bị đọng nước, KH cần KT đến lắp đặt và gia cố lại tấm pin cho có độ dốc cho nó dóc nước\nYêu cầu Cn cho KT qua hỗ trợ KH","KH đã báo CN \nKH phản ánh IVT biến tần không hoạt động không sản xuất ra điện, bị từ hôm qua\nYêu cầu quản lý điều kĩ thuật liên hệ và hỗ trợ KH","HĐ NLMT với STRIDE đã lắp cho anh Lê Xuân Hùng - SĐT: 0369030903.\nĐịa chỉ: 90/52A Đỗ Tuấn Phong, phường Tân Đông Hiệp, Thành phố Hồ Chí Minh\nKH đã báo cn: a Nhân, qua zalo\nKH phản ánh Hiện tại KH vẫn chưa nhận được hồ sơ đầy đủ để đăng ký điện lực.\nNhân viên liên tục hẹn dời lại ngày và không thực hiện. \nKH bắt đầu báo cáo từ tháng 4 nhưng đến nay vẫn chưa được hỗ trợ chính thức\nKH yêu cầu: Hỗ trợ KH hồ sơ để đăng ký nlmt để báo cáo cho bên điện lực.","KH đã báo CN nhưng chưa được hỗ trợ \nINVT báo lỗi không hoạt động, tình trạng bị lần thứ 3\nYêu  cầu CN cho KT qua ktra cho KH","1. KH chưa liên hệ CN\n2. KH đã ký HĐ lắp đặt thiết bị Ăc quy lưu trữ NLMT và chuyển tiền đặt cọc từ ngày 19/06 cho nhân sự Đạt tuy nhiên chưa được hỗ trợ lắp đặt và hoàn thiện hệ thống. CSKH kiểm tra Hợp đồng chưa được ký\n3. KH cần CN phản hồi và đề xuất hướng xử lý cho KH","Kh chưa báo CN \nKH báo sự cố nlmt không sạc được pin dù nắng to vẫn không sạc được \nYêu cầu CN cho KT qua ktra cho KH","1. KH đã liên hệ CN\n2. Hiện nhà KH đang không sử dụng được điện lưới và điện NLMT, ngày hôm nay đã mất điện 2 lần\n3. KH cần CN đến kiểm tra và khắc phục gấp","1. KH đã được nhân sự Ngọc tại CN liên hệ\n2. KH ký HĐ lắp đặt HT NLMT từ ngày 14/06 và thời gian lắp đặt là 30 ngày kể từ ngày khởi công, hiện đã sắp hết thời gian thực hiện lắp đặt theo HĐ nhưng KH chưa được hỗ trợ\n3. KH cần CN liên hệ và phản hồi gấp","1. KH đã báo CN\n2. KH phản ánh: Từ các sự cố trước về ivt hoạt động ko ổn định. CN chỉ thấy điều khiển từ xa ko thấy đến kiểm tra trực tiếp, và ko thấy xử lý. KH thấy là khi tăng tải lên vẫn lưới điện lưới buộc KH phải tắt tải. KH có liên hệ người phụ trách lắp đặt trước thì ko thấy nghe máy, KH rất ko hài lòng và bức xúc. \n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","1. KH đã báo CN: A Quốc Đại\n2. KH phản ánh: tủ điện có mùi khét, cả n <script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>

              const gutter = codeCell.querySelector('.code-annotation-gutter');
              gutter.appendChild(gutterDiv);
            }
            gutterDiv.style.top = top - 2 + "px";
            gutterDiv.style.height = height + 4 + "px";
          }
          selectedAnnoteEl = annoteEl;
        }
      };
      const unselectCodeLines = () => {
        const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
        elementsIds.forEach((elId) => {
          const div = window.document.getElementById(elId);
          if (div) {
            div.remove();
          }
        });
        selectedAnnoteEl = undefined;
      };
        // Handle positioning of the toggle
    window.addEventListener(
      "resize",
      throttle(() => {
        elRect = undefined;
        if (selectedAnnoteEl) {
          selectCodeLines(selectedAnnoteEl);
        }
      }, 10)
    );
    function throttle(fn, ms) {
    let throttle = false;
    let timer;
      return (...args) => {
        if(!throttle) { // first call gets through
            fn.apply(this, args);
            throttle = true;
        } else { // all the others get throttled
            if(timer) clearTimeout(timer); // cancel #2
            timer = setTimeout(() => {
              fn.apply(this, args);
              timer = throttle = false;
            }, ms);
        }
      };
    }
      // Attach click handler to the DT
      const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
      for (const annoteDlNode of annoteDls) {
        annoteDlNode.addEventListener('click', (event) => {
          const clickedEl = event.target;
          if (clickedEl !== selectedAnnoteEl) {
            unselectCodeLines();
            const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
            if (activeEl) {
              activeEl.classList.remove('code-annotation-active');
            }
            selectCodeLines(clickedEl);
            clickedEl.classList.add('code-annotation-active');
          } else {
            // Unselect the line
            unselectCodeLines();
            clickedEl.classList.remove('code-annotation-active');
          }
        });
      }
  const findCites = (el) => {
    const parentEl = el.parentElement;
    if (parentEl) {
      const cites = parentEl.dataset.cites;
      if (cites) {
        return {
          el,
          cites: cites.split(' ')
        };
      } else {
        return findCites(el.parentElement)
      }
    } else {
      return undefined;
    }
  };
  var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
  for (var i=0; i<bibliorefs.length; i++) {
    const ref = bibliorefs[i];
    const citeInfo = findCites(ref);
    if (citeInfo) {
      tippyHover(citeInfo.el, function() {
        var popup = window.document.createElement('div');
        citeInfo.cites.forEach(function(cite) {
          var citeDiv = window.document.createElement('div');
          citeDiv.classList.add('hanging-indent');
          citeDiv.classList.add('csl-entry');
          var biblioDiv = window.document.getElementById('ref-' + cite);
          if (biblioDiv) {
            citeDiv.innerHTML = biblioDiv.innerHTML;
          }
          popup.appendChild(citeDiv);
        });
        return popup.innerHTML;
      });
    }
  }
});

<script>
  const CHECK_INTERVAL = 60000;
  
  async function getLastBuild() {
    const res = await fetch('/last-build.json?t=' + Date.now());
    const data = await res.json();
    return data.buildTime;
  }
  (async () => {
    const initialBuild = await getLastBuild();
    
    setInterval(async () => {
      const currentBuild = await getLastBuild();
      if (currentBuild !== initialBuild) {
        window.location.reload();
      }
    }, CHECK_INTERVAL);
  })();
</script>
