 có sử dụng nhiều nên quá tải nên bị nhảy áp điện lưới, KH có đóng lại áp điện lưới thì điện nlmt mất\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","KH có đặt đơn DVKT đã làm xong nhưng thấy tình trạng điều hòa bị chảy nước, KH có liên hệ lại bạn KT trước đấy nhưng không được\nKH yêu cầu KT qua ktra lại cho KH","1. KH đã báo CN: A Tín\n2. KH phản ánh: nhảy áp liên tục, đóng áp thì nhảy, đẩy lên thì nhảy, KH đang nghi do mấy hôm nay mưa\n3. KH yêu cầu: KT ở gần đây qua kiểm tra, xử lý tình trạng này","1. KH chưa liên hệ CN\n2. KH không theo dõi được hiệu suất HT NLMT qua APP, các thông số về 0\n3. KH cần CN đến kiểm tra và khắc phục sớm","1. KH đã liên hệ tới nhân sự Trường tại chi nhánh\n\n2. Dù KH đã lắp đặt HT NLLMT nhưng chi phí tiền điện chưa giảm nhiều, tháng trước tiền điện hơn 17tr, dù tháng này KH đã giảm tải trên hệ thống rồi nhưng tiền điện vẫn gần 15tr\n\n3. KH cần CN đến kiểm tra cho KH","KH đã báo bên anh Sơn - SĐT: 0987120366, KH phản ánh dây điện truyền tải của Pin bị cháy và chảy nhựa làm CP điện bị nhảy, bị liên tục\nYêu cầu quản lý điều kĩ thuật liên hệ và hỗ trợ KH","KH có YCTX NLMT từ ngày 28/06 chưa có ai liên hệ và tư vấn","KH đặt đơn DVKT từ ngày 01/07 chưa có KT liên hệ và đến hỗ trợ\n\nKH cần KT đến hỗ trợ sớm","1. KH  chưa liên hệ CN\n2. Hiện nhà KH đã mất điện lưới và điện NLMT, Điện lưới vẫn đang có nhưng không chuyển vào hệ thông để sử dụng được, App theo dõi hiệu suất báo ngoại tuyến\n3. KH cần CN đến kiểm tra và hỗ trợ gấp do đang không có điện để sử dụng","YCTX thang máy lịch hẹn 27/06 KH chưa thấy có KT liên hệ hẹn lịch tư vấn thang máy","CN 0346452433 báo sự cố hộ KH\n1. KH phản ánh: ắc quy điện nlmt ko xả chỉ thấy lấy điện lưới, ivt báo lỗi f26\n2. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","CBNV VCC anh Đinh Thành Nhân tặng cho người nhà sử dụng\n1. KH phản ánh: khi chọn chức năng tự động tắt bếp\n2. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","KH có YCTX NLMT cần CN liên hệ và tư vấn lại","KH có YCTX NLMT cần chi nhánh liên hệ và tư vấn lại","1. CN báo sự cố cho KH (0979707700)\n2. Buổi tối chỗ tủ điện khi Ăc quy lưu trữ sắp hết, nhảy ATS sẽ có tiếng lớn nhiều lần khi chuyển sang dùng điện lưới\n3. KH cần CN đến kiểm tra và hỗ trợ sớm","1. CN báo sự cố cho KH\n\n2. KH cần CN hỗ trợ Up Firmware cho HT NLMT do Ăc quy lưu trữ của KH đang chưa nhận sạc\n\n3. KH cần CN đến kiểm tra và hỗ trợ sớm","1. KH chưa báo CN (đã liên hệ với nhân sự phụ trách lắp đặt nhưng chuyển công tác)\n2. KH phản ánh và yêu cầu: KH đổi điện thoại, ko nhớ tên app nên cần hỗ trợ cài app NLMT theo dõi hiệu suất","YCTX NLMT lịch hẹn 30/06 KH chưa thấy có KT liên hệ tư vấn khảo sát","YCTX NLMT lịch hẹn 30/6 KH chưa được liên hệ tư vấn NLMT","CN 0384989610 báo sự cố hộ KH\n1.\tKH phản ánh: cúp điện nlmt\n2.\tKH yêu cầu: KT qua kiểm tra, xử lý tình trạng này","1. KH chưa báo CN \n2. KH phản ánh: ko kết nối được hệ thống nlmt, báo offline KH theo dõi trên app thì thấy con đo meter nlmt trong 1 khu đang ko đo được nlmt sản sinh ra.\n3. KH yêu cầu: KT qua kiểm tra, khắc phục tình trạng này","Kh chưa báo CN\nKH báo sự cố hệ thống NLMT không nhận điện không sản xuất ra điện pin  hiển thị chế độ chờ hiện không hoạt động \nYêu cầu CN cho KT qua ktra cho KH..","1. KH chưa liên hệ CN\n\n2. Hiện một tấm pin của KH đang gặp sự cố\n\n3. KH cần CN hỗ trợ đến kiểm tra sớm","1. KH chưa liên hệ CN\n\n2. KH tham khảo hộ gia đình khác được KH giới thiệu lắp hệ NLMT cùng công suất, số lượng tấm pin, và thiết bị biến tần khi đạt công suất tối đa có thể đặt 9.8->10Kw diện NLMT, trong khi HT NLMT của KH đạt hiệu suát tối đâ chỉ tới 8.5KW, dù ngày nắng to cũng không sạc đầy Ắc quy lưu trữ.\n\n3. KH cần CN đến kiểm tra giúp cho KH","1. KH đã liên hệ tới CN\n\n2. HT NLMT của KH đã hoàn thiện lắp đặt và đưa vào sử dụng tuy nhiên chi nhánh chưa cung cấp cho KH các chứng từ:\n\n      - Bản hoàn công\n\n      - Bản hướng dẫn sử dụng hệ thống NLMT sau lắp đặt\n\n       - Chứng từ, hồ sơ, CO CQ của HT NLMT để KH có thể cung cấp cho EVN\n\n3. KH cần chi nhánh liên hệ, hướng dẫn KH sử dụng , cung cấp các chứng từ liên quan và có đề xuất hướng xử lý về việc chậm hợp đồng cho KH","1. KH chưa liên hệ CN\n\n2. HT NLMT của KH bị giảm hiệu suất nhiều thời gian gần đây,  hiện tại sản xuất được 2,9Kw, so sánh với hộ gia đình khác cùng lắp HT NLMT sản xuất được 4,3Kw\n\n3. KH cần CN đến hỗ trợ kiểm tra giúp","KH đã báo KT nhưng chưa được hỗ trợ \n KH phản ánh Viettel  Vinh Long vẫn không cung cấp tài liệu hay bất hoá đơn chứng từ cho khách hàng sau khi lắp bình lưu trữ và biến tần.\nKH cần CN cung cấp bộ hồ sơ để thông báo cho bên điện lực\nYêu cầu CN cho KT hỗ trợ KH","1.KH là nhân viên nội bộ VCC\n\n2. Thiết bị máy giặt của KH gặp sự cố giặt được nhưng không vắt được\nĐịa chỉ đặt thiết bị : Thôn Long Sơn 10 Xã Yên Xuân, Tỉnh Nghệ An\n\n3. KH cần CN hỗ trợ kiểm tra và khắc phục sớm","1. KH phản ánh: Đơn hàng của KH làm xong từ 9/5 sau đó 1 máy lạnh ko đóng được và có liên hệ với a Ngọc trong thời gian bảo hành, KH có kb zalo để trao đổi. CN cũng đã đến kiểm tra nhưng chưa khắc phục được tình trạng giờ 2 cái bị hư còn 1 cái bị chảy nước.\n2. KH yêu cầu: Chiều mai 3h 2/3 đến kiểm tra xử lý tình trạng này. KH có sẵn thông tin hình ảnh nhắn tin với a Ngọ trong zalo đến làm việc KH sẽ cung cấp","1. KH đã báo CN sự cố trước TT_1782705022714\n2. KH phản ánh: 1 tấm pin bị bạc màu CN có hẹn là đầu tháng qua kiểm tra nhưng đến 1/7 ko thấy có thông tin hay qua kiểm tra gì.\n3. KH yêu cầu: KT qua kiểm tra, xử lý tình trạng này.","hệ thống lỗi không hoạt động","KH phản ánh pin lưu không hoạt động trên màn hình báo lỗi  màn hình có chữ  ALAN màu đỏ, Kh muốn KT liên hệ và đến kiểm tra cho KH","1. KH  đã báo KT CN\n2. Cục biến tần lắp chưa chuẩn, KT đã đến hỗ trợ cài đặt lại nhưng chưa xử lí triệt để.\n3. Yêu cầu CN hỗ trợ KH","Kh đã báo KT\nKH báo sự cố NLMT biến tần không nhận điện, chỉ có dùng điện NLMT \nYêu cầu CN cho KT qua ktra cho KH..","KH phản ánh CT bị lỗi chạy không ổn định, bị chập chờn, các buổi trong ngày điện NLMT vẫn còn nhưng vẫn lấy điện lưới, khoảng 2 tuần nay\nYêu cầu quản lí điều kĩ thuật liên hệ và xuống kiểm tra cho KH","Đơn hàng 28/6 vẫn đang trong hạn bảo hành\n1. KH phản ánh: vẫn còn mùi ở thiết bị\n2. KH yêu cầu: KT qua kiểm tra lại","1. KH đã báo CN\n2. KH khi sửa dụng vào mùa nắng nong thì tiền điện giảm không nhiều chỉ giảm chưa đên 700.000, hệ thống pin chỉ thu dược tầm 60-70% vào mùa nắng trong khi KH lắp hệ 12.4KWP\n3. KH muốn CN hỗ trợ và khảo sát lại xem có phải tăng tấm pin để cải thiện không","1. KH đã báo CN\n2. KH muốn hoàn thiện hồ sơ để nộp điện lực vì bên điện lực đã đến kiểm tra, KH đã đưa giấy tờ nhưng bị sai mẫu \n3. Yêu cầu CN hỗ trợ KH","KH có YCTX NLMT cần chi nhánh liên hệ đến hỗ trợ tư vấn KH","Kh chưa báo CN\nKH báo sự cố hệ thống NLMT đang không theo dõi được qua App, không báo thông số , hiện HT đang không sản sinh điện NLMT\nYêu cầu CN cho KT qua ktra cho KH","1. KH chưa báo CN\n2. KH phản ánh: KH theo dõi trên app ko thấy có thông số hiệu suất\n3. KH yêu cầu: KT qua kiểm tra, hỗ trợ KH tình trạng này","Đơn hàng làm xong từ 26/6 vẫn trong hạn bảo hành 72h\n1. KH phản ánh: giờ giặt quần áo ra nhiều mùn rất bẩn\n2. KH yêu cầu: qua kiểm tra, xử lý tình trạng này nếu cần thiết thì thay phần ba chảng máy giặt","1. KH đã báo CN\n2. KH phản ánh: Từ phản ánh trước TT_1782300958053 về việc tập kết vật tư đủ hơn 1 tuần trời nhưng ko triển khai lắp đặt và hẹn KH khất hất lần này đến lần khác là lắp đặt. KH ko còn sự tin tưởng, bức xúc và thất vọng.\n3. KH yêu cầu: đến dọn dẹp đồ đạc và làm thủ tục hủy HĐ, yêu cầu người có thẩm quyền phản hồi xử lý trước 12h. Nếu ko KH sẽ tự xử lý theo cách của KH","Về khiếu nại từ trước của KH TT_1781177607618 CN có hẹn KH qua kiểm tra xử lý thiết bị nhưng KH thấy thiết bị ko có vấn đề gì lắm nên từ chối. Đến giờ KH lại thấy có tình trạng rỉ nước, chảy nước. KH mong muốn KT chính thức của viettel đến kiểm tra xử lý, KH có thể đợi nhưng phải là KT chính thức đến.","KH chưa báo CN\nKH báo sự cố hệ thống NLMT hiện tại sạc không vào điện dù trời nắng to, cả ngày chỉ sạc vào dưới 50% pin\nYêu cầu CN cho KT qua Ktra cho KH","1. KH đã báo CN\n2. KH phản ánh: KH rất bức xúc trong quá trình thi công làm sai rất nhiều, ko hề giám sát, KH yêu cầu rất nhiều trên nhóm zalo đo cửa thang máy cho thông tin thiết kế nhưng ko thực hiện. Trong quá trình làm nhân viên đi wc ko đúng chỗ, làm hỏng công trình như khoan thủng tường, vỡ gạch. Đến giờ vi phạm rất nhiều như này cũng ko lập biên bản trong khi KH yêu cầu và KH cũng sẽ ko ký BBNT. Ngoài ra việc bảo dưỡng thang máy 1 năm 4 lần KH yêu cầu CN cũng ko đến làm cũng ko thông tin lại.\n3. KH yêu cầu: phản hồi lại thông tin cho KH trong ngày hôm nay hoặc ngày mai và đưa ra phương án xử lý.","CN báo sự cố hộ KH 0393188966\nKH gặp sự cố NLMT tiền điện hàng tháng chỉ khoảng 2-2,5tr. Tuy nhiên sau khi lắp đặt và sử dụng hệ thống NLMT của VCC cung cấp từ ngày 11/6 thì tiền điện tăng vọt lên 6,4tr, mặc dù trên App theo dõi vẫn hoạt động bình thường\nYêu cầu Cn cho KT qua Ktra cho KH","Kh phản ánh hệ thống NLMT bị sập điện, sập luôn cả điện lưới không hoạt động được, bị từ sáng\nYêu cầu quản lí điều kĩ thuật liên hệ và xuống kiểm tra gấp","1. KH đã liên hệ CN\n\n2. Thiết bị điều hòa của KH đang bị rò nước \n\n3. KH cần chi nhánh qua kiểm tra thiết bị và khắc phục tình trạng này","1. KH chưa báo CN\n2. KH phản ánh: Có gọi bên điện lực kiểm tra sửa điện thì phát hiện điện nlmt đang cắt pha mát chứ ko cắt pha lửa và thấy nguy hiểm. \n3. KH yêu cầu: Qua kiểm tra, đấu nối lại đường điện","1. KH đã báo CN\n2. KH phản ánh: nắng nhưng ko thấy sản xuất ra điện toàn thấy sử dụng điện lưới tiền điện tăng cao bất thường, 1 tháng 3tr5 tiền điện. \n3. KH yêu cầu: KT qua kiểm tra, xử lý tình trạng này\n***Địa chỉ KH cung cấp: 44 nguyễn công hoàn, phường giảng võ, hà nội","1. KH chưa liên hệ CN \n\n2. Biến tần của KH gặp sự cố không có điện khoảng 3-4 ngày, App theo dõi hiệu suất báo ngoại tuyến\n\n3. KH cần CN liên hệ và đến kiểm tra gấp","KH phản ánh   function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    if (amEl) amEl.addEventListener('change', onAmChange);

    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

    amFilterHandle.clear();
    tinhFilterHandle.clear();

      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

    });

    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;

    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }

    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();

        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>
