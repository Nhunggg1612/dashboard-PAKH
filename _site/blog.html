hực hiện. Trong quá trình làm nhân viên đi wc ko đúng chỗ, làm hỏng công trình như khoan thủng tường, vỡ gạch. Đến giờ vi phạm rất nhiều như này cũng ko lập biên bản trong khi KH yêu cầu và KH cũng sẽ ko ký BBNT. Ngoài ra việc bảo dưỡng thang máy 1 năm 4 lần KH yêu cầu CN cũng ko đến làm cũng ko thông tin lại.\n3. KH yêu cầu: phản hồi lại thông tin cho KH trong ngày hôm nay hoặc ngày mai và đưa ra phương án xử lý.","CN báo sự cố hộ KH 0393188966\nKH gặp sự cố NLMT tiền điện hàng tháng chỉ khoảng 2-2,5tr. Tuy nhiên sau khi lắp đặt và sử dụng hệ thống NLMT của VCC cung cấp từ ngày 11/6 thì tiền điện tăng vọt lên 6,4tr, mặc dù trên App theo dõi vẫn hoạt động bình thường\nYêu cầu Cn cho KT qua Ktra cho KH","1. KH đã báo CN: A Phụng\n2. KH phản ánh: có hủy HĐ và yêu cầu hoàn cọc đã có trao đổi với CN và đồng ý hoàn cọc, KH chưa ký BB thanh lý\n3. KH yêu cầu: hoàn lại số tiền cọc","CN 0364023755 báo sự cố hộ KH \n1. KH phản ánh: ats mất tín hiệu, đèn ko sáng. Khi cúp điện lưới ko chuyển luôn sang pin lưu trữ\n2. KH yêu cầu: KT xuống xử lý hỗ trợ trong tối nay","Kh phản ánh hệ thống NLMT bị sập điện, sập luôn cả điện lưới không hoạt động được, bị từ sáng\nYêu cầu quản lí điều kĩ thuật liên hệ và xuống kiểm tra gấp","1. KH chưa liên hệ CN\n\n2. KH phản ánh HT NLMT của KH đang thiếu dây tiếp địa, KH lo ngại mùa mưa bão HT có thể gặp sự cố\n\n3. KH cần CN đến kiểm tra và khắc phục sớm cho KH","1. KH đã báo CN\n2. KH phản ánh: hôm qua KH kiểm tra thì thấy cháy tủ nguồn ats và thấy đang ko có điện nlmt\n3. KH yêu cầu: Hỗ trợ KH thay thế ats trong ngày hôm nay","1. KH đã báo CN\n2. KH phản ánh: sự cố từ trước hiệu suất kém giờ KH thấy là pin lưu trữ hay bị lỗi, nút đỏ thường xuyên nháy và ko hoạt động. \n3. KH yêu cầu: KT qua kiểm tra, xử lý dứt điểm tình trạng này\n\nsdt vợ: 0981283686","KH đã báo CN \nKh phản ánh hệ thống NLMT tự đẩy điện ra lưới ngoài khoảng 1 tháng nay\nYêu cầu kĩ thuật liên hệ và xuống KT cho KH","1. KH đã liên hệ CN\n\n2. Thiết bị điều hòa của KH đang bị r  này","KH đã báo CN \nKH phản ánh inveter bán tải 3kw bị lỗi về hệ thống, hiệu quả sản phẩm thấp\nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","KH chưa báo CN \nkhách hàng báo pin lưu trữ bị chớp đỏ, ko sử dụng được.\nYêu cầu quản lí điều kỹ thuật hỗ trợ kiểm tra gấp","1. KH ký hợp đồng NLMT trả góp 3 bên, đã hoàn thiện việc thanh toán cho bên thứ 3 tuy nhiên đến nay chưa nhận được hợp đồng từ chi nhánh\n\n2. KH phản ánh thiết bị Inverter bị đen màn hình, HT NLMT vẫn sử dụng tốt, nhân sự của CN đến kiểm tra và thông tin cần chuyển thiết bị đi bảo hành và thời gian khoảng 30 ngày\n\n3. KH không đồng ý chuyển thiết bị đi bảo hành do chưa có văn bản tháo gỡ, nhân viên đến kiểm tra chưa cung cấp lý do hỏng hóc thiết bị của KH, cần CN liên hệ và giải đáp cũng như chuyển hợp đồng cho KH","KH chưa báo CN,KT\nKh báo sự cố NLMT không sản xuất ra điện hơn 3 tuần nay, tiền điện thì bị tăng \nYêu cầu CN cho KT qua kiểm tra cho KH","1. KH đã báo CN: A Huy - trước lắp đặt NLMT\n2. KH phản ánh: Hiệu suất kém hệ 6kw nhưng thời điểm cao điểm nắng nhất cũng chỉ đạt được 3kw. KH theo dõi trên app hiệu suất cũng ko thấy hoạt động.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH chưa báo CN\n2. KH phản ánh: đồng hồ chính điện lưới vẫn có nhưng trong nhà ko có cả điện lưới lẫn điện nlmt. KH đã báo bên điện lực kiểm tra và điện lực báo do lỗi điện nlmt\n3. KH yêu cầu: KT xuống kiểm tra, xử lý tình trạng này\n***SĐT phản ánh: 0822993939","1. KH đã báo CN\n2. KH phản ánh: pin lưu trữ không hoạt động\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này nếu có gì thay thế thì thay thế luôn","1. KH chưa báo CN\n2. KH phản ánh: Hệ KH hơn 7kw KH vẫn thấy hệ hoạt động bình thường tầm trưa trưa là pin lưu trữ đầy mà gần đây thấy tiền điện tăng bất thường. Hồi đầu sử dụng sản phẩm tiền điện là 200k/ 1 tháng đến gần đây t4 là 708k và t5 này là 1tr1 tiền điện. \n3. KH yêu cầu: KT xuống kiểm tra xem và khắc phục tình trạng này","KH chưa báo KT,CN \nKH báo sự cố NLMT tiền điện var COL_WIDTHS = {"Mã tỉnh":100,"Lĩnh vực":100,"Ngành hàng":100,"Sản phẩm":150,"Mã HĐ":100,"Tên khách hàng":120,"SĐT":100,"Địa chỉ":250,"Giai đoạn":100,"Nhóm sự cố":100,"Loại sự cố":100,"Chi tiết":300,"Ngày bắt đầu":100,"Ngày kết thúc":100,"Ngày hoàn thành":100,"Trạng thái":100,"Tên nhân viên":100,"Mã nhân viên":100,"Hệ thống":100,"Đơn vị điều hành":100,"AM chuyên quản":100};
var CT_GROUP   = 'bang_chitiet_group';
var AM_MAP     = {"P.KD Cơ điện":["N1 - Congnd15, Tienvt16","N2 - Thaoltt16, Thikd","N3 - Truongdv17, Duyph5"],"P.KDNLMT":["N1 - Congnd15, Tienvt16","N2 - Thaoltt16, Thikd","N3 - Truongdv17, Duyph5","N4 - Nhungntt27, Anhnt631"],"P.Triển khai":["N1 - Congnd15, Tienvt16","N2 - Thaoltt16, Thikd","N3 - Truongdv17, Duyph5","N4 - Nhungntt27, Anhnt631"],"VHKT":["N1 - Congnd15, Tienvt16","N2 - Thaoltt16, Thikd","N3 - Truongdv17, Duyph5","N4 - Nhungntt27, Anhnt631"]};
var TINH_MAP   = {"N1 - Congnd15, Tienvt16":["CTO","DBN","DNG","DTP","HTH","KHA","QNI","SLA","THA"],"N2 - Thaoltt16, Thikd":["AGG","BNH","CMU","DLK","DNI","GLI","HCM","LDG","QTI","VLG"],"N3 - Truongdv17, Duyph5":["HNI","HPG","LCI","LSN","NBH","PTO","QNH","TNH","TQG"],"N4 - Nhungntt27, Anhnt631":["HUE","HYN","NAN","TNN"]};
</script>
<script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
