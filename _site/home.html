N\nKH phản ánh: sản phẩm hiện đang không hoạt động, văn không vào nước\nYêu cầu quản lý điều kĩ thuật xuống kiểm tra","CN 0989181919 báo sự cố hộ KH\n1. KH phản ánh: Nhà xưởng bị dột do bên VCC thi công NLMT phần khoan dây mưa xuống bị dột.\n2. KH yêu cầu: Khắc phục lại phần thấm dột","KH chưa báo CN chưa báo KT \nKH báo sự cố NLMT app trên đt báo phần trăm pin báo ảo, không đúng hiệu suất\nYêu cầu CN cho KT xuống hỗ trợ KH","KH chưa báo CN  chưa báo KT \nKH báo sự cố không theo dõi được hệ thống NLMT qua app trên diện thoại \nYêu cầu CN cho KT xuống hỗ trợ cho KH","KH chưa báo CN chưa báo KT, đã liên hệ nhân sự Lê Văn Phụng\nKH phản ánh về việc tiến độ triển khai lắp đặt hệ thống NLMT đã chậm trễ hơn 1 tháng nay\nYêu cầu CN cho KT liên hệ và hỗ trợ cho KH","KH phản ánh đã kí hợp đồng và đặt cọc mua sản phẩm nhưng cả tháng nay chưa có ai đến lắp\nYêu cầu quản lý điều kĩ thuật xuống kiểm tra","1.KH đã liên hệ CN\n\n2. Trên App theo dõi hiệu suất báo lỗi HT NLMT và hiện tại nhà KH đang chỉ dùng được điện lưới\n\n3. KH cần CN đến hỗ trợ khắc phục sớm","KH đã có YCTX tư vấn NLMT nhưng chưa được liên hệ tư vấn và khảo sát\nYêu cầu CN liên hệ lại cho KH gấp!!!","KH có YCTX tư vấn NLMT nhưng chưa được liên hệ tư vấn\nYêu cầu CN liên hệ lại lần nữa để tư vấn cho KH gấp, KH đang giục","1. KH đã liên hệ CN\n\n2. KH đã ký HĐ và đóng đủ tiền để lắp đặt thêm thiết bị Pin lưu trữ HT NLMT từ tháng 4 năm 2026, tuy nhiên hiện tại vẫn chưa có thiết bị và hỗ trợ lắp đặt, KH rất bức xúc và y/c hoàn tiền cho KH nếu ko lắp đặt \n\n3. KH cần chi nhánh chuyển thiết bị và thực hiện lắp đặt gấp cho KH","KH chưa báo CN chưa báo KT\nKH báo sự cố  nlmt cục pin  lưu trữu không hoạt động bị 2 ngày nay\nYêu cầu CN cho KT xuống hỗ trợ KH","KH có YCTX tư vấn NLMT nhưng chưa được tư vấn \nYêu cầu CN liên hệ  lại cho KH","KH chưa báo CN chưa báo KT \nHư ats không dung đc điện hẹ thóng nlmt, mất toàn điện hệ thống, mất cả điện lưới","KH chưa báo CN chưa báo KT\nKH báo sự cố NLMT quá tải nhảy át xả hết điện rồi mà nắng to vẫn không thấy sạc pin được \nYêu cầu CN cho KT xuống hỗ trợ KH","KH chưa báo CN đã báo KT\nKH báo sự cố điên KH dùng quá tải dẫn đến việc tủ điện bị cháy \nYêu cầu CN cho KT xuống hỗ trợ KH","KH đặt đơn DVKT từ ngày 31/05 nhưng chưa có KT liên hệ và đến hỗ trợ\n\nKH cần KT đến hỗ trợ gấp","1. KH đã báo CN: A Tùng\n2. KH phản ánh: Tủ điện nlmt bị hỏng, điện lưới ko tắt nhưng cúp hết điện trong nhà. CN hướng dẫn KH đấu trực tiếp điện lưới và sử dụng còn điện NLMT mất luôn\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN\n2. KH phản ánh: KH có 2 cục pin lưu trữ đang bị khác version BMS 1 cục là v0.003 và 1 cục là v0.005 dẫn đến khi xả chậm cách nhau 1-2% nhưng khi xả sâu thì cách nhau nhiều. Ngoài ra KH cần hỗ trợ, hướng dẫn làm thủ tục hồ sơ đăng ký bên điện lực đã có báo CN phía bên KD ký hợp đồng mà chưa thấy phản hồi.\n3. KH yêu cầu: Hỗ trợ nâng cấp BMS của cục pin lưu trữ cũ và hướng dẫn KH làm hồ sơ gửi phía bên điện lực.","1. KH đã báo CN: A Lâm \n2. KH phản ánh: hiện tại KH đã bàn giao mặt bằng và có đẩy đủ vật tư để lắp đặt rồi và đã báo CN là sẵn sàng lắp đặt vào t3 nhưng đến hnay t5 rồi vẫn chưa thấy CN có thông tin gì về việc lắp đặt. Ngoài ra KH cần điều chỉnh lại cấu hình do khảo sát thực tế ko đáp ứng được nên muốn giảm cấu hình đi.\n3. KH yêu cầu: \n+ Cập nhật lại cấu hình trong HĐ là tủ ivt 20kw, và 34 tấm pin điều chỉnh thành tủ 15kw và 30 tấm pin.\n+ Phản hồi cho KH chính xác ngày thi công lắp đặt cụ thể.","1. KH đã báo CN\n2. KH phản ánh: hỏng thiết bị phát wifi\n3. KH yêu cầu: Qua kiểm tra, hỗ trợ KH","1. KH chưa báo CN: Đã có phản ánh từ trước TT_1779684263887 nhưng KH ko nhận được cuộc gọi liên hệ trao đổi nào.\n2. KH đang có 5 tấm pin bị khuất nắng, không đảm bảo hiệu suất, đầu giờ chiều KH phát sinh hơn 5Kw điện tuy nhiên hiện chỉ có 3kw\n3. KH đang cần CN hỗ trợ tách thêm 1 String hoặc tháo bỏ 5 tấm pin khuất nắng do có nguy cơ cháy nổ.","KH đã có YCTX về sản phẩm thang máy nhưng chưa được liên hệ tư vấn \nYêu cầu CN liên hệ lại cho KH","Đã báo CN \nSản phẩm hiện đang không hoạt động, chỉ nhận điện lưới không nhận điện mặt trời\nYêu cầu quản lí điều kĩ thuật xuống kiểm tra","1. KH chưa báo CN\n2. KH phản ánh: KH đi nước ngoài nên muốn tải lại app hướng dẫn cho người nhà sử dụng app theo dõi NLMT\n3. KH yêu cầu: Hỗ trợ, hướng dẫn người nhà KH 0982351296 Chị Bích","1. CN báo lỗi cho KH\n\n2. HIện KH đang mất giám sát NLMT, ko theo dõi được qua App\n\n3. KH cần CN hỗ trợ khắc phục sớm","KH chưa báo CN chưa báo KT\nKH báo sự cố nlmt không cấp điện không hoạt động  từ 7/5 đến hôm nay \nYêu cầu CN cho KT đến hỗ trợ KH \n( địa chỉ KH Tổ 8, khu Văn Hải, Xã Long Thành, Tỉnh Đồng Nai","1. KH đã liên hệ CN\n\n2. 7h30 sáng nay KH bị mất điện lưới nhưng HT ko tự chuyển sang điện NLMT, sau khi có điện APp theo dõi hiệu suất NLMT phản ánh chi số tổng về 0\n\n3. KH cần CN liên hệ và đến hỗ trợ gấp","KH chưa báo CN chưa báo KT \nKH báo sự cố không theo dõi được hệ thống NLMT trên app điện thoại\nYêu cầu CN cho KT xuống hỗ trợ KH","1. KH đã liên hệ CN\n\n2.Tiền điện KH cần đóng tăng bất thường (gấp đôi - Từ 1tr2 -> 2tr4), HT NLMT sử dụng bình thường, KH chưa rõ lý do và ko rõ liệu HT NLMT có phát sinh điện ko\n\n3. KH cần CN đến hỗ trợ sớm","KH chưa báo chi nhánh \nPin lưu trữ bị lỗi, không kết nối inveter \nYêu cầu quản lý điều kĩ thuật xuống kiểm tra","Đã báo CN: Đã báo\nKH báo sự cố: Hiện tại 1 tấm pin nhà KH có hiện tượng bị không sử dụng được \nKH yêu cầu: KT qua kiểm tra cho Kh","Kh chưa báo chi nhánh \nKH muốn xin COCQ để khai báo lên điện lực\nYêu cầu quản lí điều kĩ thuật xuống kiểm tra","1. KH đã báo CN: Anh Đạt - phụ trách lắp đặt\n2. KH phản ánh: cột sóng wifi ko kết nối được app, bị nhảy áp nhiều lần và có mùi khét, đến hôm nay thì sập hết điện.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","1. KH đã báo CN: Đội phụ trách lắp đặt \n2. KH phản ánh: tiền điện ko thấy giảm lệch nhiều so với app. Cụ thể KH theo dõi trên app là 316 số điện mà bên điện lực là 922 số tức là gấp 3 lần. KH đang nghi đấu ngược đường điện.\n3. KH yêu cầu: Qua kiểm tra, xử lý khắc phục tình trạng này.","1. KH đã liên hệ CN\n\n2. Sau khi hoàn thiện lắp đặt HT NLMT, KH được thông tin cần thanh toán 1 số khoản vật tư phát sinh cụ thể là 30m dây điện trong khi hợp đồng là thi công trọn gói\n\n3. KH cần CN liên hệ và giải đáp cho KH","1. KH đã liên hệ CN (A Hào)\n\n2. Thiết bị biến tần của KH đang báo đỏ, chưa theo dõi được hiệu suất HT NLMT trên App\n\n3. KH cần CN liên hệ và đến hỗ trợ","1. KH chưa liên hệ CN\n\n2. KH đang gặp sự cố đóng điện để sử dụng điện NLMT thì bị nhảy áp , phải sử dụng điện lưới khoảng 3 ngày nay\n\n3. KH cần CN liên hệ và hỗ trợ sớm","KH có đơn hàng DVKT được hỗ trợ thực hiện từ ngày 29/05, hiện đang cần KT hỗ trợ xuất hóa đơn VAT\n\nKH cần CN hỗ trợ xuất hóa đơn sớm","CN 0968088033 báo sự cố hộ KH\n1. KH phản ánh: Ivt ko hoạt động, CN kiểm tra online thì thấy hệ thống ko hoạt động cách đây 2-3 ngày rồi. \n2. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","KH chưa báo lên chi nhánh \nKH phản ánh : NLMT không hoạt động\nYêu cầu quản lý điều kĩ thuật xuống kiểm tra","1. KH đã báo CN: A Trứ, A Thịnh\n2. KH phản ánh: HĐ của KH 10 máy lạnh. Sự cố từ trước KT qua kiểm tra giờ KH thấy là bị đấu nối dậy bị lỗi mất 3 cái máy lạnh, nhà KH là điện 3 pha nhưng lại chỉ đấu 1 pha. KH có liên hệ CN nhưng chưa thấy qua hỗ trợ.\n3. KH yêu cầu: Qua kiểm tra lại việc lắp đặt và lắp đặt lại","Kh phản ánh trên app của hệ thống với đồng hồ nhà nước chênh lệch số điện hơn gấp đôi\nYêu cầu KT xuống kiểm tra cho KH gấp","1. CN báo lỗi cho KH\n\n2. Ắc quy lưu trữ của KH xả cạn 0%, cần gửi hãng kiểm tra\n\n3. KH cần CN hỗ trợ khắc phục sớm","KH đã báo chi nh ánh \nKH phản ánh bộ lưu trữ không xả\nYêu cầu quản lí điều kĩ thuật kiểm tra","1. KH đã liên hệ CN\n\n2.KH P/á chất lượng HT NLMT ko đạt yêu cầu, Biến tần của KH báo lỗi liên tục, KH lắp HT NLMT 40KW nhưng có lúc chỉ phát sinh được 2KW, thông tin tấm pin trong HĐ và lắp đặt thực tế khác nhau\n\n3. KH cần CN đến hỗ trợ khắc phục gấp cho KH","KH chưa báo CN chưa báo KT\nKH báo sự cố NLMT bình ac quy kêu cả đêm liền mây ngày \nYêu cầu CN cho KT xuống hỗ trợ KH","KH đã báo CN\nKH phản ánh: Nắng to KH theo dõi trên app thì thấy dùng 100% điện lưới, ko thấy dùng nlmt cũng ko thấy có xả ra.\nKH yêu cầu: Qua kiểm tra, khắc phục tình trạng này cho KH","Khách hàng đã báo chi nhánh\nHệ thống năng lượng bị sập, không hoạt động\nYêu cầu chi nhánh điều kĩ thuật kiểm tra","KH chưa báo chi nhánh\nĐiện đồng hồ tăng bất thường trong 2 tháng \nYêu cầu chi nhánh điều kĩ thuật đến kiểm tra","KH chưa báo chi nhánh \nKH phản ánh lắp thiếu 1 cục pin lưu trữ chưa lắp cho khách, khách báo kĩ thuật nhưng kĩ thuật chậm hẹn vì không có linh kiện \nYêu cầu chi nhánh liên hệ lại cho KH","KH có nhu cầu cần được tư vấn về thang máy và đã có NVKT liên hệ tư vấn cho KH nhưng NVKT không có chuyên môn về thang máy mà chỉ có chuyên môn về NLMT. Nên KH muốn có NVKT về thang máy liên hệ lại và tư vấn cho KH. \nYêu cầu CN cho KT liên hệ lại cho KH","Đã  báo chi nhánh \nMàn hình inveter lúc bật lúc tắt, kêu tạch tạch \nYêu cầu kĩ thuật qua kiểm tra cho khách hàng gấp","1. KH đã báo CN: A Tống - ký hợp đồng, A Cảnh - đội thi công lắp láp\n2. KH phản ánh: Tiếp địa k thấy làm theo quy trình mà đấu trực tiếp vào cột nhà, có báo lại nhưng chưa thấy kỹ thuật đến xử lí. Vì trời đang vào mùa mưa xét nhiều nên nguy hiểm.\n3. KH yêu cầu: Qua kiểm tra, xử lý đấu nối tiếp địa","1. KH đã liên hệ CN\n\n2. HT NLMT của KH có 2 thiết bị Biến tần, 1 thiết bị đang không hoạt động, trên APp có cảnh báo không hoạt động khoảng 2 tuần nay, Hiệu suất sản sinh điện NLMT giảm hơn nửa, từ 35KW giảm còn 10-12 KW\n\n3, KH cần CN liên hệ và đến hỗ trợ","1. KH đã liên hệ với chi nhánh\n\n2. HT NLMT của KH chưa được hoàn thiện hạng mục dây tiếp địa\n\n3. KH cần CN liên hệ và hỗ trợ sớm cho KH\n\n3. KH cần CN liên hệ và đến hỗ trợ","0986688282 chi nhánh báo hộ \nNLMT bị nhảy asttomat liên tục KH đang mất cả điện NLMT cả điện lưới\nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN\n2. KH phản ánh: Trước đó CN hỗ trợ cung cấp hình ảnh thiết bị nhưng khi KH đưa cho bên điện lực thì bị từ chối và trả lại. KH đang thấy bên điện lực bắt cung cấp CO,CQ và phải có dấu mộc nguồn gốc sản phẩm.\n3. KH yêu cầu: Hỗ trợ KH hoàn thiện nốt hồ sơ","Đã báo chi  nhánh \nÁc quy lưu trữ ko vào pin, không có lưu trữ\nYêu cầu kt qua ktra cho kh","1. KH chưa báo CN\n2. KH phản ánh: Nắng to nhưng khi mất điện lưới ko thấy có điện nlmt để sử dụng\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","kh gọi hotline báo kt qua bảo dưỡng ko làm đúng quy trình (ko đo gas) , ko mặc đồng phục, kh hỏi thì bảo mình là bên thứ 3 nhận việc ăn chia tiền với Viettel thôi, kh báo hiện tại điều hòa vệ sinh xong vẫn ko mát (nghi do hết gas nhưng kt báo máy bình thường nên ko đo gas và ko bơm gas cho kh) kh cần kt của Viettel qua kiểm tra lại cho kh","CN 0965313434 báo sự cố hộ KH\n1. KH phản ánh: hệ thống điện bị ngắt, có thể bị hỏng ats\n2. KH yêu cầu: Qua kiểm tra, hỗ trợ, xử lý tình trạng","CN 0984299113 báo sự cố hộ KH\n1. KH phản ánh: hiệu suất ko đạt, KH lắp 16kw nhưng 1 ngày ắc quy ko đầy chỉ đạt được 81%.\n2. KH yêu cầu: Qua kiểm tra lại hiệu suất cho KH","1 kh đã báo chi nhánh\n2 kh cần hỗ trợ xuất hóa đơn đỏ\n3 yêu cầu kt hỗ trợ khách hàng","CN 0968088033 báo sự cố hộ KH \n1. KH phản ánh: Bị bể 3 tấm pin. CN có qua kiểm tra tấm pin thì cũng thấy có vết từ trên trời rơi xuống, nhưng cũng chưa thể xác nhận chính xác được, KH cũng đang ko chấp nhận là do tác động vật lý. \n2. KH yêu cầu: Phản hồi lại thông tin cho KH và thay mới 3 tấm pin.","1. KH đã báo CN: A Nghĩa\n2. KH phản ánh: hiệu suất kém chưa ko đạt hiệu suất theo cam kết. Hệ 10kw nhưng chưa bao giờ lên được 7kw lúc đầu KH lắp 10 tấm và có lắp thêm 6 tấm nữa KT cũng bảo tối đa ít nhất là 13kw mà hiện tại chỉ vẫn có được 6-7kw. Ngoài ra còn thấy ưu tiên sử dụng điện lưới khi vẫn có điện tại pin lưu trữ và vào ban đêm cục dự trữ pin nút đỏ kêu, CN có bảo tắt 5-10p rồi bật lại là ko sao nhưng hiện tượng này KH thấy lặp đi lặp lại 4-5 lần rồi.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Đã báo chi nhánh \nLắp hệ 14Wp nhưng công suất chỉ được 8Wp\nYêu cầu kt qua ktra cho kh","1. KH chưa báo CN\n2 NLMT nhà Kh tủ điện nhà khách hàng nhảy át liên tục\n3 yêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Thạnh, A Nhị\n2. KH phản ánh: Cục biến tần cứ kêu tít tít ko sử dụng được.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","Chi nhánh báo hộ 971759579  \nInvertet bị lỗi đã bảo hành về nhưng vẫn bị lỗi \nYêu cầu kt xuống ktra cho kh","Chưa báo chi nhánh\nNLMT nhà khách hàng gặp sự cố ko đạt hiệu suất \nhiện tại nhà khách hàng đang mất điện yêu cầu kt qua hỗ trợ gấp \nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ CN\n\n2. HT NLMT của KH có công suất 12KW, hiện tại ngày nắng tốt nhưng chỉ phát sinh được 2KW\n\n3. KH cần CN liên hệ và hỗ trợ sớm","Đã báo chi nhánh\nNLMT chỉ kéo điện lưới vào không dùng điện pin lưu trữ\nYcau kt qua ktra cho khách hàng","chi nhánh báo hộ 0382691111\nBiến tần hoạt động không ổn định\nKh cần ktra trong ngày hôm nay hoặc ngày mai\nYêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Hiện tại 1 áp ở trong hệ thống tổng tủ điện ko thấy nhảy lên và giờ đang ko sử dụng được \n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Đã báo chi nhánh \nKh lắp hệ 30Wh nhưng hiện tại công suất chưa được 50%\nYêu cầu kt qua ktra cho kh","1.KH chưa báo CN\n2. KH yêu cầu CN hoàn thiện hồ sơ để gửi cho bên điện lực\n3. Yêu cầu CN hỗ trợ và xử lí cho KH","Đã báo chi nhánh\nPin trữ sạc không đầy NLMT hiệu suất kém\nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Cương, A Hưng\n2. KH phản ánh: Ko thấy có điện vào ắc quy, khi mất điện lưới thì cũng ko thấy có điện ở pin lưu trữ xả ra.\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này cho KH","1. KH đã liên hệ cho CN\n\n2. Hiệu Suất NLMT của KH bị giảm khoảng 15%, trước đây ngày nắng tốt phát sinh được 30kw/h hiện tại phát sinh được 25kw/h, CN kiểm tra và thông tin do Inverter bị nóng nên giảm hiệu suất\n\n3. KH cần CN hỗ trợ và khắc phục giúp HT NLMT của KH hoạt động bình thường","1. KH đã báo CN: Anh Long trước lắp đặt nhưng đang đi công tác \n2. KH phản ánh:  Lỗi ko sạc pin lưu trữ. Pin đã xả từ lúc sáng từ 50% xuống 0% sau đó dù có nắng và hệ thống điện mặt trời hoạt động nhưng công suất sạc pin hiển thị 0kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH chưa liên hệ\n\n2, Mức điện của KH phát sinh khi không sử dụng điện NLMT là 200 số/ngày, nếu đóng điện NLMT sẽ lã 295 số /ngày, mức tiền điện KH cần đóng thêm đang tăng cao\n\n3. KH cần CN đến hỗ trợ kiểm tra HT NLMT giúp KH","Kh đã báo chi nhánh \nBiến tần đang không chạy được\nYêu cầu kt qua ktra cho kh","1. KH đã liên hệ CN\n\n2. KH thay điện thoại nên chưa theo dõi được hiệu suất trên App, từ tin nhắn của điện lực thông tin sản lượng điện từ HT NLMT đang giảm nhiều khoảng 2 tháng gần dây\n\n3. KH cần CN liên hệ và đến kiểm tra cho KH","1. KH đã báo CN: Các sự cố từ trước và cũng đã có văn bản của CN gửi KH\n2. KH phản ánh: Về sự cố tấm pin bị vỡ do ngoại lực KH đang nghi ngờ tấm pin đang ko phải của chính hãng, KH có kiểm tra số serial tấm pin trên phần mềm AE Solar thì thấy báo ko có thông tin trên cty của hãng. Trước đó CN đến kiểm tra nhiều lần nhưng đến khi KH hỏi ngoại lực gì thì CN ko thấy nói. \n3. KH yêu cầu: Làm rõ thông tin, giải thích với KH về tấm pin. Nếu ko KH sẽ kéo pháp lý, đăng tin mxh, phá hoại cty, cảnh báo mọi người và dự kiến KH sẽ khởi kiện vào t6.","Đã báo chi nhánh\nPin lưu trữ về 0% kh muốn pin lưu trữ không xuống 0% nếu không sẽ bị kêu báo động \nYêu cầu kt xuống ktra cho khách hàng","1. KH đã báo CN: A Đức\n2. KH yêu cầu: Cần hỗ trợ bản hợp đồng giấy NLMT có báo CN rồi và CN hứa hẹn là mang cho mà KH vẫn chưa thấy đâu. Ngoài ra, KH cần hỗ trợ, hướng dẫn làm thủ tục hồ sơ về NLMT để gửi bên điện lực.","1. Kh chưa báo CN\n2. KH báo cục pin lưu trữ không có điện\n3. Yêu cầu KT hỗ trợ và xử lí cho KH","1. KH chưa báo CN\n2. KH lắp 2 máy nhưng 1 máy chạy công suất hoạt động kém\n3. Yêu cầu KT hỗ trợ và xử lí cho KH","1. KH đã báo CN \n2. KH đã kí hợp đồng từ 20/4 và thanh toán đầy đủ nhưng vẫn chưa được lắp đăt. KH rất gay gắt. Nếu từ giờ đến 2 ngày tới mà không được hỗ trợ KH sẽ đăng bài phốt\n3. Yêu cầu KT hỗ trợ lắp đặt cho KH","Chưa báo chi nhánh\nPin lưu trữ xả nhưng không nạp \nYêu cầu kt qua kiểm tra cho khách hàng","2. Tủ điện ATS tự chuyển đổi không tự động chuyển điện NLMT khi KH bị mất điện lưới ngày 22/05, đường dây điện vào bị cháy\n\n3. KH cần CN liên hệ và hỗ trợ khắc phục sớm","Chưa báo chi nhánh \nInverter bị lỗi wifi không bắt được \nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Chẩu Văn Nghĩa\n2. KH phản ánh: pin lưu trữ đang bị gặp lỗi trước đó có ivt có mang đi bảo hành rồi mà có báo CN nhưng chưa thấy tháo dỡ nốt pin lưu trữ đi bảo hành.\n3. KH yêu cầu: Kiểm tra pin lưu trữ và mang thiết bị đi bảo hành","CN 0978852953 báo sự cố hộ KH\nKH báo sự cố Inverter mất điện nhưng vẫn chạy,pin lưu trữ có điện nhưng không xả điện \nYêu cầu CN liên hệ hỗ trợ KH","Đã báo chi nhánh\nBIến tần nhà khách hàng bị hỏng \nYêu cầu kt xuống ktra cho khách hàng","Đã báo chi nhánh\nĐiện năng lượng mt chập chờn, kh lắp hệ 12Wh nhưng chỉ được 6Wh\nYêu cầu kt xuống kiểm tra cho khách hàng","1. KH chưa liên hệ CN\n\n2. Những hôm nắng to Điện NLMT chỉ đạt hiệu suất 25-30% cố định do lệch pha từ khi lắp HT NLMT \n\n3. KH cần CN đến nhà KH trao đổi với nhân sự đấu điện cho KH dể thống nhất và có phương án xử lý lệch pha điện NLMT","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. KH bị mất điện ngày  17/5, khi có điện lại HT NLMT của KH không hoạt động, trên APP chỉ có thông số điện lưới, không có phát sinh điện từ NLMT\n3. KH cần CN hỗ trợ khắc phục sớm\nĐịa chỉ lắp đặt: Số nhà 18, Ngõ 111, Phạm Đình Toái, Nghệ An","Đã báo chi nhánh \nKhách hàng đang thấy hệ thống NLMT đang không hoạt động\nyêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Ko thấy có điện nlmt nạp vào, và thấy gián đoạn từ 12h trưa - 3h chiều, 1 ngày chỉ khoảng 30kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Đã báo chi nhánh \n1 tấm pin nlmt bị nứt  \nYêu cầu kt qua ktra cho khách hàng","KH đã báo KT chưa báo CN \nKH báo giao thiếu 1 tấm pin NLMT của KH mà hơn 1 tháng nay chưa thấy giao nốt cho KH \nYêu cầu CN liên hệ KH gấp","1. KH chưa liên hệ với CN \n2. KH cần hỗ trợ hoàn thiện hồ sơ NLMT để gửi cho điện lực \n3. Yêu cầu CN liên hệ và hỗ trợ hoàn thiện hồ sơ cho KH","KH phản ánh 2 tấm Pin bị nứt, vỡ, võng. Yêu cầu kiểm tra, thay thế theo bảo hành","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng","1. KH đã liên hê CN và được hỗ trợ tháo thiết bị để chuyển cho hãng\n2. Pin lưu trữ của KH bị lỗi\n3. KH cần CN hỗ trợ khắc phục sớm","1.  KH chưa báo chi nhánh\n2. KH báo lỗi inverter không hoạt động, báo lỗi không hiển thị màn hình\n3. Yêu cầu Chi nhanh cho Kỹ thuật xuống hỗ trợ KH gấp","CN 0976886777 báo sự cố hộ KH \n1. KH phản ánh: Tivi màn hình led bị lỗi ko lên màn hình.\n2. KH yêu cầu: Xuống kiểm tra, xử lý trong ngày hôm nay.","KH đã báo KT tên Huy chưa báo CN \nKH báo hiệu suất NLMT kém không đủ sạc  pin lưu trữ\nYêu cầu CN cho KT xuống kiểm tra lại cho KH gấp","1. KH đã báo CN \n2. KH phản ánh sự cố pin NLMT bị nổ KT đã xuống tháo nhưng KT chưa đem về kiểm tra và sửa cho KH, nay KH gọi lên yêu cầu KT có xuống đem về sửa cho KH không thì nói KH để còn biết KH lắp bên đơn vị khác\n3. Yêu cầu CN liên hệ và cho KT  xuống Ktra gấp cho KH, KH đang rất gay gắt","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. Inverter bị lỗi không lưu điện vào trong pin, đổi dòng dùng điện trực tiếp được nhưng không vào pin lưu trữ\n3. KH y/c CN hỗ trợ đổi thiết bị mới cho KH","KHDN ký 1 Hợp đồng nhưng có 2 địa chỉ lắp đặt và cả 2 đang gặp sự cố. \n1. KH đã báo chi nhánh\n2. KH phản ánh: \n+ Tại Xã Lương Sơn, Tỉnh Phú Thọ: KH báo bị lỗi biến tần\n+ Tại Xã Hợp Thịnh, Tỉnh Bắc Ninh: KH báo tủ biến tần bị nổ cháy\n3. KH yêu cầu: KT trong tuần này liên hệ hỗ trợ","Khách hàng đang nhận định và khiếu nại hệ thống năng lượng mặt trời hoạt động không hiệu quả. Nguyên nhân do buổi sáng đón nắng tốt, nhưng đến trưa thì bị che bóng (nên theo khách, hệ 6kW nhưng công suất thấp chỉ sản sinh được 1kW thôi). Liên quan việc che bóng thì khách cho rằng Viettel không khảo sát kỹ từ đầu. Và có yêu cầu di dời tấm pin áp mái đến vị trí đón nắng tốt hơn (trong phạm vi 10 m trên mái nhà).\nNhờ KT xêp lịch hẹn sớm với khách hàng và hỗ trợ\nKhảo sat thực tế và lên phg án di dời các tấm pin","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","1. KH đã liên hệ với CN nhưng chưa tiếp nhận: Có liên hệ với CN là a Bùi Anh Nguyễn nhưng ko nghe máy, và cũng ko thấy gọi lại.\n2. KH phản ánh: Pin tích điện đủ nhưng ko thấy xả ra để dùng. KH đã báo bên điện lực đến kiểm tra và đã đo đồng hồ các thứ và ko bị làm sao. Tiền điện bây giờ vẫn tăng cao lúc chưa lắp là 8tr tư vấn lắp đặt thông tin là 2tr mà những tháng đầu tiền điện 4tr. Và khi sập điện lưới bật quạt để chạy thử sang nlmt thì được 1 lúc lại tự ngắt rồi lại dùng điện lưới.\n3. KH yêu cầu: Qua kiểm tra thiết bị xem và khắc phục tình trạng này.","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra","1. KH đã liên hệ với CN, CN đã hỗ trợ tháo tấm pin lỗi\n2.KH nghe tiếng như có tiếng nổ, lên kiểm tra thấy tấm pin rạn vỡ, cần kiểm tra bảo hành\n3.KH cần CN hỗ trợ thông tin sớm","KH (work@namdd.dev) gửi mail n hồi do kh sd quá tải nhưng từ khi lắp đến nay kh báo chỉ dùng bằng đó thiết bị chứ ko hơn\n3. kh yc: YC cn hỗ trợ sớm","- Đối tác Công ty cổ phần SPT Việt Nam (sdt phản ánh 0975014010) tiếp tục gọi tđ phản ánh về vấn đề chậm trễ tiến độ và thiếu nhân lực thi công cho dự án Thi công lắp đặt hệ thống Chiller. \n- Kh báo hiện tại vẫn chậm tiến độ, cn ko thay đổi hay tiến triển thêm gì\n- Mã hợp đồng: 23092025/HĐTP-SPT-VIETTEL.\n- Kh yc: Yc TCT có biện pháp xử lý rõ ràng cho kh"],"Ngày bắt đầu":["2026-06-05 08:00:00","2026-06-04 17:16:00","2026-06-04 16:23:00","2026-06-04 15:04:00","2026-06-04 14:36:00","2026-06-04 14:23:00","2026-06-04 14:21:00","2026-06-04 13:30:00","2026-06-04 11:55:00","2026-06-04 10:59:00","2026-06-04 10:50:00","2026-06-04 10:25:00","2026-06-04 09:55:00","2026-06-04 09:52:00","2026-06-04 09:28:00","2026-06-04 08:29:00","2026-06-04 08:21:00","2026-06-05 08:17:00","2026-06-05 08:00:00","2026-06-05 08:00:00","2026-06-04 17:26:00","2026-06-04 17:17:00","2026-06-04 17:00:00","2026-06-04 16:16:00","2026-06-04 14:18:00","2026-06-04 13:30:00","2026-06-04 13:30:00","2026-06-04 10:09:00","2026-06-04 10:01:00","2026-06-04 08:00:00","2026-06-03 16:56:00","2026-06-03 14:26:00","2026-06-03 14:02:00","2026-06-03 13:30:00","2026-06-03 11:13:00","2026-06-04 08:00:00","2026-06-03 16:30:00","2026-06-03 16:07:00","2026-06-03 14:58:00","2026-06-03 13:57:00","2026-06-03 09:12:00","2026-06-03 08:00:00","2026-06-02 14:57:00","2026-06-02 13:48:00","2026-06-02 13:42:00","2026-06-02 11:20:00","2026-06-01 09:56:00","2026-06-01 16:29:00","2026-06-01 13:47:00","2026-06-01 11:35:00","2026-06-01 10:54:00","2026-06-01 08:00:00","2026-06-01 08:00:00","2026-06-01 08:00:00","2026-05-29 17:01:00","2026-05-29 17:00:00","2026-05-29 16:42:00","2026-05-29 13:30:00","2026-05-29 09:19:00","2026-05-29 13:30:00","2026-05-28 11:58:00","2026-05-28 10:42:00","2026-05-28 09:52:00","2026-05-27 11:26:00","2026-05-27 09:05:00","2026-05-27 11:16:00","2026-05-27 10:54:00","2026-05-27 10:37:00","2026 var COL_NAMES  = ["Mã tỉnh","Lĩnh vực","Ngành hàng","Sản phẩm","Mã HĐ","Tên khách hàng","SĐT","Địa chỉ","Giai đoạn","Nhóm sự cố","Loại sự cố","Chi tiết","Ngày bắt đầu","Ngày kết thúc","Trạng thái","Tên nhân viên","Mã nhân viên","Hệ thống","Đơn vị điều hành","AM chuyên quản"];
var COL_WIDTHS = {"Mã tỉnh":100,"Lĩnh vực":100,"Ngành hàng":100,"Sản phẩm":150,"Mã HĐ":100,"Tên khách hàng":120,"SĐT":100,"Địa chỉ":250,"Giai đoạn":100,"Nhóm sự cố":100,"Loại sự cố":100,"Chi tiết":300,"Ngày bắt đầu":100,"Ngày kết thúc":100,"Trạng thái":100,"Tên nhân viên":100,"Mã nhân viên":100,"Hệ thống":100,"Đơn vị điều hành":100,"AM chuyên quản":100};
var CT_GROUP   = 'bang_chitiet_group';
var AM_MAP     = {"P.KD Cơ điện":["P.KD Cơ điện"],"P.KDNLMT":["P.KDNLMT"],"P.Triển khai":["N1 - Truongdv17, Congnd15","N2 - Tienvt16, Anhnt631","N3 - Thikd, Ducnt84"],"VHKT":["VHKT"]};
var TINH_MAP   = {"N1 - Truongdv17, Congnd15":["BNH","HNI","HPG","PTO","QNH"],"N2 - Tienvt16, Anhnt631":["KHA","NAN","QTI"],"N3 - Thikd, Ducnt84":["AGG","DNI","HCM","LDG","VLG"],"P.KD Cơ điện":["BNH"],"P.KDNLMT":["BNH","HUE","TNN"],"VHKT":["AGG","BNH","CMU","CTO","DLK","DNG","DNI","DTP","GLI","HCM","HNI","HPG","HTH","HUE","HYN","KHA","LCI","LDG","NAN","NBH","PTO","QNH","QTI","THA","TNH","TNN","TQG","VLG"]};
</script>
<script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
