","1. KH đã báo CN\n2. KH phản ánh: KH theo dõi trên app mấy hôm nay ko thấy có lượng điện được nạp vào pin, đang có bao nhiêu và khi mất điện cũng ko thấy xả ra\n3. KH yêu cầu: KT qua kiểm tra, khắc phục tình trạng này","1. KHDN phản ánh có làm đơn hàng về mua bán thiết bị thu phát wifi và nhân công lắp đặt tổng thanh toán là 2tr970k qua TK của CN đang muốn xuất hóa và có làm với nhân sự CN là a Đại SĐT 0398210064, a Đại này có cung cấp cả hình ảnh tạo đơn thành công. KH trao đổi xuất hóa đơn với a Đại trước đó rồi thì thông tin là xuất nhầm hóa đơn cho 1 bên khác, đến hiện tại hôm nay thì liên hệ ko được nữa. CSKH kiểm tra đơn hàng này thì bị hủy và phần nội dung công việc đang ko đúng.\n2. KHDN yêu cầu là thông tin lại trong ngày hôm nay về việc xuất hóa đơn để KHDN còn làm báo cáo thuế","1. KH chưa báo CN\n2. KH phản ánh: KH bán điện cho EVN và có báo EVN kiểm tra thì thấy 3 tháng nay  không thấy số điện phát lên lưới điện.\n3. KH yêu cầu: KT qua kiểm tra lại hệ thống NLMT","KH đã báo CN \nKh phản ánh hệ thống NLMT tự đẩy điện ra lưới ngoài khoảng 1 tháng nay\nYêu cầu kĩ thuật liên hệ và xuống KT cho KH","1. KH đã báo CN\n2. KH phản ánh: KH có ký HĐ là ngày 15 và CN hứa là trong tuần sẽ lắp đặt tức muộn nhất là ngày 21. KH có trao đổi với A Nam thì A Nam phản hồi là do cấp dưới ko phản hồi, mới chỉ có tấm pin. KH sẽ căn cứ theo HĐ là 15 ngày, và sẽ gửi mail lên trên TCT.\n3. KH yêu cầu: phản hồi cho KH chính xác là thời gian tập kết vật tư hay triển khai lắp đặt để KH còn sắp xếp thời gian","1. KH chưa liên hệ CN\n\n2. HT NLMT của KH không phát sinh điện lên lưới khoảng 3 tháng nay\n\n3. KH cần CN hỗ trợ đến kiểm tra cho KH","1. KH chưa liên hệ CN\n\n2. KH không đăng nhập được vào App theo dõi hiệu suất NLMT\n\n3. KH cần Cn liên hệ và đến hỗ trợ KH sớm","CN 0984299113 báo sự cố hộ KH \n1.\tKH phản ánh: biến tần bị lỗi kêu suốt buổi từ 7h sáng - 7h tối\n2.\tKH yêu cầu: cho người đến kiểm tra, khắc phục tình trạng này","1. KH chưa liên hệ CN\n\n2. KH không theo dõ thống NLMT thì KH thấy một số vđề như sau:\n+ Khoảng 14h, là tấm pin bị che  mất gần nửa (anh1)\n+ Dây DC của tấm pin vẫn có một phần dây ko đc bọc ống bảo vệ và chạm vào mái tôn (anh2)\n+ Đầu nối giữa các tấm pin và dây điện của các tấm pin ko đc cột lên và đang tiếp xúc với mái tôn (anh3)\n+ Dây tiếp địa thi cũng nằm trơ trọi ko có phần ống bảo vệ ở mái tôn (anh4)\n+ Ống ruột gà màu cam thì bị hở đầu —> rất dễ bị nước mưa chui vào trong\n3. KH yêu cầu: sắp xếp ktra và xử lý sớm. Hiện tại đang mùa mưa, tránh gây ra các sự cố đáng tiếc cho hệ thống mới.","KH phản ánh app chỉ số điện tiêu thụ hiển thị không đúng ( điện lực báo 40 số trong khi app báo 31 số ), KH thấy bất hợp lý nên cần kĩ thuật xuống kiểm tra cho KH","1. KH đã báo CN: A Thiên\n2. KH phản ánh: bị mất kết nối app ko theo dõi được hiệu suất. Đã báo CN là A Thiên đến kiểm tra nhưng ko thấy thông tin lại\n3. KH yêu cầu: KT qua kiểm tra, hỗ trợ KH kết nối lại app","KH chưa báo CN \nKH phản ánh sản phẩm hay bão lỗi đèn đỏ ở  cục biến tần, điện bán tải đẩy lên lưới quá nhiều (27% trở lên )\nYêu cầu kĩ thuật kiểm tra cho KH","1. KH đã liên hệ CN\n\n2. HT NLMT gặp sự cố biến tần mã 70 trên APP, kết nối dây cáp quá tải khoảng 1 tuần nay\n\n3. KH cần chi nhánh đến kiểm tra và khắc phục sớm","1. KH chưa liên hệ CN \n\n2. Biến tần của KH gặp sự cố không có điện khoảng 3-4 ngày, App theo dõi hiệu suất báo ngoại tuyến\n\n3. KH cần CN liên hệ và đến kiểm tra gấp","1. CN báo sự cố cho KH\n\n2. HT NLMT của KH bị nhảy ATS liên tục, buổi tối bị mất điện\n\n3. KH cần CN đến kiểm tra và khắc phục sớm cho KH","1. KH đã liên hệ CN\n\n2. HT NLMT của KH đang không sản xuất điện\n\n3. KH cần chi nhánh hỗ trợ kiểm tra và khắc phục sớm","KH đã báo CN \nKH phản ánh NLMT chưa đấu hệ thống tiếp địa, cần KT hỗ trợ và xử lí cho KH","KH chưa báo CN \nKH phản ánh ắc quy cảnh báo đỏ không sạc mặc dù tắt thiết bị cũng không sạc vào ắc quy\nYểu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","KH chưa báo CN \nKH phản ánh Hiệu suất sản phẩm kém, lắp NLMT nhưng tiền điện vấn tăng rất nhiều \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","KH đã báo KT\nKH phản ánh về việc hệ thống NLMT đã lắp pin cho KH rồi nhưng chưa được đấu điện\nYêu cầu CN cho KT qua hỗ trợ KH","KH phản ánh Hiệu quả sản phẩm kém, tiền điện tăng lên 700-1tr, công mức xả điện yếu hơn so với lúc đầu sử dụng\nYêu cầu quản lí điều kĩ thuật liên hệ qua số 0397422358 - chị Nga ( vợ ) và xuống kiểm tra cho KH","1. KH đã liên hệ CN\n\n2. Biến tần cảnh báo đèn đỏ, kêu tít tít, mất điện, bị nhiều lần tự khởi động lại, khoảng 10 ngày trước KH cũng gặp sự cố tương tự\n\n3. KH cần CN đến kiểm tra và khắc phục sớm","1. KH đã liên hệ CN\n\n2. Thiết bị ắc quy lưu trữ luôn báo 4 vạch pin, biến tần không hoạt động, app theo dõi hiệu suất báo thông số về 0, hiện KH đang không sử dụng được điện NLMT\n\n3. KH cần chi nhánh đến kiểm tra và khắc phục gấp","1.Thiết bị Inverter của KH đang không hiển thị thông tin, các thông số trên App nhảy về 0\n\n2.CN báo lỗi giúp KH và thông tin sẽ hỗ trợ khắc phục sớm\n\n3. KH cần CN khắc phục gấp do gặp sự cố với thiết bị nhiều lần","1. KH đã liên hệ CN và được hỗ trợ đến kiểm tra nhưng chưa khắc phục được\n\n2 Thiết bị Inverter của KH đang không sản xuất điện, trên App chỉ có thông tin điện lưới, không thông tin điện NLMT khoảng 1 tuần\n\n3. KH cần chi nhánh hỗ trợ nhân sự có chuyên môn đến kiểm tra và khắc phục cho KH","KH đã báo KT\nKh báo sự cố NLMT đã lắp pin lưu trữ nhưng hiện tại điện vẫn bị sập\nYêu cầu CN cho KT qua ktra cho KH","KH đã báo CN \nKH phản ánh: Gia đình tôi lắp hệ thống ngày 12/5\nSử dụng ok,đến ngày 04/6 pin dự phòng không lưu trữ được \nSau đấy 2 ngày bên công ty cho người đến mang đi bảo hành\nĐến ngày hôm nay 19/6 vẫn chưa thấy mang về\nNhư vậy theo đúng hợp đồng,phía công ty sẽ phải đổi cho tôi pin mới\nYêu cầu CN liên hệ lại cho KH và cho KT xuống hỗ trợ KH","1. KH chưa báo CN\n2. KH phản ánh: Sự cố trước CN đã có cập nhật pin lưu trữ nhưng KH vẫn ko thấy đến cập nhật, công suất thì gần đây KH cũng ko thấy có.\n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","KH chưa báo CN \nKH phản ánh pin lưu trữ dùng song song với điện lưới, không ngắt được.\nYêu cầu quản lý điều kĩ thuật xuống kiểm tra cho KH","KH chưa báo CN \nKH muốn cung cấp COCQ của ivt và tấm pin, công suất hãng sản xuất của tấm pin\nYêu cầu CN hỗ trợ cho KH","KH đã báo CN \nKH phản ánh tiến độ triển khai chậm, chưa có ai đến lắp cho KH \nYêu cầu quản lí điều kĩ thuật liên hệ trước cho KH và xuống lắp cho KH","Kh chưa báo CN \nKH phản ánh Hệ thống năng lượng mặt trời bị lỗi, nhà mất điện là hệ thống NLMT cũng không hoạt động \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","1. KH đã liên hệ CN\n\n2. Biến tần của KH đang không hiển thị thông tin tải điện của nhà KH khoảng 2 ngày nay\n\n3. KH cần CN liên hệ và đến hỗ trợ kiểm tra sớm","KH chưa báo CN \nKH phản ánh KH có 2 ivt thì 1 cái không sáng đèn không hoạt động, không chạy được năng suất điện \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","1. KH đã báo CN\n2. KH cần bàn giao hồ sơ để gửi cho bên điện lực. CN báo 30/5 sẽ bàn giao cho KH nhưng KH không thấy phản hồi \n3. KH yêu cầu CN hoàn thiện và bàn giao hồ sơ cho KH gấp","1. KH đã liên hệ CN\n\n2. KH ký kết hợp đồng lắp đặt NLMT là lắp đặt trọn gói, tuy nhiên sau khi hoàn thiện CN có thông báo khoản phát sinh thêm cần thanh toán là lắp khung dù trước đó đã đến nhà KH và khảo sát, sau khi hoàn thiện lắp đặt chưa chuyển biên bản bàn giao cho KH\n\n3. KH cần chi nhánh liên hệ và hỗ trợ giải đáp cho KH sớm","1. KH đã liên hệ CN \n\n2. Trên App theo dõi hiệu suất HT NLMT của KH thông báo lấy 5Kw điện lưới, thực tế Đồng hồ điện lưới thông báo lấy 50Kw điện lưới\n\n3.KH cần CN liên hệ và đến kiểm tra sớm","1. KH đã báo CN\n2. KH phản ánh: Từ các sự cố trước về ivt hoạt động ko ổn định. CN chỉ thấy điều khiển từ xa ko thấy đến kiểm tra trực tiếp, và ko thấy xử lý. KH thấy là khi tăng tải lên vẫn lưới điện lưới buộc KH phải tắt tải. KH có liên hệ người phụ trách lắp đặt trước thì ko thấy nghe máy, KH rất ko hài lòng và bức xúc. \n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","KH chưa báo CN \nKH phản ánh Hệ thống NLMT phải có điện lưới mới hoạt động, không có điện lưới là không dùng được mặc dù pin đầy \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","1. KH chưa báo CN\n2. KH phản ánh: Hiệu suất NLMT kém so với trước đây. 1 ngày trước đây ra 70kw điện mà giờ 1 ngày chỉ còn 30kw điện hiệu suất giảm hơn 1 nửa.\n3. KH yêu cầu: Qua kiểm tra, xử lý tình trạng này","KH đã báo CN \nKH phản ánh inveter bán tải 3kw bị lỗi về hệ thống, hiệu quả sản phẩm thấp\nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","KH chưa báo CN \nKH phản ánh hệ thống NLMT bị lỗi điện chập chờn, điện mặt trời đạt hiệu suất kém\nYêu cầu quản lí điều kĩ thuật xuống kiểm tra","Lúc đầu KH đặt đơn SĐT 0948134000 nhưng là KHCN nên CN hủy đơn đi tạo lại theo KHDN nhưng khi tạo lại để SĐT là của KT. \n1. KH phản ánh: \n+ Việc xuất hóa đơn hạng mục bảo dưỡng + nhân công nhưng rồi lại báo đơn hàng trên 2 triệu mới xuất được hóa đơn + đưa 1 hàng hóa không đúng danh mục dịch vụ liên quan\n+ Thông tin tiếp nhận xuất hóa đơn nội bộ cho nhau không đúng lại báo KH chuyển sai thông tin. Hôm KT qua bảo dưỡng điều hòa KH có đưa hình ảnh thông tin để KT chụp lại nhưng KT lại soạn tin nhắn để gửi và lấy thông tin địa chỉ không chính xác\n2. KH yêu cầu: Hỗ trợ trường hợp hóa đơn này của KH, và KH thời gian xử lý cụ thể","KH chưa báo CN \nKH phản ánh cục biến tần NLMT đang gặp lỗi không hoạt động\nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","YCTX NLMT KH đã được liên hệ tư vấn nhưng chưa rõ ràng về giá, về bảo hành, KH cần liên hệ tư vấn thêm về NLMT hiện tại KH đang có 1 hệ nhưng ko đủ dùng","KH chưa báo CN \nkhách hàng báo pin lưu trữ bị chớp đỏ, ko sử dụng được.\nYêu cầu quản lí điều kỹ thuật hỗ trợ kiểm tra gấp","1. Pin lưu trữ NLMT của KH chỉ hiển thị ở mức 43% dù trời nắng to khoảng 2 ngày nay, CN đã hẹn KH ngày 15/06 sẽ đến kiểm tra\n\n2. KH cần CN đến kiểm tra và giải đáp cho KH","1. KH ký hợp đồng NLMT trả góp 3 bên, đã hoàn thiện việc thanh toán cho bên thứ 3 tuy nhiên đến nay chưa nhận được hợp đồng từ chi nhánh\n\n2. KH phản ánh thiết bị Inverter bị đen màn hình, HT NLMT vẫn sử dụng tốt, nhân sự của CN đến kiểm tra và thông tin cần chuyển thiết bị đi bảo hành và thời gian khoảng 30 ngày\n\n3. KH không đồng ý chuyển thiết bị đi bảo hành do chưa có văn bản tháo gỡ, nhân viên đến kiểm tra chưa cung cấp lý do hỏng hóc thiết bị của KH, cần CN liên hệ và giải đáp cũng như chuyển hợp đồng cho KH","KH chưa báo CN,KT\nKh báo sự cố NLMT không sản xuất ra điện hơn 3 tuần nay, tiền điện thì bị tăng \nYêu cầu CN cho KT qua kiểm tra cho KH","1. KH đã báo CN: A Huy - trước lắp đặt NLMT\n2. KH phản ánh: Hiệu suất kém hệ 6kw nhưng thời điểm cao điểm nắng nhất cũng chỉ đạt được 3kw. KH theo dõi trên app hiệu suất cũng ko thấy hoạt động.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã liên hệ CN\n\n2. KH phản ánh tiền điện cần đóng đang tăng khoảng 3 tháng trở lại đây (Từ khoảng 5-6tr đến hơn 9tr)\n\n3. KH cần CN liên hệ và đến hỗ trợ kiểm tra sớm cho KH","1. KH đã liên hệ CN\n\n2. HT NLMT của KH hiện đang không phát sinh điện, lượng tiền điện cần đóng của KH gần đây tăng nhiều\n\n3. KH cần CN liên hệ và đến hỗ trợ khắc phục sớm","KH chưa báo CN \nKH phản ánh hệ thống NLMT bị lỗi \nYêu cầu quản lý chi nhánh điều kĩ thuật xuống kiểm tra","1. KH chưa báo CN\n2. KH phản ánh: đồng hồ chính điện lưới vẫn có nhưng trong nhà ko có cả điện lưới lẫn điện nlmt. KH đã báo bên điện lực kiểm tra và điện lực báo do lỗi điện nlmt\n3. KH yêu cầu: KT xuống kiểm tra, xử lý tình trạng này\n***SĐT phản ánh: 0822993939","1. KH đã báo CN: A Quốc Đại\n2. KH phản ánh: tủ điện có mùi khét, cả nhà mất điện\n3. KH yêu cầu: Qua hỗ trợ, xử lý tình trạng này","1. KH đã liên hệ CN\n\n2. HT NLMT của KH đang mất kết nối Wifi, Trên theo dõi hiêu suất thông báo HT đang ngoại tuyến\n\n3. KH cần CN liên hệ và hõ trợ sớm","KH chưa báo CN, KT ( KH lắp từ 2021)\nKH báo sự cố nlmt sài được gần 2 năm, hỏng 2 năm nay không ai xuống sửa KT có xuống kiểm tra nói có gắn 1 cục gì đấy (KH không biết) là sẽ dùng được,  nhưng giờ đã nửa tháng vẫn chưa có ai xuống gắn, KH gay gắt \nYêu cầu CN liên hệ cho KT xuống kiểm tra cho KH","1. KH đã báo CN\n2. KH phản ánh: pin lưu trữ không hoạt động\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này nếu có gì thay thế thì thay thế luôn","1. KH chưa báo CN\n2. KH phản ánh: Hệ KH hơn 7kw KH vẫn thấy hệ hoạt động bình thường tầm trưa trưa là pin lưu trữ đầy mà gần đây thấy tiền điện tăng bất thường. Hồi đầu sử dụng sản phẩm tiền điện là 200k/ 1 tháng đến gần đây t4 là 708k và t5 này là 1tr1 tiền điện. \n3. KH yêu cầu: KT xuống kiểm tra xem và khắc phục tình trạng này","KH chưa báo KT,CN \nKH báo sự cố NLMT tiền điện tăng, nhà KH dùng 2 công tơ, thì 1 công tơ có NLMT bị tăng tiền điện, 1 công tơ không dùng điện NLMT thì không bị tăng\nYêu cầu CN liên hệ và cho KT xuống hỗ trợ KH","1 KH đang bị mất giám sát HTNLMT  và đã được CN hỗ trợ chuyển đi bảo hành\n\n2 KH cần CN hỗ trợ sửa chữa và chuyển trả thiết bị sớm","CN 0382691111 báo sự cố hộ KH\n1. KH phản ánh: Hôm qua mưa giông tủ điện bị sét đánh, hỏng mất cục lọc sét\n2. KH yêu cầu: Qua kiểm tra, xử lý, khắc phục tình trạng này.","KH đã báo CN\nNLMT đang tạm ngắt hệ thống, khi bật hệ NLMT lên máy móc trong nhà máy hoạt động rất yếu. KT đến xử lí không triệt để \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra và xử lý gấp","KH phản ánh không theo dõi được hiệu suất nlmt qua App\n\nKH yêu cầu: KT lại giúp cho khách","KH chưa báo CN \nKH phản ánh sự cố nlmt cứ buổi trưa và tối là bị sụp, kĩ thuật không có chuyên môn, tiến độ triển khai chậm\nYêu  cầu quản lý điều thêm  kĩ thuật xuống kiểm tra lại cho khách","KH chưa báo CN chưa báo KT \nKH báo sự cố không theo dõi được hệ thống NLMT trên app điện thoại\nYêu cầu CN cho KT xuống hỗ trợ KH","Đã báo CN: Đã báo\nKH báo sự cố: Hiện tại 1 tấm pin nhà KH có hiện tượng bị không sử dụng được \nKH yêu cầu: KT qua kiểm tra cho Kh","1. KH đã liên hệ CN\n2. KH phản ánh\n- Sau khi hoàn thiện lắp đặt HT NLMT, KH được thông tin cần thanh toán 1 số khoản vật tư phát sinh cụ thể là 30m dây điện trong khi hợp đồng là thi công trọn gói\n- Cục pin lưu trữ ko hoạt động\n3. KH cần CN liên hệ và giải đáp cho KH","1. KH chưa liên hệ CN\n\n2. KH đang gặp sự cố đóng điện để sử dụng điện NLMT thì bị nhảy áp , phải sử dụng điện lưới khoảng 3 ngày nay\n\n3. KH cần CN liên hệ và hỗ trợ sớm","1. KH đã báo CN: A Trứ, A Thịnh\n2. KH phản ánh: HĐ của KH 10 máy lạnh. Sự cố từ trước KT qua kiểm tra giờ KH thấy là bị đấu nối dậy bị lỗi mất 3 cái máy lạnh, nhà KH là điện 3 pha nhưng lại chỉ đấu 1 pha. KH có liên hệ CN nhưng chưa thấy qua hỗ trợ.\n3. KH yêu cầu: Qua kiểm tra lại việc lắp đặt và lắp đặt lại","KH đã báo CN\nKH phản ánh: Nắng to KH theo dõi trên app thì thấy dùng 100% điện lưới, ko thấy dùng nlmt cũng ko thấy có xả ra.\nKH yêu cầu: Qua kiểm tra, khắc phục tình trạng này cho KH","KH chưa báo chi nhánh\nĐiện đồng hồ tăng bất thường trong 2 tháng \nYêu cầu chi nhánh điều kĩ thuật đến kiểm tra","1. KH đã liên hệ CN\n\n2. HT NLMT của KH có 2 thiết bị Biến tần, 1 thiết bị đang không hoạt động, trên APp có cảnh báo không hoạt động khoảng 2 tuần nay, Hiệu suất sản sinh điện NLMT giảm hơn nửa, từ 35KW giảm còn 10-12 KW\n\n3, KH cần CN liên hệ và đến hỗ trợ","CN 0968088033 báo sự cố hộ KH \n1. KH phản ánh: Bị bể 3 tấm pin. CN có qua kiểm tra tấm pin thì cũng thấy có vết từ trên trời rơi xuống, nhưng cũng chưa thể xác nhận chính xác được, KH cũng đang ko chấp nhận là do tác động vật lý. \n2. KH yêu cầu: Phản hồi lại thông tin cho KH và thay mới 3 tấm pin.","chi nhánh báo hộ 0382691111\nBiến tần hoạt động không ổn định\nKh cần ktra trong ngày hôm nay hoặc ngày mai\nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ cho CN\n\n2. Hiệu Suất NLMT của KH bị giảm khoảng 15%, trước đây ngày nắng tốt phát sinh được 30kw/h hiện tại phát sinh được 25kw/h, CN kiểm tra và thông tin do Inverter bị nóng nên giảm hiệu suất\n\n3. KH cần CN hỗ trợ và khắc phục giúp HT NLMT của KH hoạt động bình thường","1. KH đã liên hệ CN\n\n2. KH thay điện thoại nên chưa theo dõi được hiệu suất trên App, từ tin nhắn của điện lực thông tin sản lượng điện từ HT NLMT đang giảm nhiều khoảng 2 tháng gần dây\n\n3. KH cần CN liên hệ và đến kiểm tra cho KH","1. KH đã báo CN: Các sự cố từ trước và cũng đã có văn bản của CN gửi KH\n2. KH phản ánh: Về sự cố tấm pin bị vỡ do ngoại lực KH đang nghi ngờ tấm pin đang ko phải của chính hãng, KH có kiểm tra số serial tấm pin trên phần mềm AE Solar thì thấy báo ko có thông tin trên cty của hãng. Trước đó CN đến kiểm tra nhiều lần nhưng đến khi KH hỏi ngoại lực gì thì CN ko thấy nói. \n3. KH yêu cầu: Làm rõ thông tin, giải thích với KH về tấm pin. Nếu ko KH sẽ kéo pháp lý, đăng tin mxh, phá hoại cty, cảnh báo mọi người và dự kiến KH sẽ khởi kiện vào t6.","Chưa báo chi nhánh \nInverter bị lỗi wifi không bắt được \nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Chẩu Văn Nghĩa\n2. KH phản ánh: pin lưu trữ đang bị gặp lỗi trước đó có ivt có mang đi bảo hành rồi mà có báo CN nhưng chưa thấy tháo dỡ nốt pin lưu trữ đi bảo hành.\n3. KH yêu cầu: Kiểm tra pin lưu trữ và mang thiết bị đi bảo hành","CN 0978852953 báo sự cố hộ KH\nKH báo sự cố Inverter mất điện nhưng vẫn chạy,pin lưu trữ có điện nhưng không xả điện \nYêu cầu CN liên hệ hỗ trợ KH","Đã báo chi nhánh \nKhách hàng đang thấy hệ thống NLMT đang không hoạt động\nyêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Ko thấy có điện nlmt nạp vào, và thấy gián đoạn từ 12h trưa - 3h chiều, 1 ngày chỉ khoảng 30kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","KH đã báo KT chưa báo CN \nKH báo giao thiếu 1 tấm pin NLMT của KH mà hơn 1 tháng nay chưa thấy giao nốt cho KH \nYêu cầu CN liên hệ KH gấp","KH phản ánh 2 tấm Pin bị nứt, vỡ, võng. Yêu cầu kiểm tra, thay thế theo bảo hành","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng","KH đã báo KT tên Huy chưa báo CN \nKH báo hiệu suất NLMT kém không đủ sạc  pin lưu trữ\nYêu cầu CN cho KT xuống kiểm tra lại cho KH gấp","1. KH đã báo CN \n2. KH phản ánh sự cố pin NLMT bị nổ KT đã xuống tháo nhưng KT chưa đem về kiểm tra và sửa cho KH, nay KH gọi lên yêu cầu KT có xuống đem về sửa cho KH không thì nói KH để còn biết KH lắp bên đơn vị khác\n3. Yêu cầu CN liên hệ và cho KT  xuống Ktra gấp cho KH, KH đang rất gay gắt","KHDN ký 1 Hợp đồng nhưng có 2 địa chỉ lắp đặt và cả 2 đang gặp sự cố. \n1. KH đã báo chi nhánh\n2. KH phản ánh: \n+ Tại Xã Lương Sơn, Tỉnh Phú Thọ: KH báo bị lỗi biến tần\n+ Tại Xã Hợp Thịnh, Tỉnh Bắc Ninh: KH báo tủ biến tần bị nổ cháy\n3. KH yêu cầu: KT trong tuần này liên hệ hỗ trợ","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","1. KH đã liên hệ với CN, CN đã hỗ trợ tháo tấm pin lỗi\n2.KH nghe tiếng như có tiếng nổ, lên kiểm tra thấy tấm pin rạn vỡ, cần kiểm tra bảo hành\n3.KH cần CN hỗ trợ thông tin sớm","KH (work@namdd.dev) gửi mail phản ánh các vấn đề: \n1.\tTiền dây dẫn thừa: Đề nghị Viettel Phú Thọ thực hiện việc bồi hoàn lại tiền cho phần dây điện thừa do thi công sai lệch ban đầu.\n2.\tTiêu chuẩn vật tư tủ điện (Dựa trên buổi làm việc ngày 11/04/2026): Hai bên đã thống nhất ghi nhận hiện trạng là chưa xác định được vật tư bên trong tủ điện có đảm bảo đúng danh sách thiết bị và tiêu chuẩn kỹ thuật của công ty hay không. Tôi yêu cầu phía Tập đoàn và VCC cung cấp chi tiết danh sách vật tư và tiêu chuẩn kỹ thuật để gia đình có cơ sở so var CT_GROUP   = 'bang_chitiet_group';

<script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>

      tooltip.show();    
    }
    setTimeout(function() {
      if (tooltip) {
        tooltip.hide();
        button.removeAttribute("data-bs-title");
        button.removeAttribute("data-bs-toggle");
        button.removeAttribute("data-bs-placement");
      }
      button.setAttribute("title", currentTitle);
