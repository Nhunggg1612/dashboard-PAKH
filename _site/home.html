hông số , hiện HT đang không sản sinh điện NLMT\nYêu cầu CN cho KT qua ktra cho KH","1. KH đã báo CN\n2. KH phản ánh và yêu cầu: bị hỏng ats cần sửa chữa hoặc thay thế. CN bảo KH gọi lên TĐ","1. KH đã báo CN\n2. Sau khi lắp đặt và sử dụng KH thấy hiệu suất chưa cao, KH muốn điều chỉnh cho dây  tiếp đất luồn xuống dưới mái tốn vì lắp ở trên mái tôn như vạy thì khi nắng dây sẽ bị nhũn,nhanh hỏng. KT khoan ốc vít sai vị trí làm hỏng mái tôn của KH dẫn đến dột, thủng\n3. Yêu cầu CN hỗ trợ KH","1. KH đã báo CN\n2. KH phản ánh: dàn lạnh điều hòa ko vào điện\n3. KH yêu cầu: KT qua kiểm tra, sửa chữa, bảo hành","KH đã báo KT nhưng chưa được hõ trợ \nKH báo sự cố tấm pin NLMT bị vỡ chưa thay,phần dây dẫn mái tôn lắp đặt chưa đảm bảo\nYêu cầu CN cho KT qua ktra cho KH","KH phản ánh hiện đang chưa có KT liên hệ hỗ trợ lắp đặt NLMT cho KH \nYêu cầu quản lý điều kĩ thuật liên hệ và hỗ trợ KH","KH phản ánh bình acquy bảo hành đã về kho Viettel, nhờ KT Viettel chuyển xuống lắp lại cho KH","KH chưa báo CN \nKH phản ánh điều hòa mua và lắp của VCC lắp sai ống đồng ngắn hơn, thường thì là 3m nhưng của VCC chỉ có hơn 1m , hiện tại không mát\nYêu cầu CN cho KT qua Ktra cho KH","1. KH đã báo CN\n2. KH phản ánh: mất kết nối app theo dõi nlmt, ko coi được số điện cả tuần nay\n3. KH yêu cầu: Qua kiểm tra, hỗ trợ KH","Thiết bị điều hòa Daikin KH mua từ Tháng 10 năm 2024 đang gặp sự cố không mát\n\nKH cần Chi nhánh đến kiểm tra và khắc phục cho KH sớm","1. KH đã báo CN: A Phụng\n2. KH phản ánh: có hủy HĐ và yêu cầu hoàn cọc đã có trao đổi với CN và đồng ý hoàn cọc, KH chưa ký BB thanh lý\n3. KH yêu cầu: hoàn lại số tiền cọc","CN 0364023755 báo sự cố hộ KH \n1. KH phản ánh: ats mất tín hiệu, đèn ko sáng. Khi cúp điện lưới ko chuyển luôn sang pin lưu trữ\n2. KH yêu cầu: KT xuống xử lý hỗ trợ trong tối nay","1. KH chưa liên hệ CN\n\n2.KH p/á HT NLMT có 3 Ăc quy lưu trữ, CN đã hỗ trợ chuyển 1 thiết bị của KH đi bảo hành khoảng 3-4 tháng nay chưa có phản hồi cho KH\n - HT NLMT khi gặp sự cố mất điện Ăc quy không xả điện để sử dụng \n3. KH cần CN liên hệ và đến kiểm tra khắc phục cho KH","1. KH đã liên hệ CN\n\n2. Khi mất điện lưới hệ thống NLMT của KH không nhảy ATS, Biến tần Inverter hiện rất nóng\n\n3. KH cần CN đến kiêm tra cho KH sớm","1. KH chưa liên hệ CN\n\n2. KH phản ánh HT NLMT của KH đang thiếu dây tiếp địa, KH lo ngại mùa mưa bão HT có thể gặp sự cố\n\n3. KH cần CN đến kiểm tra và khắc phục sớm cho KH","1. KH đã báo CN \n2. KH phản ánh: sự cố từ TT_1781232472134 trước xử lý xác định lỗi mất Wifi đến inverter, trung tâm hẹn KH qua hỗ trợ cài đặt lại nhưng hiện tại KH vẫn chưa nhận được thông tin gì.\n3. KH yêu cầu: Qua kiểm tra lại, phản hồi lại thông tin cho KH","1. KH đã báo CN\n2. KH phản ánh: hôm qua KH kiểm tra thì thấy cháy tủ nguồn ats và thấy đang ko có điện nlmt\n3. KH yêu cầu: Hỗ trợ KH thay thế ats trong ngày hôm nay","1. KH đã báo CN\n2. KH phản ánh: sự cố từ trước hiệu suất kém giờ KH thấy là pin lưu trữ hay bị lỗi, nút đỏ thường xuyên nháy và ko hoạt động. \n3. KH yêu cầu: KT qua kiểm tra, xử lý dứt điểm tình trạng này","KH đã báo CN \nKh phản ánh hệ thống NLMT tự đẩy điện ra lưới ngoài khoảng 1 tháng nay\nYêu cầu kĩ thuật liên hệ và xuống KT cho KH","1. KH đã liên hệ CN\n\n2. Thiết bị điều hòa của KH đang bị rò nước \n\n3. KH cần chi nhánh qua kiểm tra thiết bị và khắc phục tình trạng này","KH chưa báo CN\nKH phản ánh 8 ngày nay NLMT k dùng được, k theo dõi được cả trên điện thoại và hệ thống, Kh giờ chỉ dùng dc điện lưới, KH đã báo cho anh Quý phụ trách lắp nhưng không phản hồi\nYêu cầu KT liên hệ và xuống kiểm tra cho KH","1. KH đã báo Cn\n2. KH phản ánh: CN có tháo thiết bị mang đi bảo hành sửa chữa mà giờ ko thấy có thông tin lại \n3. KH yêu cầu: Phản hồi lại thông tin tình trạng thiết bị, sửa xong thì mang trả lại cho KH","1. KH đã báo CN\n2. KH phản ánh: điện nlmt ko vào, KH lắp 3 pha nhưng chỉ có vào 1 pha\n3. KH yêu cầu: qua kiểm tra, xử lý tình trạng này","1. KH đã báo CN\n2. KH phản ánh: dây lắp đặt từ sự cố trước bé khiến hiệu suất bây giờ KH ko đạt trước đây 1 ngày ra được 70kw điện nhưng giờ 1 ngày ko được kí nào.\n3. KH yêu cầu: Qua kiểm tra, xử lý tình trạng này","KH phản ánh app chỉ số điện tiêu thụ hiển thị không đúng ( điện lực báo 40 số trong khi app báo 31 số ), KH thấy bất hợp lý nên cần kĩ thuật xuống kiểm tra cho KH","1. KH đã liên hệ CN\n\n2. HT NLMT gặp sự cố biến tần mã 70 trên APP, kết nối dây cáp quá tải khoảng 1 tuần nay\n\n3. KH cần chi nhánh đến kiểm tra và khắc phục sớm","1. KH chưa liên hệ CN \n\n2. Biến tần của KH gặp sự cố không có điện khoảng 3-4 ngày, App theo dõi hiệu suất báo ngoại tuyến\n\n3. KH cần CN liên hệ và đến kiểm tra gấp","1. CN báo sự cố cho KH\n\n2. HT NLMT của KH bị nhảy ATS liên tục, buổi tối bị mất điện\n\n3. KH cần CN đến kiểm tra và khắc phục sớm cho KH","KH chưa báo CN \nKH phản ánh Hiệu suất sản phẩm kém, lắp NLMT nhưng tiền điện vấn tăng rất nhiều \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","KH đã báo KT\nKH phản ánh về việc hệ thống NLMT đã lắp pin cho KH rồi nhưng chưa được đấu điện\nYêu cầu CN cho KT qua hỗ trợ KH","1.Thiết bị Inverter của KH đang không hiển thị thông tin, các thông số trên App nhảy về 0\n\n2.CN báo lỗi giúp KH và thông tin sẽ hỗ trợ khắc phục sớm\n\n3. KH cần CN khắc phục gấp do gặp sự cố với thiết bị nhiều lần","1. KH đã liên hệ CN và được hỗ trợ đến kiểm tra nhưng chưa khắc phục được\n\n2 Thiết bị Inverter của KH đang không sản xuất điện, trên App chỉ có thông tin điện lưới, không thông tin điện NLMT khoảng 1 tuần\n\n3. KH cần chi nhánh hỗ trợ nhân sự có chuyên môn đến kiểm tra và khắc phục cho KH","KH đã báo CN \nKH phản ánh: Gia đình tôi lắp hệ thống ngày 12/5\nSử dụng ok,đến ngày 04/6 pin dự phòng không lưu trữ được \nSau đấy 2 ngày bên công ty cho người đến mang đi bảo hành\nĐến ngày hôm nay 19/6 vẫn chưa thấy mang về\nNhư vậy theo đúng hợp đồng,phía công ty sẽ phải đổi cho tôi pin mới\nYêu cầu CN liên hệ lại cho KH và cho KT xuống hỗ trợ KH","1. KH chưa báo CN\n2. KH phản ánh: Sự cố trước CN đã có cập nhật pin lưu trữ nhưng KH vẫn ko thấy đến cập nhật, công suất thì gần đây KH cũng ko thấy có.\n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","KH đã báo CN \nKH phản ánh tiến độ triển khai chậm, chưa có ai đến lắp cho KH \nYêu cầu quản lí điều kĩ thuật liên hệ trước cho KH và xuống lắp cho KH","KH chưa báo CN \nKH phản ánh KH có 2 ivt thì 1 cái không sáng đèn không hoạt động, không chạy được năng suất điện \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","1. KH đã báo CN\n2. KH phản ánh: Từ các sự cố trước về ivt hoạt động ko ổn định. CN chỉ thấy điều khiển từ xa ko thấy đến kiểm tra trực tiếp, và ko thấy xử lý. KH thấy là khi tăng tải lên vẫn lưới điện lưới buộc KH phải tắt tải. KH có liên hệ người phụ trách lắp đặt trước thì ko thấy nghe máy, KH rất ko hài lòng và bức xúc. \n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","KH chưa báo CN \nKH phản ánh Hệ thống NLMT phải có điện lưới mới hoạt động, không có điện lưới là không dùng được mặc dù pin đầy \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","1. KH chưa báo CN\n2. KH phản ánh: Hiệu suất NLMT kém so với trước đây. 1 ngày trước đây ra 70kw điện mà giờ 1 ngày chỉ còn 30kw điện hiệu suất giảm hơn 1 nửa.\n3. KH yêu cầu: Qua kiểm tra, xử lý tình trạng này","KH đã báo CN \nKH phản ánh inveter bán tải 3kw bị lỗi về hệ thống, hiệu quả sản phẩm thấp\nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","1. Pin lưu trữ NLMT của KH chỉ hiển thị ở mức 43% dù trời nắng to khoảng 2 ngày nay, CN đã hẹn KH ngày 15/06 sẽ đến kiểm tra\n\n2. KH cần CN đến kiểm tra và giải đáp cho KH","1. KH ký hợp đồng NLMT trả góp 3 bên, đã hoàn thiện việc thanh toán cho bên thứ 3 tuy nhiên đến nay chưa nhận được hợp đồng từ chi nhánh\n\n2. KH phản ánh thiết bị Inverter bị đen màn hình, HT NLMT vẫn sử dụng tốt, nhân sự của CN đến kiểm tra và thông tin cần chuyển thiết bị đi bảo hành và thời gian khoảng 30 ngày\n\n3. KH không đồng ý chuyển thiết bị đi bảo hành do chưa có văn bản tháo gỡ, nhân viên đến kiểm tra chưa cung cấp lý do hỏng hóc thiết bị của KH, cần CN liên hệ và giải đáp cũng như chuyển hợp đồng cho KH","KH chưa báo CN,KT\nKh báo sự cố NLMT không sản xuất ra điện hơn 3 tuần nay, tiền điện thì bị tăng \nYêu cầu CN cho KT qua kiểm tra cho KH","1. KH đã báo CN: A Huy - trước lắp đặt NLMT\n2. KH phản ánh: Hiệu suất kém hệ 6kw nhưng thời điểm cao điểm nắng nhất cũng chỉ đạt được 3kw. KH theo dõi trên app hiệu suất cũng ko thấy hoạt động.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã liên hệ CN\n\n2. KH phản ánh tiền điện cần đóng đang tăng khoảng 3 tháng trở lại đây (Từ khoảng 5-6tr đến hơn 9tr)\n\n3. KH cần CN liên hệ và đến hỗ trợ kiểm tra sớm cho KH","1. KH chưa báo CN\n2. KH phản ánh: đồng hồ chính điện lưới vẫn có nhưng trong nhà ko có cả điện lưới lẫn điện nlmt. KH đã báo bên điện lực kiểm tra và điện lực báo do lỗi điện nlmt\n3. KH yêu cầu: KT xuống kiểm tra, xử lý tình trạng này\n***SĐT phản ánh: 0822993939","1. KH đã báo CN: A Quốc Đại\n2. KH phản ánh: tủ điện có mùi khét, cả nhà mất điện\n3. KH yêu cầu: Qua hỗ trợ, xử lý tình trạng này","KH chưa báo CN, KT ( KH lắp từ 2021)\nKH báo sự cố nlmt sài được gần 2 năm, hỏng 2 năm nay không ai xuống sửa KT có xuống kiểm tra nói có gắn 1 cục gì đấy (KH không biết) là sẽ dùng được,  nhưng giờ đã nửa tháng vẫn chưa có ai xuống gắn, KH gay gắt \nYêu cầu CN liên hệ cho KT xuống kiểm tra cho KH","1. KH đã báo CN\n2. KH phản ánh: pin lưu trữ không hoạt động\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này nếu có gì thay thế thì thay thế luôn","1. KH chưa báo CN\n2. KH phản ánh: Hệ KH hơn 7kw KH vẫn thấy hệ hoạt động bình thường tầm trưa trưa là pin lưu trữ đầy mà gần đây thấy tiền điện tăng bất thường. Hồi đầu sử dụng sản phẩm tiền điện là 200k/ 1 tháng đến gần đây t4 là 708k và t5 này là 1tr1 tiền điện. \n3. KH yêu cầu: KT xuống kiểm tra xem và khắc phục tình trạng này","KH chưa báo KT,CN \nKH báo sự cố NLMT tiền điện tăng, nhà KH dùng 2 công tơ, thì 1 công tơ có NLMT bị tăng tiền điện, 1 công tơ không dùng điện NLMT thì không bị tăng\nYêu cầu CN liên hệ và cho KT xuống hỗ trợ KH","KH đã báo CN\nNLMT đang tạm ngắt hệ thống, khi bật hệ NLMT lên máy móc trong nhà máy hoạt động rất yếu. KT đến xử lí không triệt để \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra và xử lý gấp","KH phản ánh không theo dõi được hiệu suất nlmt qua App\n\nKH yêu cầu: KT lại giúp cho khách","Đã báo CN: Đã báo\nKH báo sự cố: Hiện tại 1 tấm pin nhà KH có hiện tượng bị không sử dụng được \nKH yêu cầu: KT qua kiểm tra cho Kh","1. KH đã liên hệ CN\n2. KH phản ánh\n- Sau khi hoàn thiện lắp đặt HT NLMT, KH được thông tin cần thanh toán 1 số khoản vật tư phát sinh cụ thể là 30m dây điện trong khi hợp đồng là thi công trọn gói\n- Cục pin lưu trữ ko hoạt động\n3. KH cần CN liên hệ và giải đáp cho KH","1. KH chưa liên hệ CN\n\n2. KH đang gặp sự cố đóng điện để sử dụng điện NLMT thì bị nhảy áp , phải sử dụng điện lưới khoảng 3 ngày nay\n\n3. KH cần CN liên hệ và hỗ trợ sớm","1. KH đã báo CN: A Trứ, A Thịnh\n2. KH phản ánh: HĐ của KH 10 máy lạnh. Sự cố từ trước KT qua kiểm tra giờ KH thấy là bị đấu nối dậy bị lỗi mất 3 cái máy lạnh, nhà KH là điện 3 pha nhưng lại chỉ đấu 1 pha. KH có liên hệ CN nhưng chưa thấy qua hỗ trợ.\n3. KH yêu cầu: Qua kiểm tra lại việc lắp đặt và lắp đặt lại","KH đã báo CN\nKH phản ánh: Nắng to KH theo dõi trên app thì thấy dùng 100% điện lưới, ko thấy dùng nlmt cũng ko thấy có xả ra.\nKH yêu cầu: Qua kiểm tra, khắc phục tình trạng này cho KH","KH chưa báo chi nhánh\nĐiện đồng hồ tăng bất thường trong 2 tháng \nYêu cầu chi nhánh điều kĩ thuật đến kiểm tra","CN 0968088033 báo sự cố hộ KH \n1. KH phản ánh: Bị bể 3 tấm pin. CN có qua kiểm tra tấm pin thì cũng thấy có vết từ trên trời rơi xuống, nhưng cũng chưa thể xác nhận chính xác được, KH cũng đang ko chấp nhận là do tác động vật lý. \n2. KH yêu cầu: Phản hồi lại thông tin cho KH và thay mới 3 tấm pin.","chi nhánh báo hộ 0382691111\nBiến tần hoạt động không ổn định\nKh cần ktra trong ngày hôm nay hoặc ngày mai\nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ cho CN\n\n2. Hiệu Suất NLMT của KH bị giảm khoảng 15%, trước đây ngày nắng tốt phát sinh được 30kw/h hiện tại phát sinh được 25kw/h, CN kiểm tra và thông tin do Inverter bị nóng nên giảm hiệu suất\n\n3. KH cần CN hỗ trợ và khắc phục giúp HT NLMT của KH hoạt động bình thường","1. KH đã liên hệ CN\n\n2. KH thay điện thoại nên chưa theo dõi được hiệu suất trên App, từ tin nhắn của điện lực thông tin sản lượng điện từ HT NLMT đang giảm nhiều khoảng 2 tháng gần dây\n\n3. KH cần CN liên hệ và đến kiểm tra cho KH","1. KH đã báo CN: Các sự cố từ trước và cũng đã có văn bản của CN gửi KH\n2. KH phản ánh: Về sự cố tấm pin bị vỡ do ngoại lực KH đang nghi ngờ tấm pin đang ko phải của chính hãng, KH có kiểm tra số serial tấm pin trên phần mềm AE Solar thì thấy báo ko có thông tin trên cty của hãng. Trước đó CN đến kiểm tra nhiều lần nhưng đến khi KH hỏi ngoại lực gì thì CN ko thấy nói. \n3. KH yêu cầu: Làm rõ thông tin, giải thích với KH về tấm pin. Nếu ko KH sẽ kéo pháp lý, đăng tin mxh, phá hoại cty, cảnh báo mọi người và dự kiến KH sẽ khởi kiện vào t6.","Chưa báo chi nhánh \nInverter bị lỗi wifi không bắt được \nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Chẩu Văn Nghĩa\n2. KH phản ánh: pin lưu trữ đang bị gặp lỗi trước đó có ivt có mang đi bảo hành rồi mà có báo CN nhưng chưa thấy tháo dỡ nốt pin lưu trữ đi bảo hành.\n3. KH yêu cầu: Kiểm tra pin lưu trữ và mang thiết bị đi bảo hành","Đã báo chi nhánh \nKhách hàng đang thấy hệ thống NLMT đang không hoạt động\nyêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Ko thấy có điện nlmt nạp vào, và thấy gián đoạn từ 12h trưa - 3h chiều, 1 ngày chỉ khoảng 30kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","KH đã báo KT chưa báo CN \nKH báo giao thiếu 1 tấm pin NLMT của KH mà hơn 1 tháng nay chưa thấy giao nốt cho KH \nYêu cầu CN liên hệ KH gấp","KH phản ánh 2 tấm Pin bị nứt, vỡ, võng. Yêu cầu kiểm tra, thay thế theo bảo hành","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng","1. KH đã báo CN \n2. KH phản ánh sự cố pin NLMT bị nổ KT đã xuống tháo nhưng KT chưa đem về kiểm tra và sửa cho KH, nay KH gọi lên yêu cầu KT có xuống đem về sửa cho KH không thì nói KH để còn biết KH lắp bên đơn vị khác\n3. Yêu cầu CN liên hệ và cho KT  xuống Ktra gấp cho KH, KH đang rất gay gắt","KHDN ký 1 Hợp đồng nhưng có 2 địa chỉ lắp đặt và cả 2 đang gặp sự cố. \n1. KH đã báo chi nhánh\n2. KH phản ánh: \n+ Tại Xã Lương Sơn, Tỉnh Phú Thọ: KH báo bị lỗi biến tần\n+ Tại Xã Hợp Thịnh, Tỉnh Bắc Ninh: KH báo tủ biến tần bị nổ cháy\n3. KH yêu cầu: KT trong tuần này liên hệ hỗ trợ","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra","1. KH đã liên hệ với CN, CN đã hỗ trợ tháo tấm pin lỗi\n2.KH nghe tiếng như có tiếng nổ, lên kiểm tra thấy tấm pin rạn vỡ, cần kiểm tra bảo hành\n3.KH cần CN hỗ trợ thông tin sớm","KH (work@namdd.dev) gửi mail phản ánh các vấn đề: \n1.\tTiền dây dẫn thừa: Đề nghị Viettel Phú Thọ thực hiện việc bồi hoàn lại tiền cho phần dây điện thừa do thi công sai lệch ban đầu.\n2.\tTiêu chuẩn vật tư tủ điện (Dựa trên buổi làm việc ngày 11/04/2026): Hai bên đã thống nhất ghi nhận hiện trạng là chưa xác định được vật tư bên trong tủ điện có đảm bảo đúng danh sách thiết bị và tiêu chuẩn kỹ thuật của công ty hay không. Tôi yêu cầu phía Tập đoàn và VCC cung cấp chi tiết danh sách vật tư và tiêu chuẩn kỹ thuật để gia đình có cơ sở so s var COL_WIDTHS = {"Mã tỉnh":100,"Lĩnh vực":100,"Ngành hàng":100,"Sản phẩm":150,"Mã HĐ":100,"Tên khách hàng":120,"SĐT":100,"Địa chỉ":250,"Giai đoạn":100,"Nhóm sự cố":100,"Loại sự cố":100,"Chi tiết":300,"Ngày bắt đầu":100,"Ngày kết thúc":100,"Trạng thái":100,"Tên nhân viên":100,"Mã nhân viên":100,"Hệ thống":100,"Đơn vị điều hành":100,"AM chuyên quản":100};
var CT_GROUP   = 'bang_chitiet_group';
var AM_MAP     = {"P.KDNLMT":["P.KDNLMT"],"P.Triển khai":["N1 - Truongdv17, Congnd15","N2 - Tienvt16, Anhnt631","N3 - Thikd, Ducnt84"],"VHKT":["VHKT"]};

<script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>

<script id="quarto-html-after-body" type="application/javascript">
window.document.addEventListener("DOMContentLoaded", function (event) {
  const toggleBodyColorMode = (bsSheetEl) => {
    const mode = bsSheetEl.getAttribute("data-mode");
    const bodyEl = window.document.querySelector("body");
    if (mode === "dark") {
      bodyEl.classList.add("quarto-dark");
      bodyEl.classList.remove("quarto-light");
    } else {
      bodyEl.classList.add("quarto-light");
      bodyEl.classList.remove("quarto-dark");
    }
  }
  const toggleBodyColorPrimary = () => {
    const bsSheetEl = window.document.querySelector("link#quarto-bootstrap");
    if (bsSheetEl) {
      toggleBodyColorMode(bsSheetEl);
    }
  }
  toggleBodyColorPrimary();  
  const icon = "";
  const anchorJS = new window.AnchorJS();
  anchorJS.options = {
    placement: 'right',
    icon: icon
  };
  anchorJS.add('.anchored');
  const isCodeAnnotation = (el) => {
    for (const clz of el.classList) {
      if (clz.startsWith('code-annotation-')) {                     
        return true;
      }
    }
    return false;
  }
  const onCopySuccess = function(e) {
    // button target
    const button = e.trigger;
    // don't keep focus
    button.blur();
    // flash "checked"
    button.classList.add('code-copy-button-checked');
    var currentTitle = button.getAttribute("title");
    button.setAttribute("title", "Copied!");
    let tooltip;
    if (window.bootstrap) {
      button.setAttribute("data-bs-toggle", "tooltip");
      button.setAttribute("data-bs-placement", "left");
      button.setAttribute("data-bs-title", "Copied!");
      tooltip = new bootstrap.Tooltip(button, 
        { trigger: "manual", 
          customClass: "code-copy-button-tooltip",
          offset: [0, -8]});
      tooltip.show();    
    }
    setTimeout(function() {
      if (tooltip) {
        tooltip.hide();
        button.removeAttribute("data-bs-title");
        button.removeAttribute("data-bs-toggle");
        button.removeAttribute("data-bs-placement");
      }
      button.setAttribute("title", currentTitle);
      button.classList.remove('code-copy-button-checked');
    }, 1000);
    // clear code selection
