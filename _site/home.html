ttel.\n2. KH yêu cầu: Quản lý KT liên hệ trao đổi, giải thích, đưa ra phương án xử lý TH này","1. KH chưa báo CN\n2. KH phản ánh và yêu cầu: mới thay đổi đt và thay sim cần hỗ trợ kết nối app để theo dõi camera, yêu cầu hỗ trợ sớm trong 1h chiều nay hoặc hỗ trợ từ xa 8h tối nay vì ngay mai KH đi công tác","KH chưa báo CN \nKH phản ánh Tất cả phòng đều có mạng LAN nhưng phòng phó chủ tịch k có, có dây mạng nhưng không vào được mạng máy tính\nYêu cầu CN liên hệ và hỗ trợ KH","1. KH đã báo CN: A Lâm\n2. KH phản ánh: pin lưu trữ ko thấy sạc vào, công suất đo nlmt sai so với điện lực gấp 3,4 lần\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","KH đã báo với bên giám sát và tư vấn, \nKh phản ánh pin không giao tiếp BMS với biến tần khiến 2 cục pin không đều nhau, pin báo lỗi bị xả hết, bị gần tháng nay.\nYêu cầu quản lý điều kĩ thuật liên hệ và hỗ trợ KH","1. KH chưa liên hệ CN\n2. Trước đó tiền điện tháng 5 của KH cần đóng là 2tr6, hiện tại tiền điện tháng 6 cần đóng là 5tr1 trong khi trên App hiển thị HT NLMT vẫn hoạt động\n3.KH cần CN đến kiểm tra và","1. KH chưa báo CN\n2. KH phản ánh: điện nlmt ko vào, ko thấy xả ra KH toàn phải dùng điện lưới. Trước lúc chưa lắp nlmt thì các bóng đèn khi tắt thì bình thường nhưng giờ tắt thì vẫn thấy mờ mờ đèn, KH đang nghi về đấu nối dây điện\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN: nhân sự trước lắp đặt nlmt\n2. KH phản ánh: 3 tấm pin nlmt bị nứt \n3. KH yêu cầu: qua kiểm tra, đưa ra phương án xử lý và xử lý tình trạng này","1. KH đã báo CN: A Trung\n2. KH phản ánh: điện nlmt ko thấy xả ra để sử dụng, trước cũng gặp sự cố này mà KH thấy CN tác động gì trên hệ thống thì được nhưng giờ lại gặp tình trạng này\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này và giải thích cho KH lỗi phần nào","1. KH chưa báo CN\n2. KH phản ánh: hệ thống nlmt khi đóng điện lưới bị te điện KH có báo bên điện lực kiểm tra thì thấy nlmt đường dây mát bị mất\n3. KH yêu cầu: Qua kiểm tra, xử lý tình trạng này","1. KH đã báo CN từ sự cố trước TT_1783128706076 phát sinh thêm sự cố mới\n2. KH phản ánh: tự ngắt điện giữa chừng, không chuyển sang điện lưới để sử dụng tình trạng này trước đây cũng từng bị rồi, CN cũng hướng dẫn bật áp tổng ở ngoài cột thì dùng được\n3. KH yêu cầu: Qua kiểm tra đưa ra phương án xử lý tình trạng này","KH chưa báo CN \nKH phản ánh thang máy vừa mới bị dừng đột ngột 1 lần , không bảo hành bảo dưỡng định kỳ\nYêu cầu CN liên hệ và hỗ trợ KH","1. KH chưa liên hệ CN\n2. Hiện KH không theo dõi được thông tin HT NLMT qua App\n3. KH cần CN đến hỗ trợ khắc phục sớm","KH đã báo KT nhiều lần nhưng chưa được hỗ trợ \nKH cần hỗ trợ đi lại đường dây trên tấm pin, dây rút bằng nhựa đã bị đứt hết, KH liên hệ KT thì hẹn lên hẹn xuống \nYêu cầu CN cho KT qua ktra hỗ trợ KH","KH đã báo CN \nKH báo sự cố điều hòa bật được 1 lúc tự tắt, đã báo hãng nhưng chưa xử lý được \nYêu cầu CN cho KT qua ktra hỗ trợ KH","KH đã báo CN \nKH báo sự cố thang máy đổ hở của cửa hở tới 3,5cm, cn báo là chờ để kiểm định\nYêu cầu Cn cho KT qua ktra hỗ trợ KH","KH đã báo CN\nKH báo sự cố về thang máy, chuông báo ở thang máy hiện tại không kêu không hoạt động\nYêu cầu CN cho KT qua ktra cho KH","KH đã báo Anh Hùng CN 0981305885 \nKh báo sự cố hệ thống NLMT tiền điện tăng, ktra trên app không kết nối với điện lưới\nYêu cầu CN cho KT qua ktra cho KH","1. CN đã đến hỗ trợ chuyển Inverter của KH đi bảo hành thay màn hình\n2. Thiết bị biến tần của KH gặp sự cố không thao tác được trên màn hình\n3. KH cần hỗ trợ bảo hành và chuyển trả thiết bị sớm","1. KH đã liên hệ CN\n2. Hiện nhà KH đang không sử dụng được điện lưới và điện NLMT, ngày hôm nay đã mất điện 2 lần\n3. KH cần CN đến kiểm tra và khắc phục gấp","1.KH đã liên hệ nhân sự CN\n2. Biến tần của KH đang không nhận 1 String, KH kiểm tra thấy CB đang gạt xuống và không gạt lên được, hiện công suất HT không đủ sử dụng\n3. KH cần CN đến kiểm tra và khắc phục sớm","ft3 lắp đặt sai quy cách tấm pin","KH chưa báo CN \nKH báo sự cố Điều hòa hiện đa H_1702271 (CSKH check hệ thống không thấy thông tin)\n- Nội dung phản ánh: \n•\tNgày 04/06/2026, KH ký hợp đồng triển khai trọn gói hệ thống điện mặt trời áp mái công suất 7.44 kWp với tổng giá trị 112.000.000 VNĐ. Công trình chính thức được khởi công vào ngày 18/06/2026. KH đã bàn giao mặt bằng và tạm ứng tiền với số tiền 64.000.000 đồng thanh toán lần 1 vào 12:07 ngày 24/6/2026 bằng chuyển khoản từ ngân hàng TP Bank cho Ngô Văn Đạt số tài khoản 9704 22...6145 Căn cước công dân số 027092009851 với số tiền 19.000.000 đồng .\n•\tTrong quá trình khởi công và tập kết vật tư có phát sinh 1 số vấn đề: \n(1)\tGiao sai chủng loại Tấm pin năng lượng mặt trời: KH mua tấm pin Longi 620W Himo7 LR8-66HGD-620M nhưng giao tấm pin công suất 535M\n(2)\tChậm giao và chưa lắp đặt Bộ pin lưu trữ điện\n-Khách hàng yêu cầu: \n•\tKhắc phục thiết bị: Buộc Chi nhánh Bắc Ninh lập tức tháo dỡ toàn bộ các tấm pin lắp sai quy cách, vận chuyển và lắp đặt lại đúng 12 bộ tấm pin Longi 620W Himo7 LR8-66HGD-620M mới 100%\n•\tLắp đặt bổ sung: Khẩn trương cấp phát, bàn giao và hoàn thiện lắp đặt bộ pin lưu trữ Lithium-ion W16-5A theo đúng hợp đồng.\n•\tPhạt vi phạm chậm giao thiết bị:\n+ Tính từ ngày khởi công kiêm ngày tập kết thiết bị sai/thiếu (18/06/2026) đến hôm nay (03/07/2026) là tròn 15 ngày chậm trễ.\n+ Áp dụng mức phạt 0,1%/ngày trên giá trị hàng hóa vi phạm (112.000.000VNĐ \\15 ngày) 0,1% = 112.000 VNĐ/ngày).\n+ Tổng số tiền phạt tính đến ngày 03/07/2026 là: 15 ngày x 112.000 VNĐ =1.680.000 VNĐ. Số tiền này phải được khấu trừ trực tiếp vào đợt thanh toán Lần 3 của tôi\n•\tPhản hồi lại thông tin trong vòng 3 ngày.","1. KH đã báo CN: Phản ánh từ TT_1782706819949 trước CN hẹn là hôm nay phản hồi nhưng KH chưa thấy thông tin gì\n2. KH phản ánh: Tấm pin và biến tần đã được lắp đặt, đưa vào sử dụng từ ngày 21/6, nhưng đến nay vẫn chưa lắp pin lưu trữ. Trong khi nhu cầu sử dụng điện của nhà KH chủ yếu vào ban đêm, việc chậm lắp pin lưu trữ gây thiệt hại về chi phí điện. \n3. KH yêu cầu: Trong ngà ào.\n3. KH yêu cầu: Qua kiểm tra, xử lý tình trạng này","KH phản ánh app chỉ số điện tiêu thụ hiển thị không đúng ( điện lực báo 40 số trong khi app báo 31 số ), KH thấy bất hợp lý nên cần kĩ thuật xuống kiểm tra cho KH","KH chưa báo CN \nKH phản ánh Hiệu suất sản phẩm kém, lắp NLMT nhưng tiền điện vấn tăng rất nhiều \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","KH đã báo KT\nKH phản ánh về việc hệ thống NLMT đã lắp pin cho KH rồi nhưng chưa được đấu điện\nYêu cầu CN cho KT qua hỗ trợ KH","KH đã báo CN \nKH phản ánh: Gia đình tôi lắp hệ thống ngày 12/5\nSử dụng ok,đến ngày 04/6 pin dự phòng không lưu trữ được \nSau đấy 2 ngày bên công ty cho người đến mang đi bảo hành\nĐến ngày hôm nay 19/6 vẫn chưa thấy mang về\nNhư vậy theo đúng hợp đồng,phía công ty sẽ phải đổi cho tôi pin mới\nYêu cầu CN liên hệ lại cho KH và cho KT xuống hỗ trợ KH","1. KH chưa báo CN\n2. KH phản ánh: Sự cố trước CN đã có cập nhật pin lưu trữ nhưng KH vẫn ko thấy đến cập nhật, công suất thì gần đây KH cũng ko thấy có.\n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","KH chưa báo CN \nKH phản ánh KH có 2 ivt thì 1 cái không sáng đèn không hoạt động, không chạy được năng suất điện \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","1. KH đã báo CN\n2. KH phản ánh: Từ các sự cố trước về ivt hoạt động ko ổn định. CN chỉ thấy điều khiển từ xa ko thấy đến kiểm tra trực tiếp, và ko thấy xử lý. KH thấy là khi tăng tải lên vẫn lưới điện lưới buộc KH phải tắt tải. KH có liên hệ người phụ trách lắp đặt trước thì ko thấy nghe máy, KH rất ko hài lòng và bức xúc. \n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","KH đã báo CN \nKH phản ánh inveter bán tải 3kw bị lỗi về hệ thống, hiệu quả sản phẩm thấp\nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","1. Pin lưu trữ NLMT của KH chỉ hiển thị ở mức 43% dù trời nắng to khoảng 2 ngày nay, CN đã hẹn KH ngày 15/06 sẽ đến kiểm tra\n\n2. KH cần CN đến kiểm tra và giải đáp cho KH","1. KH ký hợp đồng NLMT trả góp 3 bên, đã hoàn thiện việc thanh toán cho bên thứ 3 tuy nhiên đến nay chưa nhận được hợp đồng từ chi nhánh\n\n2. KH phản ánh thiết bị Inverter bị đen màn hình, HT NLMT vẫn sử dụng tốt, nhân sự của CN đến kiểm tra và thông tin cần chuyển thiết bị đi bảo hành và thời gian khoảng 30 ngày\n\n3. KH không đồng ý chuyển thiết bị đi bảo hành do chưa có văn bản tháo gỡ, nhân viên đến kiểm tra chưa cung cấp lý do hỏng hóc thiết bị của KH, cần CN liên hệ và giải đáp cũng như chuyển hợp đồng cho KH","1. KH đã báo CN: A Huy - trước lắp đặt NLMT\n2. KH phản ánh: Hiệu suất kém hệ 6kw nhưng thời điểm cao điểm nắng nhất cũng chỉ đạt được 3kw. KH theo dõi trên app hiệu suất cũng ko thấy hoạt động.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã liên hệ CN\n\n2. KH phản ánh tiền điện cần đóng đang tăng khoảng 3 tháng trở lại đây (Từ khoảng 5-6tr đến hơn 9tr)\n\n3. KH cần CN liên hệ và đến hỗ trợ kiểm tra sớm cho KH","1. KH đã báo CN: A Quốc Đại\n2. KH phản ánh: tủ điện có mùi khét, cả nhà mất điện\n3. KH yêu cầu: Qua hỗ trợ, xử lý tình trạng này","KH chưa báo CN, KT ( KH lắp từ 2021)\nKH báo sự cố nlmt sài được gần 2 năm, hỏng 2 năm nay không ai xuống sửa KT có xuống kiểm tra nói có gắn 1 cục gì đấy (KH không biết) là sẽ dùng được,  nhưng giờ đã nửa tháng vẫn chưa có ai xuống gắn, KH gay gắt \nYêu cầu CN liên hệ cho KT xuống kiểm tra cho KH","1. KH chưa báo CN\n2. KH phản ánh: Hệ KH hơn 7kw KH vẫn thấy hệ hoạt động bình thường tầm trưa trưa là pin lưu trữ đầy mà gần đây thấy tiền điện tăng bất thường. Hồi đầu sử dụng sản phẩm tiền điện là 200k/ 1 tháng đến gần đây t4 là 708k và t5 này là 1tr1 tiền điện. \n3. KH yêu cầu: KT xuống kiểm tra xem và khắc phục tình trạng này","KH chưa báo KT,CN \nKH báo sự cố NLMT tiền điện tăng, nhà KH dùng 2 công tơ, thì 1 công tơ có NLMT bị tăng tiền điện, 1 công tơ không dùng điện NLMT thì không bị tăng\nYêu cầu CN liên hệ và cho KT xuống hỗ trợ KH","KH phản ánh không theo dõi được hiệu suất nlmt qua App\n\nKH yêu cầu: KT lại giúp cho khách","Đã báo CN: Đã báo\nKH báo sự cố: Hiện tại 1 tấm pin nhà KH có hiện tượng bị không sử dụng được \nKH yêu cầu: KT qua kiểm tra cho Kh","1. KH đã liên hệ CN\n2. KH phản ánh\n- Sau khi hoàn thiện lắp đặt HT NLMT, KH được thông tin cần thanh toán 1 số khoản vật tư phát sinh cụ thể là 30m dây điện trong khi hợp đồng là thi công trọn gói\n- Cục pin lưu trữ ko hoạt động\n3. KH cần CN liên hệ và giải đáp cho KH","KH đã báo CN\nKH phản ánh: Nắng to KH theo dõi trên app thì thấy dùng 100% điện lưới, ko thấy dùng nlmt cũng ko thấy có xả ra.\nKH yêu cầu: Qua kiểm tra, khắc phục tình trạng này cho KH","CN 0968088033 báo sự cố hộ KH \n1. KH phản ánh: Bị bể 3 tấm pin. CN có qua kiểm tra tấm pin thì cũng thấy có vết từ trên trời rơi xuống, nhưng cũng chưa thể xác nhận chính xác được, KH cũng đang ko chấp nhận là do tác động vật lý. \n2. KH yêu cầu: Phản hồi lại thông tin cho KH và thay mới 3 tấm pin.","chi nhánh báo hộ 0382691111\nBiến tần hoạt động không ổn định\nKh cần ktra trong ngày hôm nay hoặc ngày mai\nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ cho CN\n\n2. Hiệu Suất NLMT của KH bị giảm khoảng 15%, trước đây ngày nắng tốt phát sinh được 30kw/h hiện tại phát sinh được 25kw/h, CN kiểm tra và thông tin do Inverter bị nóng nên giảm hiệu suất\n\n3. KH cần CN hỗ trợ và khắc phục giúp HT NLMT của KH hoạt động bình thường","1. KH đã liên hệ CN\n\n2. KH thay điện thoại nên chưa theo dõi được hiệu suất trên App, từ tin nhắn của điện lực thông tin sản lượng điện từ HT NLMT đang giảm nhiều khoảng 2 tháng gần dây\n\n3. KH cần CN liên hệ và đến kiểm tra cho KH","1. KH đã báo CN: Các sự cố từ trước và cũng đã có văn bản của CN gửi KH\n2. KH phản ánh: Về sự cố tấm pin bị vỡ do ngoại lực KH đang nghi ngờ tấm pin đang ko phải của chính hãng, KH có kiểm tra số serial tấm pin trên phần mềm AE Solar thì thấy báo ko có thông tin trên cty của hãng. Trước đó CN đến kiểm tra nhiều lần nhưng đến khi KH hỏi ngoại lực gì thì CN ko thấy nói. \n3. KH yêu cầu: Làm rõ thông tin, giải thích với KH về tấm pin. Nếu ko KH sẽ kéo pháp lý, đăng tin mxh, phá hoại cty, cảnh báo mọi người và dự kiến KH sẽ khởi kiện vào t6.","1. KH đã báo CN: A Chẩu Văn Nghĩa\n2. KH phản ánh: pin lưu trữ đang bị gặp lỗi trước đó có ivt có mang đi bảo hành rồi mà có báo CN nhưng chưa thấy tháo dỡ nốt pin lưu trữ đi bảo hành.\n3. KH yêu cầu: Kiểm tra pin lưu trữ và mang thiết bị đi bảo hành","Đã báo chi nhánh \nKhách hàng đang thấy hệ thống NLMT đang không hoạt động\nyêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Ko thấy có điện nlmt nạp vào, và thấy gián đoạn từ 12h trưa - 3h chiều, 1 ngày chỉ khoảng 30kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","KH đã báo KT chưa báo CN \nKH báo giao thiếu 1 tấm pin NLMT của KH mà hơn 1 tháng nay chưa thấy giao nốt cho KH \nYêu cầu CN liên hệ KH gấp","KH phản ánh 2 tấm Pin bị nứt, vỡ, võng. Yêu cầu kiểm tra, thay thế theo bảo hành","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng","1. KH đã báo CN \n2. KH phản ánh sự cố pin NLMT bị nổ KT đã xuống tháo nhưng KT chưa đem về kiểm tra và sửa cho KH, nay KH gọi lên yêu cầu KT có xuống đem về sửa cho KH không thì nói KH để còn biết KH lắp bên đơn vị khác\n3. Yêu cầu CN liên hệ và cho KT  xuống Ktra gấp cho KH, KH đang rất gay gắt","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra","1. KH đã liên hệ với CN, CN đã hỗ trợ tháo tấm pin lỗi\n2.KH nghe tiếng như có tiếng nổ, lên kiểm tra thấy var COL_WIDTHS = {"Mã tỉnh":100,"Lĩnh vực":100,"Ngành hàng":100,"Sản phẩm":150,"Mã HĐ":100,"Tên khách hàng":120,"SĐT":100,"Địa chỉ":250,"Giai đoạn":100,"Nhóm sự cố":100,"Loại sự cố":100,"Chi tiết":300,"Ngày bắt đầu":100,"Ngày kết thúc":100,"Trạng thái":100,"Tên nhân viên":100,"Mã nhân viên":100,"Hệ thống":100,"Đơn vị điều hành":100,"AM chuyên quản":100};
var CT_GROUP   = 'bang_chitiet_group';
var AM_MAP     = {"P.KDNLMT":["P.KDNLMT"],"P.Triển khai":["N1 - Truongdv17, Congnd15","N2 - Tienvt16, Anhnt631","N3 - Thikd, Ducnt84"],"VHKT":["VHKT"]};
var TINH_MAP   = {"N1 - Truongdv17, Congnd15":["BNH","HNI","PTO","QNH"],"N2 - Tienvt16, Anhnt631":["NAN","QTI"],"N3 - Thikd, Ducnt84":["AGG","CTO","DTP","HCM","LDG","TNH"],"P.KDNLMT":["HNI"],"VHKT":["AGG","BNH","CMU","CTO","DBN","DLK","DNG","DNI","DTP","GLI","HCM","HNI","HPG","HUE","HYN","KHA","LCI","LDG","NAN","PTO","QNH","QTI","TGG","TNN","TQG","VLG"]};

<script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */

    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

    function doExcel() {
      setBtnState(btn, true);

        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');

      setBtnState(btn, false, '⬇ Tải Excel');
    }

  };

  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);

        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>
