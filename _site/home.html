n lí điều kĩ thuật xuống kiểm tra cho KH","1. KH đã báo CN\n2. KH phản ánh: Từ các sự cố trước về ivt hoạt động ko ổn định. CN chỉ thấy điều khiển từ xa ko thấy đến kiểm tra trực tiếp, và ko thấy xử lý. KH thấy là khi tăng tải lên vẫn lưới điện lưới buộc KH phải tắt tải. KH có liên hệ người phụ trách lắp đặt trước thì ko thấy nghe máy, KH rất ko hài lòng và bức xúc. \n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","1. Pin lưu trữ NLMT của KH chỉ hiển thị ở mức 43% dù trời nắng to khoảng 2 ngày nay, CN đã hẹn KH ngày 15/06 sẽ đến kiểm tra\n\n2. KH cần CN đến kiểm tra và giải đáp cho KH","1. KH đã liên hệ CN\n\n2. KH phản ánh tiền điện cần đóng đang tăng khoảng 3 tháng trở lại đây (Từ khoảng 5-6tr đến hơn 9tr)\n\n3. KH cần CN liên hệ và đến hỗ trợ kiểm tra sớm cho KH","1. KH đã báo CN: A Quốc Đại\n2. KH phản ánh: tủ điện có mùi khét, cả nhà mất điện\n3. KH yêu cầu: Qua hỗ trợ, xử lý tình trạng này","KH chưa báo CN, KT ( KH lắp từ 2021)\nKH báo sự cố nlmt sài được gần 2 năm, hỏng 2 năm nay không ai xuống sửa KT có xuống kiểm tra nói có gắn 1 cục gì đấy (KH không biết) là sẽ dùng được,  nhưng giờ đã nửa tháng vẫn chưa có ai xuống gắn, KH gay gắt \nYêu cầu CN liên hệ cho KT xuống kiểm tra cho KH","1. KH chưa báo CN\n2. KH phản ánh: Hệ KH hơn 7kw KH vẫn thấy hệ hoạt động bình thường tầm trưa trưa là pin lưu trữ đầy mà gần đây thấy tiền điện tăng bất thường. Hồi đầu sử dụng sản phẩm tiền điện là 200k/ 1 tháng đến gần đây t4 là 708k và t5 này là 1tr1 tiền điện. \n3. KH yêu cầu: KT xuống kiểm tra xem và khắc phục tình trạng này","KH chưa báo KT,CN \nKH báo sự cố NLMT tiền điện tăng, nhà KH dùng 2 công tơ, thì 1 công tơ có NLMT bị tăng tiền điện, 1 công tơ không dùng điện NLMT thì không bị tăng\nYêu cầu CN liên hệ và cho KT xuống hỗ trợ KH","KH phản ánh không theo dõi được hiệu suất nlmt qua App\n\nKH yêu cầu: KT lại giúp cho khách","Đã báo CN: Đã báo\nKH báo sự cố: Hiện tại 1 tấm pin nhà KH có hiện tượng bị không sử dụng được \nKH yêu cầu: KT qua kiểm tra cho Kh","CN 0968088033 báo sự cố hộ KH \n1. KH phản ánh: Bị bể 3 tấm pin. CN có qua kiểm tra tấm pin thì cũng thấy có vết từ trên trời rơi xuống, nhưng cũng chưa thể xác nhận chính xác được, KH cũng đang ko chấp nhận là do tác động vật lý. \n2. KH yêu cầu: Phản hồi lại thông tin cho KH và thay mới 3 tấm pin.","chi nhánh báo hộ 0382691111\nBiến tần hoạt động không ổn định\nKh cần ktra trong ngày hôm nay hoặc ngày mai\nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ cho CN\n\n2. Hiệu Suất NLMT của KH bị giảm khoảng 15%, trước đây ngày nắng tốt phát sinh được 30kw/h hiện tại phát sinh được 25kw/h, CN kiểm tra và thông tin do Inverter bị nóng nên giảm hiệu suất\n\n3. KH cần CN hỗ trợ và khắc phục giúp HT NLMT của KH hoạt động bình thường","1. KH đã báo CN: Các sự cố từ trước và cũng đã có văn bản của CN gửi KH\n2. KH phản ánh: Về sự cố tấm pin bị vỡ do ngoại lực KH đang nghi ngờ tấm pin đang ko phải của chính hãng, KH có kiểm tra số serial tấm pin trên phần mềm AE Solar thì thấy báo ko có thông tin trên cty của hãng. Trước đó CN đến kiểm tra nhiều lần nhưng đến khi KH hỏi ngoại lực gì thì CN ko thấy nói. \n3. KH yêu cầu: Làm rõ thông tin, giải thích với KH về tấm pin. Nếu ko KH sẽ kéo pháp lý, đăng tin mxh, phá hoại cty, cảnh báo mọi người và dự kiến KH sẽ khởi kiện vào t6.","Đã báo chi nhánh \nKhách hàng đang thấy hệ thống NLMT đang không hoạt động\nyêu cầu kt qua ktra cho khách hàng","KH đã báo KT chưa báo CN \nKH báo giao thiếu 1 pin NLMT của KH mà hơn 1 tháng nay chưa thấy giao nốt cho KH \nYêu cầu CN liên hệ KH gấp","KH phản ánh 2 tấm Pin bị nứt, vỡ, võng. Yêu cầu kiểm tra, thay thế theo bảo hành","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra","1. Kh đã báo cn\n2. Kh phản ánh: Hệ của kh dạo này sd có hiện tượng liên tục bị sập. Kh đã báo kt và kt phản hồi do kh sd quá tải nhưng từ khi lắp đến nay kh báo chỉ dùng bằng đó thiết bị chứ ko hơn\n3. kh yc: YC cn hỗ trợ sớm"],"Ngày bắt đầu":["2026-07-30 08:00:00","2026-07-29 17:10:00","2026-07-29 16:34:00","2026-07-29 16:19:00","2026-07-29 13:42:00","2026-07-29 10:05:00","2026-07-29 10:04:00","2026-07-29 08:00:00","2026-07-29 08:00:00","2026-07-29 16:25:00","2026-07-29 15:31:00","2026-07-29 14:14:00","2026-07-29 10:38:00","2026-07-29 10:38:00","2026-07-29 10:35:00","2026-07-29 08:07:00","2026-07-29 08:00:00","2026-07-28 13:38:00","2026-07-29 08:00:00","2026-07-29 08:00:00","2026-07-28 14:59:00","2026-07-28 14:51:00","2026-07-28 13:30:00","2026-07-28 08:20:00","2026-07-27 13:34:00","2026-07-27 09:11:00","2026-07-27 08:00:00","2026-07-27 08:00:00","2026-07-27 08:00:00","2026-07-24 17:08:00","2026-07-27 08:00:00","2026-07-24 13:30:00","2026-07-24 11:30:00","2026-07-24 09:00:00","2026-07-24 08:34:00","2026-07-24 08:26:00","2026-07-23 14:24:00","2026-07-23 16:00:00","2026-07-22 10:26:00","2026-07-22 08:00:00","2026-07-21 13:30:00","2026-07-21 08:58:00","2026-07-21 08:53:00","2026-07-20 17:09:00","2026-07-20 09:39:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-16 16:12:00","2026-07-16 11:08:00","2026-07-15 15:44:00","2026-07-13 08:25:00","2026-07-14 08:00:00","2026-07-13 16:00:00","2026-07-13 08:00:00","2026-07-10 17:00:00","2026-07-10 16:59:00","2026-07-10 13:35:00","2026-07-10 13:32:00","2026-07-10 11:01:00","2026-07-10 08:13:00","2026-07-09 08:00:00","2026-07-08 11:21:00", var TINH_MAP   = {"N2 - Thaoltt16, Thikd":["AGG","BNH","HCM"],"N3 - Truongdv17, Duyph5":["HNI","HPG","PTO"],"N4 - Nhungntt27, Anhnt631":["NAN"],"P.KDNLMT":["HCM","VLG"],"VHKT":["AGG","BNH","CMU","CTO","DLK","DNG","DNI","DTP","HCM","HNI","HPG","HTH","HUE","KHA","LDG","NAN","PTO","QNH","QNI","THA","TNN"]};

<script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>

<script>
  const CHECK_INTERVAL = 60000;
  
  async function getLastBuild() {
    const res = await fetch('/last-build.json?t=' + Date.now());
    const data = await res.json();
    return data.buildTime;
  }
  (async () => {
    const initialBuild = await getLastBuild();
    
    setInterval(async () => {
      const currentBuild = await getLastBuild();
      if (currentBuild !== initialBuild) {
        window.location.reload();
      }
    }, CHECK_INTERVAL);
  })();
</script>
