 không theo dõi được hiệu suất HT NLMT qua App\n3. KH cần CN liên hệ và đến hỗ trợ sớm","1. KH chưa báo CN\n2. KH phản ánh: KH được tư vấn giảm khoảng 4 tr tiền điện nhưng thực tế trong 2-3 tháng gần đây tiền điện chỉ giảm khoảng 3tr\n3. KH yêu cầu: qua kiểm tra phần hiệu suất","1. KH đã báo CN\n2. KH phản ánh: kỹ sư bắn ốc vít vào tôn, ngày mưa làm dột nước xuống bàn bia làm hỏng bàn bia của KH, đã báo CN nhưng chưa liên hệ lại KH \n3. KH yêu cầu: phản hồi thông tin cho KH về phương án xử lý TH này","1. KH chưa liên hệ CN\n2. KH không theo dõi được hiệu suất HT NLMT qua App\n3. KH cần CN hỗ trợ sớm","1. KH đã liên hệ CN\n2. Biến tần của KH báo đỏ, HT NLMT không có điện\n3. KH cần CN đến kiểm tra và khắc phục sớm","1. KH chưa báo CN\n2. KH phản ánh: ko đăng nhập được app nlmt, báo lỗi ngoại tuyến\n3. KH yêu cầu: hỗ trợ KH kết nối lại app để theo dõi hiệu suất nlmt","1. KH đã báo CN\n2. KH phản ánh: khi lắp điện nlmt xong mái bị dột từ khoảng t3 - t4\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","YCTX NLMT lịch hẹn 21/08 KH báo chưa thấy có KT liên hệ tư vấn nlmt","Người nhà KH 0393197196 báo hộ sự cố\n1. KH chưa báo CN\n2. KH phản ánh: pin lưu trữ ko xả ra điện\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","Camera KT có xuống mang đi bảo hành từ phản ánh TT_1785744198211 nhưng hơn 15 ngày rồi không thấy thông tin, liên hệ lại. KH có gọi cho KT cũng ko thấy nghe máy. KH yêu cầu phản hồi cho KH về tình trạng của thiết bị.","1. KH chưa báo CN\n2. KH phản ánh: mất kết nối, ko đăng nhập được app theo dõi\n3. KH yêu cầu: qua hỗ trợ KH kết nối lại app","1. KH chưa báo CN\n2. KH phản ánh: hệ nlmt hoạt động chập chờn, sự cố trướcTT_1787113562929  thì KH tự xử lý và hệ nlmt hoạt động bình thường nhưng đến hôm nay lại ko hoạt động\n3. KH yêu cầu: qua kiểm tra, khắc phục dứt điểm tình trạng này","1. KH chưa báo CN\n2. KH phản ánh: trước cài đặt pin lưu trữ thấp nhất 10% là xả nhưng hiện tại xả dưới 10%\n3. KH yêu cầu: hỗ trợ KH cài đặt lại xả pin lưu trữ","KH phản ánh gay gắt và rất bức xúc do Thang máy liên tục gặp sự cố dừng, kẹt và không hoạt động, ngày 20/08 KH bị kẹt trong thang máy 5 phút và rất lo ngại trường hợp trẻ nhỏ trong gia đình gặp sự cố với thiết bị, Yêu cầu CNCT có phương hướng xử lý khắc phục dứt điểm cho KH","1. KH đã báo CN: a Hội\n2. KH phản ánh: tắt hết tủ điện nhưng trên app theo dõi biểu đồ điện lươi vẫn vào 8-10kw\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN\n2. KH phản ánh: thi thoảng ngắt kết nối app theo dõi nlmt, hiện lỗi \"giao tiếp giữa nhà máy và thiết bị bị ngắt kết nối\"\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","KH đã báo KT \nKH báo sự cố:  Biến tần tự động ngắt/dừng hoạt động mỗi khi điện nguồn vào bị tụt xuống dưới 180V. Khi đó, hệ thống tự động chuyển sang dùng 100% điện lưới thay vì dùng điện mặt trời. Hệ thống chỉ chạy điện mặt trời khi ngắt/tắt thủ công nguồn điện lưới. Hệ thống điện mặt trời gần như không có tác dụng (90% thời gian từ lúc lắp đặt vẫn phải dùng điện lưới), tiền điện mỗi tháng không giảm so với trước (vẫn hơn 3 triệu/tháng).\nYêu cầu CN cho KT qua ktra lại và xử lý cho KH","1. KH đã báo CN: KT Đằng\n2. KH phản ánh: bình thường khi sử dụng pin lưu trữ là điện sử dụng được toàn nhà nhưng hôm nay khi mất điện chỉ 1 vài chỗ sử dụng được điện nlmt\n3. KH yêu cầu: qua hỗ trợ, kiểm tra khắc phục tình trạng này","1. KH đã báo CN\n2. KH phản ánh: KH đăng nhập app nlmt điền mật khẩu nhưng lại ra nhà khác\n3. KH yêu cầu: hỗ trợ KH đăng nhập lại app theo dõi nlmt","1. KH đã báo CN: a Dũng\n2. KH phản ánh: toàn bộ sản lượng điện nlmt lên hết điện lưới, có báo CN và KT hỗ trợ cài đặt từ xa nhưng vẫn chưa khắc phục được\n3. KH yêu cầu: qua kiểm tra trực tiếp và khắc phục tình trạng này","1. CN báo sự cố cho KH\n2. Biến tần báo lỗi COM báo đỏ\n3. KH cần CN kiểm tra và khăc phục sớm","1. KH đã báo chi nhánh - Nhân viên Hải Tùng\n2. Nội dung sự cố: ATS bị cháy cầu trì, đã báo nhân sự Hải Tùng của chi nhánh nhưng chưa được xử lý. CN báo sẽ đổi ATS khác nhưng chưa có hàng, KH đã đợi khoảng hơn 2 tháng nhưng chưa được hỗ trợ.\n3. KHYC: CN hỗ trợ sớm (Viettel  báo giá 12tr KH đồng ý nhưng đợi lâu chưa được thay, KH cần hỗ trợ gấp do gia đình kinh doanh nhà nghỉ KS)","Phản ánh từ trước TT_1783915287625 CN đã có BBLV với KH về thiết bị ivt mang đi bảo hành và xác nhận thời điểm lắp đặt lại thiết bị là 15/8 nhưng đến hiện tại là 18/8 KH vẫn chưa thấy có thông tin gì. KH rất bức xúc yêu cầu CN liên hệ là xuống lắp đặt cho KH theo BBLV","1. KH chưa báo CN\n2. KH phản ánh: hệ nlmt ko hoạt động, đèn ở pin lưu trữ và cả hệ đều thấy tắt\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","KH chưa báo CN, KT\nKH báo sự cố hệ thống NLMT liên tục mất điên, sau đó lại có lại và tiếp tục bị mất điện, đã xảy ra tình trạng này 2 ngày nay\nYêu cầu CN cho KT qua ktra xử lý cho KH","1. KH đã báo CN: anh Bang\n2. KH phản ánh: vừa mới đây KH phát hiện ra do thấy có mùi khét và đứt phần dây tiếp địa, KH có ra kiểm tra thì là cọc tiếp địa bằng sắt chứ không phải cọc đồng như trong HĐ. KH có trao đổi với anh Bang thì phản hồi là tính nhầm\n3. KH yêu cầu: thay thế cọc tiếp địa bằng đồng và giải trình vấn đề này cho KH","1. KH đã báo CN: a Trường\n2. KH phản ánh: pin lưu trữ ko nạp vào ko xả ra\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","CN 0364023755 báo sự cố hộ KH\n1. KH phản ánh: 2,3 ngày nay hệ KH 10 tấm pin, 2 string nhưng hiện tại chỉ chạy được 5 tấm, 1 string\n2. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này gấp","CN báo sự cố hộ KH 0985792828\nKH báo sự cố hiện tại hệ thống NLMT đang bị ngừng hoạt động \nYêu cầu CN cho KT qua ktra xử ký cho KH","KH chưa báo KT\nKH báo sự cố NLMT mất điện và điện nlmt không phát điện không thấy điện chạy vào nhà\nYêu cầu CN cho KT qua ktra xử lý cho KH","KH đã báo KT nhưng chưa được hỗ trợ\nKH báo sự cố hệ thống  có lắp bộ tủ đảo công tơ 15 ngày tự đảo. Gần đây hệ không đảo sau 15 ngày nữa\nYêu cầu CN cho KT qua ktra xử lý cho KH","1. KH chưa báo CN\n2. KH phản ánh: ivt gặp trục trặc, quạt tản nhiệt bị hỏng nên biến tần nóng lúc đứng lúc chạy\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH đã liên hệ CN\n2. Từ P/á mã TT_1786152323690, KH phản ánh sau khi CNCT đến kiểm tra và kết luận tủ cháy đã báo giá cho KH chi phí thay tủ là 50%, KH hiện đang không đồng ý do thiết bị vẫn trong hạn bảo hành\n3. KH cần CNCT liên hệ và có hướng khắc phục, xử lý cho KH gấp","1. KH đã báo CN: a Minh\n2. KH phản ánh: mất điện lưới nhưng ko nhảy sang điện nlmt để sử dụng\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này\n\nĐịa chỉ Lắp đặt:5/3 Phường Đình Bảng, Từ Sơn, Bắc Ninh","1. KH chưa báo CN\n2. KH phản ánh: hệ nlmt ko chạy được, hệ bám tải, có 2 pha chỉ 1 pha sáng, trên app kiểm tra ko thấy hoạt động\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này gấp","CN 0967884099 báo sự cố hộ KH \n1. KH phản ánh: pin lưu trữ bị lỗi ko vào điện\n2. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN: a Phạm Đức Trí\n2. KH phản ánh: đường dây điện lực bị tắc ảnh hưởng tới điện nlmt và dẫn tới đồ điện trong nhà KH bị hư \n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này gấp","1. KH đã báo CN \n2. KH phản ánh: KH có 2 ivt, hiện tại 1 ivt ko hoạt động\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH đã liên hệ CN\n2. HT NLMT của KH đang lỗi ATS không điều khiển được qua WIfi, hiện chưa thiết lập được\n3. KH cần CN liên hệ và đến hỗ trợ sớm","CN 0973575722 báo sự cố hộ KH\n1. KH phản ánh: có 1 biến tần ko hoạt động, lỗi nhảy màn hình\n2. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH chưa liên hệ CN\n2. App theo dõi HT NLMT của KH báo ngoại tuyến\n3. KH cần CN liên hệ và đến hỗ trợ sớm","1.CN báo sự cố cho KH\n2. KH không theo dõi được hiệu suất NLMT trên App, chỉ số =0\n3. KH cần CN liên hệ và hỗ trợ sớm","1. KH đã báo CN \n2. KH chưa được hỗ trợ về việc lắp thang hàng và tiến độ về công trình đang bị chậm nửa năm rồi  KH muốn được đền bù HĐ\n3. Yêu cầu CN hỗ trợ KH","1. KH đã liên hệ var CT_GROUP   = 'bang_chitiet_group';
var AM_MAP     = {"P.KDNLMT":["N1 - Congnd15, Tienvt16","N2 - Thaoltt16, Thikd"],"P.Triển khai":["N1 - Congnd15, Tienvt16","N2 - Thaoltt16, Thikd","N3 - Truongdv17, Duyph5","N4 - Nhungntt27, Anhnt631"]};
var TINH_MAP   = {"N1 - Congnd15, Tienvt16":["CTO","DNG","DTP","HTH","KHA","QNI","THA"],"N2 - Thaoltt16, Thikd":["AGG","BNH","CMU","DLK","DNI","HCM","LDG","VLG"],"N3 - Truongdv17, Duyph5":["HNI","HPG","PTO","QNH","TNH"],"N4 - Nhungntt27, Anhnt631":["HUE","HYN","NAN","TNN"]};

<script>
(function () {

  /* ── State ── */
  var activeKeys    = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>
