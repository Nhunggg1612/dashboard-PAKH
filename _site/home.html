gày nữa\nYêu cầu CN cho KT qua ktra xử lý cho KH","Đơn hàng vệ sinh máy giặt làm xong 30/7 hiện tại máy giặt gặp tình trạng ko xả được nước, đang giặt dừng lại ko đến chỗ quay khô. KH yêu cầu sáng mai qua hỗ trợ khắc phục tình trạng này, CSKH đã trao đổi hết hạn bảo hành 72h và sẽ tính phí phát sinh thêm và KH đồng ý","Đơn hàng dịch vụ kiểm tra ko giới hạn từ cuối t5 bảo dưỡng 3 điều hòa, hiện tại có 1 điều hòa gặp tình trạng chảy nước. Đã trao đổi với KH về vấn đề phát sinh thêm sẽ tính phí và KH đồng ý. KH cần hỗ trợ khắc phục lỗi chảy nước","1. KH chưa báo CN\n2. KH phản ánh: ivt gặp trục trặc, quạt tản nhiệt bị hỏng nên biến tần nóng lúc đứng lúc chạy\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH đã liên hệ CN\n2. Từ P/á mã TT_1786152323690, KH phản ánh sau khi CNCT đến kiểm tra và kết luận tủ cháy đã báo giá cho KH chi phí thay tủ là 50%, KH hiện đang không đồng ý do thiết bị vẫn trong hạn bảo hành\n3. KH cần CNCT liên hệ và có hướng khắc phục, xử lý cho KH gấp","1. KH chưa báo CN\n2. KH phản ánh: quên mật khẩu đăng nhập app NLMT, ngoài ra hệ nlmt đang gặp trục trặc ko hoạt động được\n3. KH yêu cầu: qua kiểm tra hệ nlmt và hỗ trợ KH đăng nhập lại app","1. KH đã báo CN: a Minh\n2. KH phản ánh: mất điện lưới nhưng ko nhảy sang điện nlmt để sử dụng\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này\n\nĐịa chỉ Lắp đặt:5/3 Phường Đình Bảng, Từ Sơn, Bắc Ninh","KH đã báo KT, KT báo gọi TĐ\nKH báo sự cố NLMT khoản 8h tối là điện nlmt hết, nhưng giờ đến tầm đấy là tụt át, không có điện lưới, mà kêu người qua ktra thì nguồn điện vẫn có điện lưới\nYêu cầu CN cho KT qua ktra cho KT","Đơn hàng KT tên Lam trong lúc vệ sinh có tháo ra và bị vỡ vòng bi trục, KT có trao đổi phương án là mang về sửa nhưng KH không đồng ý và cũng đã có trao đổi với OFT Trang là KH sẽ báo hãng qua kiểm tra, sửa chữa, chi phí sửa của hãng OFT Trang sẽ chịu cho KH. KH yêu cầu phía bên quản lý KT liên hệ, trao đổi xác nhận về hướng hỗ trợ, xử lý TH này, KH đã liên hệ hãng hẹn mai hoặc t2 qua.","KH có YCTX NLMT cần CNCT liên hệ và tư vấn lại","1. CN phản ánh cho KH\n2. Khách hàng yêu cầu đo tiếp địa hệ năng lượng mặt trời từ khi lắp đặt xong , nhưng đến nay vẫn chưa thực hiện, \n3.Khách hàng yêu cầu kỹ thuật đến thực hiện ngay","KH đặt đơn DVKT lúc 11:51 ngày 14/08 hiện chưa được CN liên hệ và đến hỗ trợ.","KH đặt đơn DVKT từ 13/08 chưa được CN liên hệ và đến thực hiện đơn hàng","KH chưa liên hệ được tới bộ phận KT CN, cần KT liên hệ lại cho KH và đến hỗ trợ thực hiện đơn hàng sớm","1.KH chưa liên hệ CN\n2. Thiết bị NLMT của KH gặp sự cố, báo lỗi F18\n3. KH cần CN hỗ trợ kiểm tra và khắc phục sớm","1. KH chưa báo CN\n2. KH phản ánh: hệ nlmt ko chạy được, hệ bám tải, có 2 pha chỉ 1 pha sáng, trên app kiểm tra ko thấy hoạt động\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này gấp","Người nhà KH 0968755629 báo sự cố\n1. KH chưa báo CN\n2. KH phản ánh: đang dùng điện nlmt thì 11r đêm qua bụp bụp mất điện. Nay KH có cho điện lực, điện nước qua kiểm tra thì thấy bình thường. KH kiểm tra tủ điện ats, chuyển đổi nguồn thì thấy mất át, bị chết và hiện tại đang phải dùng điện lưới\n3. KH yêu cầu: qua kiểm tra, khắc phục và đấu nối lại","CN báo sự cố hộ KH 0986688282 \nKH gặp sự cố NLMT hiện tại không vào được app và không theo dõi được hiệu suất \nYêu cầu CN cho KT qua ktra cho KH","1. KH chưa báo CN\n2. KH phản ánh: sự cố có xe tông vào đường dây CTY nên KH lo ngại ảnh hưởng đến hệ nlmt\n3. KH yêu cầu: qua kiểm tra hệ nlmt xem có vấn đề gì không và khắc phục","CN 0967884099 báo sự cố hộ KH \n1. KH phản ánh: pin lưu trữ bị lỗi ko vào điện\n2. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","CN 0393188966 báo sự cố hộ KH\n1. KH phản ánh: mới bị mất điện xong ivt báo lỗi ko phát ra điện, ko có điện xuống tải\n2. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN\n2. KH phản ánh: KH đã có nâng cấp hạ tầng mạng 2 lần nhưng mạng vẫn rất chập chờn nghe zalo đều rất chập chờn, KH ko rõ là phần đấu nối hay đường truyền kém \n3. KH ng","1. KH đã báo CN: a Nguyễn Đình Trường\n2. KH phản ánh và yêu cầu: do sắp tới mùa mưa bão nên KH cần hỗ trợ đến kiểm tra, theo dõi xem hệ có đang gặp vấn đề gì không và gia cố lại","1. KH đã báo và làm việc với CN\n2. KH phản ánh: cách đây hơn 1 tháng làm HĐ thì đến ngày thi công chưa có thi công được do trời mưa rất to và mái dột rất nặng, KH cũng có phản ánh với đội KT thi công nếu thi công lắp đặt sẽ hỏng toàn bộ phần mái ngói. KH có trao đổi với CN để hỗ trợ hoàn lại cọc rồi và phản hồi là phải chờ 1 HĐ của KH khác với số tiền HĐ tương đương và ck cọc. CN cũng đã gửi mẫu hoàn cọc, nhưng 1 tháng rồi chưa được hỗ trợ tiếp\n3. KH yêu cầu: hỗ trợ KH hoàn cọc","CN 0973575722 báo sự cố hộ KH\n1. KH phản ánh: có 1 biến tần ko hoạt động, lỗi nhảy màn hình\n2. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH chưa liên hệ CN\n2. App theo dõi HT NLMT của KH báo ngoại tuyến\n3. KH cần CN liên hệ và đến hỗ trợ sớm","1. KH chưa liên hệ CN\n2. KH cần hỗ trợ, bảo dưỡng vệ sinh HT NLMT theo điều khoản trong hợp đồng\n\nĐịa chỉ lắp đặt :C29, Khu Ba Gia, Phường Từ Sơn, Bắc Ninh","1. KH đã báo CN\n2. KH phản ánh: KH ký HĐ từ tháng 6 mà hiện tại vẫn chưa thấy có lắp đặt, chưa có tấm pin nlmt. KH có chuyển khoản 40tr qua TK của CN trong HĐ\n3. KH yêu cầu: liên hệ với KH trao đổi và triển khai lắp đặt ngay cho KH","1.CN báo sự cố cho KH\n2. KH không theo dõi được hiệu suất NLMT trên App, chỉ số =0\n3. KH cần CN liên hệ và hỗ trợ sớm","1. KH chưa báo CN\n2. KH phản ánh: biến tần bị lỗi bình thường là đèn xanh nhưng hôm nay KH lên kiểm tra thì thấy đèn run đang nháy, tiền điện các tháng vừa rồi cũng tăng lên so với các tháng trước\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","KH báo KT bạn Tuấn CN \nKH báo sự cố NLMT bị báo động đỏ, không vào điện\nYêu Cầu CN cho KT qua ktra cho KH","1. CN tạo sự cố cho KH\n2. Sau khi lắp HT NLMT bị lệch cos phi, dẫn tới bị phạt công suất phản kháng khoảng 3 tháng, Điện lực đã thông tin tới KH nhiều lần\n3. KH cần CN liên hệ và var COL_WIDTHS = {"Đơn vị điều hành":100,"AM chuyên quản":100,"Mã tỉnh":100,"Mã HĐ":100,"Tên khách hàng":120,"Nhóm sự cố":100,"Loại sự cố":100,"Chi tiết":300,"Ngày bắt đầu":100,"Ngày kết thúc":100,"Trạng thái":100,"Tên nhân viên":100,"Mã nhân viên":100,"Lĩnh vực":100,"Ngành hàng":100,"Sản phẩm":150,"Giai đoạn":100,"Hệ thống":100,"SĐT":100,"Địa chỉ":250};

<script>
(function () {

  /* ── State ── */
  var activeKeys    = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>
