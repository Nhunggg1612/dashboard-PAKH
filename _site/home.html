n***KH gọi lên TĐ giọng nam báo chưa thấy có KT liên hệ, khi KT gọi cho hẹn là KH là giọng nữ (cùng 1 SĐT)","CN 0978668502 báo sự cố hộ KH\n1. KH phản ánh: Hệ nlmt bị đầy lưới\n2. KH yêu cầu: KT qua kiểm tra, khắc phục tình trạng này.","KH có đặt đơn hàng DVKT chưa có KT đến hỗ trợ\n\nKH cần KT liên hệ đến hỗ trợ KH sớm","KH chưa báo CN chưa báo KT\nKH báo lối sự cố NLMT không hoat động đc, pin lưu trữ hiện đèn đỏ, inverter báo lỗi f56, f14\nYêu cầu CN cho KT xuống hỗ trợ KH","1. KH đã liên hệ Chi nhánh\n2. KH cần hoàn tiền cọc do sau khi chấm dứt hợp đồng và dược thông tin chi nhánh sẽ thông báo với kinh doanh và phản hồi lại cho KH tuy nhiên KH chưa được hỗ trợ\n3. KH cần CN hỗ trợ phản hồi thông tin cho KH sớm","1.KH đã liên hệ với CN\n\n2. KH không chọn được chế độ nấu, nồi bị nháy đèn, có tiếng kêu, đã đóng kín\n\n3. KH cần CN hỗ trợ và khắc phục sớm cho KH","KH chưa báo KT chưa báo CN đã báo GĐKD \nKH gặp sự cô NLMT khi mất điên hệ thống không tự chuyển đổi mà KH phải thao tác bằng tay \nYêu cầu CN cho KT xuỗng hỗ trợ KH","1. KH đã báo CN: A Ngô Văn Đạt\n2. KH phản ánh: Đã chuyển 50% tiền cọc mà chưa có vật tư và CN hứa hẹn nhiều lần nhưng chưa thấy lắp, chỉ thấy có KT lên mái xem và bảo thay đổi tấm pin từ jinko sang longi lúc đầu hứa là 10-15 lắp đặt mà giờ lại sang 25. KH đang ko hiểu lí do tại sao.\n3. KH yêu cầu: Phản hồi cho KH lí do tại sao, và lắp đặt được cho KH ko để KH còn đặt bên khác. Nếu lắp đặt được thì triển khai lắp đặt nhanh cho KH.","KH báo chưa thấy có KT liên hệ hay gì, KH đã đợi 3 ngày từ 16/5 mà ko thấy có cuộc gọi nào. KH yêu cầu KT liên hệ xác nhận đơn","1. KH đã báo CN\n2. Đã kí HĐ và thanh toán đầy đủ nhưng vẫn chưa được lắp đặt\n3. Yêu cầu KT hỗ trợ lắp đặt cho KH","CN 0983934346 báo sự cố hộ KH\n1. KH phản ánh: Hiệu suất sản phẩm kém\n2. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","KH cần xuất hóa đơn đã báo KT cả tháng rồi mà vẫn chưa thấy gì. KH cần gửi hóa đơn qua mail trantrunghieu23@gmail.com","Chưa báo chi nhánh\nKh theo dõi trên app hệ thống NLMT thừa điện bị  đẩy hết lên lưới điện \nYcau kĩ thuật qua ktra cho khách hàng","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. KH bị mất điện ngày  17/5, khi có điện lại HT NLMT của KH không hoạt động, trên APP chỉ có thông số điện lưới, không có phát sinh điện từ NLMT\n3. KH cần CN hỗ trợ khắc phục sớm","KH chưa báo lên chi nhánh \nKH báo hệ thống lưới điện bị bật ngắt liên tục từ đêm qua\nKH yêu cầu KT đến kiểm tra và xử lý","KH chưa báo lên chi nhánh\nKH báo đèn trong bình lưu trữ bị tắt không chớp nữa \nKH yêu cầu KT kiểm tra và xử lý","Đã báo chi nhánh \nKhách hàng đang thấy hệ thống NLMT đang không hoạt động\nyêu cầu kt qua ktra cho khách hàng","1. KH chưa báo lên chi nhánh\n2. KH báo KH bị quên mật khẩu của app NLMT \n3. KH yêu cầu KT đến hỗ trợ","KH chưa báo KT chưa báo CN\nKH muốn được hướng dẫn sử dụng app để có thể đặt thêm thời điểm suất năng lượng từ pin ra \nYêu cầu CN cho KT xuống hỗ trợ KH","1. KH đã báo CN: A Nhân\n2. KH cần hỗ trợ hồ sơ lắp đặt NLMT để gửi điện lực","1. KH chưa báo CN\n2. KH phản ánh: Ko thấy có điện nlmt nạp vào, và thấy gián đoạn từ 12h trưa - 3h chiều, 1 ngày chỉ khoảng 30kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","1. KH đã báo CN: A Hài\n2. KH phản ánh: Lỗi sập ko kết nối được vào app, và bị cháy tủ điện\n3. KH yêu cầu: KT qua kiểm tra, khắc phục tình trạng này.","KH chưa báo lên chi nhánh\nKH báo NLMT bị chuột cắn đứt dây\nKH yêu cầu KT đến liên hệ và xử lý","Đã báo chi nhánh\nLỗi 1 cục inverter\nYêu cầu kt qua xử lý cho khách hàng","Đã báo chi nhánh \n1 tấm pin nlmt bị nứt  \nYêu cầu kt qua ktra cho khách hàng","Nhà KH sử dụng pin lưu trữ tuy nhiên nhà KH đang mất điện hệ thống NLMT cũng không sử dụng được. Yêu cầu kt qua xử lý cho khách hàng \nYêu cầu kt qua xử lý cho khách hàng","KH chưa báo CN chưa báo KT\nKH báo sự cố nlmt bị nước mưa dột vào nhà do khoan thủng phần mái tôn\nYêu cầu CN cho KT xuống hỗ trợ cho KH","Chưa báo chi nhánh \nKhách hàng thấy hệ năng lượng mặt trời tháng 4,5 không có sản lượng \nYêu cầu kĩ thuật qua hỗ trợ cho khách hàng","Chưa báo chi nhánh \nCháy đoạn dây nối từ invetet xuống át tổng  đang mất hết điện nhà \nYêu cầu kt xuống hỗ trợ gấp cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: pin ko đạt hiệu suất, trời nắng gắt chỉ đạt được 60-70% hiệu suất.\n3. KH yêu cầu: Qua kiểm tra thiết bị và khắc phục tình trạng này","đã báo chi nhánh\nKH nlmt sự cố mất điện lưới, pin cũng ko có điện\nyêu cầu kt xử lý gấp cho khách hàng","Đã gọi cho chi nhánh\nPin lưu trữ 100% nhưng không có điện bị nhảy át \nYêu cầu Kt qua xử lý cho khách hàng  gấp","SĐT phản ánh 0982865588\n1. KH phản ánh: Ko có ra công suất điện (KH ko cung cấp rõ thông tin)\n2. KH yêu cầu: Qua kiểm tra, hỗ trợ KH","1. KH đã báo CN: A Cường\n2. KH phản ánh: Thiết bị cầu dao (CB) của KH lúc đầu công suất là 100 ampe ko đủ nên muốn nâng lên là 150 ampe theo kỹ thuật viên, và giờ KH muốn công suất CB lên 250 ampe. KH có trao đổi với KT lắp đặt thì hàng ko chắc là t2 có về được không.\n3. KH yêu cầu: Phản hồi lại thông tin cho KH là bao giờ hàng mới về và triển khai lắp đặt nhanh cho KH","1. Đã báo chi nhánh chưa: chưa báo\n2.KH gọi điện lên TĐ\n3.KH phản ánh về vấn đề: Tháng này tiền điện tăng. điện tiêu thụ dồn vào 1 công tơ điện. Nhà KH có 2 công tơ đang cần chia tách đều điện tiêu thụ ra 2 công tơ, cần CN hỗ trợ.\nKT đã qua 1 lần rồi nhưng mà tiền điện không đổi \n4.KH yêu cầu KT qua hỗ trợ gấp cho KH.","KH đã báo KT chưa báo CN \nKH báo giao thiếu 1 tấm pin NLMT của KH mà hơn 1 tháng nay chưa thấy giao nốt cho KH \nYêu cầu CN liên hệ KH gấp","1. KH chưa liên hệ với CN \n2. KH cần hỗ trợ hoàn thiện hồ sơ NLMT để gửi cho điện lực \n3. Yêu cầu CN liên hệ và hỗ trợ hoàn thiện hồ sơ cho KH","KH chưa báo lên chi nhánh\nKH báo tấm pin năng lượng mặt trời có dấu hiệu bị nứt\nKH yêu cầu KT đến kiểm tra","1. Lỗi biến tần INV không hoạt động, đang chạy bình thường thì tắt sau đó cứ tắt đi bật lại khoảng 1 tuần, lỗi quạt tản nhiệt\n2. KH đã liên hệ cho CN và được hỗ trợ chuyển thiết bị đi bảo hành\n\n3. KH cần CN hỗ trợ khắc phục sớm cho KH","1.Inverter bị của KH bị lỗi\n\n2. KH đã liên hệ CN và được hỗ trợ chuyển thiết bị đi bảo hành\n\n3. KH cần CN hỗ trợ khắc phục sớm","Chưa báo chi nhánh\nĐang có 1 tấm pin bị vỡ \nYêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: trên app ko thấy số liệu, cũng ko thấy sản xuất ra điện. Sự cố trước KT cũng chỉ điều khiển từ xa mà KH cần đến kiểm tra trực tiếp.\n3. KH yêu cầu: Đến kiểm tra trực tiếp, khắc phục tình trạng này","KH phản ánh 2 tấm Pin bị nứt, vỡ, võng. Yêu cầu kiểm tra, thay thế theo bảo hành","1. KH đã báo CN\n2. KH phán ánh: Sự cố từ trước về 1 đèn NLMT xử lý xong rồi nhưng giờ đèn NLMT còn lại lại thấy sáng yếu hơn. KH có trao đổi với KT thì KT bảo KH tự mang xuống mang đi bảo hành trong khi lần trước là KT vẫn xuống mang đi bảo hành mà lần này lại bảo ko.\n3. KH yêu cầu: Xuống kiểm tra đèn nlmt còn lại nếu cần thì mang đi bảo hành.","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng","1. KH đã báo CN: A Phụng\n2. KH phản ánh: có bảo a Phụng hỗ trợ phần hồ sơ lắp đặt để gửi phía bên điện lực thì a Phụng bảo làm rồi mà KH bảo chụp lại hồ sơ mà chưa thấy chụp. KH có liên hệ a Phụng thì đang ko được.\n3. KH yêu cầu: Phản hồi lại thông tin chính xác cho KH đã làm phần hồ sơ lắp đặt gửi điện lực chưa.","1. KH đã báo CN: A Hoàng - bán hàng\n2. KH phản ánh: Cúp điện lưới mà ko thấy có điện nlmt, KH có sử dụng pin lưu trữ mà cũng ko thấy.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","1. KH chưa báo CN\n2. KH phản ánh: Ko có thấy nạp điện vào, KH xem trên app thì cảnh báo lỗi mấy ngày hôm nay.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","1. KH đã liên hê CN và được hỗ trợ tháo thiết bị để chuyển cho hãng\n2. Pin lưu trữ của KH bị lỗi\n3. KH cần CN hỗ trợ khắc phục sớm","KH chưa báo lên chi nhánh \nKH có 2 nguồn điện, để 1 nguồn điện là dùng được, chuyển sang nguồn điện khác HT NLMT sẽ không hoạt động\nKH báo: đèn không sáng cái có cái không, NLMT thì không phát ra điện\n\nKH yêu cầu kỹ thuật kiểm tra","1.  KH chưa báo chi nhánh\n2. KH báo lỗi inverter không hoạt động, báo lỗi không hiển thị màn hình\n3. Yêu cầu Chi nhanh cho Kỹ thuật xuống hỗ trợ KH gấp","KH chưa báo chi nhánh\n2. KH báo  điên lượng không chạy hd cách đây nửa tháng\n3. KH yêu cầu KT đến kiểm tra","Khách hàng chưa báo Chi nhanh chưa báo Kỹ thuật\nKhách hàng báo sự cố năng lượng mặt trời không đủ điện cấp tải \nYêu cầu chi nhánh cho kỹ thuật đến hỗ trợ cho khách hàng gấp","CN 0976886777 báo sự cố hộ KH \n1. KH phản ánh: Tivi màn hình led bị lỗi ko lên màn hình.\n2. KH yêu cầu: Xuống kiểm tra, xử lý trong ngày hôm nay.","6/5 lắp đặt anh tân đã hứa với khách hàng \nKh muốn hủy hợp đồng NLMT \nYêu cầu kt gọi lại cho kh","KH đã báo KT và GDKD \nKH phản ánh sự cố đấu lệc pha điện, chưa thi công cột chống sét, ban đêm không đủ điện dùng\nKH yêu cầu CN cho KT xuống Ktra cho KH","KH đã báo KT tên Huy chưa báo CN \nKH báo hiệu suất NLMT kém không đủ sạc  pin lưu trữ\nYêu cầu CN cho KT xuống kiểm tra lại cho KH gấp","1. KH đã báo CN \n2. KH phản ánh sự cố pin NLMT bị nổ KT đã xuống tháo nhưng KT chưa đem về kiểm tra và sửa cho KH, nay KH gọi lên yêu cầu KT có xuống đem về sửa cho KH không thì nói KH để còn biết KH lắp bên đơn vị khác\n3. Yêu cầu CN liên hệ và cho KT  xuống Ktra gấp cho KH, KH đang rất gay gắt","1. KH chưa liên hệ CN\n\n2. Hiệu suất HT NLMT chưa đảm bảo Hệ 20 KWP, hiệu suất cao nhất 1 ngày chỉ đạt 50KWP, Inverter thỉnh thoảng bị đơ (7-10 ngày bị một lần) \n\n3.KH cần KT của TCT đến hỗ trợ kiểm tra và bảo hành","1. KH chưa báo cn\n2. KH phản ánh: Ivt ko thấy lên đèn tín hiệu ở trước, KH theo dõi trên app thì thấy thiết bị ngoại tuyến. \n3. KH yêu cầu: KT xuống kiểm tra, xử lý tình trạng này cho KH","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. Inverter bị lỗi không lưu điện vào trong pin, đổi dòng dùng điện trực tiếp được nhưng không vào pin lưu trữ\n3. KH y/c CN hỗ trợ đổi thiết bị mới cho KH","Kh đã báo chi nhánh\nTủ biến tần nổ cháy\nKh yêu cầu kt trong tuần này liên hệ hỗ trợ","Khách hàng đang nhận định và khiếu nại hệ thống năng lượng mặt trời hoạt động không hiệu quả. Nguyên nhân do buổi sáng đón nắng tốt, nhưng đến trưa thì bị che bóng (nên theo khách, hệ 6kW nhưng công suất thấp chỉ sản sinh được 1kW thôi). Liên quan việc che bóng thì khách cho rằng Viettel không khảo sát kỹ từ đầu. Và có yêu cầu di dời tấm pin áp mái đến vị trí đón nắng tốt hơn (trong phạm vi 10 m trên mái nhà).\nNhờ KT xêp lịch hẹn sớm với khách hàng và hỗ trợ\nKhảo sat thực tế và lên phg án di dời các tấm pin","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","kh chưa báo chi nhánh ko thấy HĐ điện tử nhg khách hàng đã chụp hợp đồng giấy qua zalo\nNlmt không sản xuất ra điện\nyêu cầu kt qua ktra cho khách hàng","chưa báo chi nhánh\nbiến tần ko báo điện hệ thống năng lượng mặt trời đang ko dùng được\nyêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ với CN nhưng chưa tiếp nhận: Có liên hệ với CN là a Bùi Anh Nguyễn nhưng ko nghe máy, và cũng ko thấy gọi lại.\n2. KH phản ánh: Pin tích điện đủ nhưng ko thấy xả ra để dùng. KH đã báo bên điện lực đến kiểm tra và đã đo đồng hồ các thứ và ko bị làm sao. Tiền điện bây giờ vẫn tăng cao lúc chưa lắp là 8tr tư vấn lắp đặt thông tin là 2tr mà những tháng đầu tiền điện 4tr. Và khi sập điện lưới bật quạt để chạy thử sang nlmt thì được 1 lúc lại tự ngắt rồi lại dùng điện lưới.\n3. KH yêu cầu: Qua kiểm tra thiết bị xem và khắc phục tình trạng này.","CN 0868707197 báo sự cố hộ KH\n1. KH phản ánh: Đang bị mất điện lưới, pin ko đẩy lên được vì bị hỏng đảo chiều. Ngoài ra app theo dõi KH cũng đang ko vào được.\n2. KH yêu cầu: Qua kiểm tra, hỗ trợ khắc phục tình trạng này.","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","1. KH đã báo CN (KH ko nhớ rõ tên)\n2. KH phản ánh: Cách đây 4 hôm hệ của KH bị sét đánh, KH cũng ko rõ là ở đâu chỉ thấy áp ở tủ điện nhảy xuống, điện ko phát lên lưới và thấy bị hỏng.\n3. KH yêu cầu: KT qua kiểm tra, khắc phục tình trạng này cho KH.","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra","1. KH đã liên hệ với CN, CN đã hỗ trợ tháo tấm pin lỗi\n2.KH nghe tiếng như có tiếng nổ, lên kiểm tra thấy tấm pin rạn vỡ, cần kiểm tra bảo hành\n3.KH cần CN hỗ trợ thông tin sớm","KH cần mẫu bổ sung số 01 để báo với điện lực gia đình đang sử dụng NLMT theo nghị định 13 \nYêu cầu KT liên hệ lại KH gấp","KH (work@namdd.dev) gửi mail phản ánh các vấn đề: \n1.\tTiền dây dẫn thừa: Đề nghị Viettel Phú Thọ thực hiện việc bồi hoàn lại tiền cho phần dây điện thừa do thi công sai lệch ban đầu.\n2.\tTiêu chuẩn vật tư tủ điện (Dựa trên buổi làm việc ngày 11/04/2026): Hai bên đã thống nhất ghi nhận hiện trạng là chưa xác định được vật tư bên trong tủ điện có đảm bảo đúng danh sách thiết bị và tiêu chuẩn kỹ thuật của công ty hay không. Tôi yêu cầu phía Tập đoàn và VCC cung cấp chi tiết danh sách vật tư và tiêu chuẩn kỹ thuật để gia đình có cơ sở so sánh với chiếc tủ trị giá 6.500.000 VNĐ hiện tại. Yêu cầu làm rõ tính an toàn khi sử dụng dây cáp DC để đấu nối cho phần AC và dây DC 6mm2 đi với MCB 63A. Thời hạn phản hồi: Trước ngày 20/04/2026.\n3.\tXử lý lỗi Inverter (SPD DC): Hệ thống liên tục báo lỗi DC SPD. Theo thông tin mới nhất, hiện DatGroup đang làm việc với hãng GoodWe và sẽ có email phản hồi kết quả xử lý trong vòng 02 ngày tới. Đề nghị phía Viettel bám sát để xử lý dứt điểm cho khách hàng .\n4.\tĐiều chỉnh chính sách bảo hành (Dựa trên buổi làm việc ngày 11/04/2026): Thông tin bảo hành combo biến tần và pin lưu trữ của hãng hiện không khớp với hợp đồng . Phía Chi nhánh Phú Thọ đã hẹn xử lý trong vòng 120 ngày kể từ ngày 11/04/2026. Như vậy, thời hạn cuối cùng để hoàn tất việc điều chỉnh này là ngày 09/08/2026.\n6.\tThao tác điều khiển thiết bị từ xa không báo trước: Giải trình về việc tài khoản viettelsolar.phutho@gmail.com tự ý \"Xóa dữ liệu báo động lỗi hồ quang\" và \"Vô hiệu hóa báo động chống sét\" ngày 12/04/2026 mà không thông báo hay nắm rõ mục đích xóa.","- KH chưa báo chi nhánh \n- Tấm pin nlmt cần hỗ trợ 2 cái. Hôm nọ kt lắp sai tấm pin nên bị đọng nước, phần trên thì đúng phần dưới thì sai. Có 2 cái sửa  thì 1 cái dùng được  1 cái không\n- KH cần hỗ trợ sớm","1. KH đã báo cn: a Hoàng Đình Nhâm\n2. KH phản ánh: KH đã báo cn nhiều lần nhưng chưa được hỗ trợ. Hệ của KH 6 cục pin nhưng chỉ thấy xả 3 cục và chỉ xài được 1 lúc là nó hết.\n3. KH yêu cầu: Điều KT qua kiểm tra, khắc phục tình trạng này cho KH.\n***SĐT phản ánh và liên hệ: 0706455040","- KH báo qua chị Phượng (CN) \n- KH đang gặp sự cố ắc quy, 2 khối ắc quy 1 khối xả 1 khối không\n- Kh yêu cầu xử lý sớm","1. KH chưa báo CN\n2. KH đang sd NLMT nhưng hiện tại thiết bị ko xả điện\n3. YC KT qua kiểm tra và xử lý gấp\n***địa chỉ lắp đặt: kilo 63, khu đô thị đức tài, xã hoài đức, tỉnh lâm đồng.","Mất 1 string điện không vào ắc quy. Không đủ cung cấp cho tải nhà dùng . Anh cần đến kiêm tra trong ngày hôm nay.\n**Địa chỉ lắp đặt: số nhà 300, kim tân, xã đoài phương, thành phố hà nội.","1.Đã báo chi nhánh chưa: chưa báo\n2.Đã báo qua đâu: DTV HPC\n3.KH phản ánh về vấn đề: Hiệu suất hệ thấp.\n4.KH yêu cầu KT qua kiểm tra cho KH","1. KH chưa báo cn\n2. KH phản ánh: Sự cố từ TT_1772587360264 trước sau khi xử lý KH thấy hệ thống nlmt ko có ổn định, lâu lâu tự ngắt và phải bảo nv tắt 3 công tắc cp đi bật lại mãi mới được.\n3. KH yêu cầu: Kiểm tra lại hàng hóa xem có đúng với HĐ về chất lượng, hiệu suất không. Nếu có vấn đề thì thay mới tinh cho KH để hệ thống vận hành trơn tru.","1. Kh đã báo cn\n2. Kh phản ánh: Hệ của kh dạo này sd có hiện tượng liên tục bị sập. Kh đã báo kt và kt phản hồi do kh sd quá tải nhưng từ khi lắp đến nay kh báo chỉ dùng bằng đó thiết bị chứ ko hơn\n3. kh yc: YC cn hỗ trợ sớm","- Đối tác Công ty cổ phần SPT Việt Nam (sdt phản ánh 0975014010) tiếp tục gọi tđ phản ánh về vấn đề chậm trễ tiến độ và thiếu nhân lực thi công cho dự án Thi công lắp đặt hệ thống Chiller. \n- Kh báo hiện tại vẫn chậm tiến độ, cn ko thay đổi hay tiến triển thêm gì\n- Mã hợp đồng: 23092025/HĐTP-SPT-VIETTEL.\n- Kh yc: Yc TCT có biện pháp xử lý rõ ràng cho kh"],"Ngày bắt đầu":["2026-05-20 08:00:00","2026-05-20 08:00:00","2026-05-19 15:24:00","2026-05-19 13:47:00","2026-05-19 13:30:00","2026-05-19 14:22:00","2026-05-19 09:26:00","2026-05-20 08:00:00","2026-05-19 16:20:00","2026-05-19 16:10:00","2026-05-19 16:03:00","2026-05-19 15:43:00","2026-05-19 14:17:00","2026-05-19 14:01:00","2026-05-19 10:22:00","2026-05-18 17:24:00","2026-05-18 13:30:00","2026-05-19 08:00:00","2026-05-18 17:25:00","2026-05-18 15:08:00","2026-05-18 13:30:00","2026-05-18 11:46:00","2026-05-18 10:22:00","2026-05-18 09:56:00","2026-05-18 08:00:00","2026-05-18 08:00:00","2026-05-18 08:00:00","2026-05-18 08:00:00","2026-05-18 08:00:00","2026-05-18 13:30:00","2026-05-18 08:00:00","2026-05-18 08:00:00","2026-05-18 08:00:00","2026-05-18 08:00:00","2026-05-15 16:39:00","2026-05-15 11:22:00","2026-05-15 11:39:00","2026-05-14 16:05:00","2026-05-15 15:40:00","2026-05-15 10:15:00","2026-05-14 11:48:00","2026-05-14 11:30:00","2026-05-14 10:50:00","2026-05-14 08:00:00","2026-05-14 14:40:00","2026-05-14 13:30:00","2026-05-13 16:51:00","2026-05-13 16:31:00","2026-05-13 11:28:00","2026-05-12 15:03:00","2026-05-12 10:34:00","2026-05-11 16:28:00","2026-05-11 13:30:00","2026-05-11 14:22:00","2026-05-11 08:00:00","2026-05-08 11:51:00","2026-05-08 08:36:00","2026-05-07 15:26:00","2026-05-07 08:00:00","2026-05-06 13:30:00","2026-05-06 16:10:00","2026-05-06 08:00:00","2026-05-06 08:00:00","2026-05-04 08:00:00","2026-05-04 08:00:00","2026-05-04 08:00:00","2026-05-04 0 <script>
(function () {

  var activeKeys = null;

  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }
    var fh = new crosstalk.FilterHandle(CT_GROUP);
    fh.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });
  }
  initFilter();

  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) {
      return keySet.has(String(i + 1));
    });
  }

  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s = document.createElement('script');
    s.src = url;
    s.onload = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── EXCEL ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }

      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);

      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';

      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);

      html2canvas(wrapper, {
        scale: 2,
        backgroundColor: '#ffffff',
        useCORS: true,
        width: wrapper.scrollWidth,
        height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

})();
</script>
