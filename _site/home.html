n\n+ Thông tin tiếp nhận xuất hóa đơn nội bộ cho nhau không đúng lại báo KH chuyển sai thông tin. Hôm KT qua bảo dưỡng điều hòa KH có đưa hình ảnh thông tin để KT chụp lại nhưng KT lại soạn tin nhắn để gửi và lấy thông tin địa chỉ không chính xác\n2. KH yêu cầu: Hỗ trợ trường hợp hóa đơn này của KH, và KH thời gian xử lý cụ thể","1. KH chưa liên hệ CN\n\n2. KH không theo dõi được hiệu suất trên App\n\n3. KH cần CN đến kiểm tra và khắc phục sớm","1. KH đã liên hệ CN\n\n2. Thiết bị biến tần của KH đang hoạt động không ổn định, dù trời nắng to nhưng khi tăng tải hệ thống vẫn rút điện lưới để sử dụng\n\n3. KH cần CN liên hệ và đến kiểm tra khắc phục sớm","KH chưa báo CN \nKH phản ánh cục biến tần NLMT đang gặp lỗi không hoạt động\nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","KH chưa báo CN \nKH phản ánh hệ thống báo lỗi bị đỏ, bình lưu trữ k hoạt động\nYêu cầu quản lí điều kĩ thuật liên hệ và kiểm tra cho KH","KH chưa báo CN, KT \nKH báo sự cố NLMT có sản xuất ra điện nhưng đẩy hết điện vào điện lưới mà không vào nhà\nYêu cầu CN cho KT qua kiểm tra cho KH","KH đã báo CN\nKH báo sự cố NLMT sử dụng được  1 lúc xong nháy điện và bị tắt điện\nYêu cầu CN cho KT xuống kiểm tra cho KH","YCTX NLMT KH cần KT liên hệ lại để tư vấn","1. KH đã báo CN\n2. KH phản ánh:  EVN đang nói hệ thống có ưu tiên tải nhà, tiền điện tăng cao. Có KT (KH ko nhớ rõ tên)trao đổi với KH là điện nlmt KH ko ưu tiên sử dụng cho nhà mà lại bán thẳng cho điện lực xong roi mới bán lại bên KH. \n3. KH yêu cầu: có bằng chứng hệ thống gửi cho KH là chỉ đẩy lưới mà không ưu tiền sử dụng qua tải nhà để KH trao đổi với EVN","YCTX NLMT lịch hẹn 10/6 KH chưa được liên hệ tư vấn, KH cần KT liên hệ lại tư vấn, khảo sát","KH chưa báo CN \nKH phản ánh hiệu quả sản phẩm thấp \nYêu cầu quản lí điều kĩ thuật liên hệ và kiểm tra cho KH","SĐT KH phản ánh 0969001868 HĐ trả góp NLMT với Stride\n1. KH phản ánh: đã có tập kết vật tư 1 tháng rồi nhưng chưa thấy lắp đặt\n2. KH yêu cầu: Điều KT xuống lắp đặt cho KH","YCTX NLMT KH đã được liên hệ tư vấn nhưng chưa rõ ràng về giá, về bảo hành, KH cần liên hệ tư vấn thêm về NLMT hiện tại KH đang có 1 hệ nhưng ko đủ dùng","KH chưa báo CN \nKH phản ánh sản phẩm bị lỗi không hoạt đông \nYêu cầu quản lí điều kĩ thuật liên hệ và xuống kiểm tra cho KH gấp","KH đặt đơn DVKT từ ngày 8/6 chưa có KT liên hệ hẹn lịch\nYêu cầu KT liên hệ lại cho KH","KH chưa báo CN, KT\nKH báo sự cố NLMT không hoạt động\nYêu cầu CN cho KT xuống kiểm tra cho KH","1. KH chưa liên hệ CN\n\n2. Pin lưu trữ của KH đang gặp sự cố không hiển thị số % điện lưu trữ, KH không rõ HT NLMT của KH có sử dụng điện từ Ắc quy không\n\n3. KH cần CN liên hệ và đến kiểm tra gấp","1. KH đã liên hệ CN\n\n2. Thiết bị Inverter của KH báo đỏ và đang không nhận điện từ tấm pin, tiền điện KH đóng tháng rồi tăng lên hơn 9tr(trước đây là 2-3tr)\n\n3. KH cần CN đến kiểm tra và khắc phục gấp","KH chưa báo CN\nKH phản ánh Tấm pin k đủ độ dốc bị đọng nước, Dàn pin phía sau bị võng, hệ thống NLMT bị lôi không hoạt động \nYêu cầu quản lí điều kĩ thuật liên hệ trước và xuống kiểm tra cho KH","KH chưa báo CN \nkhách hàng báo pin lưu trữ bị chớp đỏ, ko sử dụng được.\nYêu cầu quản lí điều kỹ thuật hỗ trợ kiểm tra gấp","1. Thiết bị chuyển thông số sang 2 đồng hồ điện NLMT và điện lưới gặp sự cố khoảng 10 ngày nay, CN đã đến kiểm tra, tháo thiết bị gặp sự cố tuy nhiên chưa  hỗ trợ thay thiết bị cho KH\n\n2. KH cần CN liên hệ và đến hỗ trợ KH sớm","1. Pin lưu trữ NLMT của KH chỉ hiển thị ở mức 43% dù trời nắng to khoảng 2 ngày nay, CN đã hẹn KH ngày 15/06 sẽ đến kiểm tra\n\n2. KH cần CN đến kiểm tra và giải đáp cho KH","CN báo sự cố hộ KH \nKH gặp sự cố NLMT không có điện nạp vào  acquy \nYêu cầu CN cho KT xuống kiểm tra cho KH gấp","KH đã báo KT nhưng chưa được hỗ trợ \nKH báo sự cố NLMT hiệu suất kém, hiện tại chỉ sản xuất ra được 0,25kw dù trời nắng rất to, kh lắp hệ 19kw\nYêu cầu CN cho KT qua kiểm tra cho KH","KH đã báo KT nhưng được hỗ trợ\nKH báo sự cố NLMT lệch pha và không sạc được không sử dụng được\nYêu cầu CN cho KT xuống kiểm tra hỗ trợ KH","1. KH đã báo CN\n2. KH phản ánh: CN đã sang lắp đặt nhưng do đấu nối thế nào mà bị cháy mất cầu khiến ivt gặp trục trặc. CN là A Phạm Hùng có tháo gửi đi hãng từ 11/6 có báo là 1,2 ngày sau mang trả lại mà giờ chưa thấy có thông tin gì.\n3. KH yêu cầu: CN phản hồi lại thông tin cho KH và có phương án xử lý trong khi đợi thiết bị như này","1. Thiết bị mạng của KH gặp sự cố, CN(A Tuấn) đã đến kiểm tra và phản hồi cần thay thiết bị tuy nhiên chưa hỗ trợ thay thế thiết bị cho KH\n\n2. KH cần CN đến hỗ trợ thay thế gấp để phục vụ công việc","KH chưa báo CN, KT\nKH báo sự cố NLMT điện tiêu thụ 50% trời nắng to nhưng phải chạy điện từ pin lưu trữ \nYêu cầu CN cho KT quaq kiểm tra hỗ trợ KH","KH đã báo CN\nKH báo sự cố NLMT cục wifi cháy không theo dõi được trên app \nYêu cầu CN cho KT qua kiểm tra hỗ trợ cho KH","CN 0973575722 báo sự cố hộ KH \n1.\tKH phản ánh: hiệu suất đang kém, ra điện 1 ngày 20kw thấp hơn \n2.\tKH yêu cầu: Qua kiểm tra, đo đạc lại thiết bị, khắc phục tình trạng hiệu suất kém","1. KH chưa báo CN\n2. KH quên mất tài khoản đăng nhập app theo dõi hiệu suất NLMT cần hỗ trợ đăng nhập lại app","1. KH ký hợp đồng NLMT trả góp 3 bên, đã hoàn thiện việc thanh toán cho bên thứ 3 tuy nhiên đến nay chưa nhận được hợp đồng từ chi nhánh\n\n2. KH phản ánh thiết bị Inverter bị đen màn hình, HT NLMT vẫn sử dụng tốt, nhân sự của CN đến kiểm tra và thông tin cần chuyển thiết bị đi bảo hành và thời gian khoảng 30 ngày\n\n3. KH không đồng ý chuyển thiết bị đi bảo hành do chưa có văn bản tháo gỡ, nhân viên đến kiểm tra chưa cung cấp lý do hỏng hóc thiết bị của KH, cần CN liên hệ và giải đáp cũng như chuyển hợp đồng cho KH","KH đã báo CN \nKH phản ánh hệ thống NLMT đang bị lỗi nhảy bật tắt liên tục \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH gấp","KH đã báo CN \nKh phản ánh hệ thống NLMT không thấy xả pin, không thấy điện lưới bù vào\nYêu cầu kĩ thuật xuống kiểm tra và xử lí cho KH","1. KH chưa báo CN\n2. KH phản ánh: Hiệu suất kém so với cả trước đây, năm ngoái lúc mới lắp lúc nắng như này thì điện đủ dùng nhưng tới hiện tại cũng nắng to mà điện ko đủ dùng thậm chí còn thiếu\n3. KH yêu cầu: KT xuống kiểm tra hiệu suất khắc phục tình trạng này","KH được hỗ trợ thực hiện đơn hàng DVKT từ ngày 01/06, sau đó 2 máy giặt của KH đang gặp sự cố, đơn hàng đã hết thời gian bảo hành\n\nKH cần KT đến kiếm tra và khắc phục giúp","KH đã báo CN \nKH phản ánh app hệ thống NLMT bị lỗi, không vào được \nYêu câu quản lí điều kĩ thuật xuống hỗ trợ cho khách","KH đã báo KT\nKH báo về việc lắp đặt hệ thống NLMT chậm chễ  hơn 1 tháng nay. Đã có KT liên hệ KH hẹn ngày lắp nhưng KH gọi lên tổng đài gay gắt nói nếu không đến lắp thì cho người đến tháo trả thiết bị ra cho KH \nYêu cầu CN cho KT đến hỗ trợ KH","KH chưa báo CN,KT\nKh báo sự cố NLMT không sản xuất ra điện hơn 3 tuần nay, tiền điện thì bị tăng \nYêu cầu CN cho KT qua kiểm tra cho KH","CN 0917862308 báo sự cố hộ KH\n1. KH phản ánh: Hiệu suất kém, tiền điện ko giảm\n2. KH yêu cầu: KT qua kiểm tra, khắc phục tình trạng này","1. KH chưa báo CN\n2. KH phản ánh: ko có điện vào biến tần, theo dõi trên app cũng thấy biến tần mất kết nối\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH phản ánh t6 ngày 5/6 có đặt đơn vệ sinh qua app là t7 đến vsinh. Sau đó ngày 6/6 KH nhận được cuộc gọi của KT là sửa máy lạnh và nhận bảo bên viettel. Khi đến, có 2 KT ko mặc đồng phục viettel và khi KH hỏi thì nhận là đối tác của Viettel. KT này còn đưa ra hình ảnh trên app nội bộ KT để chứng minh và KH có thấy đơn của KH ở đó. Trong lúc làm thì chất lượng ko được chuẩn, thậm chí còn ko có hóa đơn khi KH hỏi thì KT này bảo KT làm đối tác nên ko xuất hóa đơn được, và yêu cầu chuyển khoản số tiền thanh toán là 1tr250k. Sau đó vài ngày KH lại nhận được tin nhắn dời lịch hẹn đơn đến tận 12/6 trong khi đơn làm xong rồi. \n2. KH yêu cầu: VCC trả lời bằng văn bản qua đường mail viettelaio.polish480@passmail.net tường tình về trường hợp này và đưa ra phương án xử lý như nào, nếu ko KH sẽ làm việc với cơ quan chức năng để giải quyết.","KH chưa báo CN \nKH muốn kĩ thuật đến đấu nối lại hệ thống do KH thay nguồn điện từ 1 pha thành 3 pha\nYêu cầu quản lí điều kĩ thuật xuống hỗ trợ khách","1. KH chưa báo CN\n2. KH phản ánh: mất toàn bộ điện trong khi điện lưới vẫn có\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN\n2. KH phản ánh: KH có 2 HĐ NLMT, HĐ 1 là phía bên CN chưa có BBNT cho KH trong khi KH giục rất nhiều hệ này ko có pin lưu trữ và KH đang muốn gắn thêm pin lưu trữ và làm hợp đồng thứ 2 là KH đã có liên hệ với nv cũ là A Hội vào giữa t3 và bên CN phản hồi là do cháy hàng và phải chờ đến cuối t4 và mãi đến tận 19/5 mới cho KH ký HĐ trong khi KH đã có thanh toán tiền tạm ứng 90% rồi tới nay giữa t6 chưa thấy có thông tin gì. CN phản hồi là do HĐ đang gặp trục trặc rồi hết sự cố này tới sự cố kia, KH nhắn tin thì ko trả lời, gọi điện thì CN cúp máy. KH đang nghi ngờ CN có dấu hiệu lừa đảo\n3. KH yêu cầu: CN sắp xếp có 1 buổi làm việc gặp mặt trực tiếp vào t7 tuần này có nv đang làm việc với KH và quản lý KV, CN để giải quyết HĐ của KH đang gặp vấn đề gì, và đưa ra quyết định hướng xử lý như nào.","1. KH chưa báo CN \n2. KH phản ánh: lỗi điện nlmt\n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","1. KH đã báo CN: A Huy - trước lắp đặt NLMT\n2. KH phản ánh: Hiệu suất kém hệ 6kw nhưng thời điểm cao điểm nắng nhất cũng chỉ đạt được 3kw. KH theo dõi trên app hiệu suất cũng ko thấy hoạt động.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã liên hệ CN\n\n2. KH phản ánh tiền điện cần đóng đang tăng khoảng 3 tháng trở lại đây (Từ khoảng 5-6tr đến hơn 9tr)\n\n3. KH cần CN liên hệ và đến hỗ trợ kiểm tra sớm cho KH","1. KH đã liên hệ CN\n\n2. HT NLMT của KH hiện đang không phát sinh điện, lượng tiền điện cần đóng của KH gần đây tăng nhiều\n\n3. KH cần CN liên hệ và đến hỗ trợ khắc phục sớm","KH chưa báo CN \nKH phản ánh hệ thống NLMT bị lỗi \nYêu cầu quản lý chi nhánh điều k đồng là thi công trọn gói\n- Cục pin lưu trữ ko hoạt động\n3. KH cần CN liên hệ và giải đáp cho KH","1. KH chưa liên hệ CN\n\n2. KH đang gặp sự cố đóng điện để sử dụng điện NLMT thì bị nhảy áp , phải sử dụng điện lưới khoảng 3 ngày nay\n\n3. KH cần CN liên hệ và hỗ trợ sớm","1. KH đã báo CN: A Trứ, A Thịnh\n2. KH phản ánh: HĐ của KH 10 máy lạnh. Sự cố từ trước KT qua kiểm tra giờ KH thấy là bị đấu nối dậy bị lỗi mất 3 cái máy lạnh, nhà KH là điện 3 pha nhưng lại chỉ đấu 1 pha. KH có liên hệ CN nhưng chưa thấy qua hỗ trợ.\n3. KH yêu cầu: Qua kiểm tra lại việc lắp đặt và lắp đặt lại","KH chưa báo CN chưa báo KT\nKH báo sự cố NLMT đang không vào đc hệ thống giám sát \nYêu cầu CN cho KT xuống hõ trợ KH","KH đã báo CN\nKH phản ánh: Nắng to KH theo dõi trên app thì thấy dùng 100% điện lưới, ko thấy dùng nlmt cũng ko thấy có xả ra.\nKH yêu cầu: Qua kiểm tra, khắc phục tình trạng này cho KH","KH chưa báo chi nhánh\nĐiện đồng hồ tăng bất thường trong 2 tháng \nYêu cầu chi nhánh điều kĩ thuật đến kiểm tra","1. KH đã liên hệ CN\n\n2. HT NLMT của KH có 2 thiết bị Biến tần, 1 thiết bị đang không hoạt động, trên APp có cảnh báo không hoạt động khoảng 2 tuần nay, Hiệu suất sản sinh điện NLMT giảm hơn nửa, từ 35KW giảm còn 10-12 KW\n\n3, KH cần CN liên hệ và đến hỗ trợ","1 kh đã báo chi nhánh\n2 kh cần hỗ trợ xuất hóa đơn đỏ\n3 yêu cầu kt hỗ trợ khách hàng","CN 0968088033 báo sự cố hộ KH \n1. KH phản ánh: Bị bể 3 tấm pin. CN có qua kiểm tra tấm pin thì cũng thấy có vết từ trên trời rơi xuống, nhưng cũng chưa thể xác nhận chính xác được, KH cũng đang ko chấp nhận là do tác động vật lý. \n2. KH yêu cầu: Phản hồi lại thông tin cho KH và thay mới 3 tấm pin.","Đã báo chi nhánh \nLắp hệ 14Wp nhưng công suất chỉ được 8Wp\nYêu cầu kt qua ktra cho kh","Chưa báo chi nhánh\nNLMT nhà khách hàng gặp sự cố ko đạt hiệu suất \nhiện tại nhà khách hàng đang mất điện yêu cầu kt qua hỗ trợ gấp \nYêu cầu kt qua ktra cho khách hàng","chi nhánh báo hộ 0382691111\nBiến tần hoạt động không ổn định\nKh cần ktra trong ngày hôm nay hoặc ngày mai\nYêu cầu kt qua ktra cho khách hàng","1.KH chưa báo CN\n2. KH yêu cầu CN hoàn thiện hồ sơ để gửi cho bên điện lực\n3. Yêu cầu CN hỗ trợ và xử lí cho KH","Đã báo chi nhánh\nPin trữ sạc không đầy NLMT hiệu suất kém\nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ cho CN\n\n2. Hiệu Suất NLMT của KH bị giảm khoảng 15%, trước đây ngày nắng tốt phát sinh được 30kw/h hiện tại phát sinh được 25kw/h, CN kiểm tra và thông tin do Inverter bị nóng nên giảm hiệu suất\n\n3. KH cần CN hỗ trợ và khắc phục giúp HT NLMT của KH hoạt động bình thường","Kh đã báo chi nhánh \nBiến tần đang không chạy được\nYêu cầu kt qua ktra cho kh","1. KH đã liên hệ CN\n\n2. KH thay điện thoại nên chưa theo dõi được hiệu suất trên App, từ tin nhắn của điện lực thông tin sản lượng điện từ HT NLMT đang giảm nhiều khoảng 2 tháng gần dây\n\n3. KH cần CN liên hệ và đến kiểm tra cho KH","1. KH đã báo CN: Các sự cố từ trước và cũng đã có văn bản của CN gửi KH\n2. KH phản ánh: Về sự cố tấm pin bị vỡ do ngoại lực KH đang nghi ngờ tấm pin đang ko phải của chính hãng, KH có kiểm tra số serial tấm pin trên phần mềm AE Solar thì thấy báo ko có thông tin trên cty của hãng. Trước đó CN đến kiểm tra nhiều lần nhưng đến khi KH hỏi ngoại lực gì thì CN ko thấy nói. \n3. KH yêu cầu: Làm rõ thông tin, giải thích với KH về tấm pin. Nếu ko KH sẽ kéo pháp lý, đăng tin mxh, phá hoại cty, cảnh báo mọi người và dự kiến KH sẽ khởi kiện vào t6.","1. KH đã báo CN: A Đức\n2. KH yêu cầu: Cần hỗ trợ bản hợp đồng giấy NLMT có báo CN rồi và CN hứa hẹn là mang cho mà KH vẫn chưa thấy đâu. Ngoài ra, KH cần hỗ trợ, hướng dẫn làm thủ tục hồ sơ về NLMT để gửi bên điện lực.","Chưa báo chi nhánh \nInverter bị lỗi wifi không bắt được \nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Chẩu Văn Nghĩa\n2. KH phản ánh: pin lưu trữ đang bị gặp lỗi trước đó có ivt có mang đi bảo hành rồi mà có báo CN nhưng chưa thấy tháo dỡ nốt pin lưu trữ đi bảo hành.\n3. KH yêu cầu: Kiểm tra pin lưu trữ và mang thiết bị đi bảo hành","CN 0978852953 báo sự cố hộ KH\nKH báo sự cố Inverter mất điện nhưng vẫn chạy,pin lưu trữ có điện nhưng không xả điện \nYêu cầu CN liên hệ hỗ trợ KH","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. KH bị mất điện ngày  17/5, khi có điện lại HT NLMT của KH không hoạt động, trên APP chỉ có thông số điện lưới, không có phát sinh điện từ NLMT\n3. KH cần CN hỗ trợ khắc phục sớm\nĐịa chỉ lắp đặt: Số nhà 18, Ngõ 111, Phạm Đình Toái, Nghệ An","Đã báo chi nhánh \nKhách hàng đang thấy hệ thống NLMT đang không hoạt động\nyêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Ko thấy có điện nlmt nạp vào, và thấy gián đoạn từ 12h trưa - 3h chiều, 1 ngày chỉ khoảng 30kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","KH đã báo KT chưa báo CN \nKH báo giao thiếu 1 tấm pin NLMT của KH mà hơn 1 tháng nay chưa thấy giao nốt cho KH \nYêu cầu CN liên hệ KH gấp","1. KH chưa liên hệ với CN \n2. KH cần hỗ trợ hoàn thiện hồ sơ NLMT để gửi cho điện lực \n3. Yêu cầu CN liên hệ và hỗ trợ hoàn thiện hồ sơ cho KH","KH phản ánh 2 tấm Pin bị nứt, vỡ, võng. Yêu cầu kiểm tra, thay thế theo bảo hành","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng","CN 0976886777 báo sự cố hộ KH \n1. KH phản ánh: Tivi màn hình led bị lỗi ko lên màn hình.\n2. KH yêu cầu: Xuống kiểm tra, xử lý trong ngày hôm nay.","KH đã báo KT tên Huy chưa báo CN \nKH báo hiệu suất NLMT kém không đủ sạc  pin lưu trữ\nYêu cầu CN cho KT xuống kiểm tra lại cho KH gấp","1. KH đã báo CN \n2. KH phản ánh sự cố pin NLMT bị nổ KT đã xuống tháo nhưng KT chưa đem về kiểm tra và sửa cho KH, nay KH gọi lên yêu cầu KT có xuống đem về sửa cho KH không thì nói KH để còn biết KH lắp bên đơn vị khác\n3. Yêu cầu CN liên hệ và cho KT  xuống Ktra gấp cho KH, KH đang rất gay gắt","KHDN ký 1 Hợp đồng nhưng có 2 địa chỉ lắp đặt và cả 2 đang gặp sự cố. \n1. KH đã báo chi nhánh\n2. KH phản ánh: \n+ Tại Xã Lương Sơn, Tỉnh Phú Thọ: KH báo bị lỗi biến tần\n+ Tại Xã Hợp Thịnh, Tỉnh Bắc Ninh: KH báo tủ biến tần bị nổ cháy\n3. KH yêu cầu: KT trong tuần này liên hệ hỗ trợ","Khách hàng đang nhận định và khiếu nại hệ thống năng lượng mặt trời hoạt động không hiệu quả. Nguyên nhân do buổi sáng đón nắng tốt, nhưng đến trưa thì bị che bóng (nên theo khách, hệ 6kW nhưng công suất thấp chỉ sản sinh được 1kW thôi). Liên quan việc che bóng thì khách cho rằng Viettel không khảo sát kỹ từ đầu. Và có yêu cầu di dời tấm pin áp mái đến vị trí đón nắng tốt hơn (trong phạm vi 10 m trên mái nhà).\nNhờ KT xêp lịch hẹn sớm với khách hàng và hỗ trợ\nKhảo sat thực tế và lên phg án di dời các tấm pin","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra","1. KH đã liên hệ với CN, CN đã hỗ trợ tháo tấm pin lỗi\n2.KH nghe tiếng như có tiếng nổ, lên kiểm tra thấy tấm pin rạn vỡ, cần kiểm tra bảo hành\n3.KH cần CN hỗ trợ thông tin sớm","KH (work@namdd.dev) gửi mail phản ánh các vấn đề: \n1.\tTiền dây dẫn thừa: Đề nghị Viettel Phú Thọ thực hiện việc bồi hoàn lại tiền cho phần dây điện thừa do thi công sai lệch ban đầu.\n2.\tTiêu chuẩn vật tư tủ điện (Dựa trên buổi làm việc ngày 11/04/2026): Hai bên đã thống nhất ghi nhận hiện trạng là chưa xác định được vật tư bên trong tủ điện có đảm bảo đúng danh sách thiết bị và tiêu chuẩn kỹ thuật của công ty hay không. Tôi yêu cầu phía Tập đoàn và VCC cung cấp chi tiết danh sách vật tư và tiêu chuẩn kỹ thuật để gia đình có cơ sở so sánh với chiếc tủ trị giá 6.500.000 VNĐ hiện tại. Yêu cầu làm rõ tính an toàn khi sử dụng dây cáp DC để đấu nối cho phần AC và dây DC 6mm2 đi với MCB 63A. Thời hạn phản hồi: Trước ngày 20/04/2026.\n3.\tXử lý lỗi Inverter (SPD DC): Hệ thống liên tục báo lỗi DC SPD. Theo thông tin mới nhất, hiện DatGroup đang làm việc với hãng GoodWe và sẽ có email phản hồi kết quả xử lý trong vòng 02 ngày tới. Đề nghị phía Viettel bám sát để xử lý dứt điểm cho khách hàng .\n4.\tĐiều chỉnh chính sách bảo hành (Dựa trên buổi làm việc ngày 11/04/2026): Thông tin bảo hành combo biến tần và pin lưu trữ của hãng hiện không khớp với hợp đồng . Phía Chi nhánh Phú Thọ đã hẹn xử lý trong vòng 120 ngày kể từ ngày 11/04/2026. Như vậy, thời hạn cuối cùng để hoàn tất việc điều chỉnh này là ngày 09/08/2026.\n6.\tThao tác điều khiển thiết bị từ xa không báo trước: Giải trình về việc tài khoản viettelsolar.phutho@gmail.com tự ý \"Xóa dữ liệu báo động lỗi hồ quang\" và \"Vô hiệu hóa báo động chống sét\" ngày 12/04/2026 mà không thông báo hay nắm rõ mục đích xóa.","1. KH chưa báo CN\n2. KH đang sd NLMT nhưng hiện tại thiết bị ko xả điện\n3. YC KT qua kiểm tra và xử lý gấp\n***địa chỉ lắp đặt: kilo 63, khu đô thị đức tài, xã hoài đức, tỉnh lâm đồng.","1.Đã báo chi nhánh chưa: chưa báo\n2.Đã báo qua đâu: DTV HPC\n3.KH phản ánh về vấn đề: Hiệu suất hệ thấp.\n4.KH yêu cầu KT qua kiểm tra cho KH","1. Kh đã báo cn\n2. Kh phản ánh: Hệ của kh dạo này sd có hiện tượng liên tục bị sập. Kh đã báo kt và kt phản hồi do kh sd quá tải nhưng từ khi lắp đến nay kh báo chỉ dùng bằng đó thiết bị chứ ko hơn\n3. kh yc: YC cn hỗ trợ sớm"],"Ngày bắt đầu":["2026-06-16 08:18:00","2026-06-16 08:00:00","2026-06-16 08:00:00","2026-06-15 17:24:00","2026-06-15 16:09:00","2026-06-15 15:34:00","2026-06-15 14:45:00","2026-06-15 14:15:00","2026-06-15 13:30:00","2026-06-16 08:07:00","2026-06-16 08:00:00","2026-06-16 08:00:00","2026-06-15 16:15:00","2026-06-15 15:55:00","2026-06-15 15:19:00","2026-06-15 14:27:00","2026-06-15 14:07:00","2026-06-15 13:30:00","2026-06-15 13:30:00","2026-06-15 11 <script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>

<script>
  const CHECK_INTERVAL = 60000;
  
  async function getLastBuild() {
    const res = await fetch('/last-build.json?t=' + Date.now());
    const data = await res.json();
    return data.buildTime;
  }
  (async () => {
    const initialBuild = await getLastBuild();
    
    setInterval(async () => {
      const currentBuild = await getLastBuild();
      if (currentBuild !== initialBuild) {
        window.location.reload();
      }
    }, CHECK_INTERVAL);
  })();
</script>
