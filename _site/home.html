 KH yêu cầu: KH mong muốn hoàn lại số tiền cọc","yêu cầu kt gọi lai cho khách hàng","Đơn hàng làm xong 24/5 vẫn còn trong hạn bảo hành 72h\n1. KH phản ánh: Lúc trc vệ sinh thì thổi còn xe lạnh. Giờ thổi ra gió th chứ ko lạnh nữa. Thợ lúc ra kiểm tra van gas có đóng van gas lại ko. Và bạn thợ đến làm cho KH xong máy còn hôi mùi mốc khi mở máy. Dàn lạnh 3 ngày ko còn lạnh.\n2. KH yêu cầu: Qua kiểm tra lại cho KH\n*** KH đang cần bơm thêm gas","1. CN báo lỗi cho KH\n\n2.KH đã lắp đặt HT NLMT 1 tháng rồi nhưng chưa được hỗ trợ cài đặt App theo dõi hiệu suất\n\n3. KH cần CN liên hệ và đến hỗ trợ sớm","1. CN báo lỗi giúp KH\n\n2. KH bị mất giám sát trên APP theo dõi hiệu suất\n\n3. KH cần CN hỗ trợ sớm","yêu cầu kt gọi lại cho khách hàng","CN 0985745694 báo sự cố hộ KH\n1.\tKH phản ánh: điện chập chờn, 5p bị ngắt 1 lần\n2.\tKH yêu cầu: Trong ngày hôm nay qua kiểm tra hỗ trợ KH","1. KH đã báo CN: A Nam\n2. KH phản ánh: Hệ KH 12kw KH lắp vào mùa mát thì đạt được tầm 5-6kw nhưng đến hiện tại mùa nắng to thế này cũng chỉ đạt được 7kw và vẫn phải dùng điện lưới\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","CN 0348680595 báo sự cố hộ KH\n1. KH phản ánh: cục ats mang đi bảo hành và CN bảo đang gửi về rồi và trong ngày mai\n2. KH yêu cầu: Ngày mai lắp và vận hành hệ lại","chi nhánh báo hộ ( 0988777770)\nKh theo dõi trên app đang không thấy nlmt vào pin lưu trữ\nYêu cầu kt xuống ktra cho kh","***SĐT phản ánh: 0966968513\n1. KH chưa báo CN\n2. KH phản ánh: bị nhảy áp liên tục, ko dùng được điện nlmt, điện lưới vẫn vào.\n3. KH yêu cầu: Qua kiểm tra, tách điện lưới và điện nlmt","Đã báo chi nhánh\nNLMT đang lấy điện lưới vào rất nhiều \nYêu cầu kt qua ktra cho khách hàng","yêu cầu kt goi lại cho khách hàng","1 kh đã báo chi nhánh\n2 kh cần hỗ trợ xuất hóa đơn đỏ\n3 yêu cầu kt hỗ trợ khách hàng","Chưa báo chi nhánh\nKh thắc mắc 1 năm có người qua ktra bảo dưỡng và vsinh nhưng sau1 năm không thấy ai qua\nYêu cầu kt qua ktra cho khách hàng","Đã báo chi nhánh\nNLMT không vào điện inverter ko hiển thị\nYêu cầu kt qua ktra cho khách hàng","CN 0985951652 báo sự cố hộ KH\n1. KH phản ánh: bộ biến tần báo đỏ, ko có tín hiệu trên app, dây DC trên mái đang bị chạm mái.\n2.\tKH yêu cầu: qua kiểm tra, khắc phục tình trạng này","CN 0985951652 báo sự cố hộ KH\n1. KH phản ánh: pin lưu trữ ko thấy xả ra\n2. KH yêu cầu: KT qua kiểm tra xử lý","KH chưa báo chi nhánh\ntủ điện nhà khách hàng đang có tiếng kêu lạ\nyêu cầu kt qua ktra cho khách hàng","CN 0968088033 báo sự cố hộ KH \n1. KH phản ánh: Bị bể 3 tấm pin. CN có qua kiểm tra tấm pin thì cũng thấy có vết từ trên trời rơi xuống, nhưng cũng chưa thể xác nhận chính xác được, KH cũng đang ko chấp nhận là do tác động vật lý. \n2. KH yêu cầu: Phản hồi lại thông tin cho KH và thay mới 3 tấm pin.","Đơn hàng DVKT trong hạn bảo hành\n\nKH có đơn hàng DVKT được hỗ trợ thực hiện ngày 25/05, sau đó thiết bị của KH gặp một số sự cố:\n\n- Cánh đảo gió dàn lạnh bị kẹt và ko khép kín\n- Cục nóng ngoài trời lắp ráp ko khớp vỏ nên kêu to\n\nKH cần CN hỗ trợ và đến khắc phục sớm tuy nhiên không đồng ý việc Nhân sự Kỹ thuật đã đến hỗ trợ thực hiện việc bảo hành","KH có đơn hàng DVKT nội dung vệ sinh lồng máy giặt, KT có mang bo mạch  máy giặt của KH đi sửa, hiện KT chưa chuyển trả thiết bị và chưa liên hệ cho KH\n\nKH cần KT liên hệ và chuyển trả thiết bị cho KH gấp","1. Chi nhánh báo lỗi cho KH\n\n2.KH không theo dõi được hiệu suất NLMT trên App\n\n3. KH cần CN liên hệ và đến hỗ trợ sớm","chi nhánh báo hộ 0981168696\nKh hệ thống không kết nối dược app, app báo mất kết nối liên tục\nYêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Quên mật khẩu đăng nhập app theo dõi\n3. KH yêu cầu: KT liên hệ hỗ trợ","1. KH đã báo CN: A Nghĩa\n2. KH phản ánh: hiệu suất kém chưa ko đạt hiệu suất theo cam kết. Hệ 10kw nhưng chưa bao giờ lên được 7kw lúc đầu KH lắp 10 tấm và có lắp thêm 6 tấm nữa KT cũng bảo tối đa ít nhất là 13kw mà hiện tại chỉ vẫn có được 6-7kw. Ngoài ra còn thấy ưu tiên sử dụng điện lưới khi vẫn có điện tại pin lưu trữ và vào ban đêm cục dự trữ pin nút đỏ kêu, CN có bảo tắt 5-10p rồi bật lại là ko sao nhưng hiện tượng này KH thấy lặp đi lặp lại 4-5 lần rồi.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","ĐÃ báo chi nhánh\nPin lưu trữ đầy nhưng Pin NLMT vẫn lấy điện lưới \nyêu cầu kt qua ktra cho khách hàng","Đã báo chi nhánh \nLắp hệ 14Wp nhưng công suất chỉ được 8Wp\nYêu cầu kt qua ktra cho kh","1. KH chưa báo CN\n2 NLMT nhà Kh tủ điện nhà khách hàng nhảy át liên tục\n3 yêu cầu kt qua ktra cho khách hàng","Chưa báo chi nhánh\nKh lắp hệ 10Wp nhưng NLMt chỉ được 3Wp-4WP\nYêu cầu kt xuống ktra cho khách hàng","1. KH đã báo CN: A Thạnh, A Nhị\n2. KH phản ánh: Cục biến tần cứ kêu tít tít ko sử dụng được.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN\n2. KH phản ánh: bị nhảy áp, ko có điện nlmt để sử dụng trong khi vẫn có điện ở pin lưu trữ\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Chi nhánh báo hộ 971759579  \nInvertet bị lỗi đã bảo hành về nhưng vẫn bị lỗi \nYêu cầu kt xuống ktra cho kh","Chưa báo chi nhánh\nKH đang không vào được app \nYêu cầu kt hỗ trợ khách hàng","Chưa báo chi nhánh \nKh đang không vào được app\nYêu cầu kt hỗ trợ kh","Đã báo chi nhánh\nTrong tủ điện báo đèn đỏ và có tiếng kêu, ktra trên app ko hiển thị chức năng\nkhách hàng ở ( tỉnh phú thọ xã thượng cốc)\nYêu cầu kt qua ktra cho khách hàng","Chưa báo chi nhánh\nNLMT nhà khách hàng gặp sự cố ko đạt hiệu suất \nhiện tại nhà khách hàng đang mất điện yêu cầu kt qua hỗ trợ gấp \nYêu cầu kt qua ktra cho khách hàng","Đã báo chi nhánh\nNLMT chỉ kéo điện lưới vào chứ không sản xuất \nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ CN\n\n2. HT NLMT của KH có công suất 12KW, hiện tại ngày nắng tốt nhưng chỉ phát sinh được 2KW\n\n3. KH cần CN liên hệ và hỗ trợ sớm","Kh bảo dưỡng xong từ ngày 20/5 \nsau đó điều hòa chảy nước đã gọi cho kĩ thuật nhưng kĩ thuật báo để 1 ngày xem\nnhưng sau đó vẫn chảy nước nhưng gọi kĩ thuật chưa qua\nyêu cầu kt qua ktra cho khách hàng gấp","Đã báo chi nhánh \nKhách hàng muốn cài đặt lại tgian xả pin \nYêu cầu kt qua ktra cho kh","Đã báo chi nhánh\nNLMT chỉ kéo điện lưới vào không dùng điện pin lưu trữ\nYcau kt qua ktra cho khách hàng","chi nhánh báo hộ 0985792828\nKh hệ thống NLMT mất kết nối không hiển thị thông tin\nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN\n2. KH phản ánh: Ký HĐ từ 15/4 hiện tại đã hơn 1 tháng mà giờ vẫn chưa thi công lắp đặt trong khi đã có tập kết đầy đủ vật tư. CN có phản hồi cho KH là do nhiều công trình và hẹn nhiều lần nhưng chưa thấy thi công. \n3. KH yêu cầu: Hiện tại đã hơn 1 tháng KH đã đợi lâu quá rồi và KH có rất nhiều việc bận yêu cầu phía bên CN phản hồi lại thông tin là xem có lắp đặt được ko, nếu ko thì KH xin hủy HĐ thu hồi thiết bị để KH còn tìm đơn vị khác.","chi nhánh báo hộ 0382691111\nBiến tần hoạt động không ổn định\nKh cần ktra trong ngày hôm nay hoặc ngày mai\nYêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Hiện tại 1 áp ở trong hệ thống tổng tủ điện ko thấy nhảy lên và giờ đang ko sử dụng được \n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Kh đã báo chi nhánh anh phụng\nKh  có láp điện mặt trời với Viettel. Tôi cần cty hỗ trợ gửi thông báo vv lắp điện mặt trời tới cty Điện Lực\nyêu cầu kt hỗ trợ khách hàng","1. KH chưa báo CN\n2. KH báo sau khi lắp đặt được 1 tháng, aptomat 2 chiều bị đảo chiều. KH đã liên hệ cho KT nhưng không nghe máy\n3. Yêu cầu KT liên hệ và hỗ trợ xử lí cho KH","Đã báo chi nhánh \nKh lắp hệ 30Wh nhưng hiện tại công suất chưa được 50%\nYêu cầu kt qua ktra cho kh","1. KH đã báo CN: A Minh\n2. KH phản ánh: Nắng to KH theo dõi trên app thì thấy dùng 100% điện lưới, ko thấy dùng nlmt cũng ko thấy có xả ra.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này cho KH","Đã báo chi nhánh\nKh lắp hệ 8 wh nhưng hiện tại công suất tối đa của kh chỉ đc 3,5Wh \nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ CN\n\n2. KH không theo dõi được hiệu suất của HT NLMT trên APP\n\n3. KH cần chi nhánh liên hệ và hỗ trợ sớm","1.KH chưa báo CN\n2. KH yêu cầu CN hoàn thiện hồ sơ để gửi cho bên điện lực\n3. Yêu cầu CN hỗ trợ và xử lí cho KH","Đã báo chi nhánh\nPin trữ sạc không đầy NLMT hiệu suất kém\nYêu cầu kt qua ktra cho khách hàng","Đã báo chi nhánh\nNLMT kh báo bị sự cố chập chờn lúc có lúc không\nYêu cầu kt qua ktra  cho khách hàng","1. KH đã báo CN: A Cương, A Hưng\n2. KH phản ánh: Ko thấy có điện vào ắc quy, khi mất điện lưới thì cũng ko thấy có điện ở pin lưu trữ xả ra.\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này cho KH","1. KH đã liên hệ cho CN\n\n2. Hiệu Suất NLMT của KH bị giảm khoảng 15%, trước đây ngày nắng tốt phát sinh được 30kw/h hiện tại phát sinh được 25kw/h, CN kiểm tra và thông tin do Inverter bị nóng nên giảm hiệu suất\n\n3. KH cần CN hỗ trợ và khắc phục giúp HT NLMT của KH hoạt động bình thường","1. KH đã báo CN: Anh Long trước lắp đặt nhưng đang đi công tác \n2. KH phản ánh:  Lỗi ko sạc pin lưu trữ. Pin đã xả từ lúc sáng từ 50% xuống 0% sau đó dù có nắng và hệ thống điện mặt trời hoạt động nhưng công suất sạc pin hiển thị 0kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH chưa liên hệ\n\n2, Mức điện của KH phát sinh khi không sử dụng điện NLMT là 200 số/ngày, nếu đóng điện NLMT sẽ lã 295 số /ngày, mức tiền điện KH cần đóng thêm đang tăng cao\n\n3. KH cần CN đến hỗ trợ kiểm tra HT NLMT giúp KH","Kh đã báo chi nhánh \nBiến tần đang không chạy được\nYêu cầu kt qua ktra cho kh","1. CN báo lỗi cho KH\n\n2. HT NLMT của KH có dấu hiệu đẩy điện lưới, ắc quy báo 100% nhưng chỉ dùng điện lưới , sự cố từ hôm qua\n\n3. KH cần CN đến hỗ trợ kiểm tra sớm","Kh chưa báo chi nhánh\nKH mất điện là mất NLMT \nYêu cầu kt qua ktra cho khách hàng","Chưa báo chi nhánh\nHỏng đồng hồ chống phát ngược\nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ CN\n\n2. KH thay điện thoại nên chưa theo dõi được hiệu suất trên App, từ tin nhắn của điện lực thông tin sản lượng điện từ HT NLMT đang giảm nhiều khoảng 2 tháng gần dây\n\n3. KH cần CN liên hệ và đến kiểm tra cho KH","Chưa báo chi nhánh\nNLMT đang chỉ được 50% hiệu suất\nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ CN\n\n2. Công suất HT NLMT của KH là 6KW nhưng hiện nay chỉ phát sinh 4,5Kw và phải kéo thêm điện lưới \n\n3. KH cần CN đến kiểm tra và hỗ trợ sớm","1. KH đã báo CN: Các sự cố từ trước và cũng đã có văn bản của CN gửi KH\n2. KH phản ánh: Về sự cố tấm pin bị vỡ do ngoại lực KH đang nghi ngờ tấm pin đang ko phải của chính hãng, KH có kiểm tra số serial tấm pin trên phần mềm AE Solar thì thấy báo ko có thông tin trên cty của hãng. Trước đó CN đến kiểm tra nhiều lần nhưng đến khi KH hỏi ngoại lực gì thì CN ko thấy nói. \n3. KH yêu cầu: Làm rõ thông tin, giải thích với KH về tấm pin. Nếu ko KH sẽ kéo pháp lý, đăng tin mxh, phá hoại cty, cảnh báo mọi người và dự kiến KH sẽ khởi kiện vào t6.","Đã báo chi nhánh\nPin lưu trữ về 0% kh muốn pin lưu trữ không xuống 0% nếu không sẽ bị kêu báo động \nYêu cầu kt xuống ktra cho khách hàng","1. KH đã báo CN: A Đức\n2. KH yêu cầu: Cần hỗ trợ bản hợp đồng giấy NLMT có báo CN rồi và CN hứa hẹn là mang cho mà KH vẫn chưa thấy đâu. Ngoài ra, KH cần hỗ trợ, hướng dẫn làm thủ tục hồ sơ về NLMT để gửi bên điện lực.","1. Kh chưa báo CN\n2. KH báo cục pin lưu trữ không có điện\n3. Yêu cầu KT hỗ trợ và xử lí cho KH","1. KH đã báo CN\n2. KH phản ánh: tủ điện đang bị quá tải và bị cháy\n3. KH yêu cầu: KT qua kiểm tra xử lý, và chuẩn bị trước thiết bị để thay thế hoặc đưa ra phương án xử lý.","1. KH chưa liên hệ CN\n\n2. Không đăng nhập được vào App theo dõi hiệu suất NLMT\n\n3. KH cần CN liên hệ và đến hỗ trợ","1. KH chưa báo CN\n2. KH lắp 2 máy nhưng 1 máy chạy công suất hoạt động kém\n3. Yêu cầu KT hỗ trợ và xử lí cho KH","1. KH đã báo CN \n2. KH đã kí hợp đồng từ 20/4 và thanh toán đầy đủ nhưng vẫn chưa được lắp đăt. KH rất gay gắt. Nếu từ giờ đến 2 ngày tới mà không được hỗ trợ KH sẽ đăng bài phốt\n3. Yêu cầu KT hỗ trợ lắp đặt cho KH","1. KH đã báo CN (anh phụ trách ký HĐ KH ko muốn nhắc tên)\n2. KH phản ánh: Đã ký hợp đồng nlmt được 20 ngày rồi mà giờ vẫn chưa lắp xong, chỉ lắp được mỗi pin còn những bộ phận khác không thấy gì. KH có liên hệ CN thì hứa hẹn hết ngày này qua ngày khác giờ thì gọi điện ko được, cũng ko thấy ai liên hệ với KH. KH rất bức xúc.\n3. KH yêu cầu: Từ giờ tới t2 mà ko lắp đặt yêu cầu CN tháo hết xuống mang về và hủy HĐ.","Chưa báo chi nhánh\nPin lưu trữ xả nhưng không nạp \nYêu cầu kt qua kiểm tra cho khách hàng","1. KH đã báo CN: Theo sự cố từ trước TT_1778764353916\n2. KH phản ánh: Từ khi lắp thêm pin lưu trữ đầu tháng tới giờ ko thấy xả ra, KT trước có qua xử lý thì chỉ hướng dẫn là ko xả được thì reset lại ắc quy pin lưu trữ mà KH thấy cứ bật đi bật lại thế này rất bất tiện.\n3. KH yêu cầu: KT qua kiểm tra nguyên nhân, xử lý dứt điểm tình trạng này.","1. KH đã báo CN: Anh Tiệp\n2. KH phản ánh: Khảo sát vị trí chưa đúng, hiện tại chỗ đang lắp đang ko có nắng KH cần di chuyển ra chỗ khác, KH đã báo CN mà CN bảo bận và hẹn sang tuần làm. CN thì phản hồi KH là nghiệm thu HĐ xong thì mới hỗ trợ KH, KH đang ko hiểu nếu nghiệm thu thế này xong thì còn hỗ trợ di chuyển lắp đặt không. \n3. KH yêu cầu: Phản hồi lại rõ thông tin cho KH để đảm bảo quyền lợi cho KH và hỗ trợ di chuyển theo vị trí đúng.","2. Tủ điện ATS tự chuyển đổi không tự động chuyển điện NLMT khi KH bị mất điện lưới ngày 22/05, đường dây điện vào bị cháy\n\n3. KH cần CN liên hệ và hỗ trợ khắc phục sớm","Đơn hàng trong hạn bảo hành\n\n1. KH chưa liên hệ CN\n\n2. THiết bị điều hòa của KH chỉ mát chứ ko lạnh sâu\n\n3. KH cần thợ kỹ thuật đến đo kiểm tra gas xem có còn đủ không, nếu hao hụt nhiều thì kiểm tra ống dẫn gas xem có bị dò hở không, nếu thiếu gas thì bổ sung gas R22 cho KH","1. KH chưa liên hệ CN\n\n2.KH chưa theo dõi đc hiệu suất qua app, Hiệu suất HT NLMT không như quảng cáo, đội ngũ hỗ trợ tại CN chậm \n\n3. KH cần CN hỗ trợ liên hệ sớm","kh đã báo chi nhánh\nNLMT nhà khách hàng công suất thấp không đạt yếu cầu\nyeu cầu kt xuống ktra cho khách hàng","Chưa báo chi nhánh \nInverter bị lỗi wifi không bắt được \nYêu cầu kt qua ktra cho khách hàng","Đã chi nhánh \nKh thấy điện NLMt kéo điện lưới vào quá nhiều\nYêu cầu kt qua ktra cho khách hàng","1. KH chưa liên hệ CN\n\n2. KH cần hỗ trợ cài lại app theo dõi hiệu suất NLMT, thời gian gần đây không nhận được tin nhắn thông báo sản lượng điện NLMT \n\n3. KH cần CN hỗ trợ sớm","1. KH đã báo CN: A Chẩu Văn Nghĩa\n2. KH phản ánh: pin lưu trữ đang bị gặp lỗi trước đó có ivt có mang đi bảo hành rồi mà có báo CN nhưng chưa thấy tháo dỡ nốt pin lưu trữ đi bảo hành.\n3. KH yêu cầu: Kiểm tra pin lưu trữ và mang thiết bị đi bảo hành","Đã báo chi nhánh \nAbs bị hỏng khách hàng sẵn abs \nYêu cầu kt xuống lắp cho khách hàng","CN 0978852953 báo sự cố hộ KH\nKH báo sự cố Inverter mất điện nhưng vẫn chạy,pin lưu trữ có điện nhưng không xả điện \nYêu cầu CN liên hệ hỗ trợ KH","1. KH đã liên hệ CN (Lê Ánh)\n\n2.Tối 8h Pin đóng không xả điện, sáng KH chỉ dùng được điện lưới dù pin lưu trữ vần còn 75% , Qua App thông báo Pin còn 10-15% tuy nhiên KH kiểm tra thì Pin lưu trữ thông tin vẫn còn 4 cọc\n\n3. KH cần CN hỗ trợ kiểm tra sớm cho KH","Đã báo chi nhánh\nBIến tần nhà khách hàng bị hỏng \nYêu cầu kt xuống ktra cho khách hàng","Đã báo chi nhánh\nĐiện năng lượng mt chập chờn, kh lắp hệ 12Wh nhưng chỉ được 6Wh\nYêu cầu kt xuống kiểm tra cho khách hàng","1. KH chưa liên hệ CN\n\n2. HT NLMT của KH đang không hoạt động\n\n3. KH cần CN liên hệ và hỗ trợ sớm","1. KH chưa liên hệ CN\n\n2. Ht NLMT có dấu hiệu giảm hiệu suất, ban ngày ko đủ dùng, trung bình một ngày nắng nóng phát sinh 5-6Kw điện NLMT, bây giờ chỉ phát sinh 3-4kw điện NLMT, CN đã đến khảo sát cho KH và chưa có động thái hỗ trợ thêm\n\n3. KH cần CN liên hệ và hỗ trợ gấp, KH đang rất bức xúc","1. KH chưa liên hệ CN\n\n2. Những hôm nắng to Điện NLMT chỉ đạt hiệu suất 25-30% cố định do lệch pha từ khi lắp HT NLMT \n\n3. KH cần CN đến nhà KH trao đổi với nhân sự đấu điện cho KH dể thống nhất và có phương án xử lý lệch pha điện NLMT","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. KH bị mất điện ngày  17/5, khi có điện lại HT NLMT của KH không hoạt động, trên APP chỉ có thông số điện lưới, không có phát sinh điện từ NLMT\n3. KH cần CN hỗ trợ khắc phục sớm\nĐịa chỉ lắp đặt: Số nhà 18, Ngõ 111, Phạm Đình Toái, Nghệ An","Đã báo chi nhánh \nKhách hàng đang thấy hệ thống NLMT đang không hoạt động\nyêu cầu kt qua ktra cho khách hàng","1. KH chưa báo lên chi nhánh\n2. KH báo KH bị quên mật khẩu của app NLMT \n3. KH yêu cầu KT đến hỗ trợ","1. KH chưa báo CN\n2. KH phản ánh: Ko thấy có điện nlmt nạp vào, và thấy gián đoạn từ 12h trưa - 3h chiều, 1 ngày chỉ khoảng 30kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Đã báo chi nhánh \n1 tấm pin nlmt bị nứt  \nYêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: pin ko đạt hiệu suất, trời nắng gắt chỉ đạt được 60-70% hiệu suất.\n3. KH yêu cầu: Qua kiểm tra thiết bị và khắc phục tình trạng này","KH đã báo KT chưa báo CN \nKH báo giao thiếu 1 tấm pin NLMT của KH mà hơn 1 tháng nay chưa thấy giao nốt cho KH \nYêu cầu CN liên hệ KH gấp","1. KH chưa liên hệ với CN \n2. KH cần hỗ trợ hoàn thiện hồ sơ NLMT để gửi cho điện lực \n3. Yêu cầu CN liên hệ và hỗ trợ hoàn thiện hồ sơ cho KH","1. Lỗi biến tần INV không hoạt động, đang chạy bình thường thì tắt sau đó cứ tắt đi bật lại khoảng 1 tuần, lỗi quạt tản nhiệt\n2. KH đã liên hệ cho CN và được hỗ trợ chuyển thiết bị đi bảo hành\n\n3. KH cần CN hỗ trợ khắc phục sớm cho KH","Chưa báo chi nhánh\nĐang có 1 tấm pin bị vỡ \nYêu cầu kt qua ktra cho khách hàng","KH phản ánh 2 tấm Pin bị nứt, vỡ, võng. Yêu cầu kiểm tra, thay thế theo bảo hành","1. KH đã báo CN\n2. KH phán ánh: Sự cố từ trước về 1 đèn NLMT xử lý xong rồi nhưng giờ đèn NLMT còn lại lại thấy sáng yếu hơn. KH có trao đổi với KT thì KT bảo KH tự mang xuống mang đi bảo hành trong khi lần trước là KT vẫn xuống mang đi bảo hành mà lần này lại bảo ko.\n3. KH yêu cầu: Xuống kiểm tra đèn nlmt còn lại nếu cần thì mang đi bảo hành.","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Ko có thấy nạp điện vào, KH xem trên app thì cảnh báo lỗi mấy ngày hôm nay.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","1. KH đã liên hê CN và được hỗ trợ tháo thiết bị để chuyển cho hãng\n2. Pin lưu trữ của KH bị lỗi\n3. KH cần CN hỗ trợ khắc phục sớm","1.  KH chưa báo chi nhánh\n2. KH báo lỗi inverter không hoạt động, báo lỗi không hiển thị màn hình\n3. Yêu cầu Chi nhanh cho Kỹ thuật xuống hỗ trợ KH gấp","Khách hàng chưa báo Chi nhanh chưa báo Kỹ thuật\nKhách hàng báo sự cố năng lượng mặt trời không đủ điện cấp tải \nYêu cầu chi nhánh cho kỹ thuật đến hỗ trợ cho khách hàng gấp","CN 0976886777 báo sự cố hộ KH \n1. KH phản ánh: Tivi màn hình led bị lỗi ko lên màn hình.\n2. KH yêu cầu: Xuống kiểm tra, xử lý trong ngày hôm nay.","6/5 lắp đặt anh tân đã hứa với khách hàng \nKh muốn hủy hợp đồng NLMT \nYêu cầu kt gọi lại cho kh","KH đã báo KT tên Huy chưa báo CN \nKH báo hiệu suất NLMT kém không đủ sạc  pin lưu trữ\nYêu cầu CN cho KT xuống kiểm tra lại cho KH gấp","1. KH đã báo CN \n2. KH phản ánh sự cố pin NLMT bị nổ KT đã xuống tháo nhưng KT chưa đem về kiểm tra và sửa cho KH, nay KH gọi lên yêu cầu KT có xuống đem về sửa cho KH không thì nói KH để còn biết KH lắp bên đơn vị khác\n3. Yêu cầu CN liên hệ và cho KT  xuống Ktra gấp cho KH, KH đang rất gay gắt","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. Inverter bị lỗi không lưu điện vào trong pin, đổi dòng dùng điện trực tiếp được nhưng không vào pin lưu trữ\n3. KH y/c CN hỗ trợ đổi thiết bị mới cho KH","KHDN ký 1 Hợp đồng nhưng có 2 địa chỉ lắp đặt và cả 2 đang gặp sự cố. \n1. KH đã báo chi nhánh\n2. KH phản ánh: \n+ Tại Xã Lương Sơn, Tỉnh Phú Thọ: KH báo bị lỗi biến tần\n+ Tại Xã Hợp Thịnh, Tỉnh Bắc Ninh: KH báo tủ biến tần bị nổ cháy\n3. KH yêu cầu: KT trong tuần này liên hệ hỗ trợ","Khách hàng đang nhận định và khiếu nại hệ thống năng lượng mặt trời hoạt động không hiệu quả. Nguyên nhân do buổi sáng đón nắng tốt, nhưng đến trưa thì bị che bóng (nên theo khách, hệ 6kW nhưng công suất thấp chỉ sản sinh được 1kW thôi). Liên quan việc che bóng thì khách cho rằng Viettel không khảo sát kỹ từ đầu. Và có yêu cầu di dời tấm pin áp mái đến vị trí đón nắng tốt hơn (trong phạm vi 10 m trên mái nhà).\nNhờ KT xêp lịch hẹn sớm với khách hàng và hỗ trợ\nKhảo sat thực tế và lên phg án di dời các tấm pin","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","kh chưa báo chi nhánh ko thấy HĐ điện tử nhg khách hàng đã chụp hợp đồng giấy qua zalo\nNlmt không sản xuất ra điện\nyêu cầu kt qua ktra cho khách hàng","chưa báo chi nhánh\nbiến tần ko báo điện hệ thống năng lượng mặt trời đang ko dùng được\nyêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ với CN nhưng chưa tiếp nhận: Có liên hệ với CN là a Bùi Anh Nguyễn nhưng ko nghe máy, và cũng ko thấy gọi lại.\n2. KH phản ánh: Pin tích điện đủ nhưng ko thấy xả ra để dùng. KH đã báo bên điện lực đến kiểm tra và đã đo đồng hồ các thứ và ko bị làm sao. Tiền điện bây giờ vẫn tăng cao lúc chưa lắp là 8tr tư vấn lắp đặt thông tin là 2tr mà những tháng đầu tiền điện 4tr. Và khi sập điện lưới bật quạt để chạy thử sang nlmt thì được 1 lúc lại tự ngắt rồi lại dùng điện lưới.\n3. KH yêu cầu: Qua kiểm tra thiết bị xem và khắc phục tình trạng này.","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","1. KH đã báo CN (KH ko nhớ rõ tên)\n2. KH phản ánh: Cách đây 4 hôm hệ của KH bị sét đánh, KH cũng ko rõ là ở đâu chỉ thấy áp ở tủ điện nhảy xuống, điện ko phát lên lưới và thấy bị hỏng.\n3. KH yêu cầu: KT qua kiểm tra, khắc phục tình trạng này cho KH.","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra","1. KH đã liên hệ với CN, CN đã hỗ trợ tháo tấm pin lỗi\n2.KH nghe tiếng như có tiếng nổ, lên kiểm tra thấy tấm pin rạn vỡ, cần kiểm tra bảo hành\n3.KH cần CN hỗ trợ thông tin sớm","KH cần mẫu bổ sung số 01 để báo với điện lực gia đình đang sử dụng NLMT theo nghị định 13 \nYêu cầu KT liên hệ lại KH gấp","KH (work@namdd.dev) gửi mail phản ánh các vấn đề: \n1.\tTiền dây dẫn thừa: Đề nghị Viettel Phú Thọ thực hiện việc bồi hoàn lại tiền cho phần dây điện thừa do thi công sai lệch ban đầu.\n2.\tTiêu chuẩn vật tư tủ điện (Dựa trên buổi làm việc ngày 11/04/2026): Hai bên đã thống nhất ghi nhận hiện trạng là chưa xác định được vật tư bên trong tủ điện có đảm bảo đúng danh sách thiết bị và tiêu chuẩn kỹ thuật của công ty hay không. Tôi yêu cầu phía Tập đoàn và VCC cung cấp chi tiết danh sách vật tư và tiêu chuẩn kỹ thuật để gia đình có cơ sở so sánh với chiếc tủ trị giá 6.500.000 VNĐ hiện tại. Yêu cầu làm rõ tính an toàn khi sử dụng dây cáp DC để đấu nối cho phần AC và dây DC 6mm2 đi với MCB 63A. Thời hạn phản hồi: Trước ngày 20/04/2026.\n3.\tXử lý lỗi Inverter (SPD DC): Hệ thống liên tục báo lỗi DC SPD. Theo thông tin mới nhất, hiện DatGroup đang làm việc với hãng GoodWe và sẽ có email phản hồi kết quả xử lý trong vòng 02 ngày tới. Đề nghị phía Viettel bám sát để xử lý dứt điểm cho khách hàng .\n4.\tĐiều chỉnh chính sách bảo hành (Dựa trên buổi làm việc ngày 11/04/2026): Thông tin bảo hành combo biến tần và pin lưu trữ của hãng hiện không khớp với hợp đồng . Phía Chi nhánh Phú Thọ đã hẹn xử lý trong vòng 120 ngày kể từ ngày 11/04/2026. Như vậy, thời hạn cuối cùng để hoàn tất việc điều chỉnh này là ngày 09/08/2026.\n6.\tThao tác điều khiển thiết bị từ xa không báo trước: Giải trình về việc tài khoản viettelsolar.phutho@gmail.com tự ý \"Xóa dữ liệu báo động lỗi hồ quang\" và \"Vô hiệu hóa báo động chống sét\" ngày 12/04/2026 mà không thông báo hay nắm rõ mục đích xóa.","1. KH đã báo cn: a Hoàng Đình Nhâm\n2. KH phản ánh: KH đã báo cn nhiều lần nhưng chưa được hỗ trợ. Hệ của KH 6 cục pin nhưng chỉ thấy xả 3 cục và chỉ xài được 1 lúc là nó hết.\n3. KH yêu cầu: Điều KT qua kiểm tra, khắc phục tình trạng này cho KH.\n***SĐT phản ánh và liên hệ: 0706455040","- KH báo qua chị Phượng (CN) \n- KH đang gặp sự cố ắc quy, 2 khối ắc quy 1 khối xả 1 khối không\n- Kh yêu cầu xử lý sớm","1. KH chưa báo CN\n2. KH đang sd NLMT nhưng hiện tại thiết bị ko xả điện\n3. YC KT qua kiểm tra và xử lý gấp\n***địa chỉ lắp đặt: kilo 63, khu đô thị đức tài, xã hoài đức, tỉnh lâm đồng.","Mất 1 string điện không vào ắc quy. Không đủ cung cấp cho tải nhà dùng . Anh cần đến kiêm tra trong ngày hôm nay.\n**Địa chỉ lắp đặt: số nhà 300, kim tân, xã đoài phương, thành phố hà nội.","1.Đã báo chi nhánh chưa: chưa báo\n2.Đã báo qua đâu: DTV HPC\n3.KH phản ánh về vấn đề: Hiệu suất hệ thấp.\n4.KH yêu cầu KT qua kiểm tra cho KH","1. KH chưa báo cn\n2. KH phản ánh: Sự cố từ TT_1772587360264 trước sau khi xử lý KH thấy hệ thống nlmt ko có ổn định, lâu lâu tự ngắt và phải bảo nv tắt 3 công tắc cp đi bật lại mãi mới được.\n3. KH yêu cầu: Kiểm tra lại hàng hóa xem có đúng với HĐ về chất lượng, hiệu suất không. Nếu có vấn đề thì thay mới tinh cho KH để hệ thống vận hành trơn tru.","1. Kh đã báo cn\n2. Kh phản ánh: Hệ của kh dạo này sd có hiện tượng liên tục bị sập. Kh đã báo kt và kt phản hồi do kh sd quá tải nhưng từ khi lắp đến nay kh báo chỉ dùng bằng đó thiết bị chứ ko hơn\n3. kh yc: YC cn hỗ trợ sớm","- Đối tác Công ty cổ phần SPT Việt Nam (sdt phản ánh 0975014010) tiếp tục gọi tđ phản ánh về vấn đề chậm trễ tiến độ và thiếu nhân lực thi công cho dự án Thi công lắp đặt hệ thống Chiller. \n- Kh báo hiện tại vẫn chậm tiến độ, cn ko thay đổi hay tiến triển thêm gì\n- Mã hợp đồng: 23092025/HĐTP-SPT-VIETTEL.\n- Kh yc: Yc TCT có biện pháp xử lý rõ ràng cho kh"],"Ngày bắt đầu":["2026-05-28 08:00:00","2026-05-28 08:00:00","2026-05-27 16:13:00","2026-05-27 15:53:00","2 <script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

    });

    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>
