KW, thông tin tấm pin trong HĐ và lắp đặt thực tế khác nhau\n\n3. KH cần CN đến hỗ trợ khắc phục gấp cho KH","KH phản ánh Bình lưu trữ vẫn nạp bth nhưng lúc mất điện là không cấp điện cho KH dùng\nYêu cầu kĩ thuật liên hệ và xuống kiểm tra cho KH","KH chưa báo CN chưa báo KT\nKH báo sự cố NLMT bình ac quy kêu cả đêm liền mây ngày \nYêu cầu CN cho KT xuống hỗ trợ KH","KH chưa báo CN chưa báo KT \nKH báo sự cố NLMT không hoạt động từ ngày 30/5 đến nay \nYêu cầu CN cho KT xuống hỗ trợ cho KH gấp","KH đã báo CN\nKH phản ánh: Nắng to KH theo dõi trên app thì thấy dùng 100% điện lưới, ko thấy dùng nlmt cũng ko thấy có xả ra.\nKH yêu cầu: Qua kiểm tra, khắc phục tình trạng này cho KH","Khách hàng đã báo chi nhánh\nHệ thống năng lượng bị sập, không hoạt động\nYêu cầu chi nhánh điều kĩ thuật kiểm tra","KH chưa báo KT chưa báo CN\nKH báo sự cố NLMT hiện tại điện áp bị cao quá\nYêu cầu CN cho KT xuống hỗ trợ gấp","KH chưa báo chi nhánh\nĐiện đồng hồ tăng bất thường trong 2 tháng \nYêu cầu chi nhánh điều kĩ thuật đến kiểm tra","KH chưa báo chi nhánh \nKH phản ánh lắp thiếu 1 cục pin lưu trữ chưa lắp cho khách, khách báo kĩ thuật nhưng kĩ thuật chậm hẹn vì không có linh kiện \nYêu cầu chi nhánh liên hệ lại cho KH","KH đã báo bên chi nhánh. \nKhách hàng báo tiến độ triển khai chậm \nYêu cầu chi nhánh cho kĩ thuật xuống hỗ trợ KH","1. KH đã liên hệ CN\n\n2. CN đã vận chuyển vật tư thiết bị đến nhà KH tuy nhiên chưa tiến hàng lắp đặt, hoàn thiện hẹ thống\n\n3, KH cần CN đến hỗ trợ lắp đặt cho KH sớm","CN báo sự cố hộ KH (0986688282)\nKH gặp sự cố nlmt điện lưới chập chợt không hoạt động được\nYêu cầu KT xuống hỗ trợ KH","KH có YCTX tư vấn thang máy nhưng 4 5 ngày rồi chưa có ai liên hệ tư vấn cho KH \nYêu cầu CN liên hệ tư vấn ngay cho KH","1. KH chưa báo CN\n2. Kh báo 3 ngày vừa rồi hệ thống không chạy điện\n3. Yêu cầu CN điều KT xuống hỗ trợ KH gấp","Đã  báo chi nhánh \nMàn hình inveter lúc bật lúc tắt, kêu tạch tạch \nYêu cầu kĩ thuật qua kiểm tra cho khách hàng gấp","1. KH đã báo CN: A Tống - ký hợp đồng, A Cảnh - đội thi công lắp láp\n2. KH phản ánh: Tiếp địa k thấy làm theo quy trình mà đấu trực tiếp vào cột nhà, có báo lại nhưng chưa thấy kỹ thuật đến xử lí. Vì trời đang vào mùa mưa xét nhiều nên nguy hiểm.\n3. KH yêu cầu: Qua kiểm tra, xử lý đấu nối tiếp địa","1. KH đã liên hệ CN\n\n2. HT NLMT của KH có 2 thiết bị Biến tần, 1 thiết bị đang không hoạt động, trên APp có cảnh báo không hoạt động khoảng 2 tuần nay, Hiệu suất sản sinh điện NLMT giảm hơn nửa, từ 35KW giảm còn 10-12 KW\n\n3, KH cần CN liên hệ và đến hỗ trợ","1. KH đã liên hệ với chi nhánh\n\n2. HT NLMT của KH chưa được hoàn thiện hạng mục dây tiếp địa\n\n3. KH cần CN liên hệ và hỗ trợ sớm cho KH\n\n3. KH cần CN liên hệ và đến hỗ trợ","0986688282 chi nhánh báo hộ \nNLMT bị nhảy asttomat liên tục KH đang mất cả điện NLMT cả điện lưới\nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN\n2. KH phản ánh: Trước đó CN hỗ trợ cung cấp hình ảnh thiết bị nhưng khi KH đưa cho bên điện lực thì bị từ chối và trả lại. KH đang thấy bên điện lực bắt cung cấp CO,CQ và phải có dấu mộc nguồn gốc sản phẩm.\n3. KH yêu cầu: Hỗ trợ KH hoàn thiện nốt hồ sơ","Đã báo chi  nhánh \nÁc quy lưu trữ ko vào pin, không có lưu trữ\nYêu cầu kt qua ktra cho kh","1. KH chưa báo CN\n2. KH phản ánh: Nắng to nhưng khi mất điện lưới ko thấy có điện nlmt để sử dụng\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Chưa báo chi nhánh \nBiến tần nhà khách hàng đang lỗi \nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN\n2. KH cần hỗ trợ gửi lại biên bản nghiệm thu, bảng báo giá, CO, CQ và hướng dẫn làm thủ tục hồ sơ để gửi phía bên điện lực. Gửi qua đường mail: tuananhsocsonhanoi@gmail.com","1. KH đã liên hệ cho CN\n2. HT NLMT của KH đang ko sản xuất và tích đủ điện để sử dụng, Sáng nắng to, đến chiều khi mất điện KH bật bóng đèn không sáng\n3. KH cần CN đến hỗ trợ và khắc phục sớm\"","kh gọi hotline báo kt qua bảo dưỡng ko làm đúng quy trình (ko đo gas) , ko mặc đồng phục, kh hỏi thì bảo mình là bên thứ 3 nhận việc ăn chia tiền với Viettel thôi, kh báo hiện tại điều hòa vệ sinh xong vẫn ko mát (nghi do hết gas nhưng kt báo máy bình thường nên ko đo gas và ko bơm gas cho kh) kh cần kt của Viettel qua kiểm tra lại cho kh","CN 0965313434 báo sự cố hộ KH\n1. KH phản ánh: hệ thống điện bị ngắt, có thể bị hỏng ats\n2. KH yêu cầu: Qua kiểm tra, hỗ trợ, xử lý tình trạng","CN 0984299113 báo sự cố hộ KH\n1. KH phản ánh: hiệu suất ko đạt, KH lắp 16kw nhưng 1 ngày ắc quy ko đầy chỉ đạt được 81%.\n2. KH yêu cầu: Qua kiểm tra lại hiệu suất cho KH","1. CN báo lỗi cho KH\n\n2.KH đã lắp đặt HT NLMT 1 tháng rồi nhưng chưa được hỗ trợ cài đặt App theo dõi hiệu suất\n\n3. KH cần CN liên hệ và đến hỗ trợ sớm","1. CN báo lỗi giúp KH\n\n2. KH bị mất giám sát trên APP theo dõi hiệu suất\n\n3. KH cần CN hỗ trợ sớm","1 kh đã báo chi nhánh\n2 kh cần hỗ trợ xuất hóa đơn đỏ\n3 yêu cầu kt hỗ trợ khách hàng","Đã báo chi nhánh\nNLMT không vào điện inverter ko hiển thị\nYêu cầu kt qua ktra cho khách hàng","CN 0968088033 báo sự cố hộ KH \n1. KH phản ánh: Bị bể 3 tấm pin. CN có qua kiểm tra tấm pin thì cũng thấy có vết từ trên trời rơi xuống, nhưng cũng chưa thể xác nhận chính xác được, KH cũng đang ko chấp nhận là do tác động vật lý. \n2. KH yêu cầu: Phản hồi lại thông tin cho KH và thay mới 3 tấm pin.","1. KH đã báo CN: A Nghĩa\n2. KH phản ánh: hiệu suất kém chưa ko đạt hiệu suất theo cam kết. Hệ 10kw nhưng chưa bao giờ lên được 7kw lúc đầu KH lắp 10 tấm và có lắp thêm 6 tấm nữa KT cũng bảo tối đa ít nhất là 13kw mà hiện tại chỉ vẫn có được 6-7kw. Ngoài ra còn thấy ưu tiên sử dụng điện lưới khi vẫn có điện tại pin lưu trữ và vào ban đêm cục dự trữ pin nút đỏ kêu, CN có bảo tắt 5-10p rồi bật lại là ko sao nhưng hiện tượng này KH thấy lặp đi lặp lại 4-5 lần rồi.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Đã báo chi nhánh \nLắp hệ 14Wp nhưng công suất chỉ được 8Wp\nYêu cầu kt qua ktra cho kh","1. KH chưa báo CN\n2 NLMT nhà Kh tủ điện nhà khách hàng nhảy át liên tục\n3 yêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Thạnh, A Nhị\n2. KH phản ánh: Cục biến tần cứ kêu tít tít ko sử dụng được.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","Chi nhánh báo hộ 971759579  \nInvertet bị lỗi đã bảo hành về nhưng vẫn bị lỗi \nYêu cầu kt xuống ktra cho kh","Chưa báo chi nhánh\nNLMT nhà khách hàng gặp sự cố ko đạt hiệu suất \nhiện tại nhà khách hàng đang mất điện yêu cầu kt qua hỗ trợ gấp \nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ CN\n\n2. HT NLMT của KH có công suất 12KW, hiện tại ngày nắng tốt nhưng chỉ phát sinh được 2KW\n\n3. KH cần CN liên hệ và hỗ trợ sớm","Đã báo chi nhánh\nNLMT chỉ kéo điện lưới vào không dùng điện pin lưu trữ\nYcau kt qua ktra cho khách hàng","chi nhánh báo hộ 0382691111\nBiến tần hoạt động không ổn định\nKh cần ktra trong ngày hôm nay hoặc ngày mai\nYêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Hiện tại 1 áp ở trong hệ thống tổng tủ điện ko thấy nhảy lên và giờ đang ko sử dụng được \n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Đã báo chi nhánh \nKh lắp hệ 30Wh nhưng hiện tại công suất chưa được 50%\nYêu cầu kt qua ktra cho kh","1.KH chưa báo CN\n2. KH yêu cầu CN hoàn thiện hồ sơ để gửi cho bên điện lực\n3. Yêu cầu CN hỗ trợ và xử lí cho KH","Đã báo chi nhánh\nPin trữ sạc không đầy NLMT hiệu suất kém\nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Cương, A Hưng\n2. KH phản ánh: Ko thấy có điện vào ắc quy, khi mất điện lưới thì cũng ko thấy có điện ở pin lưu trữ xả ra.\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này cho KH","1. KH đã liên hệ cho CN\n\n2. Hiệu Suất NLMT của KH bị giảm khoảng 15%, trước đây ngày nắng tốt phát sinh được 30kw/h hiện tại phát sinh được 25kw/h, CN kiểm tra và thông tin do Inverter bị nóng nên giảm hiệu suất\n\n3. KH cần CN hỗ trợ và khắc phục giúp HT NLMT của KH hoạt động bình thường","1. KH đã báo CN: Anh Long trước lắp đặt nhưng đang đi công tác \n2. KH phản ánh:  Lỗi ko sạc pin lưu trữ. Pin đã xả từ lúc sáng từ 50% xuống 0% sau đó dù có nắng và hệ thống điện mặt trời hoạt động nhưng công suất sạc pin hiển thị 0kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH chưa liên hệ\n\n2, Mức điện của KH phát sinh khi không sử dụng điện NLMT là 200 số/ngày, nếu đóng điện NLMT sẽ lã 295 số /ngày, mức tiền điện KH cần đóng thêm đang tăng cao\n\n3. KH cần CN đến hỗ trợ kiểm tra HT NLMT giúp KH","Kh đã báo chi nhánh \nBiến tần đang không chạy được\nYêu cầu kt qua ktra cho kh","1. KH đã liên hệ CN\n\n2. KH thay điện thoại nên chưa theo dõi được hiệu suất trên App, từ tin nhắn của điện lực thông tin sản lượng điện từ HT NLMT đang giảm nhiều khoảng 2 tháng gần dây\n\n3. KH cần CN liên hệ và đến kiểm tra cho KH","1. KH đã báo CN: Các sự cố từ trước và cũng đã có văn bản của CN gửi KH\n2. KH phản ánh: Về sự cố tấm pin bị vỡ do ngoại lực KH đang nghi ngờ tấm pin đang ko phải của chính hãng, KH có kiểm tra số serial tấm pin trên phần mềm AE Solar thì thấy báo ko có thông tin trên cty của hãng. Trước đó CN đến kiểm tra nhiều lần nhưng đến khi KH hỏi ngoại lực gì thì CN ko thấy nói. \n3. KH yêu cầu: Làm rõ thông tin, giải thích với KH về tấm pin. Nếu ko KH sẽ kéo pháp lý, đăng tin mxh, phá hoại cty, cảnh báo mọi người và dự kiến KH sẽ khởi kiện vào t6.","Đã báo chi nhánh\nPin lưu trữ về 0% kh muốn pin lưu trữ không xuống 0% nếu không sẽ bị kêu báo động \nYêu cầu kt xuống ktra cho khách hàng","1. KH đã báo CN: A Đức\n2. KH yêu cầu: Cần hỗ trợ bản hợp đồng giấy NLMT có báo CN rồi và CN hứa hẹn là mang cho mà KH vẫn chưa thấy đâu. Ngoài ra, KH cần hỗ trợ, hướng dẫn làm thủ tục hồ sơ về NLMT để gửi bên điện lực.","1. Kh chưa báo CN\n2. KH báo cục pin lưu trữ không có điện\n3. Yêu cầu KT hỗ trợ và xử lí cho KH","1. KH chưa báo CN\n2. KH lắp 2 máy nhưng 1 máy chạy công suất hoạt động kém\n3. Yêu cầu KT hỗ trợ và xử lí cho KH","1. KH đã báo CN \n2. KH đã kí hợp đồng từ 20/4 và thanh toán đầy đủ nhưng vẫn chưa được lắp đăt. KH rất gay gắt. Nếu từ giờ đến 2 ngày tới mà không được hỗ trợ KH sẽ đăng bài phốt\n3. Yêu cầu KT hỗ trợ lắp đặt cho KH","1. KH đã báo CN (anh phụ trách ký HĐ KH ko muốn nhắc tên)\n2. KH phản ánh: Đã ký hợp đồng nlmt được 20 ngày rồi mà giờ vẫn chưa lắp xong, chỉ lắp được mỗi pin còn những bộ phận khác không thấy gì. KH có liên hệ CN thì hứa hẹn hết ngày này qua ngày khác giờ thì gọi điện ko được, cũng ko thấy ai liên hệ với KH. KH rất bức xúc.\n3. KH yêu cầu: Từ giờ tới t2 mà ko lắp đặt yêu cầu CN tháo hết xuống mang về và hủy HĐ.","Chưa báo chi nhánh\nPin lưu trữ xả nhưng không nạp \nYêu cầu kt qua kiểm tra cho khách hàng","2. Tủ điện ATS tự chuyển đổi không tự động chuyển điện NLMT khi KH bị mất điện lưới ngày 22/05, đường dây điện vào bị cháy\n\n3. KH cần CN liên hệ và hỗ trợ khắc phục sớm","1. KH chưa liên hệ CN\n\n2.KH chưa theo dõi đc hiệu suất qua app, Hiệu suất HT NLMT không như quảng cáo, đội ngũ hỗ trợ tại CN chậm \n\n3. KH cần CN hỗ trợ liên hệ sớm","Chưa báo chi nhánh \nInverter bị lỗi wifi không bắt được \nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Chẩu Văn Nghĩa\n2. KH phản ánh: pin lưu trữ đang bị gặp lỗi trước đó có ivt có mang đi bảo hành rồi mà có báo CN nhưng chưa thấy tháo dỡ nốt pin lưu trữ đi bảo hành.\n3. KH yêu cầu: Kiểm tra pin lưu trữ và mang thiết bị đi bảo hành","CN 0978852953 báo sự cố hộ KH\nKH báo sự cố Inverter mất điện nhưng vẫn chạy,pin lưu trữ có điện nhưng không xả điện \nYêu cầu CN liên hệ hỗ trợ KH","1. KH đã liên hệ CN (Lê Ánh)\n\n2.Tối 8h Pin đóng không xả điện, sáng KH chỉ dùng được điện lưới dù pin lưu trữ vần còn 75% , Qua App thông báo Pin còn 10-15% tuy nhiên KH kiểm tra thì Pin lưu trữ thông tin vẫn còn 4 cọc\n\n3. KH cần CN hỗ trợ kiểm tra sớm cho KH","Đã báo chi nhánh\nBIến tần nhà khách hàng bị hỏng \nYêu cầu kt xuống ktra cho khách hàng","Đã báo chi nhánh\nĐiện năng lượng mt chập chờn, kh lắp hệ 12Wh nhưng chỉ được 6Wh\nYêu cầu kt xuống kiểm tra cho khách hàng","1. KH chưa liên hệ CN\n\n2. Những hôm nắng to Điện NLMT chỉ đạt hiệu suất 25-30% cố định do lệch pha từ khi lắp HT NLMT \n\n3. KH cần CN đến nhà KH trao đổi với nhân sự đấu điện cho KH dể thống nhất và có phương án xử lý lệch pha điện NLMT","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. KH bị mất điện ngày  17/5, khi có điện lại HT NLMT của KH không hoạt động, trên APP chỉ có thông số điện lưới, không có phát sinh điện từ NLMT\n3. KH cần CN hỗ trợ khắc phục sớm\nĐịa chỉ lắp đặt: Số nhà 18, Ngõ 111, Phạm Đình Toái, Nghệ An","Đã báo chi nhánh \nKhách hàng đang thấy hệ thống NLMT đang không hoạt động\nyêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Ko thấy có điện nlmt nạp vào, và thấy gián đoạn từ 12h trưa - 3h chiều, 1 ngày chỉ khoảng 30kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Đã báo chi nhánh \n1 tấm pin nlmt bị nứt  \nYêu cầu kt qua ktra cho khách hàng","KH đã báo KT chưa báo CN \nKH báo giao thiếu 1 tấm pin NLMT của KH mà hơn 1 tháng nay chưa thấy giao nốt cho KH \nYêu cầu CN liên hệ KH gấp","1. KH chưa liên hệ với CN \n2. KH cần hỗ trợ hoàn thiện hồ sơ NLMT để gửi cho điện lực \n3. Yêu cầu CN liên hệ và hỗ trợ hoàn thiện hồ sơ cho KH","KH phản ánh 2 tấm Pin bị nứt, vỡ, võng. Yêu cầu kiểm tra, thay thế theo bảo hành","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng","1. KH đã liên hê CN và được hỗ trợ tháo thiết bị để chuyển cho hãng\n2. Pin lưu trữ của KH bị lỗi\n3. KH cần CN hỗ trợ khắc phục sớm","1.  KH chưa báo chi nhánh\n2. KH báo lỗi inverter không hoạt động, báo lỗi không hiển thị màn hình\n3. Yêu cầu Chi nhanh cho Kỹ thuật xuống hỗ trợ KH gấp","CN 0976886777 báo sự cố hộ KH \n1. KH phản ánh: Tivi màn hình led bị lỗi ko lên màn hình.\n2. KH yêu cầu: Xuống kiểm tra, xử lý trong ngày hôm nay.","KH đã báo KT tên Huy chưa báo CN \nKH báo hiệu suất NLMT kém không đủ sạc  pin lưu trữ\nYêu cầu CN cho KT xuống kiểm tra lại cho KH gấp","1. KH đã báo CN \n2. KH phản ánh sự cố pin NLMT bị nổ KT đã xuống tháo nhưng KT chưa đem về kiểm tra và sửa cho KH, nay KH gọi lên yêu cầu KT có xuống đem về sửa cho KH không thì nói KH để còn biết KH lắp bên đơn vị khác\n3. Yêu cầu CN liên hệ và cho KT  xuống Ktra gấp cho KH, KH đang rất gay gắt","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. Inverter bị lỗi không lưu điện vào trong pin, đổi dòng dùng điện trực tiếp được nhưng không vào pin lưu trữ\n3. KH y/c CN hỗ trợ đổi thiết bị mới cho KH","KHDN ký 1 Hợp đồng nhưng có 2 địa chỉ lắp đặt và cả 2 đang gặp sự cố. \n1. KH đã báo chi nhánh\n2. KH phản ánh: \n+ Tại Xã Lương Sơn, Tỉnh Phú Thọ: KH báo bị lỗi biến tần\n+ Tại Xã Hợp Thịnh, Tỉnh Bắc Ninh: KH báo tủ biến tần bị nổ cháy\n3. KH yêu cầu: KT trong tuần này liên hệ hỗ trợ","Khách hàng đang nhận định và khiếu nại hệ thống năng lượng mặt trời hoạt động không hiệu quả. Nguyên nhân do buổi sáng đón nắng tốt, nhưng đến trưa thì bị che bóng (nên theo khách, hệ 6kW nhưng công suất thấp chỉ sản sinh được 1kW thôi). Liên quan việc che bóng thì khách cho rằng Viettel không khảo sát kỹ từ đầu. Và có yêu cầu di dời tấm pin áp mái đến vị trí đón nắng tốt hơn (trong phạm vi 10 m trên mái nhà).\nNhờ KT xêp lịch hẹn sớm với khách hàng và hỗ trợ\nKhảo sat thực tế và lên phg án di dời các tấm pin","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","kh chưa báo chi nhánh ko thấy HĐ điện tử nhg khách hàng đã chụp hợp đồng giấy qua zalo\nNlmt không sản xuất ra điện\nyêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ với CN nhưng chưa tiếp nhận: Có liên hệ với CN là a Bùi Anh Nguyễn nhưng ko nghe máy, và cũng ko thấy gọi lại.\n2. KH phản ánh: Pin tích điện đủ nhưng ko thấy xả ra để dùng. KH đã báo bên điện lực đến kiểm tra và đã đo đồng hồ các thứ và ko bị làm sao. Tiền điện bây giờ vẫn tăng cao lúc chưa lắp là 8tr tư vấn lắp đặt thông tin là 2tr mà những tháng đầu tiền điện 4tr. Và khi sập điện lưới bật quạt để chạy thử sang nlmt thì được 1 lúc lại tự ngắt rồi lại dùng điện lưới.\n3. KH yêu cầu: Qua kiểm tra thiết bị xem và khắc phục tình trạng này.","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra","1. KH đã liên hệ với CN, CN đã hỗ trợ tháo tấm pin lỗi\n2.KH nghe tiếng như có tiếng nổ, lên kiểm tra thấy tấm pin rạn vỡ, cần kiểm tra bảo hành\n3.KH cần CN hỗ trợ thông tin sớm","KH cần mẫu bổ sung số 01 để báo với điện lực gia đình đang sử dụng NLMT theo nghị định 13 \nYêu cầu KT liên hệ lại KH gấp","KH (work@namdd.dev) gửi mail phản ánh các vấn đề: \n1.\tTiền dây dẫn thừa: Đề nghị Viettel Phú Thọ thực hiện việc bồi hoàn lại tiền cho phần dây điện thừa do thi công sai lệch ban đầu.\n2.\tTiêu chuẩn vật tư tủ điện (Dựa trên buổi làm việc ngày 11/04/2026): Hai bên đã thống nhất ghi nhận hiện trạng là chưa xác định được vật tư bên trong tủ điện có đảm bảo đúng danh sách thiết bị và tiêu chuẩn kỹ thuật của công ty hay không. Tôi yêu cầu phía Tập đoàn và VCC cung cấp chi tiết danh sách vật tư và tiêu chuẩn kỹ thuật để gia đình có cơ sở so sánh với chiếc tủ trị giá 6.500.000 VNĐ hiện tại. Yêu cầu làm rõ tính an toàn khi sử dụng dây cáp DC để đấu nối cho phần AC và dây DC 6mm2 đi với MCB 63A. Thời hạn phản hồi: Trước ngày 20/04/2026.\n3.\tXử lý lỗi Inverter (SPD DC): Hệ thống liên tục báo lỗi DC SPD. Theo thông tin mới nhất, hiện DatGroup đang làm việc với hãng GoodWe và sẽ có email phản hồi kết quả xử lý trong vòng 02 ngày tới. Đề nghị phía Viettel bám sát để xử lý dứt điểm cho khách hàng .\n4.\tĐiều chỉnh chính sách bảo hành (Dựa trên buổi làm việc ngày 11/04/2026): Thông tin bảo hành combo biến tần và pin lưu trữ của hãng hiện không khớp với hợp đồng . Phía Chi nhánh Phú Thọ đã hẹn xử lý trong vòng 120 ngày kể từ ngày 11/04/2026. Như vậy, thời hạn cuối cùng để hoàn tất việc điều chỉnh này là ngày 09/08/2026.\n6.\tThao tác điều khiển thiết bị từ xa không báo trước: Giải trình về việc tài khoản viettelsolar.phutho@gmail.com tự ý \"Xóa dữ liệu báo động lỗi hồ quang\" và \"Vô hiệu hóa báo động chống sét\" ngày 12/04/2026 mà không thông báo hay nắm rõ mục đích xóa.","1. KH chưa báo CN\n2. KH đang sd NLMT nhưng hiện tại thiết bị ko xả điện\n3. YC KT qua kiểm tra và xử lý gấp\n***địa chỉ lắp đặt: kilo 63, khu đô thị đức tài, xã hoài đức, tỉnh lâm đồng.","Mất 1 string điện không vào ắc quy. Không đủ cung cấp cho tải nhà dùng . Anh cần đến kiêm tra trong ngày hôm nay.\n**Địa chỉ lắp đặt: số nhà 300, kim tân, xã đoài phương, thành phố hà nội.","1.Đã báo chi nhánh chưa: chưa báo\n2.Đã báo qua đâu: DTV HPC\n3.KH phản ánh về vấn đề: Hiệu suất hệ thấp.\n4.KH yêu cầu KT qua kiểm tra cho KH","1. Kh đã báo cn\n2. Kh phản ánh: Hệ của kh dạo này sd có hiện tượng liên tục bị sập. Kh đã báo kt và kt phản hồi do kh sd quá tải nhưng từ khi lắp đến nay kh báo chỉ dùng bằng đó thiết bị chứ ko hơn\n3. kh yc: YC cn hỗ trợ sớm","- Đối tác Công ty cổ phần SPT Việt Nam (sdt phản ánh 0975014010) tiếp tục gọi tđ phản ánh về vấn đề chậm trễ tiến độ và thiếu nhân lực thi công cho dự án Thi công lắp đặt hệ thống Chiller. \n- Kh báo hiện tại vẫn chậm tiến độ, cn ko thay đổi hay tiến triển thêm gì\n- Mã hợp đồng: 23092025/HĐTP-SPT-VIETTEL.\n- Kh yc: Yc TCT có biện pháp xử lý rõ ràng cho kh"],"Ngày bắt đầu":["2026-06-03 08:00:00","2026-06-03 08:00:00","2026-06-03 08:00:00","2026-06-02 13:49:00","2026-06-02 13:30:00","2026-06-02 11:03:00","2026-06-02 14:57:00","2026-06-02 13:48:00","2026-06-02 13:42:00","2026-06-02 11:42:00","2026-06-02 11:20:00","2026-06-02 11:07:00","2026-06-01 09:56:00","2026-06-01 16:48:00","2026-06-01 16:29:00","2026-06-01 13:47:00","2026-06-01 11:43:00","2026-06-01 11:35:00","2026-06-01 10:54:00","2026-06-01 08:43:00","2026-06-01 08:00:00","2026-06-01 08:00:00","2026-06-01 08:00:00","202 var COL_WIDTHS = {"Mã tỉnh":100,"Lĩnh vực":100,"Ngành hàng":100,"Sản phẩm":150,"Mã HĐ":100,"Tên khách hàng":120,"SĐT":100,"Địa chỉ":250,"Giai đoạn":100,"Nhóm sự cố":100,"Loại sự cố":100,"Chi tiết":300,"Ngày bắt đầu":100,"Ngày kết thúc":100,"Trạng thái":100,"Tên nhân viên":100,"Mã nhân viên":100,"Hệ thống":100,"Đơn vị điều hành":100,"AM chuyên quản":100};
var CT_GROUP   = 'bang_chitiet_group';
var AM_MAP     = {"P.KD Cơ điện":["P.KD Cơ điện"],"P.KDNLMT":["P.KDNLMT"],"P.Triển khai":["N1 - Truongdv17, Congnd15","N2 - Tienvt16, Anhnt631","N3 - Thikd, Ducnt84"],"VHKT":["VHKT"]};
var TINH_MAP   = {"N1 - Truongdv17, Congnd15":["BNH","HNI","HPG","PTO","QNH","TNN"],"N2 - Tienvt16, Anhnt631":["KHA","NAN"],"N3 - Thikd, Ducnt84":["DNI","LDG"],"P.KD Cơ điện":["BNH"],"P.KDNLMT":["AGG","DTP","HNI"],"VHKT":["AGG","BNH","CMU","DLK","DNG","DNI","GLI","HCM","HNI","HPG","HTH","HUE","HYN","KHA","LDG","NAN","NBH","PTO","QNH","QTI","THA","TNH","TNN","TQG","VLG"]};

<script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>
