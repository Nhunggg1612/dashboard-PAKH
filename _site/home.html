","Thiết bị vỡ, hỏng, chập cháy","Sản phẩm/Hệ thống lỗi/không hoạt động","Tiến độ triển khai chậm","Thiết bị vỡ, hỏng, chập cháy","Chất lượng, hiệu suất của sản phẩm/hệ thống thấp","Chất lượng, hiệu suất của sản phẩm/hệ thống thấp","Sản phẩm/Hệ thống lỗi/không hoạt động","Chất lượng, hiệu suất của sản phẩm/hệ thống thấp","Sản phẩm/Hệ thống lỗi/không hoạt động"],"Chi tiết":["KH đặt đơn DVKT từ ngày 22/07 chưa có ai liên hệ và đến hỗ trợ\n\nKH cần CN đến hỗ trợ sớm","1. KH đã liên hệ CN\n2. KH mới thay thiết bị Wifi, hiện chưa kết nối được với HT NLMT để theo dõi hiệu suất trên App\n3. KH cần CN đến hỗ trợ khắc phục sớm","1. KH đã liên hệ CN\n2 Ăc quy lưu trữ của KH đầy nhưng không xả vào ban đêm ngày 22/07, trước đó Ăc quy nạp bằng điện lưới dù trời nắng tốt\n3. KH cần CN đến hỗ trợ kiểm tra và hỗ trợ sớm","1. CN báo sự cố cho KH\n2. HT NLMT có nạp Ắc quy nhưng khi dùng lại lấy điện lưới nhiều\n3. KH cần CN hỗ trợ kiểm tra sớm","1. KH chưa liên hệ CN\n2. HT NLMT của KH đang không vào điện\n3. KH cần CN liên hệ và đến hỗ trợ sớm","KH đặt đơn hàng DVKT chưa được KT liên hệ và đến hỗ trợ\n\nKH cần KT liên hệ và đến hỗ trợ sớm","1. KH đã liên hệ CN\n2. HT NLMT của KH vẫn lấy khoảng 1kw điện lưới ban ngày dù trời nắng tốt và KH có Ắc quy lưu trữ đủ cung cấp tải nhà\n3. Kh cần CN đến kiểm tra và khắc phục sớm","KH chưa báo CN \nKH phản ánh trước KH có báo sự cố điện NLMT cứ bật tắt liên tục nhưng sau khi KT đến hỗ trợ kiểm tra xong vài hôm lại bị, nay KH yêu cầu CN điều KT khác cứng nghề hơn liên hệ và đến hỗ trợ KH \nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","1. KH đã liên hệ CN\n2. KH không theo dõi được hiệu suất NLMT trên App, báo lỗi ngoại tuyến\n3. Kh cần CN hỗ trợ khắc phục sớm\nĐịa chỉ lắp đặt: RR2 Hồng Lĩnh, Phường Hòa Hưng, Thành phố Hồ Chí Minh","1. CN đã hưỡng dẫn KH thao tác từ xa nhưng chưa khắc phục được\n2. Kh phản ánh thiết bị lưu trữ NLMT của KH không sạc, báo đỏ\n3. KH cần CN đến hỗ trợ sớm","KH có đơn hàng DVKT tuy nhiên KT chưa liên hệ và đến hỗ trợ","1. KH đã báo CN: A Đoàn Xuân Phương\n2. KH phản ánh: KH có 2 pin lưu trữ hiện tại có 1 pin lưu trữ ko xả ra điện vẫn nạp vào. CN trước có đến kiểm tra và phản hồi là update BMS \n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN: A Việt\n2. KH phản ánh: cả dàn nlmt ko thấy có điện nạp vào \n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","KH chưa báo CN \nKH phản ánh dây nối của cục biến tần của KH bị hỏng cần được thay\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","CN báo sự cố hộ KH qua hệ thống\n1. KH phản ánh: inverter báo lỗi, không hoà lưới đươc. nghe tiếng nổ trong inverter\n2. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã liên hệ bộ phận kinh doanh tại CN\n2. Hiệu suất của HT NLMT chưa đạt yêu cầu, giữa trưa nắng và trời trong nhưng hiệu suất chỉ đạt 4.250W, thời điểm hiệu suất cao nhất là 4.800W\nTrong quá trình lắp đặt hệ thống nhân sự chưa cẩn thận, suýt làm rơi tấm pin, đi lên tấm pin, thời gian thi công còn chậm\nKhông thấy sử dụng Camera nhiệt để kiểm tra các đầu Cosse AC, DC, MC4, không đo điện trở tiếp địa\nDây DC kéo dài đã đi trong ống luồn tuy nhiên các đầu nối MC4 nối 2 tấm pin liền kề đều nằm trên mái, KH đã đề nghị KT rút dây thít cho MC4 không chạm mái nhưng chưa được hỗ trợ\nTrong tủ điện không có nhãn tên các thiết bị\nChưa có nhân sự đến thu hồi vật tư còn dư để chốt chi phí cho KH như:\nVật tư phụ, dây DC tính theo m\nThanh Rail nhôm (Tính tiền 8 thanh 2,3 m nhưng lắp đặt các mẩu rail nhôm 20cm)\nChân đỡ chữ L(có tính tiền nhưng không thấy lắp)\nCùm kẹp hộp Inox(có tính tiền nhưng không thấy lắp)\n3, KH cần CN liên hệ và đến hỗ trợ giải đáp cho KH sớm","KH đã báo CN nhưng chưa được hỗ trợ \nINVT báo lỗi không hoạt động, tình trạng bị lần thứ 3\nYêu  cầu CN cho KT qua ktra cho KH","KH chưa báo CN \nKH báo sự cố NLMT : cục pin 20% là 3.2kw vậy tại sao sạc được có 6kw lại lên 100% rồi, mình đã tham khảo pin solax của bên hàng xóm sạc được tới 12.6kw mới báo 100%\nYêu cầu CN cho KT qua ktra cho KH","KH đã báo CN \nKH phản ánh:  Hợp đồng từ 15/5 đến nay là hơn 2 tháng, hồ sơ  để bàn giao và nghiệm thu quyết toán vẫn chưa hoàn thành. tôi không có đủ hồ sơ để làm thủ tục với evn. đề nghị VCC nhanh chóng cung cấp đầu đủ hồ sơ thiết bị, bản vẽ hoàn công và các biên bản bàn giao, nghiệm thu, quyết toán. việc phạt chậm hợp đồng tính đến khi có đủ hồ sơ và ký biên bản nghiệm thu bàn giao. xin cảm ơn.\nYêu cầu CN liên hệ hỗ trợ KH","1.Kh đã liên hệ nhân sự Văn của CN\n2. KH chưa được cung cấp CO,CC của Ắc quy, Biến tần, hồ sơ thiết kế xây dựng,... các chứng từ liên quan đến HT NLMT, khi KH cần hỗ trợ  vệ sinh HT NLMT CN cũng chưa hướng dẫn\n3. KH cần CN hỗ trợ sớm, thời gian lắp đặt đã lâu nhưng chưa được hỗ trợ KH không hài lòng,","KH chưa báo Cn \nKH báo sự cố NLMT thấy App đo hiệu suất không được chuẩn như trước\nYêu cầu CN cho KT qua ktra cho KH","***SĐT phản ánh: 0971697080\n1. KH đã báo CN \n2. KH phản ánh: cháy tủ điện ats, CN đã xuống cắt điện xử lý sơ bộ \n3. KH yêu cầu: Đưa ra phương án xử lý thay mới tủ điện cho KH","CN 0986688282 báo sự cố hộ KH\n1. KH phản ánh: ivt chập chờn liên tục cả ngày cả đêm\n2. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã liên hệ CN\n2. HT NLMT của KH (Hệ 2) đang tiêu thụ điện nhiều, Hiện tại tiêu thu khoàng 1,300->1400Kw , trong khi trước đó chỉ khoảng hơn 1000kw, KH đã tắt ATS tổng vào tầng 2 tuy nhiên vẫn thấy tiêu thụ điện\n3. KH cần CN đến kiểm tra sớm cho KH","1. KH đã liên hệ CN\n2. Hiện HT NLMT hiệu suất không cao, các thiết bị máy móc trong gia đình hoạt động rất hạn chế dù trời nắng to\n3. KH cần CN đến kiểm tra và khắc phục sớm","Kh đã báo CN\nKH báo sự cố NLMT hệ thống kêu  ầm kêu rú lên, biến tần không chạy dù oin đầy 100%\nYêu cầu CN cho KT qua ktra hỗ trợ KH","Kh chưa báo CN \nKH phản ánh hệ thống điện NLMT thi thoảng bị mất, hiện tại chạy chập chờn. KH cần KY kiểm tra lại cho KH \nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","Kh chưa báo CN \nKH phản ánh ắc quy NLMT bị hỏng không dùng được, bị hôm qua\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","1. KH chưa báo CN\n2. KH phản ánh: KH có 2 ivt nhưng hiện tại chỉ sử dụng được 1 con ivt, KH theo dõi trên app thì ko thấy có công suất từ 11/6\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","KH chưa báo CN \nKH phản ánh ivt bị hỏng, điện chạy lên điện lưới nên đồng hồ điện chạy gấp đôi bình thường, bị hơn 1 tháng nay\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","KH đã báo CN và báo anh Tấn \nKH phản ánh biến tần bị lỗi, lỗi quạt không quay, báo lôi trên hệ thống, bị từ lâu rồi, có nhờ bên hãng nhưng chưa hỗ trợ được\nYêu cầu quản lí điều kĩ thuật liên hệ và hỗ trợ KH","1. KH chưa liên hệ CN\n2. HT NLMT của KH giảm một nửa công suất, trước đó ngày nắng to được khoảng 13-16Kw hiện tại chỉ còn hơn 7Kw sau bão\n3. KH cần CN đến kiểm tra sớm","KH đã báo Cn nhưng chưa được hõ trợ \nKH cần hỗ trợ lắp đặt thêm pin lưu trữ\nYêu cầu CN cho KT qua hỗ trợ KH","1.KH đã báo Anh Khánh bên CN\n2. KH lắp hệ NLMT 16 kí nhưng mà khi sử dụng 1 cái điều hòa từ 20h đến 1h sáng thì hết,không đủ dùng trong khi lúc chiều tối pin báo 90%. \n3. Yêu cầu CN hỗ trợ KH","1. KH đã liên hệ nhân sự Trường của CN\n2. BQL Dự án đang yêu cầu KH cung cấp các chưng từ liên quan đến HT NLMT\n3. KH cần CN hỗ trợ hoàn thiện hồ sơ cho KH sớm","1. KH đã báo CN 0969054066 \n2. KH phản ánh: KH theo dõi trên app tấm pin nlmt ko sản xuất ra điện, báo lỗi cung DC\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã liên hệ CN\n2.KH cần CN hỗ trợ hoàn thiện chứng từ liên quan đến HT NLMT để cung cấp cho bên điện lực","Thiết bị còn hạn bảo hành \n1. KH đã liên hệ với hãng và được thông tin cần CN hỗ trợ\n2. Sản phẩm Tivi bật lên có tiếng nhưng không có hình\n3. KH cần CN đến kiểm tra và khắc phục sớm","1. KH đã báo CN: A Chiến\n2. KH phản ánh: mất kết nối app nlmt, bị treo từ trưa hôm 14/7 lúc 14h ko thấy cập nhật thông số\n3. KH yêu cầu: qua kiểm tra, khắc phục tình trạng này","1. KH chưa liên hệ CN\n2. KH đã ký HĐ lắp đặt thiết bị Ăc quy lưu trữ NLMT và chuyển tiền đặt cọc từ ngày 19/06 cho nhân sự Đạt tuy nhiên chưa được hỗ trợ lắp đặt và hoàn thiện hệ thống. CSKH kiểm tra Hợp đồng chưa được ký\n3. KH cần CN phản hồi và đề xuất hướng xử lý cho KH","Kh chưa báo CN \nKH báo sự cố nlmt không sạc được pin dù nắng to vẫn không sạc được \nYêu cầu CN cho KT qua ktra cho KH","Hợp đồng liên quan đến đ/c Đạt\n1. KH phản ánh: có tạo hợp đồng vào 15/6 và a Đạt hướng dẫn KH ký và có cung cấp mã OTP để ký nhưng CSKH kiểm tra HĐ vẫn chưa được ký. KH có thanh toán 40tr chuyển khoản qua tài khoản của a Đạt và hẹn 15/7 tiến hành lắp đặt\n2. KH yêu cầu: CN phản hồi lại thông tin và làm việc với KH","1. KH đã báo CN: a Lê Văn Việt\n2. KH phản ánh: ivt mất nguồn, ko có lên điện\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","Kh đã báo CN \nKH phản ánh về việc trước đấy vào khoảng t4/2025 IVT của KH bị lỗi và CN BNH đã đến mang đi bảo hành, có xác nhận thiết bị còn bảo hành, nhưng đã mang đi hơn 1 năm nay vẫn chưa thấy mang về và lắp đặt trả lại KH, KH có liên hệ CN thì chỉ thấy hứa hẹn lên xuống chứ không thấy đem trả về cho KH ( hôm 10/7 Anh Tuần CN BNH có trao đổi với KH là mỗi bên bỏ ra 50% số tiền để mua IVT mới lắp đặt, KH thăc mắc tại sao còn BH mà lại phải bỏ tiền ra mua mới thì Anh Tuần tắt máy)\nYêu cầu CN liên hệ lại và cho KH câu trả lời về việc mang thiết bị về và lắp đặt trả lại cho KH","KH đã báo Cn ( CSKH không thấy thông tin HĐ trên hệ thống ) \nKH phản ánh  về việc đã thanh toán 30% giá trị HĐ và đã  kí HĐ lắp đặt hệ thống NLMT vào ngày 20/6 với NS NGÔ VĂN ĐẠT và đến nay vẫn chưa được hỗ trợ lắp đặt \nKH yêu cầu CN liên hệ lại cho KH và cho KH câu trả lời về việc lắp đặt gấp","1. KH đã liên hệ CN\n2. 1 Biến tần của KH đang báo đỏ và không hoạt động\n3. KH cần CN đến kiểm tra và khắc phục sớm","1. KH chưa liên hệ CN\n2. Hiện KH cần hỗ trợ hủy hóa đơn  (1 tờ  2.020.000đ hóa đơn 44859 ngày 11/06/2026) do tạo sai và chuyển biên bản điều chỉnh đến địa chỉ : - Số 11 Khu tập thể HVCTQS, Phường Trung Văn, Quận Nam Từ Liêm, Thành phố Hà Nội\n3. KH cần CN hỗ trợ sớm","YCTX NLMT lịch hẹn 09/07 KH báo chưa có NV liên hệ tư vấn NLMT","1. KH đã báo CN: A Vinh \n2. KH phản ánh: có pin lưu trữ 41% nhưng vẫn chạy công tơ sử dụng điện lưới KH bức xúc liên hệ gọi điện, nhắn tin với CN phụ trách lắp đặt nhưng ko nhận được phản hồi. \n3. KH yêu cầu: Qua kiểm tra, đưa ra phương án xử lý và khắc phục tình trạng này","1. KH đã báo CN\n2. KH phản ánh: KH ck 50% hop đồng từ ngày 20/6 mà giờ chưa thấy lắp, KH liên lạc với a Bình phụ trách trươc thì nói là đang tập kết thiết bị sau đó bạn chuyên công tác gửi số đt cho bạn khác rồi KH liên hệ vẫn nhận được câu trả lời là đang tập kết thiết bị\n3. KH yêu cầu: KH đang đợi rất lâu và đang rất cần điện yêu cầu CN đẩy nhanh tiến độ triển khai lắp đặt NLMT cho KH","1. KH đã báo CN và làm việc với a Ngô Văn Đạt\n2. KH phản ánh: HĐ của KH đã ký vào 8/6 và thanh toán cho anh Ngô Văn Đạt tổng cộng 204tr gồm 3 lần chuyển khoản qua TK của a Đạt 94,4tr và 1 lần tiền mặt 110tr. KH cũng có thắc mắc và hỏi sao chuyển khoản qua TK cá nhân a Đạt thì CN phản hồi là cá nhân a Đạt là đại diện công ty GĐ khu vực chuyển khoản riêng sẽ linh động và lắp nhanh là 3-4 ngày còn nếu chuyển khoản qua TK CN sẽ mất 15-20 ngày lắp đặt. Sau đó CN nhiều lần rời lịch hẹn, làm xong phần khung được nửa tháng rồi và có 1 BB nhận tiền viết tay và cam kết lắp đặt vào ngày 5/7. Đến hiện tại thì KH ko còn liên hệ được với a Đạt nữa.\n3. KH yêu cầu: KH đang nghi ngờ có dấu hiệu của chiếm đoạt tài sản, yêu cầu CN làm rõ thông tin với KH và triển khai lắp đặt cho KH.","KH  chưa báo CN\nKH báo sự cố pin lưu trữ đang bị lỗi, hiện tại không sản xuất ra điện \nYêu cầu CN cho KT qua ktra cho KH","1. KH chưa liên hệ CN\n2. Trước đó tiền điện tháng 5 của KH cần đóng là 2tr6, hiện tại tiền điện tháng 6 cần đóng là 5tr1 trong khi trên App hiển thị HT NLMT vẫn hoạt động\n3.KH cần CN đến kiểm tra sớm","KH đã báo CN \nKH báo sự cố điều hòa bật được 1 lúc tự tắt, đã báo hãng nhưng chưa xử lý được \nYêu cầu CN cho KT qua ktra hỗ trợ KH","KH đã báo CN \nKH báo sự cố thang máy đổ hở của cửa hở tới 3,5cm, cn báo là chờ để kiểm định\nYêu cầu Cn cho KT qua ktra hỗ trợ KH","KH đã báo CN\nKH báo sự cố về thang máy, chuông báo ở thang máy hiện tại không kêu không hoạt động\nYêu cầu CN cho KT qua ktra cho KH","1. KH đã liên hệ CN\n2. Hiện nhà KH đang không sử dụng được điện lưới và điện NLMT, ngày hôm nay đã mất điện 2 lần\n3. KH cần CN đến kiểm tra và khắc phục gấp","ft3 lắp đặt sai quy cách tấm pin","1. KH đã được nhân sự Ngọc tại CN liên hệ\n2. KH ký HĐ lắp đặt HT NLMT từ ngày 14/06 và thời gian lắp đặt là 30 ngày kể từ ngày khởi công, hiện đã sắp hết thời gian thực hiện lắp đặt theo HĐ nhưng KH chưa được hỗ trợ\n3. KH cần CN liên hệ và phản hồi gấp","KH đã báo CN và đã làm việc với thợ trực tiếp làm việc của KH \nKH phản ánh KH có đặt gói bảo dưỡng máy sấy nhưng khi KT đến bảo dưỡng xong thì thiết bị bị hỏng, đến nay máy sấy bị đọng nước trong máy khi sấy. Tháo mở máy rất cẩu thả, lắp lại vênh cả nắp thùng, KH cũng báo nhiều lần lên nhưng anh thợ cũ đến toàn đưa phương án nhưng vấn đề thì chưa được giải quyết.\nYêu cầu CN liên hệ và hỗ trợ Kh","KH bức xúc phản ánh KH có kí hợp đồng từ đầu tháng 6 và muốn lắp thêm 5 tấm pin, đã báo bên CN là anh MInh, nhưng đến thời điểm hiện tại chưa có ai đến hỗ trợ lắp cho KH. Yêu cầu CN liên hệ và qua hỗ trợ KH","KH đã báo CN\nKH báo sự cố NLMT biến tần đầy pin  nhưng không dùng được chỉ dùng được điện lưới\nYêu cầu CN cho KT qua ktra cho KH","Mã hợp đồng: KHCN_TT.GPTH_BNH_1702271 (CSKH check hệ thống không thấy thông tin)\n- Nội dung phản ánh: \n•\tNgày 04/06/2026, KH ký hợp đồng triển khai trọn gói hệ thống điện mặt trời áp mái công suất 7.44 kWp với tổng giá trị 112.000.000 VNĐ. Công trình chính thức được khởi công vào ngày 18/06/2026. KH đã bàn giao mặt bằng và tạm ứng tiền với số tiền 64.000.000 đồng thanh toán lần 1 vào 12:07 ngày 24/6/2026 bằng chuyển khoản từ ngân hàng TP Bank cho Ngô Văn Đạt số tài khoản 9704 22...6145 Căn cước công dân số 027092009851 với số tiền 19.000.000 đồng .\n•\tTrong quá trình khởi công và tập kết vật tư có phát sinh 1 số vấn đề: \n(1)\tGiao sai chủng loại Tấm pin năng lượng mặt trời: KH mua tấm pin Longi 620W Himo7 LR8-66HGD-620M nhưng giao tấm pin công suất 535M\n(2)\tChậm giao và chưa lắp đặt Bộ pin lưu trữ điện\n-Khách hàng yêu cầu: \n•\tKhắc phục thiết bị: Buộc Chi nhánh Bắc Ninh lập tức tháo dỡ toàn bộ các tấm pin lắp sai quy cách, vận chuyển và lắp đặt lại đúng 12 bộ tấm pin Longi 620W Himo7 LR8-66HGD-620M mới 100%\n•\tLắp đặt bổ sung: Khẩn trương cấp phát, bàn giao và hoàn thiện lắp đặt bộ pin lưu trữ Lithium-ion W16-5A theo đúng hợp đồng.\n•\tPhạt vi phạm chậm giao thiết bị:\n+ Tính từ ngày khởi công kiêm ngày tập kết thiết bị sai/thiếu (18/06/2026) đến hôm nay (03/07/2026) là tròn 15 ngày chậm trễ.\n+ Áp dụng mức phạt 0,1%/ngày trên giá trị hàng hóa vi phạm (112.000.000VNĐ \\15 ngày) 0,1% = 112.000 VNĐ/ngày).\n+ Tổng số tiền phạt tính đến ngày 03/07/2026 là: 15 ngày x 112.000 VNĐ =1.680.000 VNĐ. Số tiền này phải được khấu trừ trực tiếp vào đợt thanh toán Lần 3 của tôi\n•\tPhản hồi lại thông tin trong vòng 3 ngày.","1. KH đã báo CN: Phản ánh từ TT_1782706819949 trước CN hẹn là hôm nay phản hồi nhưng KH chưa thấy thông tin gì\n2. KH phản ánh: Tấm pin và biến tần đã được lắp đặt, đưa vào sử dụng từ ngày 21/6, nhưng đến nay vẫn chưa lắp pin lưu trữ. Trong khi nhu cầu sử dụng điện của nhà KH chủ yếu vào ban đêm, việc chậm lắp pin lưu trữ gây thiệt hại về chi phí điện. \n3. KH yêu cầu: Trong ngày hôm nay phản hồi lại thông tin cho KH từ ngày 21/6 đến thời điểm hoàn thành việc lắp pin lưu trữ, ai sẽ chịu trách nhiệm đối với phần thiệt hại này? Yêu cầu CN liên hệ với KH","1. KH chưa báo CN\n2. KH phản ánh: hiệu suất sản phẩm kém, cảm thấy tiền điện tăng (KH lớn tuổi ko trao đổi chi tiết rõ thêm và gay gắt)\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH đã báo CN: a Hoàng Long Hải - lắp đặt\n2. KH phản ánh: hiệu suất kém tầm 12h trưa nắng rất to nhưng vào yếu quá hệ 6,2kw nhưng nắng vậy chỉ được có hơn 3kw có những hôm đang chạy thì chập ko chạy được luôn. \n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH chưa báo CN (ko còn liên hệ)\n2. KH cần hỗ trợ giấy tờ của thiết bị để gửi bên điện lực","Kh chưa báo CN\nKH báo sự cố hệ thống NLMT đang không theo dõi được qua App, không báo thông số , hiện HT đang không sản sinh điện NLMT\nYêu cầu CN cho KT qua ktra cho KH","KH phản ánh hiện đang chưa có KT liên hệ hỗ trợ lắp đặt NLMT cho KH \nYêu cầu quản lý điều kĩ thuật liên hệ và hỗ trợ KH","1. KH chưa liên hệ CN\n\n2.KH p/á HT NLMT có 3 Ăc quy lưu trữ, CN đã hỗ trợ chuyển 1 thiết bị của KH đi bảo hành khoảng 3-4 tháng nay chưa có phản hồi cho KH\n - HT NLMT khi gặp sự cố mất điện Ăc quy không xả điện để sử dụng \n3. KH cần CN liên hệ và đến kiểm tra khắc phục cho KH","1. KH đã liên hệ CN\n\n2. Khi mất điện lưới hệ thống NLMT của KH không nhảy ATS, Biến tần Inverter hiện rất nóng\n\n3. KH cần CN đến kiêm tra cho KH sớm","KH đã báo CN \nKh phản ánh hệ thống NLMT tự đẩy điện ra lưới ngoài khoảng 1 tháng nay\nYêu cầu kĩ thuật liên hệ và xuống KT cho KH","KH chưa báo CN\nKH phản ánh 8 ngày nay NLMT k dùng được, k theo dõi được cả trên điện thoại và hệ thống, Kh giờ chỉ dùng dc điện lưới, KH đã báo cho anh Quý phụ trách lắp nhưng không phản hồi\nYêu cầu KT liên hệ và xuống kiểm tra cho KH","1. KH đã báo Cn\n2. KH phản ánh: CN có tháo thiết bị mang đi bảo hành sửa chữa mà giờ ko thấy có thông tin lại \n3. KH yêu cầu: Phản hồi lại thông tin tình trạng thiết bị, sửa xong thì mang trả lại cho KH","1. KH đã báo CN\n2. KH phản ánh: nắng nhưng ko thấy sản xuất ra điện toàn thấy sử dụng điện lưới tiền điện tăng cao bất thường, 1 tháng 3tr5 tiền điện. \n3. KH yêu cầu: KT qua kiểm tra, xử lý tình trạng này\n***Địa chỉ KH cung cấp: 44 nguyễn công hoàn, phường giảng võ, hà nội","KH chưa báo CN \nKH phản ánh Hiệu suất sản phẩm kém, lắp NLMT nhưng tiền điện vấn tăng rất nhiều \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra cho KH","KH đã báo CN \nKH phản ánh: Gia đình tôi lắp hệ thống ngày 12/5\nSử dụng ok,đến ngày 04/6 pin dự phòng không lưu trữ được \nSau đấy 2 ngày bên công ty cho người đến mang đi bảo hành\nĐến ngày hôm nay 19/6 vẫn chưa thấy mang về\nNhư vậy theo đúng hợp đồng,phía công ty sẽ phải đổi cho tôi pin mới\nYêu cầu CN liên hệ lại cho KH và cho KT xuống hỗ trợ KH","1. KH đã báo CN\n2. KH phản ánh: Từ các sự cố trước về ivt hoạt động ko ổn định. CN chỉ thấy điều khiển từ xa ko thấy đến kiểm tra trực tiếp, và ko thấy xử lý. KH thấy là khi tăng tải lên vẫn lưới điện lưới buộc KH phải tắt tải. KH có liên hệ người phụ trách lắp đặt trước thì ko thấy nghe máy, KH rất ko hài lòng và bức xúc. \n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","1. Pin lưu trữ NLMT của KH chỉ hiển thị ở mức 43% dù trời nắng to khoảng 2 ngày nay, CN đã hẹn KH ngày 15/06 sẽ đến kiểm tra\n\n2. KH cần CN đến kiểm tra và giải đáp cho KH","1. KH đã liên hệ CN\n\n2. KH phản ánh tiền điện cần đóng đang tăng khoảng 3 tháng trở lại đây (Từ khoảng 5-6tr đến hơn 9tr)\n\n3. KH cần CN liên hệ và đến hỗ trợ kiểm tra sớm cho KH","1. KH đã báo CN: A Quốc Đại\n2. KH phản ánh: tủ điện có mùi khét, cả nhà mất điện\n3. KH yêu cầu: Qua hỗ trợ, xử lý tình trạng này","KH chưa báo CN, KT ( KH lắp từ 2021)\nKH báo sự cố nlmt sài được gần 2 năm, hỏng 2 năm nay không ai xuống sửa KT có xuống kiểm tra nói có gắn 1 cục gì đấy (KH không biết) là sẽ dùng được,  nhưng giờ đã nửa tháng vẫn chưa có ai xuống gắn, KH gay gắt \nYêu cầu CN liên hệ cho KT xuống kiểm tra cho KH","1. KH chưa báo CN\n2. KH phản ánh: Hệ KH hơn 7kw KH vẫn thấy hệ hoạt động bình thường tầm trưa trưa là pin lưu trữ đầy mà gần đây thấy tiền điện tăng bất thường. Hồi đầu sử dụng sản phẩm tiền điện là 200k/ 1 tháng đến gần đây t4 là 708k và t5 này là 1tr1 tiền điện. \n3. KH yêu cầu: KT xuống kiểm tra xem và khắc phục tình trạng này","KH chưa báo KT,CN \nKH báo sự cố NLMT tiền điện tăng, nhà KH dùng 2 công tơ, thì 1 công tơ có NLMT bị tăng tiền điện, 1 công tơ không dùng điện NLMT thì không bị tăng\nYêu cầu CN liên hệ và cho KT xuống hỗ trợ KH","KH phản ánh không theo dõi được hiệu suất nlmt qua App\n\nKH yêu cầu: KT lại giúp cho khách","Đã báo CN: Đã báo\nKH báo sự cố: Hiện tại 1 tấm pin nhà KH có hiện tượng bị không sử dụng được \nKH yêu cầu: KT qua kiểm tra cho Kh","CN 0968088033 báo sự cố hộ KH \n1. KH phản ánh: Bị bể 3 tấm pin. CN có qua kiểm tra tấm pin thì cũng thấy có vết từ trên trời rơi xuống, nhưng cũng chưa thể xác nhận chính xác được, KH cũng đang ko chấp nhận là do tác động vật lý. \n2. KH yêu cầu: Phản hồi lại thông tin cho KH và thay mới 3 tấm pin.","chi nhánh báo hộ 0382691111\nBiến tần hoạt động không ổn định\nKh cần ktra trong ngày hôm nay hoặc ngày mai\nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ cho CN\n\n2. Hiệu Suất NLMT của KH bị giảm khoảng 15%, trước đây ngày nắng tốt phát sinh được 30kw/h hiện tại phát sinh được 25kw/h, CN kiểm tra và thông tin do Inverter bị nóng nên giảm hiệu suất\n\n3. KH cần CN hỗ trợ và khắc phục giúp HT NLMT của KH hoạt động bình thường","1. KH đã liên hệ CN\n\n2. KH thay điện thoại nên chưa theo dõi được hiệu suất trên App, từ tin nhắn của điện lực thông tin sản lượng điện từ HT NLMT đang giảm nhiều khoảng 2 tháng gần dây\n\n3. KH cần CN liên hệ và đến kiểm tra cho KH","1. KH đã báo CN: Các sự cố từ trước và cũng đã có văn bản của CN gửi KH\n2. KH phản ánh: Về sự cố tấm pin bị vỡ do ngoại lực KH đang nghi ngờ tấm pin đang ko phải của chính hãng, KH có kiểm tra số serial tấm pin trên phần mềm AE Solar thì thấy báo ko có thông tin trên cty của hãng. Trước đó CN đến kiểm tra nhiều lần nhưng đến khi KH hỏi ngoại lực gì thì CN ko thấy nói. \n3. KH yêu cầu: Làm rõ thông tin, giải thích với KH về tấm pin. Nếu ko KH sẽ kéo pháp lý, đăng tin mxh, phá hoại cty, cảnh báo mọi người và dự kiến KH sẽ khởi kiện vào t6.","Đã báo chi nhánh \nKhách hàng đang thấy hệ thống NLMT đang không hoạt động\nyêu cầu kt qua ktra cho khách hàng","KH đã báo KT chưa báo CN \nKH báo giao thiếu 1 pin NLMT của KH mà hơn 1 tháng nay chưa thấy giao nốt cho KH \nYêu cầu CN liên hệ KH gấp","KH phản ánh 2 tấm Pin bị nứt, vỡ, võng. Yêu cầu kiểm tra, thay thế theo bảo hành","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra","1. Kh đã báo cn\n2. Kh phản ánh: Hệ của kh dạo này sd có hiện tượng liên tục bị sập. Kh đã báo kt và kt phản hồi do kh sd quá tải nhưng từ khi lắp đến nay kh báo chỉ dùng bằng đó thiết bị chứ ko hơn\n3. kh yc: YC cn hỗ trợ sớm"],"Ngày bắt đầu":["2026-07-23 13:30:00","2026-07-23 13:30:00","2026-07-23 11:03:00","2026-07-23 08:54:00","2026-07-23 08:32:00","2026-07-22 14:23:00","2026-07-23 10:23:00","2026-07-23 10:12:00","2026-07-23 09:33:00","2026-07-23 08:00:00","2026-07-23 08:00:00","2026-07-22 10:40:00","2026-07-22 10:26:00","2026-07-22 08:00:00","2026-07-22 08:13:00","2026-07-21 13:30:00","2026-07-21 08:58:00","2026-07-21 08:40:00","2026-07-21 08:53:00","2026-07-21 09:59:00","2026-07-20 17:09:00","2026-07-20 13:30:00","2026-07-20 09:39:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-17 16:01:00","2026-07-17 13:43:00","2026-07-20 08:00:00","2026-07-20 08:00:00","2026-07-16 16:12:00","2026-07-16 09:49:00","2026 var COL_WIDTHS = {"Mã tỉnh":100,"Lĩnh vực":100,"Ngành hàng":100,"Sản phẩm":150,"Mã HĐ":100,"Tên khách hàng":120,"SĐT":100,"Địa chỉ":250,"Giai đoạn":100,"Nhóm sự cố":100,"Loại sự cố":100,"Chi tiết":300,"Ngày bắt đầu":100,"Ngày kết thúc":100,"Trạng thái":100,"Tên nhân viên":100,"Mã nhân viên":100,"Hệ thống":100,"Đơn vị điều hành":100,"AM chuyên quản":100};
var CT_GROUP   = 'bang_chitiet_group';
var AM_MAP     = {"P.KDNLMT":["P.KDNLMT"],"P.Triển khai":["N1 - Congnd15, Tienvt16","N2 - Thaoltt16, Thikd","N3 - Truongdv17, Duyph5"],"VHKT":["VHKT"]};
var TINH_MAP   = {"N1 - Congnd15, Tienvt16":["DTP"],"N2 - Thaoltt16, Thikd":["AGG","BNH","DNI","QTI"],"N3 - Truongdv17, Duyph5":["HNI","NBH","PTO","TNH"],"P.KDNLMT":["CMU","HCM"],"VHKT":["AGG","BNH","CMU","DLK","DNG","DNI","DTP","HCM","HNI","HPG","HTH","HUE","HYN","KHA","LDG","NAN","PTO","QNH","QNI","QTI","TNH","TNN","VLG"]};
</script>
<script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {
      if (el.selectize) el.selectize.clear();
    });
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');
    if (amEl)   buildOptions(amEl,   []);
    if (tinhEl) buildOptions(tinhEl, []);
    if (amFilterHandle)   amFilterHandle.clear();
    if (tinhFilterHandle) tinhFilterHandle.clear();
  };

  /* ── Lấy dữ liệu theo filter hiện tại (cho Export) ── */
  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s     = document.createElement('script');
    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── Xuất Excel ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── Xuất PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();

  async function getLastBuild() {
