trợ cho KH","báo hệ NLMT bị lỗi. bình lưu trữ kêu tè.tè rất lớn. ko biết bị gì.\nchưa báo chi nhánh\nKH nhờ kỹ thuât kiểm tra.","***SĐT phản ánh: 0983674760\nĐơn hàng của KH phát sinh thêm vấn đề là phải thay thế giảm chấn của máy, KH đang ko có ở nhà và muốn hỏi xem thiết bị thay thế đó mua ở đâu và có chính hãng hay không. KH chỉ hỏi có thế nhưng thấy thái độ của KT trả lời thì KH ko hài lòng lắm. KH cũng muốn hỏi cả 2 tên KT này.","1. KH đã báo CN: A Kiên, A Huy\n2. KH phản ánh: Pin lưu trữ ko thấy sạc vào thêm nữa được 89% là ngưng, cũng ko thấy đèn. Khi mất điện cũng ko thấy xả ra.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này cho KH","KH cần liên hệ tư vấn, khảo sát về nlmt","kt đã hẹn khách hàng ngày 10/5 \nnhưng chưa tháy gọi cho kh\nyêu cầukt gọi lại cho khách hàng","Đã gọi chi nhánh ( Anh Tống)\nKh đã ck trước 20% và chi nhánh hứa sau 30/4 lắp nhưng đến bây giờ kt chưa gọi cho khách hàng\nKhách hang yêu cầu 1 ngày cụ thể \nYêu cầu kt qua xửu lý khách hang","1. KH đã liên hệ với CN\n\n2. KH ký HĐ HT NLMT và đặt cọc hợp đồng tuy nhiên đã quá hạn lắp đặt 15 ngày vẫn chưa được hỗ trợ triển khai lắp đặt\n3. KH cần CN tiến hành lắp đặt gấp cho KH","1. KH chưa báo CN\n2. KH phản ánh: ivt ko nhận được tín hiệu, ko có ra điện và KH xem trên app cũng ko thấy hoạt động.\n3. KH yêu cầu: Qua kiểm tra, khắc phục dứt điểm tình trạng này.","Kh đã gọi lại cho kĩ thuật\nSau khi vsinh điều hòa thì báo lỗi \nKh yêu cầu xử lý gấp","1. KH đã báo CN: A Trương Huy Công sđt 0337878789\n2. KH phản ánh: lắp xong bộ NLMT gần 9 tháng, mà KH yêu cầu CN cấp bản vẽ hoàn công và gửi lại hoá đơn nhiều lần nhưng không làm.\n3. KH yêu cầu: Hỗ trợ KH và phản hồi lại thông tin","Chi nhánh báo hộ kh \nQuá tải con CvAv hệ 12w lên 8w đã ngắt \nYêu vầu kt qua ktra cho kh","Chưa báo chi nhánh\nSản sinh công chưa đạt, kh xem app thì thấy được hpwn nửa công suất \nYêu cầu kt xuống ktra cho kh","KT đã gọi cho kh hẹn lịch 9/4 nhưng chưa gọi cho khách hàng","Kt Đã qua khảo sát nhưng mấy ngày nay không báo giá cho kh \nyêu cầu kt báo giá gấp cho khách hàng","1. KH đã báo CN: A Cầu\n2. KH phản ánh: Ko sản xuất ra được 1 tí điện nào, trước KT khắc phục được đúng 10p rồi lại như cũ công suất ko có 1 kwp nào cả.\n3. KH yêu cầu: Qua kiểm tra nguyên nhân và khắc phục dứt điểm tình trạng này.","1. KH đã liên hệ với CN (A Thế)\n2. Tủ nguồn không có đèn sáng\n3. KH cần CN hỗ trợ khắc phục sớm","Kh đã gọi lên chi nhánh\nkh cần chỉnh lại thời gian xả pin\nyêu cầu kt qua ktra cho khách hàng","Đã có yctx nhưng kt chưa liên hệ với khách hàng","1. KH đã báo CN: A Tùng\n2. KH phản ánh: Khi mất điện lưới thì mất cả hệ nlmt, pin lưu trữ thì vẫn có nhưng ko thấy dùng. \n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","Đã gọi chi nhánh. \nKH đã chuyển trước 20% nhưng hiện tại vẫn chưa được triển khai lắp đặt. \nYêu cầu CN xử lý sớm.","1. KH đã báo CN: Anh Lạc - thi công lắp đặt\n2. KH phản ánh: Lắp đặt từ Tết đến giờ mà 2 mối điện hình như thợ quên đấu nối, KH cung cấp hình ảnh file đính kèm và đoạn chat qua zalo với anh Lạc.\n3. KH yêu cầu: Qua kiểm tra và kết nối lại 2 tấm pin.","6/5 lắp đặt anh tân đã hứa với khách hàng \nKh muốn hủy hợp đồng NLMT \nYêu cầu kt gọi lại cho kh","1. KH chưa báo CN: KH ko còn nhớ ai trước phụ trách lắp đặt\n2. KH phản ánh: Tổ KH đang ở có yêu cầu lập danh sách các hộ có sử dụng nlmt.\n3. KH yêu cầu: KH muốn hỏi VCC đã có thông báo nlmt cho sở công thương chưa và nếu chưa thì thủ tục thông báo như nào thì hỗ trợ KH.","Đã báo chi nhánh \nTủ điện bị nhảy sập nguồn hư CP\nYêu cầu kt qua xử lý sớm cho kh vào ngày mai","CN 0373121111 báo sự cố hộ KH\n1. KH phản ánh: KH ko kết nối được vào app theo dõi nlmt, ko thấy có nlmt xuống.\n2. KH yêu cầu: KT qua kiểm tra hỗ trợ cho KH","Đã báo chi nhánh (Anh tuệ đã nghỉ vt )\nđã lắp NLMt vào năm 2021 nhg bên vt Lắp nlmt ko lắp chống xung ngược lên lưới lắp hệ biến tần bg10ktR là thiếu xung ngược điện lưới hôm trước bên điện lực qua kiểm tra khách hàng mới biết \nyêu cầu kt qua kiểm tra và hỗ trợ khách  hàng","1. KH đã báo cn: A Hậu, A Cảnh\n2. KH phản ánh: hộp chuyển đổi của KH bị lỗi hư 6,7 tháng nay và A Hậu có giao cho A Cảnh dỡ ra và mang đi bảo hành hơn 1 tháng nay rồi, a Cảnh thì lúc đầu tháo có bảo là đợi khoảng 7-10 ngày thôi nhưng đến giờ KH liên hệ với a Cảnh cũng đang ko rõ chính xác là ngày nào thiết bị sửa chữa xong.\n3. KH yêu cầu: CN phản hồi lại thông tin thiết bị bảo hành của KH đang như thế nào rồi.","Đã báo chi nhánh \nKH THẤY ĐIỆN NĂNG LƯỢNG TRỜI HIỆU NĂNG THẤP \nYÊU CẦU KT QUA KTRA CHO KH","KH đã báo KT và GDKD \nKH phản ánh sự cố đấu lệc pha điện, chưa thi công cột chống sét, ban đêm không đủ điện dùng\nKH yêu cầu CN cho KT xuống Ktra cho KH","1. KH liên hệ CN và được hướng dẫn gọi tổng đài\n2. KH lắp hệ bám tải hiệu suất chỉ đạt >2kw phải lấy điện lưới bù vào bình thường khoảng 5->6kw\n3. KH cần CN đến hỗ trợ khắc phục sớm","1. KH chưa liên hệ CN\n\n2. KH mới thay điện thoại, cần hỗ trợ cài lại và đăng nhập APP theo dõi hiệu suất HT NLMT\n3. KH cần CN hỗ trợ sớm","KH đã báo KT tên Huy chưa báo CN \nKH báo hiệu suất NLMT kém không đủ sạc  pin lưu trữ\nYêu cầu CN cho KT xuống kiểm tra lại cho KH gấp","1. KH đã báo CN \n2. KH phản ánh sự cố pin NLMT bị nổ KT đã xuống tháo nhưng KT chưa đem về kiểm tra và sửa cho KH, nay KH gọi lên yêu cầu KT có xuống đem về sửa cho KH không thì nói KH để còn biết KH lắp bên đơn vị khác\n3. Yêu cầu CN liên hệ và cho KT  xuống Ktra gấp cho KH, KH đang rất gay gắt","KH chưa báo lên chi nhánh\nKH báo inverter hiện tại bị cháy\nKH yêu cầu KT đến kiểm tra","1. CN báo lỗi cho KH\n2. Biến tần của KH sau khi sạc đầy pin cho ắc quy luôn lấy điện lưới EVN từ 300-400W ( Trong khi dải BV thừa cấp cho nhà), nghi ngờ biến tần bị lỗi\n3. KH cần CN hỗ trợ khắc phục sớm","1. CN báo lỗi cho KH\n2. Biến tần mất màn hình LED, Dải Pin BV không cấp được điện cho tải nhà\n3. KH cần CN đến hỗ trợ khắc phục sớm","1. Nội dung phản ánh: \n- Vật tư lắp đặt không đúng như báo giá cuối cùng (khác chủng loại nhưng giá tiền vẫn như trong báo giá => KH nghi ngờ lắp sản phẩm giá thấp hơn nhưng vẫn tính tiền tương tự)\n- Chưa cài đặt theo dõi\n- Không cân được  tải dẫn tới sản lượng thấp. \n- Hợp đồng khách hàng ký giá trị 138,039,000.00, đã chuyển khoản cho nhân viên Hiếu 64 triệu, số tiền còn lại KH chưa thanh toán nốt cho phía Stride. \n2. Khách hàng yêu cầu: \n- Phương án 1: Cân lại tải để đảm bảo hiệu suất,  có lợi nhuận cho khách hàng theo như trước đó tư vấn. (trước đó nhân viên tư vấn lợi nhuận 1 năm của KH có thể tới 60 triệu nhưng hiện tại thực tế thấp hơn nhiều)\n- Phương án 2: Tháo dỡ công trình và đền bù thiệt hại cho khách hàng","KH đã báo chi nhánh\nKH đã cọc tiền, 1 tháng chưa thấy chi nhánh qua lắp \nKH Yêu cầu kỹ thuật hẹn thời gian cụ thể cho KH","Đã báo chi nhánh\nCục inverto bị hỏng đã tháo mang đi rồi nhưng không bảo kh là hỏng cgi\nYêu cầu các bạn kt gọi lại cho khách hàng","1. KH chưa liên hệ CN\n\n2. Hiệu suất HT NLMT chưa đảm bảo Hệ 20 KWP, hiệu suất cao nhất 1 ngày chỉ đạt 50KWP, Inverter thỉnh thoảng bị đơ (7-10 ngày bị một lần) \n\n3.KH cần KT của TCT đến hỗ trợ kiểm tra và bảo hành","1. KH chưa báo chi nhánh\n2. KH phản ánh: Hệ nlmt của kh bị lỗi, ko có điện để sd\n3. KH yêu cầu kỹ thuật xuống kiểm tra","1. KH chưa báo cn\n2. KH phản ánh: Ivt ko thấy lên đèn tín hiệu ở trước, KH theo dõi trên app thì thấy thiết bị ngoại tuyến. \n3. KH yêu cầu: KT xuống kiểm tra, xử lý tình trạng này cho KH","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. Inverter bị lỗi không lưu điện vào trong pin, đổi dòng dùng điện trực tiếp được nhưng không vào pin lưu trữ\n3. KH y/c CN hỗ trợ đổi thiết bị mới cho KH","KH đã báo CN \nKH báo lỗi Iverter không hoạt đông\nYêu cầu CN liên hệ ngay cho KH","Kh đã báo chi nhánh\nTủ biến tần nổ cháy\nKh yêu cầu kt trong tuần này liên hệ hỗ trợ","Khách hàng đang nhận định và khiếu nại hệ thống năng lượng mặt trời hoạt động không hiệu quả. Nguyên nhân do buổi sáng đón nắng tốt, nhưng đến trưa thì bị che bóng (nên theo khách, hệ 6kW nhưng công suất thấp chỉ sản sinh được 1kW thôi). Liên quan việc che bóng thì khách cho rằng Viettel không khảo sát kỹ từ đầu. Và có yêu cầu di dời tấm pin áp mái đến vị trí đón nắng tốt hơn (trong phạm vi 10 m trên mái nhà).\nNhờ KT xêp lịch hẹn sớm với khách hàng và hỗ trợ\nKhảo sat thực tế và lên phg án di dời các tấm pin","1. KH đã báo CN \n2. KH gặp sự cố mất kết nối giữa biến tần với Inverter\n3. yêu cầu CN liên hệ lại ngay cho KH","1. KH đã báo CN: A Trung GĐ CN và A Tài TP Kinh doanh\n2. KH đã gửi qua: gửi văn bản vào 22/4 bằng bưu điện và gửi qua zalo cho CN.\n3. KH phản ánh: Sự cố từ trước KT cũng đã đến kiểm tra thiết bị hoạt động bình thường nhưng chưa đưa ra được theo yêu cầu của KH, KH vẫn thấy là hiệu suất kém so với trước đây. Hệ của KH 52kwp mà những ngày đầu tháng KH theo dõi là t4 được 192kwp và 1/5 được 167,8 kwp nằm khoảng 3,2-3,7kwp/ 1 tấm pin. So sánh với những năm trước đây là thấp và so sánh với những người xung quanh nhà KH cũng thấy thấp hơn tấm pin của ngta 4,6-4,7kwp thậm chí lên đến 5kwp. \n4. KH yêu cầu: Kiểm tra đo đạc lại thiết bị có biên bản ghi nhận xem hiệu suất giờ còn là bao nhiêu, hiệu suất thấp hay thiết bị hỏng thì mang ra hãng bảo hành còn ko có thì KH chịu trả phí thêm để sửa chữa.","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","kh chưa báo chi nhánh ko thấy HĐ điện tử nhg khách hàng đã chụp hợp đồng giấy qua zalo\nNlmt không sản xuất ra điện\nyêu cầu kt qua ktra cho khách hàng","chưa báo chi nhánh\nbiến tần ko báo điện hệ thống năng lượng mặt trời đang ko dùng được\nyêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ với CN nhưng chưa tiếp nhận: Có liên hệ với CN là a Bùi Anh Nguyễn nhưng ko nghe máy, và cũng ko thấy gọi lại.\n2. KH phản ánh: Pin tích điện đủ nhưng ko thấy xả ra để dùng. KH đã báo bên điện lực đến kiểm tra và đã đo đồng hồ các thứ và ko bị làm sao. Tiền điện bây giờ vẫn tăng cao lúc chưa lắp là 8tr tư vấn lắp đặt thông tin là 2tr mà những tháng đầu tiền điện 4tr. Và khi sập điện lưới bật quạt để chạy thử sang nlmt thì được 1 lúc lại tự ngắt rồi lại dùng điện lưới.\n3. KH yêu cầu: Qua kiểm tra thiết bị xem và khắc phục tình trạng này.","KH phản ánh qua zalo điều hòa bật bị chảy nước, quạt gió không mở \n- Yc cho nv KT qua ktra khắc phục","1. KH liên hệ với nhân viên hỗ trợ lắp đặt của CN\n2. HT NLMT cua tấm pin lỗi một bên string không ra điện ngày 30/04 , mất công suất điện vào \n3.KH cần CN đến hỗ trợ, khắc phục cho KH sớm","CN 0868707197 báo sự cố hộ KH\n1. KH phản ánh: Đang bị mất điện lưới, pin ko đẩy lên được vì bị hỏng đảo chiều. Ngoài ra app theo dõi KH cũng đang ko vào được.\n2. KH yêu cầu: Qua kiểm tra, hỗ trợ khắc phục tình trạng này.","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","1. KH đã báo CN (KH ko nhớ rõ tên)\n2. KH phản ánh: Cách đây 4 hôm hệ của KH bị sét đánh, KH cũng ko rõ là ở đâu chỉ thấy áp ở tủ điện nhảy xuống, điện ko phát lên lưới và thấy bị hỏng.\n3. KH yêu cầu: KT qua kiểm tra, khắc phục tình trạng này cho KH.","1. KH chưa báo cn\n2. KH phản ánh: Ivt có vấn đề báo đỏ\n3. KH yêu cầu: Qua kiểm tra khắc phục","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra","1. KH đã liên hệ với CN, CN đã hỗ trợ tháo tấm pin lỗi\n2.KH nghe tiếng như có tiếng nổ, lên kiểm tra thấy tấm pin rạn vỡ, cần kiểm tra bảo hành\n3.KH cần CN hỗ trợ thông tin sớm","KH cần mẫu bổ sung số 01 để báo với điện lực gia đình đang sử dụng NLMT theo nghị định 13 \nYêu cầu KT liên hệ lại KH gấp","KH (work@namdd.dev) gửi mail phản ánh các vấn đề: \n1.\tTiền dây dẫn thừa: Đề nghị Viettel Phú Thọ thực hiện việc bồi hoàn lại tiền cho phần dây điện thừa do thi công sai lệch ban đầu.\n2.\tTiêu chuẩn vật tư tủ điện (Dựa trên buổi làm việc ngày 11/04/2026): Hai bên đã thống nhất ghi nhận hiện trạng là chưa xác định được vật tư bên trong tủ điện có đảm bảo đúng danh sách thiết bị và tiêu chuẩn kỹ thuật của công ty hay không. Tôi yêu cầu phía Tập đoàn và VCC cung cấp chi tiết danh sách vật tư và tiêu chuẩn kỹ thuật để gia đình có cơ sở so sánh với chiếc tủ trị giá 6.500.000 VNĐ hiện tại. Yêu cầu làm rõ tính an toàn khi sử dụng dây cáp DC để đấu nối cho phần AC và dây DC 6mm2 đi với MCB 63A. Thời hạn phản hồi: Trước ngày 20/04/2026.\n3.\tXử lý lỗi Inverter (SPD DC): Hệ thống liên tục báo lỗi DC SPD. Theo thông tin mới nhất, hiện DatGroup đang làm việc với hãng GoodWe và sẽ có email phản hồi kết quả xử lý trong vòng 02 ngày tới. Đề nghị phía Viettel bám sát để xử lý dứt điểm cho khách hàng .\n4.\tĐiều chỉnh chính sách bảo hành (Dựa trên buổi làm việc ngày 11/04/2026): Thông tin bảo hành combo biến tần và pin lưu trữ của hãng hiện không khớp với hợp đồng . Phía Chi nhánh Phú Thọ đã hẹn xử lý trong vòng 120 ngày kể từ ngày 11/04/2026. Như vậy, thời hạn cuối cùng để hoàn tất việc điều chỉnh này là ngày 09/08/2026.\n6.\tThao tác điều khiển thiết bị từ xa không báo trước: Giải trình về việc tài khoản viettelsolar.phutho@gmail.com tự ý \"Xóa dữ liệu báo động lỗi hồ quang\" và \"Vô hiệu hóa báo động chống sét\" ngày 12/04/2026 mà không thông báo hay nắm rõ mục đích xóa.","- KH chưa báo chi nhánh \n- Tấm pin nlmt cần hỗ trợ 2 cái. Hôm nọ kt lắp sai tấm pin nên bị đọng nước, phần trên thì đúng phần dưới thì sai. Có 2 cái sửa  thì 1 cái dùng được  1 cái không\n- KH cần hỗ trợ sớm","1. KH đã báo cn: a Hoàng Đình Nhâm\n2. KH phản ánh: KH đã báo cn nhiều lần nhưng chưa được hỗ trợ. Hệ của KH 6 cục pin nhưng chỉ thấy xả 3 cục và chỉ xài được 1 lúc là nó hết.\n3. KH yêu cầu: Điều KT qua kiểm tra, khắc phục tình trạng này cho KH.\n***SĐT phản ánh và liên hệ: 0706455040","- KH báo qua chị Phượng (CN) \n- KH đang gặp sự cố ắc quy, 2 khối ắc quy 1 khối xả 1 khối không\n- Kh yêu cầu xử lý sớm","Trong thời gian vừa qua tôi quan sát thấy inverter hybrid có hiện tượng giảm huy động công suất DC từ tấm pin, dù trời vẫn nắng tốt và ổn định, bình lưu trữ vẫn chưa đầy và vẫn phải rút điện từ bình lưu trữ để cấp điện cho phụ tải AC. Mỗi lần hiện tượng này xảy ra kéo dài khoảng 15 - 30 phút vào thời điểm ngẫu nhiên trong ngày.\nVCC hỗ trợ để tìm ra được nguyên nhân và giải pháp cho vấn đề này.","1. KH đã báo cn: (theo các sự cố từ trước)\n2. KH phản ánh: KH bị vỡ mặt tấm cường lực pin NLMT từ 1 năm trước. KH chưa thấy có ai đến ktra và vỡ như nào, ko đến kiểm nghiệm thực tế, chỉ thấy mỗi khi lên vệ sinh rồi chụp một tấm ảnh, KH ko chấp nhận được. CN phản hồi là\ntấm pin vỡ do ngoại lực nhưng lại chưa chứng minh cho KH thấy.\n3. KH yêu cầu: KT cùng nhau lên mái kiểm tra tấm pin cùng KH phân tích rõ, chứng minh cho KH thấy là vỡ do đâu.","1. KH chưa báo CN\n2. KH đang sd NLMT nhưng hiện tại thiết bị ko xả điện\n3. YC KT qua kiểm tra và xử lý gấp\n***địa chỉ lắp đặt: kilo 63, khu đô thị đức tài, xã hoài đức, tỉnh lâm đồng.","Mất 1 string điện không vào ắc quy. Không đủ cung cấp cho tải nhà dùng . Anh cần đến kiêm tra trong ngày hôm nay.\n**Địa chỉ lắp đặt: số nhà 300, kim tân, xã đoài phương, thành phố hà nội.","1. KH đã báo cn\n2. KH yêu cầu: Muốn hiện thông số trên app từ ivt qua điện lưới với điện dùng cho GĐ để báo điện lực.","Lỗi pin ko lưu","1.Đã báo chi nhánh chưa: chưa báo\n2.Đã báo qua đâu: DTV HPC\n3.KH phản ánh về vấn đề: Hiệu suất hệ thấp.\n4.KH yêu cầu KT qua kiểm tra cho KH","1. KH chưa báo cn\n2. KH phản ánh: Sự cố từ TT_1772587360264 trước sau khi xử lý KH thấy hệ thống nlmt ko có ổn định, lâu lâu tự ngắt và phải bảo nv tắt 3 công tắc cp đi bật lại mãi mới được.\n3. KH yêu cầu: Kiểm tra lại hàng hóa xem có đúng với HĐ về chất lượng, hiệu suất không. Nếu có vấn đề thì thay mới tinh cho KH để hệ thống vận hành trơn tru.","1. Kh đã báo cn\n2. Kh phản ánh: Hệ của kh dạo này sd có hiện tượng liên tục bị sập. <script>
(function () {

  var activeKeys = null;

  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }
    var fh = new crosstalk.FilterHandle(CT_GROUP);
    fh.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });
  }
  initFilter();

  function getFilteredData() {
    if (!activeKeys) return FULL_DATA;
    var keySet = new Set(activeKeys.map(String));
    return FULL_DATA.filter(function (_, i) {
      return keySet.has(String(i + 1));
    });
  }

  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }
    var s = document.createElement('script');
    s.src = url;
    s.onload = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

  /* ── EXCEL ── */
  window._taiExcel = function (btn) {
    function doExcel() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');
      XLSX.writeFile(wb, 'danh_sach_ticket.xlsx');
      setBtnState(btn, false, '⬇ Tải Excel');
    }
    window.XLSX
      ? doExcel()
      : loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', doExcel);
  };

  /* ── PNG ── */
  window._taiPNG = function (btn) {
    function doPNG() {
      setBtnState(btn, true);
      var rows = getFilteredData();
      if (!rows.length) {
        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '📷 Tải PNG');
        return;
      }

      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);

      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';

      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);

      html2canvas(wrapper, {
        scale: 2,
        backgroundColor: '#ffffff',
        useCORS: true,
        width: wrapper.scrollWidth,
        height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

})();

      const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
      for (const annoteDlNode of annoteDls) {
        annoteDlNode.addEventListener('click', (event) => {
          const clickedEl = event.target;
          if (clickedEl !== selectedAnnoteEl) {
            unselectCodeLines();
            const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
            if (activeEl) {
              activeEl.classList.remove('code-annotation-active');
            }
            selectCodeLines(clickedEl);
            clickedEl.classList.add('code-annotation-active');
          } else {
            // Unselect the line
            unselectCodeLines();
            clickedEl.classList.remove('code-annotation-active');
          }
        });
      }
  const findCites = (el) => {
    const parentEl = el.parentElement;
    if (parentEl) {
      const cites = parentEl.dataset.cites;
      if (cites) {
        return {
          el,
          cites: cites.split(' ')
        };
      } else {
        return findCites(el.parentElement)
      }
    } else {
      return undefined;
    }
  };
  var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
  for (var i=0; i<bibliorefs.length; i++) {
    const ref = bibliorefs[i];
    const citeInfo = findCites(ref);
    if (citeInfo) {
      tippyHover(citeInfo.el, function() {
        var popup = window.document.createElement('div');
        citeInfo.cites.forEach(function(cite) {
          var citeDiv = window.document.createElement('div');
          citeDiv.classList.add('hanging-indent');
          citeDiv.classList.add('csl-entry');
          var biblioDiv = window.document.getElementById('ref-' + cite);
          if (biblioDiv) {
            citeDiv.innerHTML = biblioDiv.innerHTML;
          }
          popup.appendChild(citeDiv);
        });
        return popup.innerHTML;
      });
    }
  }
});

<script>
  const CHECK_INTERVAL = 60000;
  
  async function getLastBuild() {
    const res = await fetch('/last-build.json?t=' + Date.now());
    const data = await res.json();
    return data.buildTime;
  }
  (async () => {
    const initialBuild = await getLastBuild();
    
    setInterval(async () => {
      const currentBuild = await getLastBuild();
      if (currentBuild !== initialBuild) {
        window.location.reload();
      }
    }, CHECK_INTERVAL);
  })();
</script>
