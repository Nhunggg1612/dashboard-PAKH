c tin nhắn dời lịch hẹn đơn đến tận 12/6 trong khi đơn làm xong rồi. \n2. KH yêu cầu: VCC trả lời bằng văn bản qua đường mail viettelaio.polish480@passmail.net tường tình về trường hợp này và đưa ra phương án xử lý như nào, nếu ko KH sẽ làm việc với cơ quan chức năng để giải quyết.","1. KH đã báo CN\n2. KH phản ánh: Về phần thủ tục hồ sơ gửi phía bên điện lực CN là a Đạt đã thông báo là làm xong cho KH rồi\n3.KH cần CN hỗ trợ, hướng dẫn xem trực tiếp thông tin với phía bên điện lực là đã chính xác và đã nộp chưa cho KH yên tâm.","CN 0985951652 báo sự cố hộ KH \n1.\tKH phản ánh: có 1 đường dậy bị tuột, biến tần kêu to bất thường\n2.\tKH yêu cầu: Qua kiểm tra, xử lý tình trạng này.","KH đặt dịch vụ vệ sinh 5 điều hòa vào ngày 2/6 đặt lịch vào buổi sáng nhưng ko có ai gọi điện cho KH xác nhận đơn, đến 11h KH phải tìm số KT trên app để hỏi thì nhận được phản hồi là sẽ đến vào 1h30 chiều trong khi KH phải đợi cả buổi sáng. Trong gói dịch vụ có vệ sinh cả cục nóng nhưng KT lại lấy lý do ko mang thang nên ko làm được. KH rất ko hài lòng về chất lượng dịch vụ. KH yêu cầu KT qua kiểm tra lại và tiếp cận vệ sinh phần cục nóng.","Đơn hàng làm xong vào 6/6 hiện đã hết hạn bảo hành nhưng điều hòa đang gặp lỗi mã lỗi c1 h23. KH cần KT qua kiểm tra lại và hỗ trợ, KH đồng ý tính phí","1. KH đã báo CN\n2. KH phản ánh: KH có 2 HĐ NLMT, HĐ 1 là phía bên CN chưa có BBNT cho KH trong khi KH giục rất nhiều hệ này ko có pin lưu trữ và KH đang muốn gắn thêm pin lưu trữ và làm hợp đồng thứ 2 là KH đã có liên hệ với nv cũ là A Hội vào giữa t3 và bên CN phản hồi là do cháy hàng và phải chờ đến cuối t4 và mãi đến tận 19/5 mới cho KH ký HĐ trong khi KH đã có thanh toán tiền tạm ứng 90% rồi tới nay giữa t6 chưa thấy có thông tin gì. CN phản hồi là do HĐ đang gặp trục trặc rồi hết sự cố này tới sự cố kia, KH nhắn tin thì ko trả lời, gọi điện thì CN cúp máy. KH đang nghi ngờ CN có dấu hiệu lừa đảo\n3. KH yêu cầu: CN sắp xếp có 1 buổi làm việc gặp mặt trực tiếp vào t7 tuần này có nv đang làm việc với KH và quản lý KV, CN để giải quyết HĐ của KH đang gặp vấn đề gì, và đưa ra quyết định hướng xử lý như nào.","1. KH chưa báo CN \n2. KH phản ánh: lỗi điện nlmt\n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm tình trạng này.","1. KH đã báo CN: có sự cố từ trước TT_1779608398317\n2. KH phản ánh: Vẫn gặp tình trạng sự cố cũ tự nhảy số và tắt nguồn, bật khoảng 3p là tự tắt. Từ sự cố trước KH ko thấy có KT liên hệ hay đến kiểm tra sửa chữa\n3. KH yêu cầu: Qua kiểm tra, xử lý dứt điểm","1. KH chưa báo CN\n2. KH phản ánh: hiệu suất pin lưu trữ chưa bao giờ đạt đến 100% chỉ đạt đến 97% trong khi trời rất nắng\n3. KH yêu cầu: Qua kiểm tra, hỗ trợ KH sử dụng sản phẩm","KH chưa báo Cn \nKh phản ánh Hệ thống NLMT đang gặp sự cố không hoạt động \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra gấp","1. KH đã báo CN: A Huy - trước lắp đặt NLMT\n2. KH phản ánh: Hiệu suất kém hệ 6kw nhưng thời điểm cao điểm nắng nhất cũng chỉ đạt được 3kw. KH theo dõi trên app hiệu suất cũng ko thấy hoạt động.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","1. KH chưa báo CN\n2. KH phản ánh: điều hòa ko mát. Hôm qua KH có gọi bên hãng MDV qua kiểm tra thì báo lắp máy sai nguồn, đấu nối có vấn đề 1 là do đấu nối van, 2 là do đấu nối rò ga.\n3. KH yêu cầu: Qua kiểm tra lại và khắc phục tình trạng này","1. KH đã liên hệ CN\n\n2. KH phản ánh tiền điện cần đóng đang tăng khoảng 3 tháng trở lại đây (Từ khoảng 5-6tr đến hơn 9tr)\n\n3. KH cần CN liên hệ và đến hỗ trợ kiểm tra sớm cho KH","1. KH đã liên hệ CN\n\n2. HT NLMT của KH hiện đang không phát sinh điện, lượng tiền điện cần đóng của KH gần đây tăng nhiều\n\n3. KH cần CN liên hệ và đến hỗ trợ khắc phục sớm","KH chưa báo CN \nKH phản ánh hệ thống NLMT bị lỗi \nYêu cầu quản lý chi nhánh điều kĩ thuật xuống kiểm tra","1. KH chưa báo CN\n2. KH báo cục pin lưu trữ bị ngắt điện\n3. Yêu cầu KT hỗ trợ xử lí cho KH gấp","1. Thiết bị biến tần của KH đang gặp sự cố và CN đã đến hỗ trợ chuyển thiết bị đi bảo hành ngày 11/06\n\n2. KH cần chi nhánh hỗ trợ khắc phục sớm","1. KH chưa liên hệ CN\n\n2. Khoảng 5-6 ngày nay khi KH tắt điện trong văn phòng các bóng đèn không tắt hết mà sáng lờ mờ\n\n3. KH cần chi nhánh kiểm tra giúp cho KH","KH chưa báo CN\nKH phản ánh bị lỗi app và muốn yêu cầu kĩ thuật xuống đo điện năng lượng\nYêu cầu quản lí điều kĩ thuật xuống hỗ trợ khách","1. KH chưa báo CN\n2. KH phản ánh: đồng hồ chính điện lưới vẫn có nhưng trong nhà ko có cả điện lưới lẫn điện nlmt. KH đã báo bên điện lực kiểm tra và điện lực báo do lỗi điện nlmt\n3. KH yêu cầu: KT xuống kiểm tra, xử lý tình trạng này\n***SĐT phản ánh: 0822993939","Acquy lưu trữ không hoạt động","CN 0985792828 báo sự cố hộ KH\n1. KH phản ánh: điện nlmt ko chạy, trước KH sử dụng 2 công tơ giờ chuyển về 1 công tơ\n2. KH yêu cầu: Hỗ trợ đấu lại điện về 1 công tơ","1. KH đã báo CN: A Châu\n2. KH phản ánh: tủ điện bị hư, aptomat ko bật lên được nhảy lên nhảy xuống cũng ko thấy có điện lưới vào tủ điện\n3. KH yêu cầu: Qua kiểm tra, xử lý tình trạng này","1. KH đã báo CN: A Thắng\n2. KH phản ánh: ivt báo lỗi trên app ko hoạt động ko phát ra điện 10-12 ngày rồi\n3. KH yêu cầu: Qua kiểm tra, xử lý tình trạng này","1. KH đã báo CN: A Quốc Đại\n2. KH phản ánh: tủ điện có mùi khét, cả nhà mất điện\n3. KH yêu cầu: Qua hỗ trợ, xử lý tình trạng này","Thiết bị máy giặt của KH sau bảo dưỡng vệ sinh hiện đang kêu to, đã hết thời gian bảo hành,\n\nHiện KH cần KT đến kiểm tra lại cho KH","1. KH đã liên hệ CN\n\n2. HT NLMT của KH đang mất kết nối Wifi, Trên theo dõi hiêu suất thông báo HT đang ngoại tuyến\n\n3. KH cần CN liên hệ và hõ trợ sớm","1. KH đã báo CN\n2. KH phản ánh: trong năm sản lượng điện ra kém có gọi cho CN bảo theo dõi thêm nhưng đến giờ KH thấy bị mất kết nối app toàn thấy dữ liệu toàn 2025\n3. KH yêu cầu: Qua kiểm tra hiệu suất và hỗ trợ kết nối lại app","KH đã báo Cn \nKH phản ánh tiến độ triển khai chậm, nhân viên hẹn nhiều lần nhưng chưa thực hiện\nYêu cầu quản lí điều kĩ thuật xuống kiểm tra gấp","Kh đã báo CN , KT \nKH báo sự cố NLMT dây cáp và attomat đang bị nóng khoảng 80 90 độ \nYêu cầu CN cho KT xuống hỗ trợ KH","1. KH đã liên hệ CN tuy nhiên chưa có phản hồi rõ ràng\n\n2. KH đã được hỗ trợ lắp đặt HT NLMT và đưa vào sử dụng, tuy nhiên còn một số nội dung KH chưa được chi nhánh hỗ trợ như:\n\n- Nghiệm thu hoàn thành công trình\n- Hướng dẫn vận hành, sử dụng hệ thống (App theo dõi hiệu suất)\n- Quyết toán, thanh toán giá trị hợp đồng còn lại theo quy định\n- Xác nhận thông tin bảo hành của Hệ thống, thiết bị đã lắp đặt\n\n3. KH cần CN liên hệ và hỗ trợ giải đáp sớm","KH chưa báo CN, KT ( KH lắp từ 2021)\nKH báo sự cố nlmt sài được gần 2 năm, hỏng 2 năm nay không ai xuống sửa KT có xuống kiểm tra nói có gắn 1 cục gì đấy (KH không biết) là sẽ dùng được,  nhưng giờ đã nửa tháng vẫn chưa có ai xuống gắn, KH gay gắt \nYêu cầu CN liên hệ cho KT xuống kiểm tra cho KH","KH đã báo chi nhánh\nKH phản ánh pin đầy 100% nhưng không xả ra để KH xử dụng \nYêu cầu quản lí điều kĩ thuật xuống kiểm tra gấp","Kh chưa báo CN,KT\nKH đang cần hỗ trợ lắp đặt thêm Metor, hd cài lại app vì không xem được công suất điện sản xuất ra \nYêu cầu CN cho KT đến hỗ trợ KH","1. KH chưa báo CN\n2. KH phản ánh: Đèn nlmt hôm bữa ko thấy sáng, đến hôm qua sáng mờ có sạc pin nhưng ko thấy đầy giờ thì sạc ko được báo đỏ luôn rồi.\n3. KH yêu cầu: Qua kiểm tra, sửa chữa thiết bị","1. KH đã báo CN\n2. KH phản ánh: pin lưu trữ không hoạt động\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này nếu có gì thay thế thì thay thế luôn","1. KH đã liên hệ CN\n\n2. Biến tần của KH hiện đang gặp sự cố không phát điện\n\n3. KH cần CN đến hỗ trợ khắc phục sớm","KH chưa báo CN đã báo KT nhưng chưa được sử lý triệt để\nKH gặp sự cố IVT bị sập liên tục không sử dụng được \nYêu cầu CN liên hệ cho KT đến kiểm tra cho KH","KH chưa báo CN, KT\nKH báo sự cố hệ thống NLMT hiện tại không hoạt động được\nYêu cầu CN liên hệ và cho KT đến hỗ trợ KH","1. KH chưa báo CN\n2. KH phản ánh: Hệ KH hơn 7kw KH vẫn thấy hệ hoạt động bình thường tầm trưa trưa là pin lưu trữ đầy m  trợ khắc phục sớm","KH chưa báo CN chưa báo KT\nKH báo sự cố NLMT đang không vào đc hệ thống giám sát \nYêu cầu CN cho KT xuống hõ trợ KH","KH đã báo CN\nKH phản ánh: Nắng to KH theo dõi trên app thì thấy dùng 100% điện lưới, ko thấy dùng nlmt cũng ko thấy có xả ra.\nKH yêu cầu: Qua kiểm tra, khắc phục tình trạng này cho KH","KH chưa báo chi nhánh\nĐiện đồng hồ tăng bất thường trong 2 tháng \nYêu cầu chi nhánh điều kĩ thuật đến kiểm tra","1. KH đã liên hệ CN\n\n2. HT NLMT của KH có 2 thiết bị Biến tần, 1 thiết bị đang không hoạt động, trên APp có cảnh báo không hoạt động khoảng 2 tuần nay, Hiệu suất sản sinh điện NLMT giảm hơn nửa, từ 35KW giảm còn 10-12 KW\n\n3, KH cần CN liên hệ và đến hỗ trợ","1. KH đã báo CN\n2. KH phản ánh: Trước đó CN hỗ trợ cung cấp hình ảnh thiết bị nhưng khi KH đưa cho bên điện lực thì bị từ chối và trả lại. KH đang thấy bên điện lực bắt cung cấp CO,CQ và phải có dấu mộc nguồn gốc sản phẩm.\n3. KH yêu cầu: Hỗ trợ KH hoàn thiện nốt hồ sơ","Đã báo chi  nhánh \nÁc quy lưu trữ ko vào pin, không có lưu trữ\nYêu cầu kt qua ktra cho kh","1 kh đã báo chi nhánh\n2 kh cần hỗ trợ xuất hóa đơn đỏ\n3 yêu cầu kt hỗ trợ khách hàng","CN 0968088033 báo sự cố hộ KH \n1. KH phản ánh: Bị bể 3 tấm pin. CN có qua kiểm tra tấm pin thì cũng thấy có vết từ trên trời rơi xuống, nhưng cũng chưa thể xác nhận chính xác được, KH cũng đang ko chấp nhận là do tác động vật lý. \n2. KH yêu cầu: Phản hồi lại thông tin cho KH và thay mới 3 tấm pin.","Đã báo chi nhánh \nLắp hệ 14Wp nhưng công suất chỉ được 8Wp\nYêu cầu kt qua ktra cho kh","1. KH đã báo CN: A Thạnh, A Nhị\n2. KH phản ánh: Cục biến tần cứ kêu tít tít ko sử dụng được.\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này","Chưa báo chi nhánh\nNLMT nhà khách hàng gặp sự cố ko đạt hiệu suất \nhiện tại nhà khách hàng đang mất điện yêu cầu kt qua hỗ trợ gấp \nYêu cầu kt qua ktra cho khách hàng","Đã báo chi nhánh\nNLMT chỉ kéo điện lưới vào không dùng điện pin lưu trữ\nYcau kt qua ktra cho khách hàng","chi nhánh báo hộ 0382691111\nBiến tần hoạt động không ổn định\nKh cần ktra trong ngày hôm nay hoặc ngày mai\nYêu cầu kt qua ktra cho khách hàng","1.KH chưa báo CN\n2. KH yêu cầu CN hoàn thiện hồ sơ để gửi cho bên điện lực\n3. Yêu cầu CN hỗ trợ và xử lí cho KH","Đã báo chi nhánh\nPin trữ sạc không đầy NLMT hiệu suất kém\nYêu cầu kt qua ktra cho khách hàng","1. KH đã liên hệ cho CN\n\n2. Hiệu Suất NLMT của KH bị giảm khoảng 15%, trước đây ngày nắng tốt phát sinh được 30kw/h hiện tại phát sinh được 25kw/h, CN kiểm tra và thông tin do Inverter bị nóng nên giảm hiệu suất\n\n3. KH cần CN hỗ trợ và khắc phục giúp HT NLMT của KH hoạt động bình thường","1. KH chưa liên hệ\n\n2, Mức điện của KH phát sinh khi không sử dụng điện NLMT là 200 số/ngày, nếu đóng điện NLMT sẽ lã 295 số /ngày, mức tiền điện KH cần đóng thêm đang tăng cao\n\n3. KH cần CN đến hỗ trợ kiểm tra HT NLMT giúp KH","Kh đã báo chi nhánh \nBiến tần đang không chạy được\nYêu cầu kt qua ktra cho kh","1. KH đã liên hệ CN\n\n2. KH thay điện thoại nên chưa theo dõi được hiệu suất trên App, từ tin nhắn của điện lực thông tin sản lượng điện từ HT NLMT đang giảm nhiều khoảng 2 tháng gần dây\n\n3. KH cần CN liên hệ và đến kiểm tra cho KH","1. KH đã báo CN: Các sự cố từ trước và cũng đã có văn bản của CN gửi KH\n2. KH phản ánh: Về sự cố tấm pin bị vỡ do ngoại lực KH đang nghi ngờ tấm pin đang ko phải của chính hãng, KH có kiểm tra số serial tấm pin trên phần mềm AE Solar thì thấy báo ko có thông tin trên cty của hãng. Trước đó CN đến kiểm tra nhiều lần nhưng đến khi KH hỏi ngoại lực gì thì CN ko thấy nói. \n3. KH yêu cầu: Làm rõ thông tin, giải thích với KH về tấm pin. Nếu ko KH sẽ kéo pháp lý, đăng tin mxh, phá hoại cty, cảnh báo mọi người và dự kiến KH sẽ khởi kiện vào t6.","1. KH đã báo CN: A Đức\n2. KH yêu cầu: Cần hỗ trợ bản hợp đồng giấy NLMT có báo CN rồi và CN hứa hẹn là mang cho mà KH vẫn chưa thấy đâu. Ngoài ra, KH cần hỗ trợ, hướng dẫn làm thủ tục hồ sơ về NLMT để gửi bên điện lực.","1. KH chưa báo CN\n2. KH lắp 2 máy nhưng 1 máy chạy công suất hoạt động kém\n3. Yêu cầu KT hỗ trợ và xử lí cho KH","Chưa báo chi nhánh \nInverter bị lỗi wifi không bắt được \nYêu cầu kt qua ktra cho khách hàng","1. KH đã báo CN: A Chẩu Văn Nghĩa\n2. KH phản ánh: pin lưu trữ đang bị gặp lỗi trước đó có ivt có mang đi bảo hành rồi mà có báo CN nhưng chưa thấy tháo dỡ nốt pin lưu trữ đi bảo hành.\n3. KH yêu cầu: Kiểm tra pin lưu trữ và mang thiết bị đi bảo hành","CN 0978852953 báo sự cố hộ KH\nKH báo sự cố Inverter mất điện nhưng vẫn chạy,pin lưu trữ có điện nhưng không xả điện \nYêu cầu CN liên hệ hỗ trợ KH","Đã báo chi nhánh\nBIến tần nhà khách hàng bị hỏng \nYêu cầu kt xuống ktra cho khách hàng","1. KH đã liên hệ CN (bên hỗ trợ lắp đặt)\n2. KH bị mất điện ngày  17/5, khi có điện lại HT NLMT của KH không hoạt động, trên APP chỉ có thông số điện lưới, không có phát sinh điện từ NLMT\n3. KH cần CN hỗ trợ khắc phục sớm\nĐịa chỉ lắp đặt: Số nhà 18, Ngõ 111, Phạm Đình Toái, Nghệ An","Đã báo chi nhánh \nKhách hàng đang thấy hệ thống NLMT đang không hoạt động\nyêu cầu kt qua ktra cho khách hàng","1. KH chưa báo CN\n2. KH phản ánh: Ko thấy có điện nlmt nạp vào, và thấy gián đoạn từ 12h trưa - 3h chiều, 1 ngày chỉ khoảng 30kw\n3. KH yêu cầu: Qua kiểm tra, khắc phục tình trạng này.","KH đã báo KT chưa báo CN \nKH báo giao thiếu 1 tấm pin NLMT của KH mà hơn 1 tháng nay chưa thấy giao nốt cho KH \nYêu cầu CN liên hệ KH gấp","1. KH chưa liên hệ với CN \n2. KH cần hỗ trợ hoàn thiện hồ sơ NLMT để gửi cho điện lực \n3. Yêu cầu CN liên hệ và hỗ trợ hoàn thiện hồ sơ cho KH","KH phản ánh 2 tấm Pin bị nứt, vỡ, võng. Yêu cầu kiểm tra, thay thế theo bảo hành","Đã báo chi nhánh \nHỏng quạt inverter  \nYêu cầu kĩ thuật  đến kiểm tra cho khách hàng","CN 0976886777 báo sự cố hộ KH \n1. KH phản ánh: Tivi màn hình led bị lỗi ko lên màn hình.\n2. KH yêu cầu: Xuống kiểm tra, xử lý trong ngày hôm nay.","KH đã báo KT tên Huy chưa báo CN \nKH báo hiệu suất NLMT kém không đủ sạc  pin lưu trữ\nYêu cầu CN cho KT xuống kiểm tra lại cho KH gấp","1. KH đã báo CN \n2. KH phản ánh sự cố pin NLMT bị nổ KT đã xuống tháo nhưng KT chưa đem về kiểm tra và sửa cho KH, nay KH gọi lên yêu cầu KT có xuống đem về sửa cho KH không thì nói KH để còn biết KH lắp bên đơn vị khác\n3. Yêu cầu CN liên hệ và cho KT  xuống Ktra gấp cho KH, KH đang rất gay gắt","KHDN ký 1 Hợp đồng nhưng có 2 địa chỉ lắp đặt và cả 2 đang gặp sự cố. \n1. KH đã báo chi nhánh\n2. KH phản ánh: \n+ Tại Xã Lương Sơn, Tỉnh Phú Thọ: KH báo bị lỗi biến tần\n+ Tại Xã Hợp Thịnh, Tỉnh Bắc Ninh: KH báo tủ biến tần bị nổ cháy\n3. KH yêu cầu: KT trong tuần này liên hệ hỗ trợ","Khách hàng đang nhận định và khiếu nại hệ thống năng lượng mặt trời hoạt động không hiệu quả. Nguyên nhân do buổi sáng đón nắng tốt, nhưng đến trưa thì bị che bóng (nên theo khách, hệ 6kW nhưng công suất thấp chỉ sản sinh được 1kW thôi). Liên quan việc che bóng thì khách cho rằng Viettel không khảo sát kỹ từ đầu. Và có yêu cầu di dời tấm pin áp mái đến vị trí đón nắng tốt hơn (trong phạm vi 10 m trên mái nhà).\nNhờ KT xêp lịch hẹn sớm với khách hàng và hỗ trợ\nKhảo sat thực tế và lên phg án di dời các tấm pin","Chưa báo chi nhánh \nĐang bị nứt 1 tấm pin ở mặt dưới, công suất không đạt\nYêu cầu kt qua ktra cho khách  hàng","1. KH đã liên hệ CN và được hướng dẫn nhưng chưa khắc phục được, CN đã qua kiểm tra và mang pin cùng Inverter đi bảo hành cho KH khoảng 3 hôm trước (A Kương)\n\n2. Khoảng 2 tuần trước, KH bị mất điện , Pin và Inverter không có tín hiệu, cầu dao trong tủ điện bị nhảy, khi đóng cầu dao cũng ko có tín hiệu nên KH phải dùng điện lưới\n\n3. KH cần CN hỗ trợ khắc phục lỗi thiết bị để HT NLMT của KH có thể sử dụng","Chưa báo chi nhánh\nLỗi cảnh báo ác quy hiệu suất ko đạt \nYêu cầu kt qua ktra","1. KH đã liên hệ với CN, CN đã hỗ trợ tháo tấm pin lỗi\n2.KH nghe tiếng như có tiếng nổ, lên kiểm tra thấy tấm pin rạn vỡ, cần kiểm tra bảo hành\n3.KH cần CN hỗ trợ thông tin sớm","KH (work@namdd.dev) gửi mail phản ánh các vấn đề: \n1.\tTiền dây dẫn thừa: Đề nghị Viettel Phú Thọ thực hiện việc bồi hoàn lại tiền cho phần dây điện thừa do thi công sai lệch ban đầu.\n2.\tTiêu chuẩn vật tư tủ điện (Dựa trên buổi làm việc ngày 11/04/2026): Hai bên đã thống nhất ghi nhận hiện trạng là chưa xác định được vật tư bên trong tủ điện có đảm bảo đúng danh sách thiết bị và tiêu chuẩn kỹ thuật của công ty hay không. Tôi yêu cầu phía Tập đoàn và VCC cung cấp chi tiết danh sách vật tư và tiêu chuẩn kỹ thuật để gia đình có cơ sở so sánh với chiếc tủ trị giá 6.500.000 VNĐ hiện tại. Yêu cầu làm rõ tính an toàn khi sử dụng dây cáp DC để đấu nối cho phần AC và dây DC 6mm2 đi với MCB 63A. Thời hạn phản hồi: Trước ngày 20/04/2026.\n3.\tXử lý lỗi Inverter (SPD DC): Hệ thống liên tục báo lỗi DC SPD. Theo thông tin mới nhất, hiện DatGroup đang làm việc với hãng GoodWe và sẽ có email phản hồi kết quả xử lý trong vòng 02 ngày tới. Đề nghị phía Viettel bám sát để xử lý dứt điểm cho khách hàng .\n4.\tĐiều chỉnh chính sách bảo hành (Dựa trên buổi làm việc ngày 11/04/2026): Thông tin bảo hành combo biến tần và pin lưu trữ của hãng hiện không khớp với hợp đồng . Phía Chi nhánh Phú Thọ đã hẹn xử lý trong vòng 120 ngày kể từ ngày 11/04/2026. Như vậy, thời hạn cuối cùng để hoàn tất việc điều chỉnh này là ngày 09/08/2026.\n6.\tThao tác điều khiển thiết bị từ xa không báo trước: Giải trình về việc tài khoản viettelsolar.phutho@gmail.com tự ý \"Xóa dữ liệu báo động lỗi hồ quang\" và \"Vô hiệu hóa báo động chống sét\" ngày 12/04/2026 mà không thông báo hay nắm rõ mục đích xóa.","1. KH chưa báo CN\n2. KH đang sd NLMT nhưng hiện tại thiết bị ko xả điện\n3. YC KT qua kiểm tra và xử lý gấp\n***địa chỉ lắp đặt: kilo 63, khu đô thị đức tài, xã hoài đức, tỉnh lâm đồng.","1.Đã báo chi nhánh chưa: chưa báo\n2.Đã báo qua đâu: DTV HPC\n3.KH phản ánh về vấn đề: Hiệu suất hệ thấp.\n4.KH yêu cầu KT qua kiểm tra cho KH","1. Kh đã báo cn\n2. Kh phản ánh: Hệ của kh dạo này sd có hiện tượng liên tục bị sập. Kh đã báo kt và kt phản hồi do kh sd quá tải nhưng từ khi lắp đến nay kh báo chỉ dùng bằng đó t <script>
(function () {

  /* ── State ── */
  var activeKeys    = null;
  var amFilterHandle   = null;
  var tinhFilterHandle = null;

  /* ── Helpers ── */
  function buildOptions(selectEl, items) {
    selectEl.innerHTML = '<option value="">Tất cả</option>';
    (items || []).forEach(function (v) {
      if (v === null || v === undefined) return;
      var opt = document.createElement('option');
      opt.value = opt.textContent = String(v);
      selectEl.appendChild(opt);
    });
  }

  function getSelectizeVal(wrapperId) {
    var w = document.querySelector('#' + wrapperId);
    var h = w && w.querySelector('.selectized');
    return (h && h.selectize) ? h.selectize.getValue() : '';
  }

  /* ── Khởi tạo crosstalk ── */
  function initFilter() {
    if (typeof crosstalk === 'undefined') { setTimeout(initFilter, 150); return; }

    /* Handle tổng hợp — theo dõi activeKeys cho Export */
    var mainHandle = new crosstalk.FilterHandle(CT_GROUP);
    mainHandle.on('change', function (e) {
      activeKeys = (e.value && e.value.length > 0) ? e.value : null;
    });

    /* Handle riêng cho AM và Tỉnh */
    amFilterHandle   = new crosstalk.FilterHandle(CT_GROUP);
    tinhFilterHandle = new crosstalk.FilterHandle(CT_GROUP);

    /* Chờ selectize Đơn vị sẵn sàng */
    var waitDV = setInterval(function () {
      var w = document.querySelector('#don_vi_dieu_hanh');
      var h = w && w.querySelector('.selectized');
      if (h && h.selectize) {
        h.selectize.on('change', onDonViChange);
        clearInterval(waitDV);
      }
    }, 200);

    /* Gắn event AM select */
    var amEl = document.getElementById('am_select');
    if (amEl) amEl.addEventListener('change', onAmChange);

    /* Gắn event Tỉnh select */
    var tinhEl = document.getElementById('tinh_select');
    if (tinhEl) tinhEl.addEventListener('change', onTinhChange);
  }

  /* ── Cấp 1→2: Đơn vị → rebuild AM options, reset Tỉnh ── */
  function onDonViChange() {
    var donVi  = getSelectizeVal('don_vi_dieu_hanh');
    var amEl   = document.getElementById('am_select');
    var tinhEl = document.getElementById('tinh_select');

    buildOptions(amEl,   donVi ? AM_MAP[donVi]   : []);
    buildOptions(tinhEl, []);

    amFilterHandle.clear();
    tinhFilterHandle.clear();
  }

  /* ── Cấp 2→3: AM → rebuild Tỉnh options, đẩy filter AM ── */
  function onAmChange() {
    var amVal  = document.getElementById('am_select').value;
    var tinhEl = document.getElementById('tinh_select');

    /* Rebuild Tỉnh */
    buildOptions(tinhEl, amVal ? TINH_MAP[amVal] : []);
    tinhFilterHandle.clear();

    /* Filter AM vào crosstalk */
    if (!amVal) { amFilterHandle.clear(); return; }
    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) { return String(d.row['AM chuyên quản']) === amVal; })
      .map(function (d)    { return String(d.i + 1); });
    amFilterHandle.set(keys);
  }

  /* ── Cấp 3: Tỉnh → đẩy filter Tỉnh ── */
  function onTinhChange() {
    var amVal   = document.getElementById('am_select').value;
    var tinhVal = document.getElementById('tinh_select').value;

    if (!tinhVal) { tinhFilterHandle.clear(); return; }

    var keys = FULL_DATA
      .map(function (row, i) { return { row: row, i: i }; })
      .filter(function (d) {
        return String(d.row['AM chuyên quản']) === amVal &&
               String(d.row['Mã tỉnh'])        === tinhVal;
      })
      .map(function (d) { return String(d.i + 1); });
    tinhFilterHandle.set(keys);
  }

  /* ── Reset tất cả ── */
  window.resetAllFilters = function () {
    document.querySelectorAll('.selectized').forEach(function (el) {

    return FULL_DATA.filter(function (_, i) { return keySet.has(String(i + 1)); });
  }

  /* ── Lazy load script ── */
  function loadScript(url, cb) {
    if (document.querySelector('script[src="' + url + '"]')) { cb && cb(); return; }

    s.src     = url;
    s.onload  = cb || function () {};
    s.onerror = function () { alert('Không load được: ' + url); };
    document.head.appendChild(s);
  }

  function setBtnState(btn, loading, label) {
    if (!btn) return;
    btn.disabled    = loading;
    btn.textContent = loading ? '⏳ Đang tạo...' : label;
  }

    function doExcel() {
      setBtnState(btn, true);

        alert('Không có dữ liệu để xuất!');
        setBtnState(btn, false, '⬇ Tải Excel');
        return;
      }
      var ws = XLSX.utils.json_to_sheet(rows, { header: COL_NAMES });
      ws['!cols'] = COL_NAMES.map(function (col) {
        return { wch: Math.max(Math.round((COL_WIDTHS[col] || 100) / 7), 8) };
      });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ticket');

  };

  window._taiPNG = function (btn) {

      setBtnState(btn, true);

      }
      var totalWidth = COL_NAMES.reduce(function (s, col) {
        return s + (COL_WIDTHS[col] || 100);
      }, 0);
      var html = '<table style="border-collapse:collapse;font-size:13px;'
               + 'font-family:Arial,sans-serif;width:' + totalWidth + 'px;">'
               + '<colgroup>';
      COL_NAMES.forEach(function (col) {
        html += '<col style="width:' + (COL_WIDTHS[col] || 100) + 'px">';
      });
      html += '</colgroup><thead><tr>';
      COL_NAMES.forEach(function (col) {
        html += '<th style="background:#F5DEB3;border:1px solid #ccc;'
             +  'padding:6px 8px;text-align:center;white-space:normal;'
             +  'word-break:break-word;">' + col + '</th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(function (row, idx) {
        var bg = idx % 2 === 0 ? '#ffffff' : '#f5f5f5';
        html += '<tr style="background:' + bg + '">';
        COL_NAMES.forEach(function (col) {
          var txt = (row[col] === null || row[col] === undefined) ? '' : String(row[col]);
          html += '<td style="border:1px solid #ccc;padding:5px 8px;'
               +  'white-space:normal;word-break:break-word;'
               +  'vertical-align:top;">' + txt + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      var wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed;top:-99999px;left:-99999px;'
                            + 'background:#ffffff;padding:16px;'
                            + 'width:' + (totalWidth + 32) + 'px;';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
      html2canvas(wrapper, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight
      }).then(function (canvas) {
        document.body.removeChild(wrapper);
        var a      = document.createElement('a');
        a.download = 'danh_sach_ticket.png';
        a.href     = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBtnState(btn, false, '📷 Tải PNG');
      }).catch(function (e) {
        document.body.removeChild(wrapper);
        alert('Lỗi PNG: ' + e.message);
        setBtnState(btn, false, '📷 Tải PNG');
      });
    }
    window.html2canvas
      ? doPNG()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', doPNG);
  };

  /* ── Khởi động ── */
  initFilter();

})();
</script>
